---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ansible:
    name: yamllint + ansible-lint
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install linters
        run: pip install ansible-lint yamllint
      - name: Install pinned collections and roles
        run: |
          ansible-galaxy collection install --no-cache -r ansible/requirements.yml
          ansible-galaxy role install -r ansible/requirements.yml -p ~/.ansible/roles
      - name: yamllint
        run: yamllint -c .yamllint.yml .
      - name: ansible-lint
        run: ansible-lint ansible/

  repo-checks:
    name: Repository checks (ops/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install check dependencies
        run: pip install jinja2 pyyaml
      - name: Selftests
        run: |
          ops/check-empty-set-floors.py --selftest
          ops/check-shell-cmds-parse.py --selftest
          ops/check-secret-in-environment.py --selftest
          ops/check-no-comments.py --selftest
      - name: ascii-system-files
        run: ops/check-ascii-system-files.py
      - name: jinja-templates-parse
        run: ops/check-jinja-templates.py
      - name: empty-set-floors
        run: ops/check-empty-set-floors.py
      - name: goss-specs-render
        run: ops/check-goss-specs-render.py
      - name: secret-in-environment
        run: ops/check-secret-in-environment.py
      - name: shell-cmds-parse
        run: ops/check-shell-cmds-parse.py
      - name: no-comments
        run: ops/check-no-comments.py
