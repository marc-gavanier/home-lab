---
extends: default

ignore: |
  ansible/roles/UBUNTU24-CIS/

rules:
  line-length:
    max: 160
  braces:
    max-spaces-inside: 1
  truthy:
    check-keys: false
  document-start: disable
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
