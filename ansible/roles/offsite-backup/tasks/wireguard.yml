---
# WireGuard client (outbound tunnel to the homelab wg-easy) + Kuma reachability.

- name: wireguard | Install WireGuard
  ansible.builtin.apt:
    name: wireguard
    state: present

- name: wireguard | Write WireGuard client configuration
  ansible.builtin.copy:
    content: "{{ offsite_wg_conf }}"
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart WireGuard

- name: wireguard | Enable and start WireGuard tunnel
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started

# --- Recover from a home public-IP change ---
# wg-quick resolves the peer's Endpoint name once, at `up`. When the home IPv4
# changes, DDNS moves the record but this kernel keeps dialling the old address
# forever — and SSH to this host runs through that tunnel, so the only repair
# left is a trip. The timer below re-resolves the name when the handshake goes
# stale, and does nothing while the tunnel works (#180).

- name: wireguard | Install endpoint re-resolve script
  ansible.builtin.template:
    src: offsite-wg-reresolve.sh.j2
    dest: /usr/local/bin/offsite-wg-reresolve.sh
    mode: "0750"

- name: wireguard | Install endpoint re-resolve units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - offsite-wg-reresolve.service
    - offsite-wg-reresolve.timer

- name: wireguard | Enable endpoint re-resolve timer
  ansible.builtin.systemd:
    name: offsite-wg-reresolve.timer
    enabled: true
    state: started
    daemon_reload: true

# --- Reach Uptime Kuma through the tunnel ---
# Once offsite, services.<domain> does not resolve at all: it has no public
# record, and this host's resolver is its own LAN router, not Pi-hole. Checked
# rather than assumed — a public lookup returns nothing, while vpn.<domain>
# returns an address, which is what proves the query itself works. So this pin
# is not a routing preference, it is **the only reason the name resolves here**;
# remove it and the Kuma push stops resolving rather than getting a 403.
# (The 403 reasoning was the original comment and it was wrong: Traefik does
# reject non-VPN sources, but nothing ever reaches Traefik.)
# Pin it to the homelab host's
# VPN address (Traefik listens on all host interfaces), NOT its LAN IP:
# routing the homelab LAN IP into the tunnel breaks any direct-LAN traffic
# while the Pi is prepared at home (bitten during the seed, 2026-07-12).
# Same cloud-init-template pattern as the homelab's own pin.

- name: wireguard | Pin services domain in the cloud-init hosts template (persists across reboots)
  ansible.builtin.lineinfile:
    path: /etc/cloud/templates/hosts.debian.tmpl
    regexp: ' services\.{{ domain | regex_escape }}$'
    line: "{{ homelab_wg_ip }} services.{{ domain }}"
    state: present

- name: wireguard | Pin services domain in /etc/hosts now (immediate, until next cloud-init run)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: ' services\.{{ domain | regex_escape }}$'
    line: "{{ homelab_wg_ip }} services.{{ domain }}"
    state: present
