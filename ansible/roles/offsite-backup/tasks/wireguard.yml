---
- name: wireguard | Install WireGuard
  ansible.builtin.apt:
    name: wireguard
    state: present

- name: wireguard | Write WireGuard client configuration
  ansible.builtin.copy:
    content: "{{ offsite_wg_conf }}"
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart WireGuard

- name: wireguard | Enable and start WireGuard tunnel
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started

- name: wireguard | Install endpoint re-resolve script
  ansible.builtin.template:
    src: offsite-wg-reresolve.sh.j2
    dest: /usr/local/bin/offsite-wg-reresolve.sh
    mode: "0750"

- name: wireguard | Install endpoint re-resolve units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - offsite-wg-reresolve.service
    - offsite-wg-reresolve.timer

- name: wireguard | Enable endpoint re-resolve timer
  ansible.builtin.systemd:
    name: offsite-wg-reresolve.timer
    enabled: true
    state: started
    daemon_reload: true

- name: wireguard | Pin services domain in the cloud-init hosts template (persists across reboots)
  ansible.builtin.lineinfile:
    path: /etc/cloud/templates/hosts.debian.tmpl
    regexp: ' services\.{{ domain | regex_escape }}$'
    line: "{{ homelab_wg_ip }} services.{{ domain }}"
    state: present

- name: wireguard | Pin services domain in /etc/hosts now (immediate, until next cloud-init run)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: ' services\.{{ domain | regex_escape }}$'
    line: "{{ homelab_wg_ip }} services.{{ domain }}"
    state: present
