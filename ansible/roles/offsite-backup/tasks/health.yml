---
- name: health | Install goss, shared with the homelab
  ansible.builtin.include_role:
    name: observability
    tasks_from: goss-install.yml

- name: health | Install the shared persistence gate
  ansible.builtin.include_role:
    name: observability
    tasks_from: gate.yml

- name: health | Install the declarative health spec
  ansible.builtin.template:
    src: goss-offsite-health.yaml.j2
    dest: /etc/goss/offsite-health.yaml
    owner: root
    group: root
    mode: "0400"

- name: health | Install disk-health report script
  ansible.builtin.template:
    src: offsite-health.sh.j2
    dest: /usr/local/bin/offsite-health.sh
    mode: "0750"

- name: health | Install disk-health and SMART self-test units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - offsite-health.service
    - offsite-health.timer
    - offsite-smart-test.service
    - offsite-smart-test.timer

- name: health | Enable disk-health and SMART self-test timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - offsite-health.timer
    - offsite-smart-test.timer
