---
- name: Prepare the backup disk (UAS quirk, ext4, mount)
  ansible.builtin.import_tasks: disk.yml

- name: Install the append-only rest-server
  ansible.builtin.import_tasks: rest-server.yml

- name: Set up the outbound WireGuard tunnel and Kuma pin
  ansible.builtin.import_tasks: wireguard.yml

- name: Install the disk-health report and SMART self-test
  ansible.builtin.import_tasks: health.yml

- name: Install the tools needed to recover from this Pi on site
  ansible.builtin.import_tasks: toolbox.yml
