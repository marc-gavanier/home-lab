---
# Backup disk: USB-SATA quirk, ext4 (no LUKS — ADR-010), mount.

# --- USB-SATA bridge quirk ---
# Some bridges (ASMedia ASM1153 in the 52Pi tower) corrupt writes in UAS
# mode on the Pi. usb_storage_quirks (host_vars) forces plain usb-storage.

- name: disk | Read cmdline.txt
  ansible.builtin.slurp:
    src: /boot/firmware/cmdline.txt
  register: offsite_cmdline
  when: usb_storage_quirks is defined

- name: disk | Disable UAS for the USB-SATA bridge
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    backrefs: true
    regexp: '^(.*?)(\s*)$'
    line: '\1 usb-storage.quirks={{ usb_storage_quirks }}\2'
  when:
    - usb_storage_quirks is defined
    - "('usb-storage.quirks=' ~ usb_storage_quirks) not in (offsite_cmdline.content | b64decode)"
  register: offsite_quirk_added

# Not a handler on purpose: handlers fire at end of play, but the quirk must
# be active BEFORE the format/mount tasks below ever touch the disk.
- name: disk | Reboot to apply the storage quirk (must precede any disk write)  # noqa: no-handler
  ansible.builtin.reboot:
    reboot_timeout: 300
  when: offsite_quirk_added is changed

# --- Backup disk (ext4, no LUKS) ---

# `check_mode: false` on both blkid probes, for the same reason as the
# rest-server version probe: Ansible skips `command` under --check, and a
# skipped command still registers `stdout` — as an EMPTY STRING, not as
# undefined (measured 2026-08-17). Nothing errors; the values simply become
# wrong, quietly.
#
# Here that produced two lies in one dry run. This probe's '' passes the
# safety check below, so the guard that refuses to overwrite an unexpected
# filesystem cannot fire in check mode. And the UUID probe's '' turns the
# mount's src into a bare `UUID=`, which no longer matches fstab, so a dry run
# announced it would REMOUNT the backup disk on the host that only exists to
# hold the last copy. Both probes only read.
- name: disk | Read current filesystem type on the backup disk
  ansible.builtin.command: blkid -o value -s TYPE {{ backup_disk_device }}
  register: backup_disk_fstype
  changed_when: false
  failed_when: false # rc=2 when the partition has no filesystem yet
  check_mode: false

- name: disk | Refuse to overwrite an unexpected filesystem
  ansible.builtin.fail:
    msg: >-
      {{ backup_disk_device }} carries a '{{ backup_disk_fstype.stdout }}'
      filesystem. Set offsite_disk_force_format=true (one run) to format it.
  when:
    - backup_disk_fstype.stdout not in ['', 'ext4']
    - not offsite_disk_force_format

- name: disk | Create ext4 filesystem on the backup disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ backup_disk_device }}"
    force: "{{ offsite_disk_force_format }}"

- name: disk | Read backup disk UUID
  ansible.builtin.command: blkid -o value -s UUID {{ backup_disk_device }}
  register: backup_disk_uuid
  changed_when: false
  check_mode: false

- name: disk | Mount backup disk
  ansible.posix.mount:
    path: "{{ backup_mount_point }}"
    src: "UUID={{ backup_disk_uuid.stdout }}"
    fstype: ext4
    opts: defaults,noatime,nofail
    state: mounted
