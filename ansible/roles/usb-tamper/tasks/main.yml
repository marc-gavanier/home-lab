---
- name: Deploy the udev trigger script
  ansible.builtin.copy:
    src: usb-tamper-trigger.sh
    dest: /usr/local/sbin/usb-tamper-trigger.sh
    owner: root
    group: root
    mode: "0750"

- name: Install the udev rule (any usb_device add/remove)
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-usb-tamper.rules
    mode: "0644"
    content: |
      SUBSYSTEM=="usb", ENV{DEVTYPE}=="usb_device", ACTION=="add|remove", RUN+="/usr/local/sbin/usb-tamper-trigger.sh"
  notify: Reload udev rules

- name: Install usb-tamper.service (armed check + poweroff)
  ansible.builtin.copy:
    dest: /etc/systemd/system/usb-tamper.service
    mode: "0644"
    content: |
      [Unit]
      Description=USB tamper response — poweroff while armed (ADR-008)
      ConditionPathExists=/run/homelab/tamper-armed
      StartLimitIntervalSec=0
      DefaultDependencies=no

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/logger -t usb-tamper "RESPONSE running — powering off NOW"
      ExecStart=/usr/bin/systemctl poweroff

- name: Reload systemd for usb-tamper.service
  ansible.builtin.systemd:
    daemon_reload: true

- name: Install the arm command
  ansible.builtin.copy:
    dest: /usr/local/bin/homelab-tamper-arm
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      mkdir -p /run/homelab
      touch /run/homelab/tamper-armed
      logger -t usb-tamper "armed"
      echo "USB tamper response ARMED — any USB plug/unplug powers the Pi off."

- name: Install the disarm command
  ansible.builtin.copy:
    dest: /usr/local/bin/homelab-tamper-disarm
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      rm -f /run/homelab/tamper-armed
      logger -t usb-tamper "disarmed"
      echo "USB tamper response DISARMED — re-arm with: homelab-tamper-arm"
