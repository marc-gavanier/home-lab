---
# =============================================================================
# Handlers: usb-tamper
# =============================================================================
# Reload only — NEVER `udevadm trigger` here: replaying add events with the
# tamper rule live would fire the poweroff on the spot if the system is armed.
# =============================================================================

- name: Reload udev rules
  ansible.builtin.command:
    cmd: udevadm control --reload-rules
  changed_when: true
