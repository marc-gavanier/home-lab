---
# Input contract — validated automatically at run time (ansible-core >= 2.11).
argument_specs:
  main:
    short_description: Remote kill switch (ntfy-triggered poweroff, ADR-006)
    options:
      killswitch_ntfy_topic:
        type: str
        required: true
        no_log: true
        description: Long random ntfy topic — acts as the shared secret.
      killswitch_keyword:
        type: str
        required: true
        no_log: true
        description: Keyword that must appear in the message to trigger the poweroff.
