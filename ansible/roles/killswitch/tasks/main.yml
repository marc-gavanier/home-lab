---
- name: Ensure curl is installed
  ansible.builtin.apt:
    name: curl
    state: present

- name: Deploy the kill switch script
  ansible.builtin.copy:
    src: killswitch.sh
    dest: /usr/local/sbin/killswitch.sh
    owner: root
    group: root
    mode: "0750"
  notify: Restart killswitch

- name: Template the kill switch env (ntfy topic + keyword)
  ansible.builtin.template:
    src: killswitch.env.j2
    dest: /etc/killswitch.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart killswitch

- name: Create the kill switch systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/killswitch.service
    mode: "0644"
    content: |
      [Unit]
      Description=ntfy kill switch (poweroff on secret message)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      EnvironmentFile=/etc/killswitch.env
      ExecStart=/usr/local/sbin/killswitch.sh
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target
  notify: Restart killswitch

- name: Enable and start the kill switch
  ansible.builtin.systemd:
    name: killswitch.service
    enabled: true
    state: started
    daemon_reload: true
