---
# Input contract — validated automatically at run time (ansible-core >= 2.11).
# Convention (all roles): the spec documents and validates but sets NO
# defaults; runtime defaults stay inline (`| default()`) in the tasks.
argument_specs:
  main:
    short_description: System base configuration (identity, packages, boot, fan, DNS port)
    options:
      hostname:
        type: str
        required: true
        description: System hostname (also pinned in /etc/hosts).
      timezone:
        type: str
        required: true
        description: IANA timezone, e.g. Europe/Paris.
      locale:
        type: str
        required: true
        description: Locale to generate, e.g. fr_FR.UTF-8.
      gpio_fan_pin:
        type: int
        required: false
        description: GPIO pin of the thermostatic case fan. Absent = no fan overlay (hardwired or no fan).
      gpio_fan_temp:
        type: int
        required: false
        description: Fan trigger temperature in °C (inline default 60).
      free_port_53:
        type: bool
        required: false
        description: Disable the systemd-resolved stub listener to free port 53 for Pi-hole (inline default true; set false on hosts without Pi-hole).
      journald_system_max_use:
        type: str
        required: false
        description: >-
          Hard cap on the persistent systemd journal (inline default 500M, set
          to 1500M in group_vars). It bounds the SPACE, not the writes — a cap
          governs deletion — and it is now sized by retention: the journal is
          the only durable record of some monthly events, so it has to outlive
          their period (#290).
      tmp_tmpfs_size:
        type: str
        required: false
        description: Size cap of the tmpfs /tmp mount (inline default 1G; 512M on the 4GB offsite node).
      zram_enabled:
        type: bool
        required: false
        description: Enable zram compressed swap (inline default false; true on the offsite node, which has no HDD swapfile).
      zram_percent:
        type: int
        required: false
        description: zram device size as a percentage of RAM (inline default 50).
      root_fsck_max_mounts:
        type: int
        required: true
        description: >-
          Mount count after which the root filesystem is checked at boot. SET here with
          tune2fs; the observability role declares it too because goss-units asserts it
          back. Consumed here since #260 and declared nowhere until #274.
      root_fsck_interval_days:
        type: int
        required: true
        description: Day interval after which the root filesystem is checked at boot. Set here with tune2fs, asserted by the observability role.
      extra_fsck_filesystems:
        type: list
        elements: dict
        required: true
        description: >-
          Filesystems beyond the root to arm with boot-check triggers — one dict per
          device, with `device`, `max_mounts` and `interval_days`. The offsite backup disk
          is the only entry today (#260).

          Declared with its LIMIT stated, because this is the one knob here whose failure
          is silent: group_vars falls back to `[]`, so a host that arms nothing looks
          exactly like a host with nothing to arm. An argument spec does NOT close that —
          validation ignores surplus variables, so a misspelled key in host_vars leaves
          this at `[]` and the run stays green. What the spec buys is the type and the
          documentation; the misspelling remains uncaught, and the goss assertion that
          would catch it cannot, because it derives from this same variable.
