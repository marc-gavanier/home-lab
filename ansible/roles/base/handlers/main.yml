---
- name: Reboot required
  ansible.builtin.debug:
    msg: "A reboot is required to apply changes. Reboot manually or re-run with --tags reboot."

- name: Restart systemd-resolved
  ansible.builtin.service:
    name: systemd-resolved
    state: restarted

- name: Restart systemd-journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Restart zramswap
  ansible.builtin.service:
    name: zramswap
    state: restarted

- name: Restart smartd
  ansible.builtin.systemd:
    name: smartmontools
    state: restarted

- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

# The timer that keeps this board's clock current has to re-read its schedule
# when the drop-in changes. A handler and not a `when: ... is changed` task:
# ansible-lint rejects the latter, rightly — a handler fires once at the end
# however many tasks notified it, and not at all on a run that changed nothing.
- name: Reload the fake-hwclock save interval
  ansible.builtin.systemd:
    name: fake-hwclock-save.timer
    daemon_reload: true
    state: restarted
