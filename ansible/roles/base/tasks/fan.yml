---
- name: fan | Configure thermostatic fan control
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^dtoverlay=gpio-fan'
    line: "dtoverlay=gpio-fan,gpiopin={{ gpio_fan_pin }},temp={{ gpio_fan_temp | default(60) * 1000 }}"
  when: gpio_fan_pin is defined
  notify: Reboot required
