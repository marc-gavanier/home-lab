---
# Identity, packages, kernel & boot parameters, SD-card care.

- name: system | Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname }}"

# There is no `Update /etc/hosts` task here any more, and its absence is the fix.
#
# It rewrote the 127.0.1.1 line to `127.0.1.1 <hostname>` on every run, and
# cloud-init writes that same line from its own template on every boot as
# `127.0.1.1 <fqdn> <hostname>`. Two owners, one line, and the file
# flipped between them forever:
#
#   homelab   /etc/hosts mtime 09:48:58 (the reboot), content `127.0.1.1 homelab homelab`
#             — cloud-init's form, because `base` had not run since
#   offsite    /etc/hosts mtime 14:45:10 (the deploy),  content `127.0.1.1 backup`
#             — ansible's form, and the deploy reported changed=1 for it
#
# Both measured 2026-08-26. The cost is not the file, it is the SIGNAL: every
# deploy after a reboot reported a change that meant nothing, in a repository
# where `changed=0` is how an idempotent run is recognised. A task that cries
# changed on every boot is a task that hides the ones that matter.
#
# Removing it loses nothing. `manage_etc_hosts: True` on both hosts (verified),
# so cloud-init writes the line at every boot, derived from /etc/hostname — set
# by the task directly above this comment. Its version is also the better one:
# it carries the fqdn field that the ansible line dropped.
#
# If a host ever runs with `manage_etc_hosts` false, nothing here will write
# that line. That is the condition to check before assuming this file still
# covers it, and it is why this comment names it rather than leaving the removal
# silent.

- name: system | Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: system | Generate locale
  community.general.locale_gen:
    name: "{{ locale }}"
    state: present

# Refreshing package metadata is a read, not a config change — keep converged
# recaps at changed=0 even when the 1h cache has expired.
- name: system | Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

- name: system | Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true

- name: system | Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - htop
      - vim
      - tmux
      - tree
      - jq
      - unzip
      - net-tools
      - dnsutils
      - smartmontools
      - lsof
      - ncdu
      - python3-pip
    state: present

# smartd's own alerting is deliberately silent — the template carries the
# measurement that decided it. It ships on BOTH hosts: the dead mailbox was
# found on the homelab, and the offsite Pi had the identical configuration with
# an empty spool only because nothing had gone wrong there yet.
- name: system | Silence smartd's unreachable mail channel
  ansible.builtin.template:
    src: smartd.conf.j2
    dest: /etc/smartd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart smartd

- name: system | Configure kernel parameters for Docker and performance
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-homelab.conf
    reload: true
  loop:
    - { key: "vm.swappiness", value: "10" }
    # Both Redis instances warn about this at every start, and the warning is
    # earned here: RDB persistence forks, and under the default heuristic the
    # kernel can refuse a fork whose child will never touch most of the pages it
    # inherits. This host peaked at 6.6 GiB of 7.7 on 2026-07-29 with 1.3 GiB
    # already swapped, which is exactly when a BGSAVE would be refused — and a
    # refused BGSAVE is silent data loss for the Nextcloud session store and the
    # Immich job queue. The trade is real and taken knowingly: with "1" the
    # kernel never refuses an allocation, so a genuine exhaustion becomes an OOM
    # kill later rather than a failed malloc now. Swap plus vm.swappiness=10 is
    # what makes that acceptable.
    - { key: "vm.overcommit_memory", value: "1" }
    - { key: "vm.vfs_cache_pressure", value: "50" }
    - { key: "net.core.somaxconn", value: "1024" }
    # ip_forward=1 is a DELIBERATE CIS 3.3.1 deviation: the lab routes for
    # Docker and WireGuard (see knowledge/research/cis-audit-2026-07.md).
    - { key: "net.ipv4.ip_forward", value: "1" }

# CIS batch 1 (audit 2026-07): network + kernel hardening. Everything here is
# compatible with Docker/WireGuard routing — only forwarding stays ours.
- name: system | Harden kernel network parameters (CIS 1.5.x / 3.3.x)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-homelab.conf
    reload: true
  loop:
    # No ICMP redirects, in or out (3.3.2, 3.3.5, 3.3.6)
    - { key: "net.ipv4.conf.all.send_redirects", value: "0" }
    - { key: "net.ipv4.conf.default.send_redirects", value: "0" }
    - { key: "net.ipv4.conf.all.accept_redirects", value: "0" }
    - { key: "net.ipv4.conf.default.accept_redirects", value: "0" }
    - { key: "net.ipv4.conf.all.secure_redirects", value: "0" }
    - { key: "net.ipv4.conf.default.secure_redirects", value: "0" }
    - { key: "net.ipv6.conf.all.accept_redirects", value: "0" }
    - { key: "net.ipv6.conf.default.accept_redirects", value: "0" }
    # No source-routed packets (3.3.8)
    - { key: "net.ipv4.conf.all.accept_source_route", value: "0" }
    - { key: "net.ipv4.conf.default.accept_source_route", value: "0" }
    - { key: "net.ipv6.conf.all.accept_source_route", value: "0" }
    - { key: "net.ipv6.conf.default.accept_source_route", value: "0" }
    # Reverse-path filtering (3.3.7), LOOSE — and this is the second
    # declaration of the key on the host, deliberately now rather than by
    # accident. `procps` ships /etc/sysctl.d/10-network-security.conf, which
    # sets rp_filter=2. This file sorts later, so whatever it says wins, and
    # neither file used to mention the other (#152).
    #
    # It said "1" (strict), and the kernel was dropping packets for it. The
    # comment here anticipated the wrong failure — it watched the offsite copy,
    # which is symmetric and was never affected. What broke is VPN client
    # traffic reaching the host on the `proxy` docker bridge with its 10.8.0.x
    # source intact: the route back to that address is the wg-easy container,
    # not the bridge the packet arrived on, so strict mode drops it. Measured
    # 2026-08-17: 1734 in_martian_src since boot, 179 of the last 246 kernel
    # lines from 10.8.0.2 and 10.8.0.3, every day since 2026-08-07, all on
    # br-c7236916b77d. The offsite Pi carries an identical sysctl set and
    # reports in_martian_src=0, which places the cause in this host's
    # wg-easy/bridge topology rather than in the value alone.
    #
    # Loose still rejects a source that is unroutable by any path; it accepts
    # one that is simply reachable a different way, which is exactly the
    # asymmetry a VPN plus four docker bridges creates. Recorded as an assumed
    # CIS deviation in knowledge/research/cis-audit-2026-07.md §1.
    #
    # Do NOT "fix" this by editing 10-network-security.conf: it belongs to
    # procps and a package update would put it back.
    - { key: "net.ipv4.conf.all.rp_filter", value: "2" }
    - { key: "net.ipv4.conf.default.rp_filter", value: "2" }
    # ICMP hygiene + SYN floods (3.3.3, 3.3.4, 3.3.10)
    - { key: "net.ipv4.icmp_ignore_bogus_error_responses", value: "1" }
    - { key: "net.ipv4.icmp_echo_ignore_broadcasts", value: "1" }
    - { key: "net.ipv4.tcp_syncookies", value: "1" }
    # Log spoofed/impossible packets (3.3.9)
    - { key: "net.ipv4.conf.all.log_martians", value: "1" }
    - { key: "net.ipv4.conf.default.log_martians", value: "1" }
    # No IPv6 router advertisements — static IPv4 network (3.3.11)
    - { key: "net.ipv6.conf.all.accept_ra", value: "0" }
    - { key: "net.ipv6.conf.default.accept_ra", value: "0" }
    # ASLR, ptrace confinement, no suid core dumps (1.5.1, 1.5.2, 1.5.3)
    - { key: "kernel.randomize_va_space", value: "2" }
    - { key: "kernel.yama.ptrace_scope", value: "1" }
    - { key: "fs.suid_dumpable", value: "0" }

# The other half of #152. The rp_filter collision cost eleven days of dropped
# VPN packets, and what made it expensive was not the wrong value — it was that
# nothing could see two files disagreeing. sysctl applies them in order and
# keeps the last one, silently, so the losing declaration goes on describing a
# state that is not in force.
#
# Read-only, and `check_mode: false` so a dry run reports the truth: a command
# task skipped under --check still registers stdout, as an empty string, which
# would turn this control into one that always passes.
- name: system | Look for sysctl keys declared twice with different values
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      awk -F= '
          /^[[:space:]]*[#;]/ { next }
          NF < 2 { next }
          {
              key = $1; gsub(/[[:space:]]/, "", key)
              val = $2; gsub(/[[:space:]]/, "", val)
              if (key == "") next
              if ((key in seen) && seen[key] != val)
                  printf "%s: %s=%s overridden by %s=%s\n",
                         key, where[key], seen[key], FILENAME, val
              seen[key] = val; where[key] = FILENAME
          }
      ' $(ls /usr/lib/sysctl.d/*.conf /run/sysctl.d/*.conf \
             /etc/sysctl.d/*.conf /etc/sysctl.conf 2>/dev/null)
    executable: /bin/bash
  register: sysctl_collisions
  changed_when: false
  check_mode: false

# Hard fail rather than a warning. It runs in the base role, before anything on
# the host has been touched, and the answer is always the same small edit: make
# one file own the key. Measured 2026-08-17 across 44 keys on each Pi —
# rp_filter was the only collision on either.
- name: system | Refuse to deploy while a sysctl key is silently overridden
  ansible.builtin.fail:
    msg: |
      A sysctl key is declared more than once with different values. The last
      file wins and the other declaration is inert, which is how #152 hid for
      eleven days.

      {{ sysctl_collisions.stdout }}

      Decide which value is intended and let a single file own it. Distribution
      files (procps ships 10-network-security.conf) must not be edited — a
      package update restores them; set the intended value in 99-homelab.conf,
      which sorts last, and say there that it overrides.
  when: sysctl_collisions.stdout | length > 0

# CIS 1.5.5 — apport phones crash dumps home and has no use on a headless
# server; crash context lives in the systemd journal.
- name: system | Remove Ubuntu automatic error reporting (apport)
  ansible.builtin.apt:
    name: apport
    state: absent
    purge: true

- name: system | Set GPU memory to minimum (headless server)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^gpu_mem='
    line: 'gpu_mem=16'
  notify: Reboot required

# This task owns the root line of /etc/fstab, so both properties that line
# carries are set here: `noatime` for SD longevity, and `passno` for #154.
#
# passno=1 is HALF of a boot-time check and does nothing on its own — it only
# makes systemd-fstab-generator pull in systemd-fsck-root.service, which then
# asks the superblock whether a check is due. The superblock said "never" on
# both hosts; the other half arms it, in filesystem-checks.yml.
- name: system | Own the root fstab line — noatime, and a boot-time fsck pass
  ansible.posix.mount:
    path: /
    src: "{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | map(attribute='device') | first }}"
    fstype: ext4
    opts: defaults,noatime
    passno: "1"
    state: mounted

# Weekly TRIM lets the SD (and the offsite SSD) controller wear-level free
# blocks efficiently — a modest longevity complement. Ubuntu ships fstrim.timer
# enabled by default; enforce it so an image variant can't ship it off. The
# synchronous `discard` mount option is deliberately avoided — the timer is the
# right mechanism; on the main spinning HDD TRIM is a harmless no-op.
- name: system | Ensure periodic TRIM (fstrim.timer) is enabled
  ansible.builtin.systemd:
    name: fstrim.timer
    enabled: true
    state: started

- name: system | Read cmdline.txt
  ansible.builtin.slurp:
    src: /boot/firmware/cmdline.txt
  register: cmdline_content

- name: system | Enable cgroup memory (required for Docker)
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    backrefs: true
    regexp: '^(.*?)(\s*)$'
    line: '\1 cgroup_memory=1 cgroup_enable=memory\2'
  when: "'cgroup_memory=1' not in (cmdline_content.content | b64decode)"
  notify: Reboot required
