---
- name: zram | Install zram-tools
  ansible.builtin.apt:
    name: zram-tools
    state: present
  when: zram_enabled | default(false)

- name: zram | Configure the zram swap device
  ansible.builtin.copy:
    dest: /etc/default/zramswap
    mode: "0644"
    content: |
      # Ansible managed — rendered from the home-lab repo, edits on the host will be overwritten
      ALGO=lz4
      PERCENT={{ zram_percent | default(50) }}
      PRIORITY=100
  when: zram_enabled | default(false)
  notify: Restart zramswap

- name: zram | Enable and start the zramswap service
  ansible.builtin.systemd:
    name: zramswap
    enabled: true
    state: started
  when: zram_enabled | default(false)
