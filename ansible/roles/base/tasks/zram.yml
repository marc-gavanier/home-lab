---
# zram — a compressed RAM block device used as high-priority swap. Enabled
# only where it earns its keep (zram_enabled in host_vars):
#   - offsite (4GB, no HDD swapfile): real headroom for memory-spiky restic
#     runs, kept off the SSD.
#   - homelab (8GB, swappiness=10): stays OFF, but NOT for the reason this
#     comment used to give. It claimed the host "almost never swaps"; measured
#     on 2026-08-15, the swap file is ~76% occupied on average and takes about
#     400 MiB of writes a day. The real argument is better anyway: zram trades
#     RAM for latency, it does not create capacity. Reserving ~700 MiB of RAM
#     to compress pages that cost nothing on a 5TB disk would eat straight into
#     the headroom that matters — available memory bottomed out at 756 MiB over
#     the same period, and that is what precedes an OOM, not a full swap.
# zram-tools is the Ubuntu-native path; PRIORITY outranks any disk swap so zram
# fills first and a disk swapfile (where present) stays a last-resort fallback.

- name: zram | Install zram-tools
  ansible.builtin.apt:
    name: zram-tools
    state: present
  when: zram_enabled | default(false)

- name: zram | Configure the zram swap device
  ansible.builtin.copy:
    dest: /etc/default/zramswap
    mode: "0644"
    content: |
      # Ansible managed — rendered from the home-lab repo, edits on the host will be overwritten
      ALGO=lz4
      PERCENT={{ zram_percent | default(50) }}
      PRIORITY=100
  when: zram_enabled | default(false)
  notify: Restart zramswap

- name: zram | Enable and start the zramswap service
  ansible.builtin.systemd:
    name: zramswap
    enabled: true
    state: started
  when: zram_enabled | default(false)
