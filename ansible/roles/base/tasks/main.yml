---
# =============================================================================
# Role: base — System base configuration
# =============================================================================
# Thin orchestrator: one file per concern, task names prefixed with the file.

- name: Configure system identity, packages and boot parameters
  ansible.builtin.import_tasks: system.yml

- name: Bound SD writes — journald cap and tmpfs volatile storage
  ansible.builtin.import_tasks: logging.yml

- name: Reduce the physical/radio attack surface
  ansible.builtin.import_tasks: attack-surface.yml

- name: Configure the thermostatic fan (opt-in via gpio_fan_pin)
  ansible.builtin.import_tasks: fan.yml

- name: Free port 53 for Pi-hole (opt-out via free_port_53)
  ansible.builtin.import_tasks: port53.yml
