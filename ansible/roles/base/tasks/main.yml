---
# =============================================================================
# Role: base — System base configuration
# =============================================================================

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname }}"

- name: Update /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ hostname }}"

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Generate locale
  community.general.locale_gen:
    name: "{{ locale }}"
    state: present

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - htop
      - vim
      - tmux
      - tree
      - jq
      - unzip
      - net-tools
      - dnsutils
      - smartmontools
      - lsof
      - ncdu
      - python3-pip
    state: present

- name: Configure kernel parameters for Docker and performance
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-homelab.conf
    reload: true
  loop:
    - { key: "vm.swappiness", value: "10" }
    - { key: "vm.vfs_cache_pressure", value: "50" }
    - { key: "net.core.somaxconn", value: "1024" }
    - { key: "net.ipv4.ip_forward", value: "1" }

- name: Set GPU memory to minimum (headless server)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^gpu_mem='
    line: 'gpu_mem=16'
  notify: Reboot required

# --- Physical/radio attack-surface reduction ---
# Unused on this headless, Ethernet-only box. Killed in firmware rather than
# software: a dtoverlay cannot be re-enabled at runtime even by root — undoing
# it takes a config.txt edit plus a reboot, which wipes the LUKS key from RAM.

- name: Disable unused GPIO buses (I2C, SPI)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^dtparam=i2c_arm=', line: 'dtparam=i2c_arm=off' }
    - { regexp: '^dtparam=spi=', line: 'dtparam=spi=off' }
  notify: Reboot required

# blockinfile appends at EOF, which lands inside the LAST conditional section
# of config.txt ([pi4]/[cm4]/...) — the [all] header makes the overlays apply
# unconditionally wherever the block ends up.
- name: Disable Wi-Fi and Bluetooth radios in firmware
  ansible.builtin.blockinfile:
    path: /boot/firmware/config.txt
    marker: "# {mark} ANSIBLE MANAGED — radio kill (base role)"
    block: |
      [all]
      dtoverlay=disable-wifi
      dtoverlay=disable-bt
  notify: Reboot required

- name: Add noatime to SD card mount
  ansible.posix.mount:
    path: /
    src: "{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | map(attribute='device') | first }}"
    fstype: ext4
    opts: defaults,noatime
    state: mounted

- name: Read cmdline.txt
  ansible.builtin.slurp:
    src: /boot/firmware/cmdline.txt
  register: cmdline_content

- name: Enable cgroup memory (required for Docker)
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    backrefs: true
    regexp: '^(.*?)(\s*)$'
    line: '\1 cgroup_memory=1 cgroup_enable=memory\2'
  when: "'cgroup_memory=1' not in (cmdline_content.content | b64decode)"
  notify: Reboot required

# --- Thermostatic case fan (kernel gpio-fan overlay) ---
# Same mechanism raspi-config uses on Raspberry Pi OS: the kernel switches
# the fan GPIO at the temperature threshold (hysteresis ~5°C). No daemon,
# no userspace. Set gpio_fan_pin/gpio_fan_temp in host_vars (52Pi ICE Tower
# NAS case: pin 14, 60°C per the vendor wiki).

- name: Configure thermostatic fan control
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^dtoverlay=gpio-fan'
    line: "dtoverlay=gpio-fan,gpiopin={{ gpio_fan_pin }},temp={{ gpio_fan_temp | default(60) * 1000 }}"
  when: gpio_fan_pin is defined
  notify: Reboot required

# --- Disable the UART serial console ---
# The GPIO header (pins 8/10) exposed a login getty where PASSWORD auth works —
# bypassing the SSH key-only rule with a 2€ USB-TTL adapter — plus kernel boot
# logs and SysRq over serial. Physical console attack surface, complementary to
# the USB tamper response (ADR-008): serial emits no udev event, so the tamper
# poweroff never sees it. Trade-off (accepted 2026-07-08): no emergency serial
# console anymore — if SSH is lost, recovery means pulling the SD card.

- name: Disable the UART hardware (takes effect at next boot)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^enable_uart='
    line: 'enable_uart=0'
  notify: Reboot required

- name: Remove the serial console from the kernel command line
  ansible.builtin.replace:
    path: /boot/firmware/cmdline.txt
    regexp: 'console=serial0,115200 ?'
    replace: ''
  notify: Reboot required

# Masked, not just disabled: nothing (device hotplug, another unit) can bring a
# login prompt back on the serial line. Immediate — no reboot needed for this.
- name: Mask the serial login getty
  ansible.builtin.systemd:
    name: serial-getty@ttyS0.service
    state: stopped
    masked: true

# --- Free port 53 for Pi-hole ---
# Only on hosts that run Pi-hole (free_port_53: false on the offsite host,
# which keeps the stock systemd-resolved setup).

- name: Disable systemd-resolved stub DNS listener
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?DNSStubListener='
    line: 'DNSStubListener=no'
  notify: Restart systemd-resolved
  when: free_port_53 | default(true)

- name: Point resolv.conf to upstream DNS temporarily
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 1.1.1.1
      nameserver 8.8.8.8
    mode: "0644"
  when: free_port_53 | default(true)
