---
- name: attack-surface | Disable unused GPIO buses (I2C, SPI)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^dtparam=i2c_arm=', line: 'dtparam=i2c_arm=off' }
    - { regexp: '^dtparam=spi=', line: 'dtparam=spi=off' }
  notify: Reboot required

- name: attack-surface | Repair the non-ASCII radio-kill marker in place
  ansible.builtin.replace:
    path: /boot/firmware/config.txt
    regexp: '^(# (?:BEGIN|END) ANSIBLE MANAGED) — (radio kill \(base role\))$'
    replace: '\1 - \2'

- name: attack-surface | Disable Wi-Fi and Bluetooth radios in firmware
  ansible.builtin.blockinfile:
    path: /boot/firmware/config.txt
    marker: "# {mark} ANSIBLE MANAGED - radio kill (base role)"
    block: |
      [all]
      dtoverlay=disable-wifi
      dtoverlay=disable-bt
  notify: Reboot required

- name: attack-surface | Disable the UART hardware (takes effect at next boot)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^enable_uart='
    line: 'enable_uart=0'
  notify: Reboot required

- name: attack-surface | Remove the serial console from the kernel command line
  ansible.builtin.replace:
    path: /boot/firmware/cmdline.txt
    regexp: 'console=serial0,115200 ?'
    replace: ''
  notify: Reboot required

- name: attack-surface | Mask the serial login getty
  ansible.builtin.systemd:
    name: serial-getty@ttyS0.service
    state: stopped
    masked: true

- name: attack-surface | Blacklist unused kernel modules (CIS 1.1.1.x, 3.2.x)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/cis-blacklist.conf
    mode: "0644"
    content: |
      # Ansible managed — rendered from the home-lab repo (base role)
      {% for mod in ['cramfs', 'freevxfs', 'hfs', 'hfsplus', 'jffs2', 'udf'] %}
      install {{ mod }} /bin/false
      blacklist {{ mod }}
      {% endfor %}
      {% for mod in ['dccp', 'tipc', 'rds', 'sctp'] %}
      install {{ mod }} /bin/false
      blacklist {{ mod }}
      {% endfor %}
