---
- name: filesystem-checks | Look for the distribution's e2scrub timer
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/e2scrub_all.timer
  register: e2scrub_distro_timer

- name: filesystem-checks | Stop the e2scrub timer, which scrubs nothing here
  ansible.builtin.systemd:
    name: e2scrub_all.timer
    enabled: false
    state: stopped
  when: e2scrub_distro_timer.stat.exists

- name: filesystem-checks | Mask it so a package update cannot re-enable it
  ansible.builtin.systemd:
    name: e2scrub_all.timer
    masked: true
  when: e2scrub_distro_timer.stat.exists

- name: filesystem-checks | Resolve the device behind /
  ansible.builtin.set_fact:
    root_fs_device: >-
      {{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/')
         | map(attribute='device') | first }}

- name: filesystem-checks | Read the root filesystem's check triggers
  ansible.builtin.command: "tune2fs -l {{ root_fs_device }}"
  register: root_fs_superblock
  changed_when: false
  check_mode: false

- name: filesystem-checks | Arm both boot-time triggers on the root filesystem
  ansible.builtin.command:
    cmd: >-
      tune2fs -c {{ root_fsck_max_mounts }}
              -i {{ root_fsck_interval_days }}d
              {{ root_fs_device }}
  vars:
    current_max_mounts: "{{ root_fs_superblock.stdout
      | regex_search('Maximum mount count:\\s+(-?\\d+)', '\\1') | first }}"
    current_interval: "{{ root_fs_superblock.stdout
      | regex_search('Check interval:\\s+(\\d+)', '\\1') | first }}"
  when: >-
    current_max_mounts != (root_fsck_max_mounts | string)
    or current_interval != (root_fsck_interval_days | int * 86400) | string
  changed_when: true

- name: filesystem-checks | Read the check triggers on the extra filesystems
  ansible.builtin.command: "tune2fs -l {{ item.device }}"
  register: extra_fs_superblocks
  changed_when: false
  check_mode: false
  # floor: none needed — an empty extra_fsck_filesystems is this option's DESIGNED
  loop: "{{ extra_fsck_filesystems }}"
  loop_control:
    label: "{{ item.device }}"

- name: filesystem-checks | Arm both boot-time triggers on the extra filesystems
  ansible.builtin.command:
    cmd: >-
      tune2fs -c {{ item.item.max_mounts }}
              -i {{ item.item.interval_days }}d
              {{ item.item.device }}
  vars:
    current_max_mounts: "{{ item.stdout
      | regex_search('Maximum mount count:\\s+(-?\\d+)', '\\1') | first }}"
    current_interval: "{{ item.stdout
      | regex_search('Check interval:\\s+(\\d+)', '\\1') | first }}"
    wanted_max_mounts: "{{ '-1' if item.item.max_mounts | int == 0
                           else item.item.max_mounts | string }}"
  when:
    - current_max_mounts != wanted_max_mounts
      or current_interval != (item.item.interval_days | int * 86400) | string
  # floor: inherited — this iterates the results of the loop above, so it is empty
  loop: "{{ extra_fs_superblocks.results }}"
  loop_control:
    label: "{{ item.item.device }}"
  changed_when: true

# [warning]: the check must not run before the clock is restored (C42)
- name: filesystem-checks | Ensure the fsck drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-fsck@.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: filesystem-checks | Order the boot check after the clock is restored
  ansible.builtin.copy:
    dest: /etc/systemd/system/systemd-fsck@.service.d/after-fake-hwclock.conf
    owner: root
    group: root
    mode: "0444"
    content: |
      # Ansible managed — rendered from the home-lab repo, edits on the host will be overwritten
      [Unit]
      After=fake-hwclock-load.service
  notify: Reload systemd units

- name: filesystem-checks | Verify the drop-in introduces no ordering cycle
  ansible.builtin.command: systemd-analyze verify systemd-fsck@.service
  changed_when: false
  check_mode: false
