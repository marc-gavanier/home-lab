---
# =============================================================================
# base | Filesystem integrity — and one control that only looks like it (#154)
# =============================================================================
# Measured on BOTH hosts (2026-08-16, re-measured 2026-08-24):
#
#   systemctl is-enabled e2scrub_all.timer   -> enabled, active, green weekly
#   e2scrub_all -n                           -> (empty output)
#   vgs                                      -> (empty output)
#
# e2scrub only ever scrubs LVM LOGICAL VOLUMES — checking a mounted filesystem
# requires a snapshot, and the snapshot is what LVM provides. Neither host has
# LVM, so this timer has fired every week since installation over ZERO bytes.
# It is not misconfigured: it is structurally incapable of examining the volumes
# this lab actually has, and it has been reporting success for doing so.
#
# That is the shape this repository keeps finding and removing — a control that
# is present, exits 0, and can never report the failure it appears to name. A
# green timer that checks nothing is worse than no timer, because it answers the
# question "is anything verifying these filesystems?" with a yes.
#
# Masked rather than disabled, and for the same reason as lynis.timer next door
# in security/audit.yml: a package update must not be able to put a green no-op
# back on the schedule quietly.
#
# --- Here rather than in `storage`, which is the whole of #155 ---------------
# The storage role runs on the homelab only. The offsite Pi has the same inert
# timer and the same absence of LVM (verified over the tunnel, 2026-08-24), so a
# fix in `storage` would have left it running there — exactly what happened to
# lynis.timer. `base` runs on both, which is the property that matters.
#
# --- What actually checks these filesystems, so masking loses nothing --------
#   /mnt/data   `homelab-unlock` runs `e2fsck -p` on the still-unmounted mapper
#               at every unlock (storage/unlock.yml). This paragraph used to
#               stop there, and it was too generous: preen honours the
#               superblock triggers, /mnt/data had NONE, and so that check only
#               ever did work after an unclean shutdown. `Last checked` on it
#               read 2026-05-10 for 108 days while this file claimed it was
#               covered. The triggers are armed as of #254
#               (storage/tasks/fsck.yml), which is what makes the sentence
#               true — the check itself never changed.
#   /           nothing, until the second half of this file. `passno=0` in
#               fstab, `Maximum mount count: -1`, `Check interval: 0`, last
#               checked 2026-02-10 — the date the image was built, on BOTH
#               hosts. That decision was left open when this file was written;
#               it is taken below.
#   both        the daily disk report reads the superblock error counters
#               (`ext4 clean`), which catches errors the kernel has ALREADY
#               noticed. That is detection after the fact, not a consistency
#               check, and the two are easy to mistake for each other.
#
# e2scrub_reap.service is deliberately left enabled: it removes stale e2scrub
# snapshots, and with the timer masked it will never have one to remove. Leaving
# it alone keeps this change to the single unit that makes a false claim.
# =============================================================================

- name: filesystem-checks | Look for the distribution's e2scrub timer
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/e2scrub_all.timer
  register: e2scrub_distro_timer

# Stop and mask in SEPARATE tasks, in this order. Combining `masked: true` with
# `state: stopped` is the equivalent of `systemctl mask --now`: the fragment
# becomes /dev/null, systemd can no longer load the unit it is being asked to
# stop, and it records the unit as FAILED. Measured on the host on 2026-08-16
# for lynis.timer, and the reasoning is identical here — `systemctl --failed`
# staying empty is itself an assertion this lab makes.
- name: filesystem-checks | Stop the e2scrub timer, which scrubs nothing here
  ansible.builtin.systemd:
    name: e2scrub_all.timer
    enabled: false
    state: stopped
  when: e2scrub_distro_timer.stat.exists

- name: filesystem-checks | Mask it so a package update cannot re-enable it
  ansible.builtin.systemd:
    name: e2scrub_all.timer
    masked: true
  when: e2scrub_distro_timer.stat.exists

# =============================================================================
# The root filesystem, which nothing has ever checked (#154, option 2)
# =============================================================================
# Measured on BOTH hosts, 2026-08-25:
#
#   Maximum mount count:  -1                      -> mount-count trigger off
#   Check interval:       0 (<none>)              -> time trigger off
#   Last checked:         Tue Feb 10 04:01:10 2026 -> the image build date
#
# 2026-02-10 is not "the last time someone checked". It is the mkfs timestamp
# baked into the Ubuntu image, identical on two machines flashed months apart.
# Neither root filesystem has EVER been checked, and both were configured so
# that neither ever would be.
#
# --- Two halves, and one without the other does nothing ----------------------
#   fstab passno=1   set in system.yml, on the task that owns that line. It
#                    makes systemd pull in systemd-fsck-root.service at boot.
#                    Alone it changes nothing: the service asks the superblock
#                    whether a check is due, and the superblock said "never".
#   superblock       set here. `-c` and `-i` are the two triggers the service
#                    consults. They live in the superblock rather than in a
#                    file, which is the property that matters on this host:
#                    cloud-init's `mounts` module is enabled and rewrites
#                    /etc/fstab, and /etc/hosts is already wiped on every boot
#                    for the same reason. It cannot reach these.
#
# --- Why the first firing is the next boot, deliberately ---------------------
# `Last checked` is 196 days old, so a 30-day interval is already exceeded and
# the check runs at the very next boot rather than in a month. That boot is the
# supervised on-site one this work is being sequenced around — which is the only
# honest way to enable this. A trigger whose first firing nobody watches is the
# same bet as the controls this repository keeps deleting.
#
# --- The cost, stated rather than discovered ---------------------------------
# ~10 GB used on a 57 GB card: tens of seconds at boot, once a month or once
# every 30 mounts, on a host that reboots a few times a year. Both triggers are
# kept because they fail in opposite directions — the interval covers a host
# that never reboots, the mount count covers one that reboots constantly.
#
# The real cost is not time. systemd-fsck runs `e2fsck -p`, which fixes only
# what is unambiguously safe and exits non-zero on anything else, and systemd
# turns that into an emergency shell. On a host reachable only through a tunnel
# that needs the encrypted volume unlocked, that means physically present or not
# at all. That is the correct outcome — a root filesystem e2fsck refuses to
# preen should not silently carry on serving — but it is a real change in
# failure mode and it is why this waited for a decision rather than shipping
# with the mask above.
# =============================================================================

- name: filesystem-checks | Resolve the device behind /
  ansible.builtin.set_fact:
    root_fs_device: >-
      {{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/')
         | map(attribute='device') | first }}

- name: filesystem-checks | Read the root filesystem's check triggers
  ansible.builtin.command: "tune2fs -l {{ root_fs_device }}"
  register: root_fs_superblock
  changed_when: false
  check_mode: false

# `-c` and `-i` are both set in one call so a half-applied state is not
# reachable, and the guard reads the superblock rather than a marker file: the
# thing being asserted is the filesystem's own state, and it is the only thing
# that can answer honestly after a reflash.
- name: filesystem-checks | Arm both boot-time triggers on the root filesystem
  ansible.builtin.command:
    cmd: >-
      tune2fs -c {{ root_fsck_max_mounts }}
              -i {{ root_fsck_interval_days }}d
              {{ root_fs_device }}
  vars:
    current_max_mounts: "{{ root_fs_superblock.stdout
      | regex_search('Maximum mount count:\\s+(-?\\d+)', '\\1') | first }}"
    current_interval: "{{ root_fs_superblock.stdout
      | regex_search('Check interval:\\s+(\\d+)', '\\1') | first }}"
  when: >-
    current_max_mounts != (root_fsck_max_mounts | string)
    or current_interval != (root_fsck_interval_days | int * 86400) | string
  changed_when: true
