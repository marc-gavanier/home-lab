---
# =============================================================================
# The clock this board has before it has a clock (#292, class C42)
# =============================================================================
# The Pi has no real-time clock. With no RTC and no /usr/lib/clock-epoch,
# systemd advances the clock at boot to the mtime of its own binary — measured
# on 2026-08-30: /usr/lib/systemd/systemd is stamped 2026-07-28 17:04:45, and
# that is exactly where the boot began according to the journal. Both hosts fall
# on the same instant, because they carry the same systemd package.
#
# Everything logged between that moment and the first NTP reply carries a
# timestamp a month in the past. Measured on the reboot of 2026-08-30 17:00:
# timesyncd starts 90 seconds into that window, and the journal segment opened
# during it is named for the bogus instant — which makes a file written ten
# minutes ago the OLDEST on the host, ahead of data from 2026-08-15.
#
# The consequence is not cosmetic. journald's vacuum deletes the oldest segment
# first, so the first thing it removes is the beginning of the CURRENT boot:
# kernel, initramfs, the filesystem check, sysctl, udev, the encrypted-volume
# wait — the part of boot that has already produced #252, #253 and #260. It had
# happened on every boot retained before this one.
#
# --- Why fake-hwclock, and not something written here -----------------------
# ADR-030: no new glue where a packaged tool does the job. fake-hwclock is the
# standard answer on an RTC-less board — it saves the time hourly and at
# shutdown, and restores it in early boot — and it turns the pre-synchronisation
# clock from "the day systemd was built" into "roughly the last time this
# machine was running". A segment stamped an hour ago sorts where it belongs,
# and the vacuum goes back to deleting genuinely old data.
#
# It does NOT make the timestamps correct; nothing without an RTC can. It makes
# them close enough that ordering stops lying, which is the whole of what the
# vacuum needs.
#
# --- What is NOT done here, deliberately ------------------------------------
# Ordering fake-hwclock.service before systemd-journald.service with a drop-in
# was considered and rejected. Both run with DefaultDependencies=no this early,
# and adding an edge between them risks an ordering cycle on a board that must
# not fail to boot: there is no console, and wg0.conf lives inside the encrypted
# volume, so a boot failure is not recoverable from anywhere but the room the Pi
# is in. The package's own ordering is what it was designed with — measured:
# fake-hwclock-load.service carries DefaultDependencies=no and
# Before=sysinit.target, the same tier systemd-journald.service runs in, so the
# two are unordered with respect to each other BY DESIGN. Whether `load` lands
# before the first journal write is therefore a question for the next boot, and
# the health script's pending check is what will answer it.
- name: clock | Install fake-hwclock (no RTC on this board)
  ansible.builtin.apt:
    name: fake-hwclock
    state: present

# The package ships FOUR units and masks one of them itself:
#
#   fake-hwclock-load.service   restore at boot   DefaultDependencies=no,
#                                                 Before=sysinit.target
#   fake-hwclock-save.service   save              driven by the timer
#   fake-hwclock-save.timer     hourly save
#   fake-hwclock.service        the SysV compatibility unit — MASKED by the
#                               package, so both mechanisms cannot run at once
#
# The first version of this file enabled `fake-hwclock.service`, which is the
# name a reader expects and the one thing that cannot work: the deploy died with
# "Unit file /usr/lib/systemd/system/fake-hwclock.service is masked" on the
# offsite, 2026-08-30 17:18. The mask is the package's own and it is correct;
# the task was wrong.
#
# debhelper already enables the two real units at install, so these are
# idempotent by design. They are here to STATE the dependency rather than
# inherit it: what makes this fix work is `load` running before the first
# journal write, and a unit silently disabled by something else would put the
# clock back at the systemd build date without a word.
- name: clock | Restore the saved clock at boot
  ansible.builtin.systemd:
    name: fake-hwclock-load.service
    enabled: true

- name: clock | Keep the saved clock current
  ansible.builtin.systemd:
    name: fake-hwclock-save.timer
    enabled: true
    state: started

# --- How stale the restored clock may be, and why one hour was too much ------
# The package saves hourly and at shutdown. The shutdown save is the one that
# matters and the one you never get when it counts: a power cut, a kill-switch,
# or the USB tamper poweroff all cut without it. So the clock restored at the
# next boot is as stale as the time since the last HOURLY save — up to 60
# minutes, averaging 30.
#
# That is not theoretical. On 2026-09-01 the tamper cut the Pi at 01:48 with the
# last save at 01:20, and the machine came back believing it was 01:20. The
# journal of that boot begins 1734 s before the machine did, which is exactly
# the ordering lie this file exists to prevent — and the health check's own
# threshold is 600 s, so an hourly save cannot help but breach it.
#
# Five minutes caps the staleness below both that threshold and the ten-minute
# antedating at which the vacuum was OBSERVED to delete the current boot's
# opening (2026-08-30, see the header). It does not remove the residue: this
# timer is not ordered after time synchronisation, so a save can still record a
# pre-NTP instant. It shortens how long that wrong value survives from an hour
# to five minutes.
#
# The cost was measured before choosing the number, not after. The file is 20
# bytes in one 4 KiB block; 264 extra saves a day is 2-3 MiB of SD writes
# against a measured 1.39 GiB/day, or about 0.2 %. The audit puts this card at
# 11.5 rewrites a year, so the addition is below the noise.
#
# The empty `OnCalendar=` is required and not decoration: without it systemd
# ADDS this schedule to the packaged `hourly` one instead of replacing it.
- name: clock | Create the timer drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/fake-hwclock-save.timer.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: clock | Cap how stale the restored clock can be (#292, class C42)
  ansible.builtin.copy:
    dest: /etc/systemd/system/fake-hwclock-save.timer.d/override.conf
    content: |
      # Managed by Ansible — do not edit on the host.
      [Timer]
      OnCalendar=
      OnCalendar=*:0/5
    owner: root
    group: root
    mode: "0644"
  notify: Reload the fake-hwclock save interval
