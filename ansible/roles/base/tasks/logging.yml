---
# Volatile-storage policy — bound what the OS writes to the SD card.
# Docker logs and swap already live on the HDD (docker + storage roles); this
# file handles the remaining SD write sources.

# journald writes the persistent journal to /var/log/journal on the SD card.
# Keep it PERSISTENT — boot logs must survive a poweroff, they are what the
# "unexplained poweroff -> reflash" runbook reads to decide — but CAP its size
# so it can never grow unbounded. A drop-in wins over the shipped journald.conf
# without editing it; "99-" sorts last so it beats any CIS-supplied fragment.
#
# The cap was 200M and the journal sat at 199.1M, i.e. permanently rotating:
# measured retention was 14.3 days against 19 days of uptime, so the boot of
# 2026-07-28 was already gone — and boot logs are exactly what that runbook
# needs. 74 % of the volume is SSH session accounting. Raising the cap adds NO
# writes (the cap governs deletion, not writing) and costs 300M on a filesystem
# with 45G free. Counter-check: the offsite host retains 42 days at the same
# cap, which is what shows 200M is not a universal figure but a symptom of this
# host's log rate.
- name: logging | Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: logging | Cap the systemd journal size (drop-in)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-homelab.conf
    mode: "0644"
    content: |
      # Ansible managed — rendered from the home-lab repo, edits on the host will be overwritten
      [Journal]
      Storage=persistent
      Compress=yes
      SystemMaxUse={{ journald_system_max_use | default('500M') }}
      SystemMaxFileSize=50M
      RuntimeMaxUse=50M
  notify: Restart systemd-journald

# /tmp defaults to the SD card. A tmpfs /tmp removes that write surface
# entirely (RAM is plentiful on both hosts) and satisfies CIS's /tmp
# separate-mount rules. fstab is safe HERE — unlike /mnt/data: tmpfs has no
# device dependency, so the LUKS "ghost store" race that banned fstab for the
# data mount does not apply. Size-capped so a runaway temp writer hits a loud
# ENOSPC instead of silently exhausting RAM.
# Deliberately NOT noexec: apt/dpkg postinst and container/pip tooling exec
# from /tmp — noexec there is a foot-gun on a Docker host (documented CIS
# deviation, not a fix).
- name: logging | Mount /tmp as tmpfs (size-capped, nosuid/nodev)
  ansible.posix.mount:
    path: /tmp
    src: tmpfs
    fstype: tmpfs
    opts: "defaults,nosuid,nodev,noatime,size={{ tmp_tmpfs_size | default('1G') }}"
    state: mounted
  # AnsiballZ explodes the module payload under TMPDIR (/tmp by default); the
  # moment this task mounts a fresh tmpfs over /tmp it hides that payload, and
  # the module dies mid-run trying to re-read its own zip. Land the payload in
  # /var/tmp so it survives the remount.
  environment:
    TMPDIR: /var/tmp
