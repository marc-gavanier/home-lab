---
- name: secrets | Refuse an empty secret
  ansible.builtin.assert:
    that:
      - cloudflare_dns_api_token | length > 0
      - nextcloud_admin_password | length > 0
      - nextcloud_db_password | length > 0
      - nextcloud_db_root_password | length > 0
      - nextcloud_redis_password | length > 0
      - immich_db_password | length > 0
      - restic_password | length > 0
    fail_msg: A secret is empty in host_vars/annex/local.yml — fill every value of local.example.yml.
    quiet: true
  no_log: true

- name: secrets | Write the container secrets
  ansible.builtin.copy:
    dest: "{{ data_mount_point }}/secrets/docker/{{ item.name }}"
    content: "{{ item.value }}"
    owner: root
    group: root
    mode: "0444"
  loop:
    - { name: cf_dns_api_token, value: "{{ cloudflare_dns_api_token }}" }
    - { name: nextcloud_admin_password, value: "{{ nextcloud_admin_password }}" }
    - { name: nextcloud_db_password, value: "{{ nextcloud_db_password }}" }
    - { name: nextcloud_db_root_password, value: "{{ nextcloud_db_root_password }}" }
    - { name: nextcloud_redis_password, value: "{{ nextcloud_redis_password }}" }
    - { name: immich_db_password, value: "{{ immich_db_password }}" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: secrets | Render the Nextcloud Redis configuration
  ansible.builtin.copy:
    dest: "{{ data_mount_point }}/secrets/docker/nextcloud_redis.conf"
    content: |
      save ""
      requirepass {{ nextcloud_redis_password }}
    owner: root
    group: "999"
    mode: "0440"
  no_log: true

- name: secrets | Write the restic password
  ansible.builtin.copy:
    dest: "{{ data_mount_point }}/secrets/restic_password"
    content: "{{ restic_password }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true
