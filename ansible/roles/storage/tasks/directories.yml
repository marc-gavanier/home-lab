---
- name: directories | Create top-level data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ services_data_dir }}"
    - "{{ media_dir }}"
    - "{{ media_dir }}/music"
    - "{{ media_dir }}/videos"
    - "{{ media_dir }}/videos/home-videos"
    - "{{ media_dir }}/videos/music-videos"
    - "{{ library_dir }}"
    - "{{ library_dir }}/movies"
    - "{{ library_dir }}/shows"
    - "{{ library_dir }}/downloads"
    - "{{ library_dir }}/downloads/complete"
    - "{{ library_dir }}/downloads/incomplete"
    - "{{ library_dir }}/downloads/complete/tv-sonarr"
    - "{{ library_dir }}/downloads/complete/radarr"
    - "{{ media_dir }}/photos"
    - "{{ backup_dir }}"
    - "{{ services_data_dir }}/nextcloud"
    - "{{ services_data_dir }}/immich"
    - "{{ services_data_dir }}/miniflux"
    - "{{ services_data_dir }}/forgejo"

- name: directories | Close the Forgejo data directory to other local uids
  ansible.builtin.file:
    path: "{{ services_data_dir }}/forgejo/data"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0700"

- name: directories | Own the trees of services that run as root in-container
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    recurse: true
  loop:
    - "{{ services_data_dir }}/jellyfin"
    - "{{ services_data_dir }}/navidrome"

- name: directories | Own the database datadirs as the uid the servers run as
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "999"
    group: "999"
    mode: "0700"
  loop:
    - "{{ services_data_dir }}/nextcloud/db"
    - "{{ services_data_dir }}/immich/db"
    - "{{ services_data_dir }}/miniflux/db"

- name: directories | Create the Vaultwarden log directory
  ansible.builtin.file:
    path: "{{ services_data_dir }}/vaultwarden/logs"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: directories | Create the Nextcloud data directory (holds its log)
  ansible.builtin.file:
    path: "{{ services_data_dir }}/nextcloud/data/data"
    state: directory
    owner: "33"
    group: "33"
    mode: "0770"

- name: directories | Own the netdata state directories as uid 201
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "201"
    group: "201"
    mode: "0750"
  loop:
    - "{{ services_data_dir }}/netdata"
    - "{{ services_data_dir }}/netdata/lib"
    - "{{ services_data_dir }}/netdata/cache"
