---
# Directory structure on the encrypted volume.

- name: directories | Create top-level data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ services_data_dir }}"
    - "{{ media_dir }}"
    - "{{ media_dir }}/music"
    - "{{ media_dir }}/videos"
    - "{{ media_dir }}/videos/movies"
    - "{{ media_dir }}/videos/shows"
    - "{{ media_dir }}/videos/home-videos"
    - "{{ media_dir }}/videos/music-videos"
    - "{{ media_dir }}/photos"
    - "{{ backup_dir }}"
    # Parents of the database datadirs below: without them Ansible (or Docker)
    # would create them as root on a fresh provision, where today they belong
    # to the host user like every other service directory.
    - "{{ services_data_dir }}/nextcloud"
    - "{{ services_data_dir }}/immich"

# Ownership here is a capability decision, not housekeeping. Jellyfin and
# Navidrome run as root *inside* the container, over trees that were created
# 1000:1000 — so root was reading and writing files it did not own, which only
# worked because Docker grants DAC_OVERRIDE by default. Dropping that capability
# (ADR-017) made jellyfin fail its startup sanity check and navidrome report a
# read-only database. Root-owned trees remove the need for the capability
# instead of working around it (issue #28).
#
# recurse: the existing trees hold a mix of root- and 1000-owned files (the
# containers created some, Ansible the rest), so the top directory alone is not
# enough. ~8000 files, re-checked on each deploy and reported changed only while
# something differs.
- name: directories | Own the trees of services that run as root in-container
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    recurse: true
  loop:
    - "{{ services_data_dir }}/jellyfin"
    - "{{ services_data_dir }}/navidrome"

# The two databases run as uid 999 from PID 1 (`user: "999:999"` in
# compose.yaml), which is what lets them hold no capability at all: there is no
# root phase left to chown the datadir, so the datadir has to arrive already
# owned by 999. On a fresh provision Docker would create these bind-mount
# sources as root and Postgres would refuse to start ("data directory has wrong
# ownership") while MariaDB would fail on its first write — neither has CHOWN
# to repair it any more (issue #28).
#
# No `recurse`: the databases create their own files as 999, and walking a
# 1.2 GB tree on every deploy would cost far more than it checks. Mode 0700
# because Postgres requires it, and because a datadir holding every Nextcloud
# file record has no reason to be world-readable.
- name: directories | Own the database datadirs as the uid the servers run as
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "999"
    group: "999"
    mode: "0700"
  loop:
    - "{{ services_data_dir }}/nextcloud/db"
    - "{{ services_data_dir }}/immich/db"

# Netdata keeps its registry and its metrics database here rather than in the
# container's writable layer, which is what lets it run with a read-only rootfs
# (issue #32) — and incidentally means its history now survives a recreate. It
# runs as uid 201 and has no CHOWN once started, so the directories must arrive
# owned by 201.
- name: directories | Own the netdata state directories as uid 201
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "201"
    group: "201"
    mode: "0750"
  loop:
    - "{{ services_data_dir }}/netdata"
    - "{{ services_data_dir }}/netdata/lib"
    - "{{ services_data_dir }}/netdata/cache"
