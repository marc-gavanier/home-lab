---
# Operator scripts: homelab-unlock / homelab-lock.

- name: unlock | Install unlock script
  ansible.builtin.copy:
    dest: /usr/local/bin/homelab-unlock
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Unlock the encrypted data volume and start services
      set -euo pipefail

      MAPPER="{{ luks_mapper_name }}"
      DEVICE="{{ data_disk_device }}"
      MOUNT="{{ data_mount_point }}"

      # --- Why a gate file, and why the obvious guard was not one -------------
      # `if ! mountpoint -q` was not a guard, it was a coin toss, and both
      # outcomes were bad. Measured on 2026-08-26 after a real reboot:
      #
      #   09:54:23.996  operator runs `cryptsetup open`
      #   09:55:03.303  systemd: Found device dev-mapper-data_crypt.device
      #   09:55:03.816  Mounted mnt-data.mount        <- 513 ms later
      #   09:55:03.834  Starting docker.service
      #
      # Units queued at boot with RequiresMountsFor=/mnt/data — docker.service,
      # fail2ban.service — pull the mount the instant the mapper appears. That
      # is 513 ms after the device, and roughly 513 ms AFTER this script's next
      # line has already run. So:
      #
      #   this script opens the mapper   -> `mountpoint` says no, e2fsck starts,
      #                                     systemd mounts it read-write half a
      #                                     second later, UNDERNEATH the check.
      #                                     On a clean volume e2fsck exits first
      #                                     and nothing happens. On a dirty one
      #                                     — the only case this check exists
      #                                     for — it is a repair running against
      #                                     a mounted filesystem.
      #   someone opens it by hand first -> volume already mounted, the whole
      #                                     block skipped in silence.
      #
      # The second is not hypothetical: it is what happened on 2026-08-26. The
      # volume mounted at 09:55:03, this script ran at 10:03:18, and a 4.6 TB
      # volume went unchecked after a shutdown that left PostgreSQL replaying
      # its WAL. `Last checked` on it still reads 2026-05-10.
      #
      # Masking was tried first and CANNOT work here: `systemctl mask` needs to
      # put a symlink at /etc/systemd/system/mnt-data.mount, and that path is
      # the unit file itself, deployed by this role —
      #   Failed to mask unit: File /etc/systemd/system/mnt-data.mount already exists.
      # Measured on the host, 2026-08-26, before this was written.
      #
      # So the gate is a ConditionPathExists drop-in instead. It is stronger
      # than winning a race: while the flag is present the mount unit ASSERTS out,
      # taking its dependents with it, whatever wants it and however fast. The trap
      # is not optional — a flag left behind cannot mount the data volume.
      GATE="/run/homelab/unlock-fsck-in-progress"
      clear_gate() { rm -f "$GATE" 2>/dev/null || true; }

      # A gate that is ALREADY up is not ours, and taking it would be the same
      # mistake this file was written to stop — just aimed at a human instead of
      # at systemd. Measured on 2026-08-26: an operator was running
      # `e2fsck -fn` by hand when this script was started; the old code did
      # `: > "$GATE"` without looking, absorbed the flag as if it had placed it,
      # mounted the volume read-write under the running scan, and cleared the
      # flag from its EXIT trap. Nothing was damaged — the repair pass refused a
      # mounted filesystem, which is the correct failure — but three minutes of
      # diagnosis were destroyed and read as real corruption for half an hour.
      #
      # The trap is armed only AFTER this check, so refusing here cannot delete
      # a flag this run does not own.
      if [ -e "$GATE" ] && ! mountpoint -q "$MOUNT"; then
        echo "Another integrity check holds $MOUNT (gate present, not ours)." >&2
        echo "Wait for it to finish — homelab-fsck clears the gate on exit." >&2
        echo "If you are certain nothing is running: rm -f $GATE" >&2
        exit 1
      fi

      trap clear_gate EXIT

      if ! mountpoint -q "$MOUNT"; then
        mkdir -p /run/homelab
        : > "$GATE"
      fi

      if [ -b "/dev/mapper/$MAPPER" ]; then
        echo "Volume already unlocked."
      else
        echo "Unlocking $DEVICE..."
        cryptsetup open --type luks "$DEVICE" "$MAPPER"
      fi

      if mountpoint -q "$MOUNT"; then
        # Re-run on an already-mounted volume, or the gate did not hold. Either
        # way the check cannot run — and saying so is the whole point. The old
        # code took this branch silently, which is how a skipped integrity check
        # reads as a successful unlock.
        SKIP="integrity check SKIPPED: $MOUNT was already mounted when the check was due"
        echo "WARNING: $SKIP" >&2
        logger -t homelab-unlock -p daemon.warning "$SKIP"
      else
        # The data volume is never in fstab (no passno), so nothing ever fsck's
        # it — the one disk holding all data + Docker's data-root gets no
        # integrity check. Run a preen pass here, on the still-unmounted mapper
        # (fsck on a mounted fs corrupts it). Clean fs = ~1s (reads the clean
        # flag); a real scan only happens after an unclean shutdown — exactly
        # the "unexplained poweroff" case. -p auto-fixes safe problems and
        # stops (rc >= 4) on anything needing a human, so we refuse to mount a
        # filesystem too damaged to repair automatically.
        echo "Checking data volume integrity..."
        # -C 0 draws a progress bar. It matters more than it looks: the check
        # below is normally instant, but on the run where tune2fs's interval has
        # elapsed it takes minutes (3 min 27 s measured on 4.6 TB / 730 GB used,
        # 2026-08-26) and preen mode prints NOTHING while it works. An operator
        # watching a console go silent for three and a half minutes, right after
        # "Checking data volume integrity...", is an operator reaching for the
        # power button.
        rc=0; e2fsck -p -C 0 "/dev/mapper/$MAPPER" || rc=$?
        # Journal the verdict, symmetric with the SKIP branch above. Without
        # this line the run leaves NO trace at all: preen mode prints only to
        # the operator's terminal, and `e2fsck -p` does not rewrite the
        # superblock's `Last checked` when it decides the filesystem is clean.
        # So an hour later "repaired", "had nothing to do" and "was skipped"
        # are indistinguishable — measured after the unclean shutdown of
        # 2026-09-01, where the check ran for 1 min 53 s and nothing recorded
        # what it concluded. rc is e2fsck's own: 0 = clean, 1 = errors FIXED,
        # 2 = fixed and a reboot is wanted, >= 4 handled below.
        case "$rc" in
          0) logger -t homelab-unlock "integrity check passed (e2fsck rc=0, no errors)" ;;
          1) logger -t homelab-unlock -p daemon.warning "integrity check REPAIRED errors (e2fsck rc=1)" ;;
          2) logger -t homelab-unlock -p daemon.warning "integrity check REPAIRED errors, reboot advised (e2fsck rc=2)" ;;
          *) logger -t homelab-unlock -p daemon.err "integrity check could not auto-repair (e2fsck rc=$rc)" ;;
        esac
        if [ "$rc" -ge 4 ]; then
          # The gate STAYS UP on this path, and the trap is disarmed to keep it
          # there. Without that, "NOT mounting" would be advice rather than a
          # refusal: clearing the flag hands the volume straight back to
          # docker.service's queued job, which mounts a filesystem e2fsck has
          # just declined to repair. The operator has to clear it deliberately,
          # which is the correct amount of friction for that decision.
          trap - EXIT
          echo "fsck could not auto-repair (rc=$rc)."
          echo "NOT mounting, and nothing else can mount it either while"
          echo "$GATE exists."
          echo
          echo "  1. rm -f $GATE       # homelab-fsck takes it back immediately"
          echo "  2. homelab-fsck         # read-only first — READ the output"
          echo "  3. homelab-fsck -fy     # only once you know what it will fix"
          echo "  4. homelab-unlock"
          exit 1
        fi
        clear_gate
        echo "Mounting $MOUNT..."
        systemctl start mnt-data.mount
      fi

      clear_gate

      # Arm the USB tamper response (ADR-008) as soon as the volume key is in
      # RAM — that key is exactly what the tamper poweroff protects. Guarded:
      # the arm command ships with the usb-tamper role, deployed after storage.
      if [ -x /usr/local/bin/homelab-tamper-arm ]; then
        /usr/local/bin/homelab-tamper-arm
      fi

      echo "Starting services (staged, in the background)..."
      # --no-block: the target waits for the orchestrator's health-gated waves
      # (~5-8 min); don't hold the operator's shell hostage for that.
      systemctl start --no-block homelab-services.target

      echo "Done. DNS returns in ~1-3 min, full stack in ~8 min."
      echo "Follow progress with: journalctl -t homelab-startup -b -f"

- name: unlock | Install lock script
  ansible.builtin.copy:
    dest: /usr/local/bin/homelab-lock
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Stop services and lock the encrypted volume
      set -euo pipefail

      MAPPER="{{ luks_mapper_name }}"
      MOUNT="{{ data_mount_point }}"

      # Disarm the USB tamper response (ADR-008) first: locking usually means
      # going hands-on, and once the volume is closed there is no key in RAM
      # left to protect anyway.
      if [ -x /usr/local/bin/homelab-tamper-disarm ]; then
        /usr/local/bin/homelab-tamper-disarm
      fi

      echo "Stopping services..."
      systemctl stop homelab-services.target

      echo "Unmounting $MOUNT..."
      systemctl stop mnt-data.mount || true

      echo "Locking volume..."
      cryptsetup close "$MAPPER"

      echo "Done. Volume is locked."
