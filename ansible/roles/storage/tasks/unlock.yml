---
# Operator scripts: homelab-unlock / homelab-lock.

- name: unlock | Install unlock script
  ansible.builtin.copy:
    dest: /usr/local/bin/homelab-unlock
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Unlock the encrypted data volume and start services
      set -euo pipefail

      MAPPER="{{ luks_mapper_name }}"
      DEVICE="{{ data_disk_device }}"
      MOUNT="{{ data_mount_point }}"

      if [ -b "/dev/mapper/$MAPPER" ]; then
        echo "Volume already unlocked."
      else
        echo "Unlocking $DEVICE..."
        cryptsetup open --type luks "$DEVICE" "$MAPPER"
      fi

      if ! mountpoint -q "$MOUNT"; then
        echo "Mounting $MOUNT..."
        systemctl start mnt-data.mount
      fi

      # Arm the USB tamper response (ADR-008) as soon as the volume key is in
      # RAM — that key is exactly what the tamper poweroff protects. Guarded:
      # the arm command ships with the usb-tamper role, deployed after storage.
      if [ -x /usr/local/bin/homelab-tamper-arm ]; then
        /usr/local/bin/homelab-tamper-arm
      fi

      echo "Starting services (staged, in the background)..."
      # --no-block: the target waits for the orchestrator's health-gated waves
      # (~5-8 min); don't hold the operator's shell hostage for that.
      systemctl start --no-block homelab-services.target

      echo "Done. DNS returns in ~1-3 min, full stack in ~8 min."
      echo "Follow progress with: journalctl -t homelab-startup -b -f"

- name: unlock | Install lock script
  ansible.builtin.copy:
    dest: /usr/local/bin/homelab-lock
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Stop services and lock the encrypted volume
      set -euo pipefail

      MAPPER="{{ luks_mapper_name }}"
      MOUNT="{{ data_mount_point }}"

      # Disarm the USB tamper response (ADR-008) first: locking usually means
      # going hands-on, and once the volume is closed there is no key in RAM
      # left to protect anyway.
      if [ -x /usr/local/bin/homelab-tamper-disarm ]; then
        /usr/local/bin/homelab-tamper-disarm
      fi

      echo "Stopping services..."
      systemctl stop homelab-services.target

      echo "Unmounting $MOUNT..."
      systemctl stop mnt-data.mount || true

      echo "Locking volume..."
      cryptsetup close "$MAPPER"

      echo "Done. Volume is locked."
