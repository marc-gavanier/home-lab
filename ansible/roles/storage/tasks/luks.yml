---
- name: luks | Install filesystem and encryption utilities
  ansible.builtin.apt:
    name:
      - e2fsprogs
      - hdparm
      - cryptsetup
      - smartmontools
    state: present

- name: luks | Read the signature on the data disk
  ansible.builtin.command: blkid -p -o value -s TYPE {{ data_disk_device }}
  register: data_disk_type
  changed_when: false
  failed_when: data_disk_type.rc not in [0, 2]
  check_mode: false

- name: luks | Refuse to format a disk that does not read as LUKS
  ansible.builtin.assert:
    that: data_disk_type.stdout == 'crypto_LUKS' or data_disk_force_format
    fail_msg: >-
      {{ data_disk_device }} reads as '{{ data_disk_type.stdout }}', not crypto_LUKS.
      A blank disk, an unreadable one and another disk under this name look the same
      here, and the next task formats. Set data_disk_force_format=true (one run) only
      for a disk meant to be erased.
    quiet: true

- name: luks | Look for the unlock workflow
  ansible.builtin.stat:
    path: /usr/local/bin/homelab-unlock
  register: luks_unlock_script

- name: luks | Look for the opened data volume
  ansible.builtin.stat:
    path: "/dev/mapper/{{ luks_mapper_name }}"
  register: luks_mapper

- name: luks | Refuse to unlock a volume that homelab-unlock owns
  ansible.builtin.assert:
    that: >-
      luks_mapper.stat.exists
      or not luks_unlock_script.stat.exists
      or data_disk_force_format
    fail_msg: >-
      /dev/mapper/{{ luks_mapper_name }} is absent and homelab-unlock is installed:
      the volume is locked on a provisioned host. Opening it here would skip the
      unlock workflow (the expected-poweroff question, fsck, the staged startup and
      the USB tamper arming). Run homelab-unlock on the host, then re-run.
    quiet: true

- name: luks | Format (first time only) and open the LUKS volume
  community.crypto.luks_device:
    device: "{{ data_disk_device }}"
    state: opened
    name: "{{ luks_mapper_name }}"
    passphrase: "{{ luks_passphrase }}"
  no_log: true

- name: luks | Create the ext4 filesystem (first time only)
  community.general.filesystem:
    fstype: ext4
    dev: /dev/mapper/{{ luks_mapper_name }}
    opts: -L homelab-data
  when: data_disk_force_format
