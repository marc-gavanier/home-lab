---
# =============================================================================
# storage | Periodic integrity checks on the data volume (#254)
# =============================================================================
# The volume holding every byte of service data, media, backups and the Docker
# store was armed by nothing. Measured 2026-08-26, before this file existed:
#
#   Filesystem state:     clean
#   Last checked:         Sun May 10 13:21:33 2026     (108 days)
#   Maximum mount count:  -1
#   Check interval:       0 (<none>)
#
# Not in fstab either (no passno, deliberately — homelab-unlock owns the mount),
# so no boot-time fsck could reach it. Nothing was ever going to check it.
#
# --- Why this is configuration and not a new script -------------------------
# `homelab-unlock` already runs `e2fsck -p` on the still-unmounted mapper at
# every unlock, and that looked like the answer for months. It was not, and the
# reason is worth stating precisely: preen HONOURS the superblock triggers, and
# there were none. Measured on a loopback image, 2026-08-26:
#
#   unarmed, clean       "clean, 11/32768 files"                       30 ms
#   armed -c 1, mounted  "has been mounted 1 times without being
#                          checked, check forced"     full check, count reset
#
# So the existing check was never broken — it was correctly declining to do work
# nobody had asked for. Arming the superblock is the entire fix, and ADR-030
# applies: no new glue when an installed tool already does the job.
#
# --- Why the values differ from the root filesystem's ------------------------
# /mnt/data is mounted once per unlock. A mount count would be a trigger that
# never fires, so it is disabled outright rather than set to a number that only
# looks like a policy. See group_vars/all.yml for the reasoning and the cost.
# =============================================================================

- name: fsck | Look for the opened data volume
  ansible.builtin.stat:
    path: "/dev/mapper/{{ luks_mapper_name }}"
  register: data_mapper

# Everything below needs the mapper. A deploy against a locked volume is a
# normal state (the operator has not unlocked yet), not a failure — but it must
# not pass silently either, or an unarmed volume would look armed.
- name: fsck | Warn when the data volume is locked and cannot be armed
  ansible.builtin.debug:
    msg: >-
      /dev/mapper/{{ luks_mapper_name }} is absent — the volume is locked, so
      its check triggers cannot be read or set. Re-run this role after
      `homelab-unlock` to arm them.
  when: not data_mapper.stat.exists

- name: fsck | Read the data volume's check triggers
  ansible.builtin.command: "tune2fs -l /dev/mapper/{{ luks_mapper_name }}"
  register: data_fs_superblock
  changed_when: false
  check_mode: false
  when: data_mapper.stat.exists

# Both in one call so a half-applied state is not reachable, and the guard reads
# the superblock rather than a marker file — the filesystem's own state is the
# thing being asserted, and the only thing that answers honestly after a
# reflash. Same shape as the root filesystem's arming in base/filesystem-checks.
#
# `-c 0` DISABLES the mount count and the superblock then reads `-1`, not `0`.
# Comparing against the variable as written would make this task report changed
# on every single run — measured on a loopback image before this was written.
- name: fsck | Arm the interval trigger on the data volume
  ansible.builtin.command:
    cmd: >-
      tune2fs -c {{ data_fsck_max_mounts }}
              -i {{ data_fsck_interval_days }}d
              /dev/mapper/{{ luks_mapper_name }}
  vars:
    current_max_mounts: "{{ data_fs_superblock.stdout
      | regex_search('Maximum mount count:\\s+(-?\\d+)', '\\1') | first }}"
    current_interval: "{{ data_fs_superblock.stdout
      | regex_search('Check interval:\\s+(\\d+)', '\\1') | first }}"
    wanted_max_mounts: "{{ '-1' if data_fsck_max_mounts | int == 0
                           else data_fsck_max_mounts | string }}"
  when:
    - data_mapper.stat.exists
    - current_max_mounts != wanted_max_mounts
      or current_interval != (data_fsck_interval_days | int * 86400) | string
  changed_when: true

# --- The operator's way to reserve the volume -------------------------------
# The mount gate is raised by homelab-unlock and by nothing else, so a human
# running e2fsck by hand had no way to say "hands off". On 2026-08-26 that cost
# three minutes of diagnosis: a manual `e2fsck -fn` was in flight when
# homelab-unlock was started, and the volume was mounted read-write underneath
# the running scan. This script is the missing half — it takes the gate, and the
# EXIT trap is the part a human does not do reliably.
- name: fsck | Install the operator fsck wrapper
  ansible.builtin.copy:
    dest: /usr/local/bin/homelab-fsck
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Run e2fsck on the data volume with the mount gate held.
      set -euo pipefail

      MAPPER="{{ luks_mapper_name }}"
      MOUNT="{{ data_mount_point }}"
      GATE="/run/homelab/unlock-fsck-in-progress"

      [ "$(id -u)" -eq 0 ] || { echo "Must run as root." >&2; exit 1; }

      if [ ! -b "/dev/mapper/$MAPPER" ]; then
        echo "Volume is locked — nothing to check." >&2
        echo "Open it first: cryptsetup open --type luks {{ data_disk_device }} $MAPPER" >&2
        exit 1
      fi

      # e2fsck on a mounted filesystem corrupts it. This is the one refusal that
      # is not about tidiness.
      if mountpoint -q "$MOUNT"; then
        echo "$MOUNT is mounted — e2fsck on a mounted filesystem corrupts it." >&2
        echo "Stop the stack and unmount first (knowledge/runbooks/boot-and-unlock.md)." >&2
        exit 1
      fi

      if [ -e "$GATE" ]; then
        echo "Another check already holds the gate ($GATE)." >&2
        exit 1
      fi

      mkdir -p /run/homelab
      : > "$GATE"
      # Cleared unconditionally, unlike homelab-unlock's failure path. A
      # read-only pass returns rc=4 for "errors left uncorrected", which is the
      # NORMAL result of `-fn` finding anything — latching the gate on that
      # would leave the volume unmountable after a routine inspection.
      trap 'rm -f "$GATE" 2>/dev/null || true' EXIT

      echo "Gate raised — nothing can mount $MOUNT while this runs."
      rc=0; e2fsck -C 0 "${@:--fn}" "/dev/mapper/$MAPPER" || rc=$?

      if [ "$rc" -ge 4 ]; then
        echo
        echo "e2fsck exited $rc — the filesystem has errors it did not fix." >&2
        echo "With -fn that is expected and means 'found, not repaired'." >&2
        echo "Read the output before mounting; repair with: homelab-fsck -fy" >&2
      fi
      exit "$rc"
