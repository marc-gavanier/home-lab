---
# =============================================================================
# Role: storage — LUKS-encrypted HDD with manual SSH unlock
# =============================================================================
# Boot flow:
#   1. Pi boots normally from SD (unencrypted)
#   2. SSH is available immediately
#   3. User SSH in and runs: sudo homelab-unlock
#   4. LUKS volume opens, /mnt/data mounts, Docker services start
# =============================================================================
# Thin orchestrator: one file per concern, task names prefixed with the file.

- name: Set up LUKS on the data disk (first-time only, probe-guarded)
  ansible.builtin.import_tasks: luks.yml

- name: Install the mnt-data.mount unit (no fstab/crypttab)
  ansible.builtin.import_tasks: mount.yml

- name: Install the homelab-unlock / homelab-lock scripts
  ansible.builtin.import_tasks: unlock.yml

- name: Arm the data volume's integrity checks and install homelab-fsck
  ansible.builtin.import_tasks: fsck.yml

- name: Install the LUKS header backup operator script
  ansible.builtin.import_tasks: header-backup.yml

- name: Install the homelab-services systemd target
  ansible.builtin.import_tasks: target.yml

- name: Create the data tree on /mnt/data
  ansible.builtin.import_tasks: directories.yml

- name: Set up the HDD swapfile via a systemd swap unit
  ansible.builtin.import_tasks: swap.yml
