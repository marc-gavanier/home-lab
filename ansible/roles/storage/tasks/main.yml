---
# =============================================================================
# Role: storage — LUKS-encrypted HDD with manual SSH unlock
# =============================================================================
# Boot flow:
#   1. Pi boots normally from SD (unencrypted)
#   2. SSH is available immediately
#   3. User SSH in and runs: sudo homelab-unlock
#   4. LUKS volume opens, /mnt/data mounts, Docker services start
# =============================================================================
# Thin orchestrator: one file per concern, task names prefixed with the file.

- ansible.builtin.import_tasks: luks.yml         # first-time format/open (probe-guarded)
- ansible.builtin.import_tasks: mount.yml        # mnt-data.mount unit, no fstab/crypttab
- ansible.builtin.import_tasks: unlock.yml       # homelab-unlock / homelab-lock scripts
- ansible.builtin.import_tasks: target.yml       # homelab-services.target
- ansible.builtin.import_tasks: directories.yml  # data tree on /mnt/data
- ansible.builtin.import_tasks: swap.yml         # HDD swapfile via systemd swap unit
