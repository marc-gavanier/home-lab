---
# =============================================================================
# Role: storage — LUKS-encrypted HDD with manual SSH unlock
# =============================================================================
# Boot flow:
#   1. Pi boots normally from SD (unencrypted)
#   2. SSH is available immediately
#   3. User SSH in and runs: sudo homelab-unlock
#   4. LUKS volume opens, /mnt/data mounts, Docker services start
# =============================================================================

- name: Install filesystem and encryption utilities
  ansible.builtin.apt:
    name:
      - e2fsprogs
      - hdparm
      - cryptsetup
      - smartmontools
    state: present

# --- LUKS Encryption (first-time setup only) ---

- name: Check if device is already a LUKS volume
  ansible.builtin.command:
    cmd: cryptsetup isLuks {{ data_disk_device }}
  register: is_luks
  failed_when: false
  changed_when: false

- name: Format device with LUKS (destructive — only if not already LUKS)
  ansible.builtin.shell:
    cmd: echo "{{ luks_passphrase }}" | cryptsetup luksFormat --batch-mode {{ data_disk_device }}
  when: is_luks.rc != 0
  no_log: true

- name: Open LUKS volume for initial setup
  ansible.builtin.shell:
    cmd: echo "{{ luks_passphrase }}" | cryptsetup open --type luks {{ data_disk_device }} {{ luks_mapper_name }}
  when: is_luks.rc != 0
  no_log: true

- name: Check if LUKS volume is already open
  ansible.builtin.stat:
    path: "/dev/mapper/{{ luks_mapper_name }}"
  register: mapper_device

- name: Open LUKS volume (if not open)
  ansible.builtin.shell:
    cmd: echo "{{ luks_passphrase }}" | cryptsetup open --type luks {{ data_disk_device }} {{ luks_mapper_name }}
  when: not mapper_device.stat.exists
  no_log: true

- name: Check if filesystem exists on LUKS volume
  ansible.builtin.command:
    cmd: blkid /dev/mapper/{{ luks_mapper_name }}
  register: blkid_result
  failed_when: false
  changed_when: false

- name: Create ext4 filesystem on LUKS volume
  ansible.builtin.command:
    cmd: mkfs.ext4 -L homelab-data /dev/mapper/{{ luks_mapper_name }}
  when: blkid_result.rc != 0

# --- Mount ---

- name: Create mount point
  ansible.builtin.file:
    path: "{{ data_mount_point }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The mount is a static systemd unit, NOT an fstab entry: it gives
# RequiresMountsFor= a real unit to bind to. Without it, systemd resolves
# RequiresMountsFor={{ data_mount_point }} against the parent mounts only (/),
# so nothing actually stopped Docker from starting before the LUKS volume was
# mounted — it then initialised a ghost store on the SD card *under* the mount
# point (incident of 2026-07-04).
- name: Install mnt-data.mount unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/mnt-data.mount
    mode: "0644"
    content: |
      [Unit]
      Description=Home Lab encrypted data volume
      # No [Install] section: never started at boot — the LUKS mapping only
      # exists after a manual unlock (homelab-unlock starts this unit, or
      # homelab-services.target pulls it in via Requires=).

      [Mount]
      What=/dev/mapper/{{ luks_mapper_name }}
      Where={{ data_mount_point }}
      Type={{ data_filesystem }}
      Options=defaults,noatime

- name: Mount encrypted volume (via the systemd unit)
  ansible.builtin.systemd:
    name: mnt-data.mount
    state: started
    daemon_reload: true

- name: Remove crypttab entry (systemd-cryptsetup-generator ignores noauto)
  ansible.builtin.file:
    path: /etc/crypttab
    state: absent

- name: Remove fstab entry for encrypted volume (homelab-unlock handles mount)
  ansible.posix.mount:
    path: "{{ data_mount_point }}"
    src: "/dev/mapper/{{ luks_mapper_name }}"
    fstype: "{{ data_filesystem }}"
    state: absent_from_fstab

# --- Unlock script ---

- name: Install unlock script
  ansible.builtin.copy:
    dest: /usr/local/bin/homelab-unlock
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Unlock the encrypted data volume and start services
      set -euo pipefail

      MAPPER="{{ luks_mapper_name }}"
      DEVICE="{{ data_disk_device }}"
      MOUNT="{{ data_mount_point }}"

      if [ -b "/dev/mapper/$MAPPER" ]; then
        echo "Volume already unlocked."
      else
        echo "Unlocking $DEVICE..."
        cryptsetup open --type luks "$DEVICE" "$MAPPER"
      fi

      if ! mountpoint -q "$MOUNT"; then
        echo "Mounting $MOUNT..."
        systemctl start mnt-data.mount
      fi

      echo "Starting services (staged, in the background)..."
      # --no-block: the target waits for the orchestrator's health-gated waves
      # (~5-8 min); don't hold the operator's shell hostage for that.
      systemctl start --no-block homelab-services.target

      echo "Done. DNS returns in ~1-3 min, full stack in ~8 min."
      echo "Follow progress with: journalctl -t homelab-startup -b -f"

- name: Install lock script
  ansible.builtin.copy:
    dest: /usr/local/bin/homelab-lock
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Stop services and lock the encrypted volume
      set -euo pipefail

      MAPPER="{{ luks_mapper_name }}"
      MOUNT="{{ data_mount_point }}"

      echo "Stopping services..."
      systemctl stop homelab-services.target

      echo "Unmounting $MOUNT..."
      systemctl stop mnt-data.mount || true

      echo "Locking volume..."
      cryptsetup close "$MAPPER"

      echo "Done. Volume is locked."

# --- Systemd target for services that depend on /mnt/data ---

- name: Create homelab-services systemd target
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-services.target
    mode: "0644"
    content: |
      [Unit]
      Description=Home Lab Services (requires /mnt/data)
      Requires=mnt-data.mount
      # Pull Docker directly (it is disabled at boot, so its WantedBy symlink is
      # stripped — Wants= starts it regardless). Ordered after the mount so it
      # never starts against an empty data-root. The swap lives on the HDD too,
      # so it is activated here as well (see the swap unit).
      Wants=docker.service mnt-data-swapfile.swap
      After=mnt-data.mount docker.service

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# --- Directory Structure ---

- name: Create top-level data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ services_data_dir }}"
    - "{{ media_dir }}"
    - "{{ media_dir }}/music"
    - "{{ media_dir }}/videos"
    - "{{ media_dir }}/videos/movies"
    - "{{ media_dir }}/videos/shows"
    - "{{ media_dir }}/videos/home-videos"
    - "{{ media_dir }}/videos/music-videos"
    - "{{ media_dir }}/photos"
    - "{{ backup_dir }}"

# --- Swap ---

- name: Create swap file on HDD
  ansible.builtin.command:
    cmd: "dd if=/dev/zero of={{ data_mount_point }}/swapfile bs=1M count={{ swap_size_mb }}"
    creates: "{{ data_mount_point }}/swapfile"

- name: Set swap file permissions
  ansible.builtin.file:
    path: "{{ data_mount_point }}/swapfile"
    mode: "0600"

- name: Format swap file
  ansible.builtin.command:
    cmd: "mkswap {{ data_mount_point }}/swapfile"
  register: mkswap_result
  changed_when: mkswap_result.rc == 0
  failed_when: false

# Swap is a systemd unit bound to the data mount, NOT an fstab entry: the
# fstab entry (sw,nofail) was activated at boot, when {{ data_mount_point }} is
# still the bare SD directory — so the system silently created and swapped on a
# ghost swapfile on the SD card (wear + slow) instead of the HDD one.
- name: Install swap unit (activates only once the HDD is mounted)
  ansible.builtin.copy:
    dest: /etc/systemd/system/mnt-data-swapfile.swap
    mode: "0644"
    content: |
      [Unit]
      Description=Home Lab swap on encrypted HDD
      RequiresMountsFor={{ data_mount_point }}

      [Swap]
      What={{ data_mount_point }}/swapfile

- name: Remove swap from fstab (activated by the swap unit instead)
  ansible.posix.mount:
    path: none
    src: "{{ data_mount_point }}/swapfile"
    fstype: swap
    opts: sw,nofail
    state: absent

- name: Activate swap unit
  ansible.builtin.systemd:
    name: mnt-data-swapfile.swap
    state: started
    daemon_reload: true
