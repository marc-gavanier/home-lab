---
- name: heal | Deploy the crash-recovery script
  ansible.builtin.copy:
    src: homelab-stack-heal.sh
    dest: /usr/local/sbin/homelab-stack-heal.sh
    owner: root
    group: root
    mode: "0750"

- name: heal | Install the crash-recovery systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-stack-heal.service
    mode: "0644"
    content: |
      [Unit]
      Description=Homelab crash recovery (restart crashed containers)
      PartOf=homelab-services.target
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/homelab-stack-heal.sh

- name: heal | Look for an installed crash-recovery timer
  ansible.builtin.stat:
    path: /etc/systemd/system/homelab-stack-heal.timer
  register: heal_timer_unit

- name: heal | Read whether the crash-recovery timer is running
  ansible.builtin.systemd:
    name: homelab-stack-heal.timer
  register: heal_timer_active

- name: heal | Install the crash-recovery systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-stack-heal.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Homelab crash recovery timer
      PartOf=homelab-services.target

      [Timer]
      OnActiveSec=2min
      OnUnitActiveSec=2min

      [Install]
      WantedBy=homelab-services.target

- name: heal | Wire the crash-recovery timer into homelab-services.target unless the operator paused it
  ansible.builtin.systemd:
    name: homelab-stack-heal.timer
    enabled: "{{ omit if heal_timer_paused else true }}"
    state: "{{ omit if heal_timer_paused else 'started' }}"
    daemon_reload: true
  vars:
    heal_timer_paused: "{{ heal_timer_unit.stat.exists and heal_timer_active.status.ActiveState != 'active' }}"
