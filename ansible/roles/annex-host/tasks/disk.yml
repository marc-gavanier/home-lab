---
- name: disk | The disk must be a block device before it is read ({{ disk.name }})
  ansible.builtin.stat:
    path: "{{ disk.device }}"
    follow: true
  register: disk_stat
  check_mode: false

- name: disk | Refuse to reason about a device that is not there ({{ disk.name }})
  ansible.builtin.assert:
    that:
      - disk_stat.stat.exists
      - disk_stat.stat.isblk | default(false)
    fail_msg: >-
      {{ disk.device }} is not a block device on this host. Nothing below
      may run: the filesystem probe cannot tell that apart from an unformatted
      disk, and the next task formats.
    quiet: true

- name: disk | Read the disks the root filesystem lives on ({{ disk.name }})
  ansible.builtin.command: lsblk -nls -o NAME,TYPE /dev/disk/by-uuid/{{ root_fs_uuid }}
  vars:
    root_fs_uuid: "{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | map(attribute='uuid') | first }}"
  register: root_disk_chain
  changed_when: false
  check_mode: false

- name: disk | Read the disk the partition belongs to ({{ disk.name }})
  ansible.builtin.command: lsblk -ndo PKNAME {{ disk.device }}
  register: disk_parent
  changed_when: false
  check_mode: false

- name: disk | Refuse the disk the root filesystem lives on ({{ disk.name }})
  ansible.builtin.assert:
    that:
      - disk_parent.stdout | trim | length > 0
      - (disk_parent.stdout | trim) not in
        (root_disk_chain.stdout_lines | select('search', ' disk$') | map('split', ' ') | map('first') | list)
    fail_msg: >-
      {{ disk.device }} is on disk '{{ disk_parent.stdout | trim }}', the
      disk / lives on, or on none. It must name the {{ disk.name }} disk,
      not the system SSD — read `ls -l /dev/disk/by-id/` on the host.
    quiet: true

- name: disk | Read the current filesystem type ({{ disk.name }})
  ansible.builtin.command: blkid -p -o value -s TYPE {{ disk.device }}
  register: disk_fstype
  changed_when: false
  failed_when: disk_fstype.rc not in [0, 2]
  check_mode: false

- name: disk | Refuse to format a disk that does not read as ext4 ({{ disk.name }})
  ansible.builtin.fail:
    msg: >-
      {{ disk.device }} reads as '{{ disk_fstype.stdout }}', not ext4.
      A blank disk and an unreadable one look the same here, and the next task
      formats. Set {{ disk.latch }}=true (one run) to format it.
  when:
    - disk_fstype.stdout != 'ext4'
    - not disk.force | bool

- name: disk | Create the ext4 filesystem ({{ disk.name }})
  community.general.filesystem:
    fstype: ext4
    dev: "{{ disk.device }}"
    force: "{{ disk.force | bool }}"
  when: disk.force | bool

- name: disk | Read the filesystem UUID ({{ disk.name }})
  ansible.builtin.command: blkid -o value -s UUID {{ disk.device }}
  register: disk_uuid
  changed_when: false
  check_mode: false

- name: disk | Mount the disk ({{ disk.name }})
  ansible.posix.mount:
    path: "{{ disk.mount }}"
    src: "UUID={{ disk_uuid.stdout }}"
    fstype: ext4
    opts: "{{ disk.opts }}"
    passno: "2"
    dump: "0"
    state: mounted
