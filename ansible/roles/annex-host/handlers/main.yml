---
- name: Reload systemd units
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload logind
  ansible.builtin.systemd:
    name: systemd-logind
    state: reloaded

- name: Restart upower
  ansible.builtin.systemd:
    name: upower
    state: restarted

- name: Apply netplan
  ansible.builtin.command: netplan apply
  changed_when: true
