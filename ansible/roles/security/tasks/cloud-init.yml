---
- name: cloud-init | Redact flash-time password hash from cloud-init artifacts
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '(?i)^(\s*)passwd:\s*\S.*$'
    replace: '\1passwd: REDACTED'
  loop:
    - /boot/firmware/user-data
    - /var/lib/cloud/instance/user-data.txt
    - /var/lib/cloud/instance/user-data.txt.i
    - /var/lib/cloud/instance/cloud-config.txt
  failed_when: false
