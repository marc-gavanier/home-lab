---
# CIS batches 5-6 (audit 2026-07): the genuine quick wins from the arbitration
# table, kept to what ground-truth checks showed as REAL gaps. Deliberately
# NOT here (verified already-satisfied or decided against):
#   - lock shell-less accounts (5.4.2.8): every system account is already
#     locked (* / ! in shadow) — the role's 17 "changed" are false positives
#   - sudo use_pty (5.2.2): Ubuntu ships "Defaults use_pty" already
#   - strong password hashing (5.4.1.4): login.defs is already SHA512
#   - system-account shells (5.4.2.7): no non-root account has a login shell
#   - umask 027, shell TMOUT, login banners, su group: see report §2 (skip/careful)

# 1.1.2.2.4 — /dev/shm is tmpfs, exec-capable by default; a classic staging
# ground for "drop payload in RAM and run it". It already has nosuid,nodev;
# add noexec. (Container /dev/shm is a separate per-container mount — unaffected.)
- name: hardening | Mount /dev/shm nodev,nosuid,noexec (CIS 1.1.2.2.4)
  ansible.posix.mount:
    path: /dev/shm
    src: tmpfs
    fstype: tmpfs
    opts: defaults,nodev,nosuid,noexec
    state: mounted

# 2.1.21 — Postfix ships listening on all interfaces (0.0.0.0:25 + [::]:25).
# No mail is received from the network here; restrict it to loopback so it
# only carries local cron/report mail.
- name: hardening | Postfix listens on loopback only (CIS 2.1.21)
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^inet_interfaces\s*='
    line: 'inet_interfaces = loopback-only'
  notify: Restart postfix

# lynis MAIL-8818. The stock banner is `$myhostname ESMTP $mail_name (Ubuntu)`,
# which names the software and the distribution to anyone who opens the port.
# Only loopback can, since the task above — so this is depth, not a hole being
# closed: the value of not naming the version is that a local process which
# should not be talking to port 25 learns nothing from the answer. Postfix
# requires the banner to START with $myhostname, so this is the shortest legal
# form.
- name: hardening | Postfix banner names the host and nothing else (lynis MAIL-8818)
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^smtpd_banner\s*='
    line: 'smtpd_banner = $myhostname ESMTP'
  notify: Restart postfix

# 5.2.3 — record every sudo command to a dedicated log (use_pty is already a
# Ubuntu default). Drop-in + visudo validation so a syntax slip can't lock sudo.
- name: hardening | Enable a dedicated sudo logfile (CIS 5.2.3)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/cis-logfile
    content: "Defaults logfile=/var/log/sudo.log\n"
    mode: "0440"
    validate: 'visudo -cf %s'

# --- batch 6 ---

# 5.3.3.4.1 — pam_unix ships with `nullok` in common-auth, which permits login
# to accounts that have an EMPTY password. Remove the token (word-boundary
# replace, leaves the rest of the line intact).
- name: hardening | Remove nullok from pam_unix (CIS 5.3.3.4.1)
  ansible.builtin.replace:
    path: /etc/pam.d/common-auth
    regexp: '(\bpam_unix\.so\b[^\n]*?)\s+nullok\b'
    replace: '\1'

# 5.4.2.6 — root's login shell has no explicit umask; default 022 lets new
# root-created files be world-readable. Set 027 for root only (narrower and
# safer than a system-wide default umask, which can break cross-service reads).
# Target .bash_profile: the CIS-standard location for a login shell (also what
# the benchmark checks).
- name: hardening | Set root umask to 027 (CIS 5.4.2.6)
  ansible.builtin.lineinfile:
    path: /root/.bash_profile
    regexp: '^\s*umask'
    line: 'umask 0027'  # 0027 == 027; the leading zero matches the CIS literal
    create: true
    mode: "0600"

# 2.3.2.1 — systemd-timesyncd has no explicit time source (NTP= commented),
# relying on DHCP/fallback. Pin authorized NTP servers.
- name: hardening | Configure authorized NTP servers for timesyncd (CIS 2.3.2.1)
  ansible.builtin.lineinfile:
    path: /etc/systemd/timesyncd.conf
    regexp: '^#?NTP='
    line: 'NTP=0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org 3.pool.ntp.org'
    insertafter: '^\[Time\]'
  notify: Restart timesyncd

# lynis TIME-3185 warns when /run/systemd/timesync/synchronized is 2048 s old or
# more. systemd's PollIntervalMaxSec defaults to exactly 2048, so a STABLE clock
# backs off until the file is permanently between 0 and 2048 seconds old and the
# weekly audit warns or not depending on where in that cycle it happens to run —
# measured 1612 s then 1679 s, sixty-seven seconds apart, on a host reporting
# NTPSynchronized=yes. It cost two points of the hardening index on 2026-08-24
# and pushed the Kuma monitor DOWN.
#
# Capping the interval below the threshold is not silencing the test, it is what
# makes it able to fail for the right reason: as it stands the age of that file
# cannot distinguish "backed off to the maximum" from "synchronisation stopped",
# because both produce the same number. At 1024 the file is always fresher than
# lynis's threshold while timesyncd is working, and crosses it immediately when
# it is not. Costs one poll every ~17 minutes instead of ~34, against four pool
# servers.
- name: hardening | Cap the timesyncd poll interval below lynis's threshold (TIME-3185)
  ansible.builtin.lineinfile:
    path: /etc/systemd/timesyncd.conf
    regexp: '^#?PollIntervalMaxSec='
    line: 'PollIntervalMaxSec=1024'
    insertafter: '^\[Time\]'
  notify: Restart timesyncd
