---
- name: hardening | Mount /dev/shm nodev,nosuid,noexec (CIS 1.1.2.2.4)
  ansible.posix.mount:
    path: /dev/shm
    src: tmpfs
    fstype: tmpfs
    opts: defaults,nodev,nosuid,noexec
    state: mounted

- name: hardening | Postfix listens on loopback only (CIS 2.1.21)
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^inet_interfaces\s*='
    line: 'inet_interfaces = loopback-only'
  notify: Restart postfix

- name: hardening | Postfix banner names the host and nothing else (lynis MAIL-8818)
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^smtpd_banner\s*='
    line: 'smtpd_banner = $myhostname ESMTP'
  notify: Restart postfix

- name: hardening | Enable a dedicated sudo logfile (CIS 5.2.3)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/cis-logfile
    content: "Defaults logfile=/var/log/sudo.log\n"
    mode: "0440"
    validate: 'visudo -cf %s'

- name: hardening | Rotate the sudo logfile the way rsyslog rotates auth.log, masking what it carries
  ansible.builtin.copy:
    dest: /etc/logrotate.d/sudo
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/sudo.log {
          daily
          rotate 28
          missingok
          notifempty
          compress
          delaycompress
          create 0600 root root
          postrotate
              [ -f /var/log/sudo.log.1 ] && sed -i -E 's@([A-Za-z0-9_]{32,}|[A-Za-z0-9+/]{20,}={1,2})@***@g' /var/log/sudo.log.1 || true
          endscript
      }

- name: hardening | Rotate auth.log daily and mask the credentials it carries
  ansible.builtin.copy:
    dest: /etc/logrotate.d/rsyslog
    owner: root
    group: root
    mode: "0644"
    content: |
      /var/log/syslog
      /var/log/mail.log
      /var/log/kern.log
      /var/log/user.log
      /var/log/cron.log
      {
          rotate 4
          weekly
          missingok
          notifempty
          compress
          delaycompress
          sharedscripts
          postrotate
              /usr/lib/rsyslog/rsyslog-rotate
          endscript
      }

      /var/log/auth.log
      {
          rotate 28
          daily
          missingok
          notifempty
          compress
          delaycompress
          sharedscripts
          postrotate
              [ -f /var/log/auth.log.1 ] && sed -i -E 's@([A-Za-z0-9_]{32,}|[A-Za-z0-9+/]{20,}={1,2})@***@g' /var/log/auth.log.1 || true
              /usr/lib/rsyslog/rsyslog-rotate
          endscript
      }

- name: hardening | Remove nullok from pam_unix (CIS 5.3.3.4.1)
  ansible.builtin.replace:
    path: /etc/pam.d/common-auth
    regexp: '(\bpam_unix\.so\b[^\n]*?)\s+nullok\b'
    replace: '\1'

- name: hardening | Set root umask to 027 (CIS 5.4.2.6)
  ansible.builtin.lineinfile:
    path: /root/.bash_profile
    regexp: '^\s*umask'
    line: 'umask 0027'
    create: true
    mode: "0600"

- name: hardening | Configure authorized NTP servers for timesyncd (CIS 2.3.2.1)
  ansible.builtin.lineinfile:
    path: /etc/systemd/timesyncd.conf
    regexp: '^#?NTP='
    line: 'NTP=0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org 3.pool.ntp.org'
    insertafter: '^\[Time\]'
  notify: Restart timesyncd

- name: hardening | Cap the timesyncd poll interval below lynis's threshold (TIME-3185)
  ansible.builtin.lineinfile:
    path: /etc/systemd/timesyncd.conf
    regexp: '^#?PollIntervalMaxSec='
    line: 'PollIntervalMaxSec=1024'
    insertafter: '^\[Time\]'
  notify: Restart timesyncd
