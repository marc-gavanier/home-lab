---
# SSH hardening + admin account lockdown.

- name: ssh | Configure SSH hardening
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    validate: 'sshd -t -f %s'
  loop:
    - { regexp: '^#?Port ', line: "Port {{ ssh_port_hardened }}" }
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
    - { regexp: '^#?PermitEmptyPasswords', line: 'PermitEmptyPasswords no' }
    - { regexp: '^#?X11Forwarding', line: 'X11Forwarding no' }
    - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 3' }
    - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval 300' }
    - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax 2' }
    - { regexp: '^#?AllowUsers', line: "AllowUsers {{ ssh_allowed_users | join(' ') }}" }
    # CIS batch 3 (audit 2026-07). DisableForwarding deliberately NOT set:
    # the SSH tunnel is the only admin path to the wg-easy UI (deviation §1).
    - { regexp: '^#?LogLevel', line: 'LogLevel VERBOSE' }
    - { regexp: '^#?LoginGraceTime', line: 'LoginGraceTime 60' }
    - { regexp: '^#?MaxSessions', line: 'MaxSessions 10' }
    - { regexp: '^#?MaxStartups', line: 'MaxStartups 10:30:60' }
    - { regexp: '^#?PermitUserEnvironment', line: 'PermitUserEnvironment no' }
    - { regexp: '^#?IgnoreRhosts', line: 'IgnoreRhosts yes' }
    - { regexp: '^#?HostbasedAuthentication', line: 'HostbasedAuthentication no' }
    - { regexp: '^#?GSSAPIAuthentication', line: 'GSSAPIAuthentication no' }
    # SUBTRACTIVE, not absolute. An absolute list freezes the set at the day it
    # was written: it is a valid key, sshd parses it without a warning, `sshd -T`
    # reports it applied, and the only observable is an algorithm the daemon
    # would otherwise have gained. Measured on 2026-09-12 against OpenSSH
    # 9.6p1's own defaults, read with `sshd -T -f /dev/null`:
    #
    #   Ciphers        the absolute list was SET-IDENTICAL to the default. Six
    #                  names, zero policy content — it existed only to freeze.
    #   MACs           removed 6 of the default 10.
    #   KexAlgorithms  removed 4 of the default 10.
    #
    # Each `-` form below was verified to produce a set byte-identical to what
    # the host serves today, and the verification was itself controlled: a
    # deliberate typo in the MACs list leaves `hmac-sha1-etm@openssh.com` in the
    # result, so the comparison detects one. Note that `sshd -T` ACCEPTS an
    # unknown name in a `-` list without complaint — only comparing the
    # resulting set catches a mistake here.
    #
    # Why this matters beyond tidiness: `ssh -Q kex` on 9.6 contains no
    # `mlkem768x25519-sha256`. When OpenSSH 9.9 adds it, the absolute list would
    # have excluded the post-quantum exchange silently, on the only path into
    # this machine, with every check green.
    - regexp: '^#?Ciphers'
      line: >-
        Ciphers
        {{ ['-*-cbc', '3des*', 'arcfour*', 'rijndael*'] | join(',') }}
    - regexp: '^#?MACs'
      line: >-
        MACs
        {{ ['-umac-64-etm@openssh.com', 'umac-128-etm@openssh.com',
            'hmac-sha1-etm@openssh.com', 'umac-64@openssh.com',
            'umac-128@openssh.com', 'hmac-sha1'] | join(',') }}
    - regexp: '^#?KexAlgorithms'
      line: >-
        KexAlgorithms
        {{ ['-ecdh-sha2-nistp256', 'ecdh-sha2-nistp384', 'ecdh-sha2-nistp521',
            'diffie-hellman-group-exchange-sha256'] | join(',') }}
  notify: Restart SSH

# SSH is key-only and sudo is NOPASSWD, so the account password's only reachable
# use was a local console login — and its hash sat on the unencrypted SD card,
# crackable offline by anyone who reads the card. Lock it: `!` prefix on the
# hash disables password auth everywhere without touching the SSH keys.

- name: ssh | Lock the admin account password (no legitimate use, offline-crackable)
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    password_lock: true
