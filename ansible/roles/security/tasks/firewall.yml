---
- name: firewall | Repair non-ASCII Ansible markers in after.rules
  ansible.builtin.replace:
    path: /etc/ufw/after.rules
    regexp: '^(# (?:BEGIN|END) ANSIBLE MANAGED) — (.*)$'
    replace: '\1 - \2'

- name: firewall | Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: firewall | Align UFW sysctl overrides with the CIS hardening (log martians)
  ansible.builtin.lineinfile:
    path: /etc/ufw/sysctl.conf
    regexp: '^#?net/ipv4/conf/{{ item }}/log_martians='
    line: 'net/ipv4/conf/{{ item }}/log_martians=1'
  loop: [all, default]

- name: firewall | Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: firewall | Set UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: firewall | Allow inbound traffic on the loopback interface (CIS 4.2.4)
  community.general.ufw:
    rule: allow
    direction: in
    interface: lo

- name: firewall | Allow outbound traffic on the loopback interface (CIS 4.2.4)
  community.general.ufw:
    rule: allow
    direction: out
    interface: lo

- name: firewall | Deny spoofed loopback traffic on real interfaces (CIS 4.2.4)
  community.general.ufw:
    rule: deny
    direction: in
    from_ip: "{{ item }}"
  loop:
    - 127.0.0.0/8
    - ::1

- name: firewall | Refuse to proceed with no SSH source to allow
  ansible.builtin.assert:
    that:
      - ssh_allowed_sources | default([]) | length > 0
    fail_msg: >-
      ssh_allowed_sources is empty, so the loop below would add no allow rule
      while the three retractions and `ufw enable` further down run regardless.
      That combination is default-deny with nothing permitted: the host becomes
      unreachable at the end of this play, and on a fresh provision there is no
      previous rule to fall back on. `required: true` does not catch it — an
      empty list satisfies it. Set the permitted sources in
      host_vars/<host>/ before running this again.
    quiet: true

- name: firewall | Allow SSH through UFW from the permitted sources (IPv4 only)
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port_hardened }}"
    proto: tcp
    from_ip: "{{ item }}"
    comment: SSH
  loop: "{{ ssh_allowed_sources }}"

- name: firewall | Remove the unscoped IPv4 SSH rule the scoped ones replace
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port_hardened }}"
    proto: tcp
    from_ip: 0.0.0.0/0
    delete: true

- name: firewall | Remove the legacy IPv6 SSH rule
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port_hardened }}"
    proto: tcp
    from_ip: "::/0"
    delete: true

- name: firewall | Allow service ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    from_ip: "{{ item.from_ip | default('any') }}"
    comment: "{{ item.comment | default(omit) }}"
  # floor: none needed — a host may legitimately publish no service port. What must
  loop: "{{ ufw_service_rules | default([]) }}"

- name: firewall | Remove the legacy proto-less DNS rule ufw added beside its replacement
  community.general.ufw:
    rule: allow
    port: "53"
    from_ip: 192.168.1.0/24
    delete: true

- name: firewall | Declare the DOCKER-USER chain in UFW's after.rules
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBLE MANAGED - DOCKER-USER chain"
    insertafter: '^# End required lines'
    block: |
      :DOCKER-USER - [0:0]
  notify: Reload UFW

- name: firewall | Restrict Pi-hole's DNS to the LAN, the VPN and the container networks
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBLE MANAGED - DOCKER-USER rules"
    insertbefore: '^COMMIT'
    block: |
      -A DOCKER-USER -p udp --dport 53 -s 192.168.1.0/24 -j RETURN
      -A DOCKER-USER -p tcp --dport 53 -s 192.168.1.0/24 -j RETURN
      -A DOCKER-USER -p udp --dport 53 -s 10.8.0.0/24 -j RETURN
      -A DOCKER-USER -p tcp --dport 53 -s 10.8.0.0/24 -j RETURN
      -A DOCKER-USER -p udp --dport 53 -s 172.16.0.0/12 -j RETURN
      -A DOCKER-USER -p tcp --dport 53 -s 172.16.0.0/12 -j RETURN
      -A DOCKER-USER -p udp --dport 53 -j DROP
      -A DOCKER-USER -p tcp --dport 53 -j DROP
  notify: Reload UFW

- name: firewall | Enable UFW
  community.general.ufw:
    state: enabled
