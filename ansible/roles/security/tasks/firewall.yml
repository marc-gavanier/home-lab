---
# UFW: deny by default, explicit whitelist.

- name: firewall | Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

# UFW applies its own sysctl file (IPT_SYSCTL=/etc/ufw/sysctl.conf) on every
# reload, OVERRIDING /etc/sysctl.d — its shipped log_martians=0 was silently
# undoing the CIS hardening on each run (flip-flop caught by the convergence
# runs). Align UFW's copy with the base role's value.
- name: firewall | Align UFW sysctl overrides with the CIS hardening (log martians)
  ansible.builtin.lineinfile:
    path: /etc/ufw/sysctl.conf
    regexp: '^#?net/ipv4/conf/{{ item }}/log_martians='
    line: 'net/ipv4/conf/{{ item }}/log_martians=1'
  loop: [all, default]

- name: firewall | Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: firewall | Set UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

# CIS 4.2.4 — explicit loopback handling: allow all traffic on lo, and drop
# anything from a loopback address arriving on a real interface (spoofing).
- name: firewall | Allow inbound traffic on the loopback interface (CIS 4.2.4)
  community.general.ufw:
    rule: allow
    direction: in
    interface: lo

- name: firewall | Allow outbound traffic on the loopback interface (CIS 4.2.4)
  community.general.ufw:
    rule: allow
    direction: out
    interface: lo

- name: firewall | Deny spoofed loopback traffic on real interfaces (CIS 4.2.4)
  community.general.ufw:
    rule: deny
    direction: in
    from_ip: "{{ item }}"
  loop:
    - 127.0.0.0/8
    - ::1

# IPv4 only, and deliberately. A bare `rule: allow` with no from_ip emits the
# rule for BOTH families, which on a host with a global IPv6 address and no NAT
# in front of it puts SSH on the internet — the offsite Pi is exactly that.
# Every SSH connection either host has seen in 30 days came from the WireGuard
# subnet or a LAN, over v4; none came from a v6 source, and the homelab has no
# IPv6 egress at all. So the v6 half protects nothing and is removed below.
- name: firewall | Allow SSH through UFW (IPv4 only)
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port_hardened }}"
    proto: tcp
    from_ip: 0.0.0.0/0
    comment: SSH

# Adding the scoped rule above does NOT retract the unscoped one: ufw sees an
# identical v4 entry and skips it, leaving the v6 entry in place. It has to go
# explicitly. Ordered after the allow so the v4 path is never absent, not even
# between two tasks — this runs against a host whose only access is a tunnel.
- name: firewall | Remove the legacy IPv6 SSH rule
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port_hardened }}"
    proto: tcp
    from_ip: "::/0"
    delete: true

# Per-host service ports — defined in host_vars/<host>/main.yml
- name: firewall | Allow service ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    from_ip: "{{ item.from_ip | default('any') }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ ufw_service_rules | default([]) }}"

- name: firewall | Enable UFW
  community.general.ufw:
    state: enabled
