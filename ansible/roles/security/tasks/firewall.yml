---
# UFW: deny by default, explicit whitelist.

- name: firewall | Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

# UFW applies its own sysctl file (IPT_SYSCTL=/etc/ufw/sysctl.conf) on every
# reload, OVERRIDING /etc/sysctl.d — its shipped log_martians=0 was silently
# undoing the CIS hardening on each run (flip-flop caught by the convergence
# runs). Align UFW's copy with the base role's value.
- name: firewall | Align UFW sysctl overrides with the CIS hardening (log martians)
  ansible.builtin.lineinfile:
    path: /etc/ufw/sysctl.conf
    regexp: '^#?net/ipv4/conf/{{ item }}/log_martians='
    line: 'net/ipv4/conf/{{ item }}/log_martians=1'
  loop: [all, default]

- name: firewall | Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: firewall | Set UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

# CIS 4.2.4 — explicit loopback handling: allow all traffic on lo, and drop
# anything from a loopback address arriving on a real interface (spoofing).
- name: firewall | Allow inbound traffic on the loopback interface (CIS 4.2.4)
  community.general.ufw:
    rule: allow
    direction: in
    interface: lo

- name: firewall | Allow outbound traffic on the loopback interface (CIS 4.2.4)
  community.general.ufw:
    rule: allow
    direction: out
    interface: lo

- name: firewall | Deny spoofed loopback traffic on real interfaces (CIS 4.2.4)
  community.general.ufw:
    rule: deny
    direction: in
    from_ip: "{{ item }}"
  loop:
    - 127.0.0.0/8
    - ::1

# IPv4 only, and deliberately. A bare `rule: allow` with no from_ip emits the
# rule for BOTH families, which on a host with a global IPv6 address and no NAT
# in front of it puts SSH on the internet — the offsite Pi is exactly that.
# Every SSH connection either host has seen in 30 days came from the WireGuard
# subnet or a LAN, over v4; none came from a v6 source, and the homelab has no
# IPv6 egress at all. So the v6 half protects nothing and is removed below.
- name: firewall | Allow SSH through UFW (IPv4 only)
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port_hardened }}"
    proto: tcp
    from_ip: 0.0.0.0/0
    comment: SSH

# Adding the scoped rule above does NOT retract the unscoped one: ufw sees an
# identical v4 entry and skips it, leaving the v6 entry in place. It has to go
# explicitly. Ordered after the allow so the v4 path is never absent, not even
# between two tasks — this runs against a host whose only access is a tunnel.
- name: firewall | Remove the legacy IPv6 SSH rule
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port_hardened }}"
    proto: tcp
    from_ip: "::/0"
    delete: true

# Per-host service ports — defined in host_vars/<host>/main.yml
- name: firewall | Allow service ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    from_ip: "{{ item.from_ip | default('any') }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ ufw_service_rules | default([]) }}"

# Same shape as the legacy IPv6 SSH rule above, and for the same reason: adding
# a scoped rule does not retract an older one whose tuple differs. This one is
# the proto-less `53` entry that host_vars carried until 2026-09-03, which ufw
# stores as proto `any` and prints with the comment "DNS (Pi-hole, LAN only)" —
# a claim DOCKER-USER, not ufw, has been enforcing since 2026-09-02. Ordered
# AFTER the loop that creates the explicit udp and tcp rules, so the INPUT path
# is never left without a udp/53 allow.
#
# `delete: true` with no `proto` is what matches the proto-less rule: the module
# passes no protocol and ufw resolves that to `any`, which is the tuple to remove.
- name: firewall | Remove the legacy proto-less DNS rule ufw added beside its replacement
  community.general.ufw:
    rule: allow
    port: "53"
    from_ip: 192.168.1.0/24
    delete: true

# Every rule above lands on the INPUT path. A packet bound for a published
# container port never takes it: it is FORWARDed, and in FORWARD Docker's own
# chains sit ahead of every ufw-* chain — DOCKER-USER at position 1,
# DOCKER-FORWARD at 2, the six ufw-*-forward chains only from 3. Docker's
# DOCKER chain then ACCEPTs by destination port with no source filter at all,
# which terminates the traversal before ufw is ever consulted.
#
# Measured on the running host 2026-09-02: six of the seven inbound ufw rules
# were in that position. Five of them (80, 443, 51413 twice, 51820) say
# "Anywhere" and are therefore honest — Docker permits exactly what they
# describe. The sixth said "DNS (Pi-hole, LAN only)" and restricted nothing,
# so it is the only one whose written intent was violated, and the only one
# restored here. Deliberately NOT a general default-deny in front of Docker:
# 51820/udp is the WireGuard tunnel, which is the only way into this host.
#
# DOCKER-USER is the single supported hook — Docker traverses it first and
# never rewrites its contents. Declaring the chain here also creates it when
# ufw loads before dockerd has ever run, so the ruleset cannot fail to parse.
- name: firewall | Declare the DOCKER-USER chain in UFW's after.rules
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBLE MANAGED — DOCKER-USER chain"
    insertafter: '^# End required lines'
    block: |
      :DOCKER-USER - [0:0]
  notify: Reload UFW

# Source addresses are still the original ones here: filter/FORWARD is
# traversed before nat/POSTROUTING, so the laundering that rewrites bridge
# sources into 172.18.0.1 has not happened yet and `-s` matches what the
# client actually sent.
- name: firewall | Restrict Pi-hole's DNS to the LAN, the VPN and the container networks
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBLE MANAGED — DOCKER-USER rules"
    insertbefore: '^COMMIT'
    block: |
      -A DOCKER-USER -p udp --dport 53 -s 192.168.1.0/24 -j RETURN
      -A DOCKER-USER -p tcp --dport 53 -s 192.168.1.0/24 -j RETURN
      -A DOCKER-USER -p udp --dport 53 -s 10.8.0.0/24 -j RETURN
      -A DOCKER-USER -p tcp --dport 53 -s 10.8.0.0/24 -j RETURN
      # The stack resolves through Pi-hole too, and that traffic is FORWARDed
      # from a bridge subnet. Omitting this pair breaks DNS for every container.
      -A DOCKER-USER -p udp --dport 53 -s 172.16.0.0/12 -j RETURN
      -A DOCKER-USER -p tcp --dport 53 -s 172.16.0.0/12 -j RETURN
      -A DOCKER-USER -p udp --dport 53 -j DROP
      -A DOCKER-USER -p tcp --dport 53 -j DROP
  notify: Reload UFW

- name: firewall | Enable UFW
  community.general.ufw:
    state: enabled
