---
- name: packages | Remove unused network services and legacy clients (CIS 2.1.x, 2.2.x)
  ansible.builtin.apt:
    name:
      - avahi-daemon
      - telnet
      - ftp
      - snapd
    state: absent
    purge: true
    autoremove: true

- name: packages | Keep snapd from coming back with a metapackage
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/no-snapd
    content: |
      Package: snapd
      Pin: release a=*
      Pin-Priority: -1
    owner: root
    group: root
    mode: "0644"
