---
# fail2ban on SSH, Nextcloud and Vaultwarden.
#
# SSH is not reachable from the internet, so the sshd jail guards the least
# exposed door. Nextcloud and Vaultwarden sit behind vpn-only, which makes
# their attacker a compromised VPN client or LAN device — scenario #1 of the
# 2026-07-19 audit, and the one the container hardening was aimed at. Brute
# force from inside the perimeter was unthrottled until now (issue #35).
#
# ---------------------------------------------------------------------------
# `fail2ban_service_jails` gates everything that assumes the Docker stack is on
# this host. The sshd jail and the base hardening stay unconditional, because
# both hosts want them.
#
# It exists because this file had zero `when:` conditions and touched
# `services_data_dir` unconditionally, which on the offsite Pi is
# /mnt/data/services — a path that does not exist there, since that host mounts
# /mnt/backup and runs neither service. `file: state: touch` does not create
# parent directories, so the task failed, the play stopped, and the
# `offsite-backup` role never ran. Offsite last converged 2026-07-19, the day
# before these jails landed; the second copy was un-provisionable for a month
# while looking healthy (issue #115).
#
# OPT-OUT rather than opt-in, deliberately. The failure modes are not
# symmetric: with a default of false, losing the homelab's variable would
# silently drop two jails there — and the posture check would not catch it,
# because it compares jails *configured* against jails *loaded*, and both would
# agree on sshd alone. With a default of true, a new host without the stack
# fails loudly, which is recoverable. Same shape as `free_port_53`: offsite is
# the exception, so offsite carries the variable.
# ---------------------------------------------------------------------------

- name: fail2ban | Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: fail2ban | Create the systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/fail2ban.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: fail2ban_service_jails | default(true)

# Neither filter ships with Debian's fail2ban. The `bitwarden` filter that does
# ship targets the *official* Bitwarden server (Bit.Core log lines) and never
# matches Vaultwarden — a jail that silently catches nothing, which is exactly
# the failure mode this stack keeps producing.
- name: fail2ban | Install the Vaultwarden filter
  ansible.builtin.copy:
    dest: /etc/fail2ban/filter.d/vaultwarden.conf
    mode: "0644"
    content: |
      # Managed by Ansible — do not edit on the host.
      # Vaultwarden logs to LOG_FILE with its own prefix:
      #   [2026-07-27 12:00:00.000][vaultwarden::api::identity][ERROR] Username or
      #   password is incorrect. Try again. IP: 1.2.3.4. Username: user@example.com.
      [Definition]
      failregex = ^.*\[vaultwarden::api::identity\]\[ERROR\] Username or password is incorrect\. Try again\. IP: <HOST>\.
                  ^.*\[vaultwarden::api::identity\]\[ERROR\] Invalid TOTP code.*IP: <HOST>\.
                  ^.*\[vaultwarden::api::admin\]\[ERROR\] Invalid admin token\. IP: <HOST>
      ignoreregex =
      journalmatch =
  notify: Restart fail2ban
  when: fail2ban_service_jails | default(true)

- name: fail2ban | Install the Nextcloud filter
  ansible.builtin.copy:
    dest: /etc/fail2ban/filter.d/nextcloud.conf
    mode: "0644"
    content: |
      # Managed by Ansible — do not edit on the host.
      # Nextcloud writes JSON lines into its data directory. The address is the
      # real client one (remoteAddr) because trusted_proxies is configured — if
      # that ever breaks, every attempt would appear to come from a Docker
      # address, which is one reason the Docker ranges are in ignoreip.
      {% raw %}[Definition]
      _groupsre = (?:(?:,?\s*"\w+":(?:"[^"]*"|[\w\.]+))*)
      failregex = ^\{%(_groupsre)s,?\s*"remoteAddr":"<HOST>"%(_groupsre)s,?\s*"message":"Login failed:
                  ^\{%(_groupsre)s,?\s*"remoteAddr":"<HOST>"%(_groupsre)s,?\s*"message":"Trusted domain error
                  ^\{%(_groupsre)s,?\s*"remoteAddr":"<HOST>"%(_groupsre)s,?\s*"message":"Bruteforce attempt
      ignoreregex =
      journalmatch ={% endraw %}
  notify: Restart fail2ban
  when: fail2ban_service_jails | default(true)

# fail2ban does not skip a jail whose log file is missing — it refuses to start
# at all, taking the sshd jail down with it. The files are created here, and not
# left to the services, so a fresh provision (where this role runs before the
# containers exist) produces a working fail2ban rather than a dead one.
# `modification_time: preserve` keeps this idempotent on an existing file.
- name: fail2ban | Ensure the watched log files exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: touch
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  loop:
    - path: "{{ services_data_dir }}/nextcloud/data/data/nextcloud.log"
      owner: "33"        # www-data inside the container writes it
      group: "33"
    - path: "{{ services_data_dir }}/vaultwarden/logs/vaultwarden.log"
      owner: root        # vaultwarden runs as root inside its container
      group: root
  # This is the task that aborted the offsite play for a month: services_data_dir
  # is under /mnt/data, which does not exist on a host that mounts /mnt/backup.
  when: fail2ban_service_jails | default(true)

- name: fail2ban | Configure the jails
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      # Managed by Ansible — do not edit on the host.
      [DEFAULT]
      bantime = {{ fail2ban_ban_time }}
      findtime = 600
      maxretry = {{ fail2ban_max_retry }}
      backend = systemd
      {% if fail2ban_service_jails | default(true) %}
      # Docker's own networks are never banned. Every request to Nextcloud and
      # Vaultwarden arrives through Traefik; if X-Forwarded-For handling ever
      # breaks, the address in the application log becomes Traefik's, and
      # banning it would take the whole stack off the network — an outage caused
      # by the protection itself.
      {% else %}
      # Kept for parity with the homelab's file; nothing containerised reaches
      # this host, so no jail here reads an address that Traefik rewrote.
      {% endif %}
      ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12

      [sshd]
      enabled = true
      port = {{ ssh_port_hardened }}
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = {{ fail2ban_max_retry }}
      {% if fail2ban_service_jails | default(true) %}

      # The two jails below read FILES, so they must override the systemd
      # backend set above — with it they would watch the journal, find nothing,
      # and report themselves perfectly healthy.
      #
      # `chain` is a JAIL parameter, not a banaction bracket argument: fail2ban
      # composes action_ = %(banaction)s[..., chain="%(chain)s"], so a chain
      # passed in brackets is overridden by the jail's own value. Measured —
      # with the bracket form the ban was registered and counted while the rule
      # landed in INPUT, blocking nothing.
      #
      # DOCKER-USER rather than INPUT because these services are reached through
      # a Docker-published port: their packets are filtered in the FORWARD path
      # and never traverse INPUT. Same mechanism as the UFW note in
      # docs/03-security.
      [nextcloud]
      enabled = true
      filter = nextcloud
      backend = auto
      logpath = {{ services_data_dir }}/nextcloud/data/data/nextcloud.log
      port = http,https
      banaction = iptables-allports
      chain = DOCKER-USER
      maxretry = 5
      findtime = 600

      # `logtimezone` because Vaultwarden writes a NAKED local timestamp and its
      # container runs on UTC while this host runs on CEST. fail2ban diagnoses it
      # itself, in its own log, once per restart:
      #
      #   WARNING [vaultwarden] Detected a log entry 2h before the current time
      #   in operation mode. This looks like a timezone problem. Treating such
      #   entries as if they just happened.
      #
      # In steady state that recovery is adequate. What it cannot recover is the
      # backfill: findtime is 600 s against a 7200 s offset, so at every fail2ban
      # restart — five of them so far — the whole existing file falls outside the
      # window and the jail starts from nothing.
      #
      # The [nextcloud] jail deliberately does NOT get this: its log is JSON with
      # an explicit offset ("time":"2026-09-01T21:55:01+00:00"), so fail2ban
      # already reads it correctly and forcing a timezone here would break it.
      # The difference is the presence of the offset in the log, not the service.
      [vaultwarden]
      enabled = true
      filter = vaultwarden
      backend = auto
      logpath = {{ services_data_dir }}/vaultwarden/logs/vaultwarden.log
      logtimezone = UTC
      port = http,https
      banaction = iptables-allports
      chain = DOCKER-USER
      maxretry = 5
      findtime = 600
      {% endif %}
    mode: "0644"
  notify: Restart fail2ban

# Two of the three jails read logs from /mnt/data, which is a LUKS volume
# unlocked by hand minutes-to-hours after boot. fail2ban does not skip a jail
# whose logpath is missing — it exits, and with no Restart= directive it stays
# down. Measured on the reboot of 2026-07-27: fail2ban failed at 23:43:52, the
# volume appeared at 23:52:30, and SSH was left unprotected until a human
# restarted it. Adding those jails is what created the dependency, so the unit
# has to learn about it.
#
# Deliberately NOT `Requires=mnt-data.mount`: a hard dependency-job failure
# stays dead forever and is not covered by Restart= — the same trap documented
# on claude-remote-control. Soft-want the mount, gate startup on it being
# there, and let the retry bring the service up ~30 s after the unlock.
- name: fail2ban | Wait for the encrypted volume before starting (jails read from it)
  ansible.builtin.copy:
    dest: /etc/systemd/system/fail2ban.service.d/override.conf
    mode: "0644"
    content: |
      # Managed by Ansible — do not edit on the host.
      [Unit]
      After=mnt-data.mount
      Wants=mnt-data.mount
      # The unlock can come hours after boot; never stop retrying.
      StartLimitIntervalSec=0

      [Service]
      ExecStartPre=/bin/sh -c 'grep -q " /mnt/data " /proc/mounts'
      Restart=on-failure
      RestartSec=30
  notify: Restart fail2ban
  when: fail2ban_service_jails | default(true)

# Removed rather than merely skipped, and this is the important half. That
# ExecStartPre greps /mnt/data, which never appears on a host without the
# stack — so an override left behind after the variable is set to false gives
# a fail2ban that starts today and stops starting at the next reboot, silently,
# with the sshd jail going down with it. Skipping the task would leave exactly
# that. This is the trap issue #115 named: the loud failure replaced by a quiet
# one.
- name: fail2ban | Remove the encrypted-volume override where there is no volume
  ansible.builtin.file:
    path: /etc/systemd/system/fail2ban.service.d/override.conf
    state: absent
  notify: Restart fail2ban
  when: not (fail2ban_service_jails | default(true))

# Vaultwarden holds the file open, so rotation must not move it out from under
# the process — copytruncate rather than create.
- name: fail2ban | Rotate the Vaultwarden log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/vaultwarden
    mode: "0644"
    content: |
      # Managed by Ansible — do not edit on the host.
      {{ services_data_dir }}/vaultwarden/logs/vaultwarden.log {
          weekly
          rotate 4
          missingok
          notifempty
          compress
          delaycompress
          copytruncate
      }
  when: fail2ban_service_jails | default(true)
