---
- name: audit | Install security audit tools where they are scheduled
  ansible.builtin.apt:
    name:
      - lynis
    state: "{{ 'present' if lynis_scheduled | default(false) else 'absent' }}"
    purge: "{{ not (lynis_scheduled | default(false)) }}"

- name: audit | Look for the distribution's own lynis timer
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/lynis.timer
  register: lynis_distro_timer

- name: audit | Stop and disable the distribution's daily lynis timer
  ansible.builtin.systemd:
    name: lynis.timer
    enabled: false
    state: stopped
  when: lynis_distro_timer.stat.exists

- name: audit | Mask lynis.timer so a package update cannot re-enable it
  ansible.builtin.systemd:
    name: lynis.timer
    masked: true
  when: lynis_distro_timer.stat.exists

- name: audit | Remove rkhunter, which was installed but never ran
  ansible.builtin.apt:
    name: rkhunter
    state: absent
    purge: true
