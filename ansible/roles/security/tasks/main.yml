---
# =============================================================================
# Role: security — System hardening
# =============================================================================
# Thin orchestrator: one file per concern, task names prefixed with the file.

- name: Harden SSH and lock the admin account password
  ansible.builtin.import_tasks: ssh.yml

- name: Configure UFW (deny-by-default + per-host rules)
  ansible.builtin.import_tasks: firewall.yml

- name: Configure fail2ban on SSH
  ansible.builtin.import_tasks: fail2ban.yml

- name: Enable unattended security updates
  ansible.builtin.import_tasks: updates.yml

- name: Install security audit tools
  ansible.builtin.import_tasks: audit.yml

- name: Restrict sensitive file permissions (CIS)
  ansible.builtin.import_tasks: permissions.yml

- name: Remove unused network services and clients (CIS)
  ansible.builtin.import_tasks: packages.yml

- name: Redact the flash-time password hash from cloud-init artifacts
  ansible.builtin.import_tasks: cloud-init.yml

# Apply the SSH port change NOW, not at end of play: if a later role fails,
# handlers never run and the box is left with sshd on the old port behind a
# UFW that only allows the new one — a guaranteed lockout (bitten 2026-07-12).
- name: Flush handlers so sshd matches UFW before later roles run
  ansible.builtin.meta: flush_handlers
