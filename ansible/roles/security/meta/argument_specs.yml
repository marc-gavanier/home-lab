---
# Input contract — validated automatically at run time (ansible-core >= 2.11).
argument_specs:
  main:
    short_description: System hardening (SSH, UFW, fail2ban, updates, cloud-init redaction)
    options:
      ssh_port_hardened:
        type: int
        required: true
        no_log: true
        description: Non-standard SSH port (vault — the port is deliberately not published).
      ssh_allowed_users:
        type: list
        elements: str
        required: true
        description: AllowUsers whitelist for sshd.
      services_data_dir:
        type: str
        required: true
        description: Root of the service data trees (the Nextcloud and Vaultwarden jails read logs from there).
      fail2ban_service_jails:
        type: bool
        required: false
        description: >-
          Install the Nextcloud and Vaultwarden jails, the log files they watch and the
          /mnt/data startup gate (inline default true; set false on hosts without the Docker
          stack — offsite, whose data volume is /mnt/backup). The sshd jail is unconditional.
      fail2ban_ban_time:
        type: int
        required: true
        description: Ban duration in seconds.
      fail2ban_max_retry:
        type: int
        required: true
        description: Failed attempts before a ban.
      unattended_automatic_reboot:
        type: bool
        required: false
        description: Let unattended-upgrades auto-reboot (inline default false — homelab is LUKS-locked on reboot; true on the offsite node, which has no LUKS).
      unattended_automatic_reboot_time:
        type: str
        required: false
        description: Time of day for the unattended auto-reboot when enabled (inline default "04:00").
      ufw_service_rules:
        type: list
        elements: dict
        required: false
        description: Per-host allow rules (inline default []).
        options:
          port:
            type: str
            required: true
            description: Port (number as string).
          proto:
            type: str
            required: false
            description: Protocol (inline default tcp).
          from_ip:
            type: str
            required: false
            description: Source restriction (inline default any).
          comment:
            type: str
            required: false
            description: UFW rule comment.
