---
- name: Restart SSH
  ansible.builtin.systemd:
    name: ssh
    state: restarted
    daemon_reload: true

- name: Restart SSH socket
  ansible.builtin.systemd:
    name: ssh.socket
    state: restarted
    daemon_reload: true
  listen: Restart SSH

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
    daemon_reload: true

- name: Restart postfix
  ansible.builtin.service:
    name: postfix
    state: restarted

- name: Restart timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: restarted

- name: Reload UFW
  ansible.builtin.command: ufw reload
  changed_when: true

- name: Reload fail2ban after UFW
  ansible.builtin.command: fail2ban-client reload --restart
  changed_when: true
  listen: Reload UFW
