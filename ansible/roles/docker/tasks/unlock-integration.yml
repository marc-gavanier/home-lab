---
# [critical]: Docker must never start before the LUKS volume is mounted: it would build a ghost store on the SD card
- name: unlock-integration | Create Docker service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: unlock-integration | Configure Docker to start only via homelab-unlock
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/override.conf
    mode: "0644"
    content: |
      [Unit]
      RequiresMountsFor={{ data_mount_point }}
      PartOf=homelab-services.target

      [Install]
      WantedBy=homelab-services.target

- name: unlock-integration | Disable Docker auto-start at boot
  ansible.builtin.systemd:
    name: docker
    enabled: false
    daemon_reload: true

- name: unlock-integration | Disable Docker socket activation at boot
  ansible.builtin.systemd:
    name: docker.socket
    enabled: false
