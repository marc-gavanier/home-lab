---
- name: install | Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: install | Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    checksum: "sha256:{{ docker_gpg_sha256 }}"
    mode: "0644"

- name: install | Add Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    architectures: arm64
    signed_by: /etc/apt/keyrings/docker.asc

- name: install | Remove the one-line Docker source the deb822 file replaces
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
    state: absent

- name: install | Create the Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: install | Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "data-root": "{{ docker_data_root }}",
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "shutdown-timeout": {{ docker_shutdown_timeout }},
        "storage-driver": "overlay2"
      }
    mode: "0644"
  notify: Restart Docker

- name: install | Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: install | Create Docker service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: install | Pin docker.service stop timeout
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/shutdown-budget.conf
    content: |
      [Service]
      TimeoutStopSec={{ docker_stop_timeout }}
    mode: "0644"
  notify: Reload systemd units

- name: install | Create Docker data directory on HDD
  ansible.builtin.file:
    path: "{{ docker_data_root }}"
    state: directory
    mode: "0710"

- name: install | Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user | default('pi') }}"
    groups: docker
    append: true

- name: install | Start Docker
  ansible.builtin.service:
    name: docker
    state: started

- name: install | Create the external Docker network
  community.docker.docker_network:
    name: proxy
    state: present
