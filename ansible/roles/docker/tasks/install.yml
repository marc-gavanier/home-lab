---
# Docker Engine + Compose from the official repo, data-root on the HDD.

- name: install | Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

- name: install | Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: install | Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: install | Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

# `shutdown-timeout` is the whole of #288, and it is a DAEMON-WIDE budget rather
# than a per-container one — which is what the audit's first diagnosis got wrong.
#
# Measured from the deliberate reboot of 2026-08-29:
#
#     02:45:17.239  dockerd: Processing signal 'terminated'
#     02:45:32.551  dockerd: level=error msg="Force shutdown daemon"
#
# 15.31 s, which is the undocumented default, for TWENTY-EIGHT containers. What
# had not finished draining by then was killed, and four came back needing
# recovery: both PostgreSQL databases ("database system was not properly shut
# down"), MariaDB (InnoDB crash recovery, 853 pages, 47 s) and Pi-hole's FTL
# store ("recovered 937 frames from WAL").
#
# This budget is NECESSARY BUT NOT SUFFICIENT, and the correction is worth
# recording because the first version of this comment said the opposite.
#
# A solo `docker stop` on an idle database reads 1.6 s (miniflux-db) and 2.5 s
# (immich-db), from which it was concluded that a per-container grace period
# would not have helped and that this daemon-wide budget was the whole fix. The
# supervised restart of 2026-08-30 00:22 disproved it in one shot: with 60 s here
# and no per-container change, both still came back recovering, while
# nextcloud-db — the only one that had been given `stop_grace_period: 30s` —
# came back clean.
#
# What the logs showed, and why the solo measurement lied:
#
#     22:22:52.537  received fast shutdown request
#     22:22:54.767  shutting down
#     22:23:00.051  FATAL: the database system is shutting down
#                   ... killed at the 10 s per-container default, mid-checkpoint
#
# An idle database has almost nothing to flush. A real one, twenty minutes into
# its writes, checkpointing while twenty-eight containers drain onto the same USB
# disk, needs far more than 10 s. MEASURE THE CONDITION THAT ACTUALLY OCCURS.
#
# So both knobs are set: 30 s per database in compose.yaml, and this budget to
# make room for them — four containers that may each take 30 s cannot fit in 15.
#
# 60 s, not more: systemd allows docker.service 90 s to stop (TimeoutStopSec,
# left at the distribution default), and a daemon budget that outlived its own
# supervisor's would just move the kill one level up. 60 leaves 30 s of headroom.
# The relationship is asserted, not assumed — see the goss posture spec.
- name: install | Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "data-root": "{{ docker_data_root }}",
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "shutdown-timeout": {{ docker_shutdown_timeout }},
        "storage-driver": "overlay2"
      }
    mode: "0644"
  notify: Restart Docker

- name: install | Create Docker data directory on HDD
  ansible.builtin.file:
    path: "{{ docker_data_root }}"
    state: directory
    mode: "0711"

- name: install | Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user | default('pi') }}"
    groups: docker
    append: true

- name: install | Start Docker
  ansible.builtin.service:
    name: docker
    state: started

# `proxy` only — it is the one network declared `external: true` in
# compose.yaml, so it must pre-exist. The internal network is created by Compose
# under the project prefix; naming it here produced a second, empty, orphaned
# `internal` on a different subnet. See the sibling comment in
# roles/deploy/tasks/compose.yml.
- name: install | Create the external Docker network
  community.docker.docker_network:
    name: proxy
    state: present
