---
# Input contract — validated automatically at run time (ansible-core >= 2.11).
argument_specs:
  main:
    short_description: Docker Engine + Compose, data-root on the encrypted HDD
    options:
      docker_data_root:
        type: path
        required: true
        description: Docker data-root, on the encrypted volume (/mnt/data/docker).
      data_mount_point:
        type: path
        required: true
        description: Encrypted volume mount point — Docker is gated behind it (RequiresMountsFor).
      docker_shutdown_timeout:
        type: int
        required: true
        description: >-
          Seconds the daemon gives all containers together to drain on shutdown
          (daemon.json shutdown-timeout). Must be less than docker.service's
          TimeoutStopSec, or systemd kills the daemon mid-drain.
