---
# Input contract — validated automatically at run time (ansible-core >= 2.11).
argument_specs:
  main:
    short_description: Deploy the Docker Compose stack (secrets on LUKS, ADR-011)
    options:
      domain:
        type: str
        required: true
        description: Public domain of the lab.
      homelab_ip:
        type: str
        required: true
        description: LAN IP of the Pi (DNS pins, hairpin workarounds).
      traefik_acme_email:
        type: str
        required: true
        description: Let's Encrypt account email.
      cloudflare_dns_api_token:
        type: str
        required: true
        no_log: true
        description: Scoped Cloudflare API token (Zone:DNS:Edit + Zone:Read) for ACME DNS-01 and DDNS.
      ddns_kuma_push_url:
        type: str
        required: false
        no_log: true
        description: Optional Uptime Kuma push URL for the DDNS updater (empty = no monitor).
      services_data_dir:
        type: path
        required: true
        description: Root of the service data tree.
      media_dir:
        type: path
        required: true
        description: Root of the media tree.
      backup_dir:
        type: path
        required: true
        description: Root of the local backup tree (restic repo lives under it).
      deploy_services:
        type: str
        required: false
        description: >-
          Space-separated compose services to target. Pass it as JSON when there is more than one —
          -e '{"deploy_services": "a b"}' — because the key=value form splits on whitespace and would
          silently keep only the first. Absent = whole stack.
      wg_password:
        type: str
        required: true
        no_log: true
        description: >-
          wg-easy admin password. Since v15 it is written in plaintext to
          /mnt/data/secrets/wg-easy-setup.env (0600 root, encrypted volume) and
          hashed by wg-easy itself with argon2 — v15 takes no precomputed hash.
      vaultwarden_admin_token:
        type: str
        required: true
        no_log: true
        description: Vaultwarden admin token (Argon2id-hashed at deploy time).
      vaultwarden_admin_salt:
        type: str
        required: true
        no_log: true
        description: Fixed hex salt making the Argon2 hash deterministic (idempotence).
      pihole_password:
        type: str
        required: true
        no_log: true
        description: Pi-hole admin password (enforced via the v6 API probe).
      nextcloud_db_name:
        type: str
        required: false
        description: Nextcloud MariaDB database name (inline default nextcloud).
      nextcloud_db_user:
        type: str
        required: false
        description: Nextcloud MariaDB user (inline default nextcloud).
      nextcloud_db_password:
        type: str
        required: true
        no_log: true
        description: Nextcloud MariaDB password.
      nextcloud_db_root_password:
        type: str
        required: true
        no_log: true
        description: MariaDB root password.
      nextcloud_lock_timeout_minutes:
        type: int
        required: false
        description: >-
          Minutes before files_lock's own cron releases an unreleased lock (group_vars default 60).
          Nextcloud ships that cron and disables it by default: -1 means never expire, so a lock
          left behind by a client that died outlives it and the file silently stops syncing. There
          is no refresh, so this must outlast a real editing session.
      immich_db_name:
        type: str
        required: false
        description: Immich Postgres database name (inline default immich).
      immich_db_user:
        type: str
        required: false
        description: Immich Postgres user (inline default immich).
      immich_db_password:
        type: str
        required: true
        no_log: true
        description: Immich Postgres password.
      transmission_user:
        type: str
        required: false
        description: Transmission web UI user (inline default admin).
      transmission_password:
        type: str
        required: true
        no_log: true
        description: Transmission web UI password.
      miniflux_db_name:
        type: str
        required: false
        description: Miniflux Postgres database name (inline default miniflux).
      miniflux_db_user:
        type: str
        required: false
        description: Miniflux Postgres user (inline default miniflux).
      miniflux_db_password:
        type: str
        required: true
        no_log: true
        description: >-
          Miniflux Postgres password. Written twice: bare into
          /mnt/data/secrets/docker/miniflux_db_password for the database container, and again
          inside the composed DSN in miniflux_database_url, because Miniflux reads a whole
          connection string rather than a password (ADR-026).
      miniflux_admin_user:
        type: str
        required: false
        description: Miniflux admin username (group_vars default admin).
      miniflux_admin_password:
        type: str
        required: true
        no_log: true
        description: >-
          Miniflux admin password, created at first start via CREATE_ADMIN. Max 72 BYTES —
          bcrypt reads no further and Miniflux exits 1 with "password length exceeds 72 bytes"
          rather than truncating, which the heal timer then retries every two minutes. Changing
          it here does NOT change the account afterwards — Miniflux only reads it when the user
          does not yet exist; use the web UI to rotate it (ADR-026).
      forgejo_admin_password:
        type: str
        required: true
        no_log: true
        description: >-
          Forgejo admin password. Unlike Miniflux there is no CREATE_ADMIN equivalent, so it is
          only ever read by the one-shot `forgejo admin user create` run once on first deploy
          (docs/05-services/forgejo.md); changing it here afterwards does nothing, rotate in the
          web UI. Written to /mnt/data/secrets/docker/forgejo_admin_password and mounted into the
          container so the command never puts it in the operator's shell history (ADR-028).
      forgejo_secret_key:
        type: str
        required: true
        no_log: true
        description: >-
          Forgejo SECRET_KEY, which encrypts 2FA secrets and OAuth2 client secrets at rest.
          Required rather than optional on purpose: the web installer is what normally generates
          it, INSTALL_LOCK skips the installer, and an empty value silently falls back to the
          constant compiled into every Forgejo binary. Failing the play is the only way that
          absence is visible. Delivered through SECRET_KEY_URI so the key never appears in the
          container environment. Forgejo cannot rotate it — set it before any 2FA enrolment.
      libresign_cert_cn:
        type: str
        required: false
        description: >-
          Common name of the LibreSign root certificate (group_vars default "Home Lab").
          Printed inside every signed PDF. Only read at generation time — the CA is created
          once and regenerating it would orphan the signatures already issued (ADR-022).
      libresign_cert_o:
        type: str
        required: false
        description: Organization of the LibreSign root certificate (group_vars default "Home Lab").
      libresign_cert_c:
        type: str
        required: false
        description: Two-letter country of the LibreSign root certificate (group_vars default FR).
      dozzle_admin_user:
        type: str
        required: false
        description: Dozzle simple-auth username (group_vars default admin).
      dozzle_admin_email:
        type: str
        required: false
        description: E-mail shown for the Dozzle user (group_vars default admin@localhost).
      dozzle_admin_name:
        type: str
        required: false
        description: Display name shown for the Dozzle user (group_vars default Admin).
      dozzle_admin_password_hash:
        type: str
        required: true
        no_log: true
        description: >-
          bcrypt hash of the Dozzle UI password, rendered verbatim into
          /mnt/data/secrets/docker/dozzle_users.yml. Stored pre-hashed because bcrypt salts at
          random and hashing at deploy time would report changed on every run — generate it with
          `docker run -it --rm amir20/dozzle:<tag> generate <user> --email … --name …`, which
          prompts for the password and caps it at 72 bytes (bcrypt reads no further).
      searxng_secret_key:
        type: str
        required: true
        no_log: true
        description: SearXNG server secret (settings.yml on the encrypted volume).
      searxng_branding:
        type: bool
        required: false
        description: Apply the Gerbier theme (inline default false = stock CSS).
      searxng_logo:
        type: str
        required: false
        description: Control-node path to a logo (.svg/.png); only used when searxng_branding is true.
      restic_password:
        type: str
        required: true
        no_log: true
        description: Local restic repository password.
      offsite_restic_password:
        type: str
        required: true
        no_log: true
        description: Offsite restic repository password (never stored on the offsite Pi).
      backup_kuma_push_url:
        type: str
        required: true
        no_log: true
        description: Uptime Kuma push URL for the nightly backup (token = secret).
      local_maintenance_kuma_push_url:
        type: str
        required: false
        no_log: true
        description: >-
          Uptime Kuma push URL for the weekly local prune+check (create the
          monitor in Kuma first; empty disables that monitor, not the timer).
      offsite_copy_kuma_push_url:
        type: str
        required: true
        no_log: true
        description: Uptime Kuma push URL for the offsite copy step.
      offsite_check_kuma_push_url:
        type: str
        required: true
        no_log: true
        description: Uptime Kuma push URL for the weekly offsite check.
      homelab_wg_conf:
        type: str
        required: false
        no_log: true
        description: Host WireGuard client config (contains the private key). Absent = no host tunnel (offsite backup path disabled).
