---
# =============================================================================
# Role: deploy — Deploy Docker Compose stacks
# =============================================================================
# All secrets must be set in host_vars/homelab/local.yml (gitignored)
# or passed via --extra-vars.
# =============================================================================

# --- Host facts ---

- name: Lookup UID/GID of ansible_user
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

# --- Hash WireGuard password (wg-easy needs bcrypt) ---
# bcrypt salts are random: rehashing every run would rewrite .env every run.
# Keep the deployed hash when it still matches the vault password.

- name: Install python3-bcrypt on Pi
  ansible.builtin.apt:
    name: python3-bcrypt
    state: present

- name: Read deployed WireGuard password hash (idempotence)
  ansible.builtin.shell: >-
    grep -oP '(?<=^WG_PASSWORD_HASH=).*' /mnt/data/secrets/homelab.env
    2>/dev/null | sed 's/\$\$/$/g' || true
  register: wg_hash_current
  changed_when: false
  no_log: true

- name: Generate WireGuard bcrypt hash (stable while the password is unchanged)
  ansible.builtin.command:
    cmd: >-
      python3 -c "import os, bcrypt;
      pwd = os.environ['P'].encode(); cur = os.environ['C'].encode();
      ok = cur.startswith(b'$2') and len(cur) == 60 and bcrypt.checkpw(pwd, cur);
      print(cur.decode() if ok else bcrypt.hashpw(pwd, bcrypt.gensalt()).decode())"
  environment:
    P: "{{ wg_password }}"
    C: "{{ wg_hash_current.stdout | default('') }}"
  register: wg_hash_result
  changed_when: false
  no_log: true

- name: Set WireGuard password hash fact
  ansible.builtin.set_fact:
    wg_password_hash: "{{ wg_hash_result.stdout }}"

# --- Hash Vaultwarden admin token (Argon2id, deterministic via fixed salt) ---

- name: Install python3-argon2 on Pi
  ansible.builtin.apt:
    name: python3-argon2
    state: present

- name: Generate Vaultwarden Argon2 hash (deterministic)
  ansible.builtin.command:
    cmd: python3 -c "import os,sys; from argon2.low_level import hash_secret, Type; print(hash_secret(os.environ['T'].encode(), bytes.fromhex(os.environ['S']), time_cost=3, memory_cost=65540, parallelism=4, hash_len=32, type=Type.ID).decode())"
  environment:
    T: "{{ vaultwarden_admin_token }}"
    S: "{{ vaultwarden_admin_salt }}"
  register: vw_hash
  no_log: true
  changed_when: false

- name: Set Vaultwarden Argon2 hash fact
  ansible.builtin.set_fact:
    vaultwarden_admin_token_hash: "{{ vw_hash.stdout }}"
  no_log: true

# --- Deploy ---

- name: Create deployment directory
  ansible.builtin.file:
    path: /opt/homelab
    state: directory
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0750"

# --- Secrets directory (encrypted volume) ---
# Credential-bearing files live on /mnt/data (LUKS), never on the SD card: a
# stolen or copied SD must yield no secrets. The historical paths under
# /opt/homelab become symlinks, so scripts, systemd units and docs are
# unchanged — and everything consuming them only runs after homelab-unlock
# mounts /mnt/data anyway. Mode 0711: traverse-only, per-file ownership.

- name: Create secrets directory on the encrypted volume
  ansible.builtin.file:
    path: /mnt/data/secrets
    state: directory
    owner: root
    group: root
    mode: "0711"

# The operator's personal rclone remote (Nextcloud WebDAV) also keeps its
# config off the SD card; the conf itself is user data, only its location is
# managed here.
- name: Create operator secrets directory on the encrypted volume
  ansible.builtin.file:
    path: /mnt/data/secrets/{{ ansible_user }}
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Point the operator rclone config at the encrypted volume
  ansible.builtin.lineinfile:
    path: /home/{{ ansible_user }}/.bashrc
    regexp: '^export RCLONE_CONFIG='
    line: export RCLONE_CONFIG=/mnt/data/secrets/{{ ansible_user }}/rclone.conf

- name: Copy Docker Compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker/compose.yaml"
    dest: /opt/homelab/compose.yaml
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0640"

- name: Template environment file (encrypted volume)
  ansible.builtin.template:
    src: env.j2
    dest: /mnt/data/secrets/homelab.env
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0600"

- name: Link /opt/homelab/.env to the encrypted volume
  ansible.builtin.file:
    src: /mnt/data/secrets/homelab.env
    dest: /opt/homelab/.env
    state: link

# docker/configs/ now holds ONLY verbatim files (traefik/dynamic); anything
# needing variables lives in this role's templates/ as .j2. Keep it that way:
# copying unrendered Jinja over rendered files made every deploy report
# changes (and fought the SearXNG settings symlink).
- name: Create service configuration directories
  ansible.builtin.file:
    path: /opt/homelab/configs/{{ item }}
    state: directory
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0750"
  loop:
    - traefik/dynamic
    - pihole

# No ownership managed: the SearXNG container chowns this directory to its
# own UID at startup — forcing it back would flap on every run.
- name: Create SearXNG configuration directory
  ansible.builtin.file:
    path: /opt/homelab/configs/searxng
    state: directory

- name: Copy Traefik dynamic configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker/configs/traefik/dynamic/"
    dest: /opt/homelab/configs/traefik/dynamic/
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0640"

- name: Template Traefik static config (resolve variables)
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: /opt/homelab/configs/traefik/traefik.yml
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0640"
  notify: Restart traefik

- name: Template Pi-hole split DNS config (resolve variables)
  ansible.builtin.template:
    src: pihole-05-homelab.conf.j2
    dest: /opt/homelab/configs/pihole/05-homelab.conf
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0640"
  notify: Restart pihole

# settings.yml embeds secret_key → encrypted volume + symlink (the compose
# bind-mount resolves the symlink when the container is created)
- name: Template SearXNG settings (resolve secret_key + base_url)
  ansible.builtin.template:
    src: searxng-settings.yml.j2
    dest: /mnt/data/secrets/searxng-settings.yml
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0640"

- name: Link SearXNG settings to the encrypted volume
  ansible.builtin.file:
    src: /mnt/data/secrets/searxng-settings.yml
    dest: /opt/homelab/configs/searxng/settings.yml
    state: link
    force: true

- name: Ensure Docker networks exist
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop:
    - proxy
    - internal

- name: Pull latest images
  ansible.builtin.command:
    cmd: docker compose pull {{ deploy_services | default('') }}
    chdir: /opt/homelab
  changed_when: false

# --- SearXNG branding (Gerbier theme) ---
# Opt-in via `searxng_branding` (default false). The build ALWAYS runs so the
# (static) bind-mount always has a file: with branding off it emits the stock
# CSS (mount is a no-op, SearXNG stays vanilla); with branding on it appends the
# Gerbier overrides (+ optional logo). Runs BEFORE `compose up` so the mounted
# files exist — otherwise Docker would create empty directories over them.

- name: Install brotli (to regenerate SearXNG precompressed assets)
  ansible.builtin.apt:
    name: brotli
    state: present

- name: Copy SearXNG branding sources
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker/branding/"
    dest: /opt/homelab/branding/
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0750"
    directory_mode: "0750"

- name: Copy SearXNG logo (when configured)
  ansible.builtin.copy:
    src: "{{ searxng_logo }}"
    dest: "/opt/homelab/branding/searxng/logo.{{ searxng_logo.split('.') | last }}"
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0640"
  when:
    - searxng_branding | default(false)
    - searxng_logo | default('') | length > 0

- name: Build SearXNG branded assets (before compose up)
  ansible.builtin.command:
    cmd: ./build-branding.sh
    chdir: /opt/homelab/branding/searxng
  environment:
    SEARXNG_BRANDING: "{{ searxng_branding | default(false) | ternary('true', 'false') }}"
    SEARXNG_IMAGE: searxng/searxng:latest
    SEARXNG_LOGO: "{{ ('/opt/homelab/branding/searxng/logo.' + (searxng_logo.split('.') | last)) if ((searxng_branding | default(false)) and (searxng_logo | default('') | length > 0)) else '' }}"
    OUT_DIR: /opt/homelab/branding/searxng/out
  changed_when: true

- name: Deploy services
  ansible.builtin.command:
    cmd: docker compose up -d {{ deploy_services | default('') }}
    chdir: /opt/homelab
  register: compose_result
  changed_when: "'Started' in compose_result.stderr or 'Created' in compose_result.stderr"

- name: Show deployment output
  ansible.builtin.debug:
    var: compose_result.stderr_lines

# --- Pi-hole password (v6 ignores env var after first start) ---

- name: Check if Pi-hole is running
  ansible.builtin.command:
    cmd: docker ps -q -f name=pihole -f status=running
  register: pihole_running
  changed_when: false

- name: Set Pi-hole admin password
  ansible.builtin.shell:
    cmd: "docker exec pihole pihole setpassword {{ pihole_password | quote }}"
  no_log: true
  changed_when: true
  when: pihole_running.stdout | length > 0

# --- Nextcloud post-config (cron mode, system settings, apps) ---

- name: Check if Nextcloud is running
  ansible.builtin.command:
    cmd: docker ps -q -f name=nextcloud -f status=running
  register: nextcloud_running
  changed_when: false

- name: Wait for Nextcloud to be ready
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ status --output=json
  register: nc_status
  until: nc_status.rc == 0 and (nc_status.stdout | from_json).installed | default(false)
  retries: 30
  delay: 5
  changed_when: false
  when: nextcloud_running.stdout | length > 0

- name: Set Nextcloud background jobs to cron mode
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ background:cron
  register: nc_cron
  changed_when: "'set to cron' in nc_cron.stdout"
  when: nextcloud_running.stdout | length > 0

- name: Configure Nextcloud system settings
  ansible.builtin.command:
    cmd: "docker exec -u www-data nextcloud php occ config:system:set {{ item.key }} --type={{ item.type }} --value={{ item.value }}"
  loop:
    - { key: default_phone_region, type: string, value: FR }
    - { key: maintenance_window_start, type: integer, value: "4" }
  changed_when: true
  when: nextcloud_running.stdout | length > 0

# Manage trusted_domains via occ: NEXTCLOUD_TRUSTED_DOMAINS only applies on first
# install, not on an existing instance. localhost = internal healthcheck,
# nextcloud = notify_push reaching http://nextcloud, drive.<domain> = real access.
- name: Ensure Nextcloud trusted domains
  ansible.builtin.command:
    cmd: "docker exec -u www-data nextcloud php occ config:system:set trusted_domains {{ item.idx }} --value={{ item.val }}"
  loop:
    - { idx: 0, val: localhost }
    - { idx: 1, val: "drive.{{ domain }}" }
    - { idx: 2, val: nextcloud }
  loop_control:
    label: "{{ item.val }}"
  changed_when: true
  when: nextcloud_running.stdout | length > 0

- name: Get installed Nextcloud apps
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:list --output=json
  register: nc_app_list
  changed_when: false
  when: nextcloud_running.stdout | length > 0

- name: Install Nextcloud productivity apps
  ansible.builtin.command:
    cmd: "docker exec -u www-data nextcloud php occ app:install {{ item }}"
  loop: [calendar, contacts, tasks, bookmarks, gpxpod, external, notify_push]
  when:
    - nextcloud_running.stdout | length > 0
    - item not in (nc_app_list.stdout | default('{}') | from_json).enabled
    - item not in (nc_app_list.stdout | default('{}') | from_json).disabled
  register: nc_app_install
  changed_when: nc_app_install.rc == 0
  failed_when:
    - nc_app_install.rc is defined
    - nc_app_install.rc != 0
    - "'not compatible' not in nc_app_install.stdout"

# notify_push reads config.php (trusted_proxies, binary path) at startup, so it
# must be restarted after the app is installed and after any Nextcloud config
# change for the self-test to pass.
- name: Restart notify_push to reload Nextcloud config
  ansible.builtin.command:
    cmd: docker restart nextcloud-notify-push
  changed_when: true
  when: nextcloud_running.stdout | length > 0

- name: Set up notify_push (client real-time updates)
  ansible.builtin.command:
    cmd: "docker exec -u www-data nextcloud php occ notify_push:setup https://drive.{{ domain }}/push"
  register: nc_notify_push
  until: nc_notify_push.rc == 0
  retries: 6
  delay: 10
  changed_when: "'configuration saved' in nc_notify_push.stdout or 'success' in nc_notify_push.stdout"
  failed_when: false
  when: nextcloud_running.stdout | length > 0

# Mount media libraries (photos/music/videos) as read-only External Storage
# so Nextcloud can browse them without duplicating players or syncing files.

- name: Ensure files_external app is enabled
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:enable files_external
  register: nc_files_external
  changed_when: "'already enabled' not in nc_files_external.stdout"
  when: nextcloud_running.stdout | length > 0

- name: List existing Nextcloud external storages
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ files_external:list --output=json
  register: nc_ext_list
  changed_when: false
  when: nextcloud_running.stdout | length > 0

- name: Create media external storages
  ansible.builtin.command:
    cmd: >
      docker exec -u www-data nextcloud php occ files_external:create
      "{{ item.name }}" local null::null -c datadir={{ item.path }}
  loop:
    - { name: Photos, path: /external/photos }
    - { name: Music, path: /external/music }
    - { name: Videos, path: /external/videos }
  when:
    - nextcloud_running.stdout | length > 0
    - item.path not in (nc_ext_list.stdout | default('[]') | from_json | map(attribute='configuration.datadir') | list)
  changed_when: true

- name: Re-list external storages after creation
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ files_external:list --output=json
  register: nc_ext_list2
  changed_when: false
  when: nextcloud_running.stdout | length > 0

- name: Enforce read-only on media external storages
  ansible.builtin.command:
    cmd: >
      docker exec -u www-data nextcloud php occ files_external:option
      {{ item.mount_id }} readonly true
  loop: "{{ (nc_ext_list2.stdout | from_json) if (nc_ext_list2.stdout | default('')) else [] }}"
  loop_control:
    label: "{{ item.mount_point | default('?') }}"
  when:
    - nextcloud_running.stdout | length > 0
    - item.configuration.datadir is defined
    - item.configuration.datadir.startswith('/external/')
  changed_when: false

# --- Backup setup ---

- name: Install restic
  ansible.builtin.apt:
    name: restic
    state: present

- name: Create scripts directory
  ansible.builtin.file:
    path: /opt/homelab/scripts
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Copy backup script
  ansible.builtin.copy:
    src: backup.sh
    dest: /opt/homelab/scripts/backup.sh
    owner: root
    group: root
    mode: "0750"

- name: Template backup environment file (encrypted volume)
  ansible.builtin.template:
    src: backup.env.j2
    dest: /mnt/data/secrets/backup.env
    owner: root
    group: root
    mode: "0600"

- name: Link /opt/homelab/backup.env to the encrypted volume
  ansible.builtin.file:
    src: /mnt/data/secrets/backup.env
    dest: /opt/homelab/backup.env
    state: link
    force: true

# backup.sh pings Uptime Kuma at services.<domain>, which resolves to the public IP from
# the Pi (DNS hairpin) and is rejected (403) through Traefik. Pin it to the Pi's LAN IP so
# the push reaches Kuma directly over the LAN (same pattern as the claude-code role's pin).
#
# This host is cloud-init managed (manage_etc_hosts: True): cloud-init regenerates /etc/hosts
# from a template on every boot, wiping a plain lineinfile pin (which silently breaks the Kuma
# push after a reboot). Pin in the template (survives reboots) AND /etc/hosts (immediate).
- name: Pin services domain in the cloud-init hosts template (persists across reboots)
  ansible.builtin.lineinfile:
    path: /etc/cloud/templates/hosts.debian.tmpl
    line: "{{ homelab_ip }} services.{{ domain }}"
    state: present

- name: Pin services domain in /etc/hosts now (immediate, until next cloud-init run)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ homelab_ip }} services.{{ domain }}"
    state: present

- name: Initialize restic repository
  ansible.builtin.command:
    cmd: restic init
  environment:
    RESTIC_REPOSITORY: "{{ backup_dir }}/restic-repo"
    RESTIC_PASSWORD: "{{ restic_password }}"
  register: restic_init
  failed_when: false
  changed_when: "'created restic repository' in restic_init.stdout"

# HOME is unset for systemd services, so restic can't locate its cache
# ("neither $XDG_CACHE_HOME nor $HOME are defined") and runs cache-less — slower
# and re-reads more from the repo. Set HOME so it caches under /root/.cache/restic.
- name: Create backup systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-backup.service
    mode: "0644"
    content: |
      [Unit]
      Description=Home Lab Restic Backup
      Requires=mnt-data.mount
      After=mnt-data.mount

      [Service]
      Type=oneshot
      ExecStart=/opt/homelab/scripts/backup.sh
      EnvironmentFile=/opt/homelab/backup.env
      Environment=HOME=/root

- name: Create backup systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-backup.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Daily Home Lab Backup at 3 AM

      [Timer]
      OnCalendar=*-*-* 03:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Enable backup timer
  ansible.builtin.systemd:
    name: homelab-backup.timer
    enabled: true
    state: started
    daemon_reload: true

# --- Host WireGuard client (backup path to the offsite Pi, ADR-010) ---
# wg0 lives inside the wg-easy container, so the host cannot reach VPN peers
# directly. The host runs its own WireGuard client ("homelab-host") against
# wg-easy over loopback; restic then reaches the offsite rest-server at its
# VPN address — the same path before and after the Pi moves offsite.

- name: Install WireGuard (host client for offsite backup)
  ansible.builtin.apt:
    name: wireguard
    state: present
  when: homelab_wg_conf is defined

# The private key lives on the encrypted volume; /etc/wireguard/wg0.conf is a
# symlink so wg-quick@wg0 keeps its standard name. The tunnel therefore cannot
# start before homelab-unlock — mnt-data.mount pulls it in (add-wants) and the
# drop-in orders it after the mount. It only serves the 03:00 offsite copy, so
# a post-unlock start loses nothing.
- name: Write host WireGuard client configuration (encrypted volume)
  ansible.builtin.copy:
    content: "{{ homelab_wg_conf }}"
    dest: /mnt/data/secrets/wg0.conf
    owner: root
    group: root
    mode: "0600"
  register: homelab_wg_conf_file
  when: homelab_wg_conf is defined

- name: Link /etc/wireguard/wg0.conf to the encrypted volume
  ansible.builtin.file:
    src: /mnt/data/secrets/wg0.conf
    dest: /etc/wireguard/wg0.conf
    state: link
    force: true
  when: homelab_wg_conf is defined

- name: Create drop-in directory for the tunnel unit
  ansible.builtin.file:
    path: /etc/systemd/system/wg-quick@wg0.service.d
    state: directory
    mode: "0755"
  when: homelab_wg_conf is defined

- name: Order the host tunnel after the encrypted volume mount
  ansible.builtin.copy:
    dest: /etc/systemd/system/wg-quick@wg0.service.d/luks.conf
    mode: "0644"
    content: |
      # Config on /mnt/data (secrets never on the SD card) — see deploy role.
      [Unit]
      RequiresMountsFor=/mnt/data
  when: homelab_wg_conf is defined

# No `enabled:` here — the wants-link below makes is-enabled report "enabled",
# so enabled:false would wipe that very link on every run (bitten 2026-07-13).
# Nothing enables this unit at boot; only mnt-data.mount pulls it in.
- name: Start host WireGuard tunnel (boot-time start comes from mnt-data.mount)
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: "{{ homelab_wg_conf_file is changed | ternary('restarted', 'started') }}"
    daemon_reload: true
  when: homelab_wg_conf is defined
- name: Start the tunnel whenever the encrypted volume mounts
  ansible.builtin.command: systemctl add-wants mnt-data.mount wg-quick@wg0.service
  args:
    creates: /etc/systemd/system/mnt-data.mount.wants/wg-quick@wg0.service
  when: homelab_wg_conf is defined

# --- Offsite repo weekly check (ADR-010) ---
# The homelab holds the offsite repo password, so integrity checks of the
# offsite repo run from here, through the WireGuard tunnel. Sunday 06:00:
# well clear of the 03:00 backup+copy window (restic check takes an
# exclusive lock — an overlap would fail one of the two).

- name: Copy offsite check script
  ansible.builtin.copy:
    src: offsite-check.sh
    dest: /opt/homelab/scripts/offsite-check.sh
    owner: root
    group: root
    mode: "0750"

- name: Create offsite check systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-offsite-check.service
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly offsite restic repo check
      Wants=network-online.target
      Requires=mnt-data.mount
      After=network-online.target mnt-data.mount

      [Service]
      Type=oneshot
      ExecStart=/opt/homelab/scripts/offsite-check.sh
      EnvironmentFile=/opt/homelab/backup.env
      Environment=HOME=/root

- name: Create offsite check systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-offsite-check.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly offsite restic repo check (Sunday 06:00)

      [Timer]
      OnCalendar=Sun *-*-* 06:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Enable offsite check timer
  ansible.builtin.systemd:
    name: homelab-offsite-check.timer
    enabled: true
    state: started
    daemon_reload: true
