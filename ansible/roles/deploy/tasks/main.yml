---
# =============================================================================
# Role: deploy — Deploy Docker Compose stacks
# =============================================================================
# All secrets must be set in host_vars/homelab/local.yml (gitignored)
# or passed via --extra-vars.
# =============================================================================
# Thin orchestrator: one file per concern, task names prefixed with the file.
# Order matters: hashes feed the env template (secrets), branding builds the
# assets `compose up` bind-mounts, pihole/nextcloud post-configure running
# containers, and the wireguard tunnel carries the offsite check.

- ansible.builtin.import_tasks: hashes.yml     # WG bcrypt + Vaultwarden Argon2 facts
- ansible.builtin.import_tasks: secrets.yml    # /mnt/data/secrets + env + symlinks (ADR-011)
- ansible.builtin.import_tasks: configs.yml    # traefik/pihole/searxng configurations
- ansible.builtin.import_tasks: branding.yml   # SearXNG Gerbier assets (before compose up)
- ansible.builtin.import_tasks: compose.yml    # compose file, networks, pull, up
- ansible.builtin.import_tasks: pihole.yml     # admin password (v6 quirk)
- ansible.builtin.import_tasks: nextcloud.yml  # occ post-config, apps, external storage
- ansible.builtin.import_tasks: backup.yml     # local restic + nightly timer
- ansible.builtin.import_tasks: wireguard.yml  # host tunnel to the offsite Pi (ADR-010)
- ansible.builtin.import_tasks: offsite.yml    # weekly offsite repo check
