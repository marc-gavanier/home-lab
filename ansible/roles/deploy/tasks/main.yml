---
# =============================================================================
# Role: deploy — Deploy Docker Compose stacks
# =============================================================================
# All secrets must be set in host_vars/homelab/local.yml (gitignored)
# or passed via --extra-vars.
# =============================================================================
# Thin orchestrator: one file per concern, task names prefixed with the file.
# Order matters: hashes feed the env template (secrets), branding builds the
# assets `compose up` bind-mounts, pihole/nextcloud post-configure running
# containers, and the wireguard tunnel carries the offsite check.

- name: Compute WireGuard bcrypt and Vaultwarden Argon2 facts
  ansible.builtin.import_tasks: hashes.yml

- name: Deploy secrets on the encrypted volume (ADR-011)
  ansible.builtin.import_tasks: secrets.yml

- name: Deploy traefik/pihole/searxng configurations
  ansible.builtin.import_tasks: configs.yml

- name: Build the SearXNG Gerbier assets (before compose up)
  ansible.builtin.import_tasks: branding.yml

- name: Install the netdata AppArmor profile (before compose up — see file)
  ansible.builtin.import_tasks: apparmor.yml

- name: Own the data directories hardened containers must be able to write (#144)
  ansible.builtin.import_tasks: data_dirs.yml

- name: Run Docker Compose (file, networks, pull, up)
  ansible.builtin.import_tasks: compose.yml

- name: Enforce the Pi-hole admin password (v6 quirk)
  ansible.builtin.import_tasks: pihole.yml

- name: Re-assert the wg-easy settings (v15 keeps them in SQLite, not the env)
  ansible.builtin.import_tasks: wg_easy_config.yml

- name: Post-configure Nextcloud (occ, apps, external storage)
  ansible.builtin.import_tasks: nextcloud.yml

- name: Wire Nextcloud to the Collabora document server (ADR-021)
  ansible.builtin.import_tasks: collabora.yml

- name: Set up PDF signing inside Nextcloud (ADR-022)
  ansible.builtin.import_tasks: libresign.yml

- name: Apply Transmission runtime settings the compose file cannot set
  ansible.builtin.import_tasks: transmission.yml

- name: Set up the local restic backup and nightly timer
  ansible.builtin.import_tasks: backup.yml

- name: Set up the host tunnel to the offsite Pi (ADR-010)
  ansible.builtin.import_tasks: wireguard.yml

- name: Set up the weekly offsite repo check
  ansible.builtin.import_tasks: offsite.yml

- name: Set up the Cloudflare DDNS updater for the vpn record
  ansible.builtin.import_tasks: ddns.yml

# A deploy is the moment the container posture is most likely to have changed,
# and the posture check runs only once a day. Without this, a drift introduced
# at 12:00 waits until 11:00 the next morning to be reported — and worse, a
# drift that has just been FIXED leaves its monitor red for the rest of the day.
# Re-asserting here makes detection and recovery both minutes rather than a day
# (issue #33; seen for real on 2026-07-27, when a corrected finding stayed red).
- name: Re-assert the container posture now that the stack has changed
  ansible.builtin.systemd:
    name: homelab-posture.service
    state: started
  changed_when: false
  failed_when: false
