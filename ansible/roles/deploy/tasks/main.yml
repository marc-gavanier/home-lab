---
# =============================================================================
# Role: deploy — Deploy Docker Compose stacks
# =============================================================================
# All secrets must be set in host_vars/homelab/local.yml (gitignored)
# or passed via --extra-vars.
# =============================================================================
# Thin orchestrator: one file per concern, task names prefixed with the file.
# Order matters: hashes feed the env template (secrets), branding builds the
# assets `compose up` bind-mounts, pihole/nextcloud post-configure running
# containers, and the wireguard tunnel carries the offsite check.

- name: Compute WireGuard bcrypt and Vaultwarden Argon2 facts
  ansible.builtin.import_tasks: hashes.yml

- name: Deploy secrets on the encrypted volume (ADR-011)
  ansible.builtin.import_tasks: secrets.yml

- name: Deploy traefik/pihole/searxng configurations
  ansible.builtin.import_tasks: configs.yml

- name: Build the SearXNG Gerbier assets (before compose up)
  ansible.builtin.import_tasks: branding.yml

- name: Install the netdata AppArmor profile (before compose up — see file)
  ansible.builtin.import_tasks: apparmor.yml

- name: Own the data directories hardened containers must be able to write (#144)
  ansible.builtin.import_tasks: data_dirs.yml

- name: Prepare the tmpfs the Traefik access log is written to (#287, ADR-034)
  ansible.builtin.import_tasks: traefik_accesslog.yml

- name: Run Docker Compose (file, networks, pull, up)
  ansible.builtin.import_tasks: compose.yml

- name: Enforce the Pi-hole admin password (v6 quirk)
  ansible.builtin.import_tasks: pihole.yml

- name: Re-assert the wg-easy settings (v15 keeps them in SQLite, not the env)
  ansible.builtin.import_tasks: wg_easy_config.yml

- name: Post-configure Nextcloud (occ, apps, external storage)
  ansible.builtin.import_tasks: nextcloud.yml

- name: Wire Nextcloud to the Collabora document server (ADR-021)
  ansible.builtin.import_tasks: collabora.yml

- name: Set up PDF signing inside Nextcloud (ADR-022)
  ansible.builtin.import_tasks: libresign.yml

- name: Apply Transmission runtime settings the compose file cannot set
  ansible.builtin.import_tasks: transmission.yml

- name: Set up the local restic backup and nightly timer
  ansible.builtin.import_tasks: backup.yml

# ADR-031, and the migration is over. This announced "phase 1 … backup.sh keeps
# running on its timer" on every single run until 2026-08-29, long after the
# switch: resticprofile owns the nightly job and the two weekly ones, all three
# ExecStart lines go through it, and backup.sh, local-maintenance.sh and
# offsite-check.sh are deleted — by this same role, a few tasks further down.
# The staging is kept in this sentence because it is the reusable part: install,
# exercise by hand against the real repository including a RESTORE, then move
# the timers.
- name: "Install resticprofile and its profile (ADR-031)"
  ansible.builtin.import_tasks: resticprofile.yml

- name: Set up the host tunnel to the offsite Pi (ADR-010)
  ansible.builtin.import_tasks: wireguard.yml

- name: Set up the weekly offsite repo check
  ansible.builtin.import_tasks: offsite.yml

# Tagged, alone among the imports in this file, and the asymmetry is the point
# rather than an oversight. This role mixes host-level concerns — secrets, the
# AppArmor profile, systemd units — with the container stack, and only the
# container half is expensive: `compose.yml` copies the whole compose.yaml on
# every run, which arms every pending image pin for the crash-heal timer. That
# is the right price for a service deploy and the wrong one for a change to a
# 130-line shell script that no container reads.
#
# `--tags ddns` therefore installs the script, its environment file and the two
# systemd units, and nothing else runs. Added 2026-09-03 alongside the retry fix
# in cloudflare-ddns.sh, whose deploy is what wanted it. Other imports can be
# tagged the same way when they need it; none is today.
- name: Set up the Cloudflare DDNS updater for the vpn record
  ansible.builtin.import_tasks: ddns.yml
  tags: [ddns]

# A deploy is the moment the container posture is most likely to have changed,
# and the posture check runs only once a day. Without this, a drift introduced
# at 12:00 waits until 11:00 the next morning to be reported — and worse, a
# drift that has just been FIXED leaves its monitor red for the rest of the day.
# Re-asserting here makes detection and recovery both minutes rather than a day
# (issue #33; seen for real on 2026-07-27, when a corrected finding stayed red).
# ...but this task is the LAST of the role, and Ansible runs handlers at the end
# of the PLAY. So until this flush, the re-assertion graded the stack BEFORE the
# restarts the same deploy had just queued: 14 handlers in this role, and the
# repo held exactly one `meta: flush_handlers`, in the security role. Combined
# with the timer having no boot hook, the only two occasions on which the
# posture could cover a day's changes both fell at the wrong moment — one before
# the handlers, one before the reboot (audit of 2026-08-30, class C44/C53).
#
# One interaction, stated because it is not obvious: a flush runs EVERY handler
# pending in the play, not only this role's. `Restart Docker` is the one that
# matters, and it is notified from a single site — the daemon.json template in
# the docker role — so it is pending only on the rare run that changes it. When
# it is, Docker now restarts before the posture check rather than after, which
# is the right order for the check even though it means containers are settling
# while it runs. The check asserts container CONFIGURATION (user, read-only
# rootfs, capabilities), which is readable the moment a container exists, not
# health, which is not.
- name: Flush handlers so the posture check below sees the restarts, not the state before them
  ansible.builtin.meta: flush_handlers

- name: Re-assert the container posture now that the stack has changed
  ansible.builtin.systemd:
    name: homelab-posture.service
    state: started
  changed_when: false
  failed_when: false
