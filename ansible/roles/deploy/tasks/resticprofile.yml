---
# resticprofile — ADR-031, migration complete.
#
# Installs the binary and the profile. This header claimed "phase 1 … backup.sh
# keeps running on its timer" until 2026-08-29, which stopped being true the day
# the timers moved: resticprofile owns the nightly backup and the two weekly
# jobs, and backup.sh, local-maintenance.sh and offsite-check.sh no longer
# exist. It was staged that way on purpose — install, exercise by hand against
# the real repository including a restore, then switch — and that sequence is
# recorded here because it is the part worth reusing.
#
# The `no_self_update` build on purpose. A binary that updates itself on a host
# whose image and package versions are pinned and reviewed through Renovate
# would be a hole in that process rather than a convenience.

- name: resticprofile | Read the installed version, if any
  ansible.builtin.command: resticprofile version
  register: resticprofile_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: resticprofile | Install the pinned release
  when: resticprofile_version not in (resticprofile_installed.stdout | default(''))
  block:
    # Checksum published by the project alongside the release. Without it this
    # task would trust whatever the network returned, on the host that holds the
    # backups.
    - name: resticprofile | Download the release archive
      ansible.builtin.get_url:
        url: "{{ resticprofile_release_url }}/{{ resticprofile_archive }}"
        dest: /tmp/resticprofile.tar.gz
        checksum: "sha256:{{ resticprofile_sha256 }}"
        mode: "0600"
      vars:
        resticprofile_release_url: >-
          https://github.com/creativeprojects/resticprofile/releases/download/v{{ resticprofile_version }}
        resticprofile_archive: >-
          resticprofile_no_self_update_{{ resticprofile_version }}_linux_arm64.tar.gz

    - name: resticprofile | Unpack the binary
      ansible.builtin.unarchive:
        src: /tmp/resticprofile.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include:
          - resticprofile
        owner: root
        group: root
        mode: "0755"

  always:
    - name: resticprofile | Remove the downloaded archive
      ansible.builtin.file:
        path: /tmp/resticprofile.tar.gz
        state: absent

# The password files this profile reads are written by secrets.yml, which runs
# far earlier in the role. They used to be written HERE, and the move is not
# cosmetic: `restic init` in backup.yml runs before this file and now reads the
# same password through RESTIC_PASSWORD_FILE, so writing them here would have
# left a fresh host initialising its repository against a file that does not
# exist yet. The existing host would never have shown it.

# The half no tool expresses. resticprofile's hooks receive PROFILE_NAME and
# PROFILE_COMMAND and nothing else, so a readable notification has to be built
# outside the tool. Its sibling backup-dumps.sh is gone: the dump COMMANDS are
# hooks in the profile and the assertions are the goss spec below.
- name: resticprofile | Install the notification adapter
  ansible.builtin.copy:
    src: backup-notify.sh
    dest: /opt/homelab/scripts/backup-notify.sh
    owner: root
    group: root
    mode: "0750"

- name: resticprofile | Remove the dump script it replaced
  # 373 lines. ADR-031 kept it because "resticprofile has no equivalent" for the
  # assertions, which stopped being true when ADR-032 installed goss.
  ansible.builtin.file:
    path: /opt/homelab/scripts/backup-dumps.sh
    state: absent

- name: resticprofile | Install the dump assertions
  # /etc/goss is created by the observability role, which site.yml runs first.
  # Same mode as the posture spec: it names every database path on this host.
  ansible.builtin.template:
    src: goss-backup-dumps.yaml.j2
    dest: /etc/goss/backup-dumps.yaml
    owner: root
    group: root
    mode: "0400"

- name: resticprofile | Install the profile
  ansible.builtin.template:
    src: resticprofile.yaml.j2
    dest: /opt/homelab/resticprofile.yaml
    owner: root
    group: root
    mode: "0640"
