---
# Secrets on the encrypted volume (ADR-011).
# Credential-bearing files live on /mnt/data (LUKS), never on the SD card: a
# stolen or copied SD must yield no secrets. The historical paths under
# /opt/homelab become symlinks, so scripts, systemd units and docs are
# unchanged — and everything consuming them only runs after homelab-unlock
# mounts /mnt/data anyway. Mode 0711: traverse-only, per-file ownership.

# `required: true` in argument_specs checks that a variable EXISTS, not that it
# holds anything — and local.example.yml ships these as empty strings, so a
# copied-but-unfilled example passes validation cleanly. Assert the content,
# not the presence.
#
# This started as a guard on forgejo_secret_key alone, which left three secrets
# with the same shape unchecked (#156). They do not fail the same way, and the
# difference is worth keeping in view:
#
#   forgejo, vaultwarden and pihole FAIL OPEN. The container starts, nothing is
#   logged, and the thing the secret existed to protect is simply unprotected.
#   Vaultwarden is the sharpest: hashes.yml would compute a perfectly valid
#   Argon2id hash OF THE EMPTY STRING, so the admin panel stays enabled and
#   accepts an empty token — an empty value there does not disable the panel,
#   it opens it.
#
#   restic FAILS CLOSED. Measured on the host rather than assumed:
#   `RESTIC_PASSWORD='' restic init` answers "Fatal: an empty password is not a
#   password". It is asserted here to move that failure from 03:12 the next
#   morning to the deploy that caused it — not because an empty repository
#   password could ever be silently accepted.
- name: secrets | Refuse to deploy silently-empty secrets
  ansible.builtin.assert:
    that:
      - lookup('vars', item.var, default='') | trim | length > 0
    fail_msg: "{{ item.why }}"
    quiet: true
  loop:
    - var: forgejo_secret_key
      why: >-
        forgejo_secret_key is empty. Forgejo would fall back to the default key
        compiled into every binary, silently. Generate one and put it in the
        vaulted local.yml:
        docker exec forgejo /app/gitea/gitea generate secret SECRET_KEY
    - var: vaultwarden_admin_token
      why: >-
        vaultwarden_admin_token is empty. It would be Argon2id-hashed as-is and
        written to the ADMIN_TOKEN_FILE the container reads, which leaves the
        admin panel ENABLED and its correct token empty. Set a long random
        value in the vaulted local.yml.
    - var: pihole_password
      why: >-
        pihole_password is empty. It is passed verbatim to
        `pihole setpassword`, and an empty password hash is how Pi-hole
        expresses "no authentication" — the admin API and web interface would
        stop asking for anything. Set it in the vaulted local.yml.
    - var: restic_password
      why: >-
        restic_password is empty. restic refuses it ("an empty password is not
        a password"), so the nightly backup would fail at 03:12 rather than
        here. Set it in the vaulted local.yml — and note that changing it does
        not re-key an existing repository.
    - var: offsite_restic_password
      why: >-
        offsite_restic_password is empty. Identical shape to restic_password
        above and it was the one left unasserted: restic refuses an empty
        password, so the nightly OFFSITE copy would fail rather than this
        deploy. Set it in the vaulted local.yml.
    - var: transmission_password
      why: >-
        transmission_password is empty. The image's init only enables RPC
        authentication when USER and PASS are both non-empty, so an empty value
        does not weaken the password — it removes authentication entirely, and
        the healthcheck still returns rc=0 against the result. Set it in the
        vaulted local.yml.
    - var: searxng_secret_key
      why: >-
        searxng_secret_key is empty. SearXNG's own startup check only refuses
        the literal placeholder "ultrasecretkey", so an empty key passes it and
        the instance runs with no secret at all. Set a long random value in the
        vaulted local.yml.
  loop_control:
    label: "{{ item.var }}"

- name: secrets | Create deployment directory
  ansible.builtin.file:
    path: /opt/homelab
    state: directory
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0750"

- name: secrets | Create secrets directory on the encrypted volume
  ansible.builtin.file:
    path: /mnt/data/secrets
    state: directory
    owner: root
    group: root
    mode: "0711"

# The operator's personal rclone remote (Nextcloud WebDAV) also keeps its
# config off the SD card; the conf itself is user data, only its location is
# managed here.
- name: secrets | Create operator secrets directory on the encrypted volume
  ansible.builtin.file:
    path: /mnt/data/secrets/{{ ansible_user }}
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: secrets | Point the operator rclone config at the encrypted volume
  ansible.builtin.lineinfile:
    path: /home/{{ ansible_user }}/.bashrc
    regexp: '^export RCLONE_CONFIG='
    line: export RCLONE_CONFIG=/mnt/data/secrets/{{ ansible_user }}/rclone.conf

- name: secrets | Template environment file (encrypted volume)
  ansible.builtin.template:
    src: env.j2
    dest: /mnt/data/secrets/homelab.env
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0600"

- name: secrets | Link /opt/homelab/.env to the encrypted volume
  ansible.builtin.file:
    src: /mnt/data/secrets/homelab.env
    dest: /opt/homelab/.env
    state: link

# wg-easy 15 settings, read by the HOST (the migration script and the config
# re-assertion), never by the container — v15 takes none of this from its
# environment. Kept out of homelab.env on purpose: that file is group-readable
# by docker and mounted into containers, and this one carries a PLAINTEXT
# password (v15 hashes it itself; there is no hash to hand it any more).
- name: secrets | Write the wg-easy admin settings (host-side only, plaintext)
  ansible.builtin.template:
    src: wg-easy-setup.env.j2
    dest: /mnt/data/secrets/wg-easy-setup.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

# Per-service secret files, mounted as Docker secrets instead of injected via
# `environment:` (ADR-016). The socket-proxy allows GET /containers/{id}/json,
# whose response carries every container's Env array — so an env-injected
# password is readable by Traefik or Netdata if either is compromised. A secret
# file leaves only the /run/secrets path in that response.
#
# The two modes look contradictory but are not, and the split is the point:
#   - the DIRECTORY (0710 root:docker) is what protects the host — other local
#     users cannot even traverse into it;
#   - the FILES (0444) are what let the container read them, because container
#     UIDs are arbitrary and unmappable (mysql 999, abc 911, www-data 33) and
#     the bind mount lands at /run/secrets/<name>, whose parents are inside the
#     container, so the host directory mode no longer applies there.
#
# Written with `content:` and no trailing newline ON PURPOSE: the linuxserver
# init-envfile script passes the file through verbatim and warns that a
# trailing newline "may not work as expected" (the mariadb/postgres/immich
# readers all strip it, so no-newline is the only form that suits every image).
- name: secrets | Create the Docker secrets directory on the encrypted volume
  ansible.builtin.file:
    path: /mnt/data/secrets/docker
    state: directory
    owner: root
    group: docker
    mode: "0710"

# Grouped by the container that READS each file, because each group carries its
# own restart handler. These are bind-mounted as FILES, and `copy` with
# `content:` renames a temporary file into place — which replaces the inode
# Docker bound at container start. Without a handler the running container keeps
# serving the previous credential indefinitely, while the deploy reports changed
# and every monitor stays green. That is the same defect #131 fixed for the two
# mounted config files; the sweep stopped ten lines short of the secrets.
# Measured: forgejo_secret_key was written on 2026-08-15 and the forge ran
# 17 h 44 on the old key.
#
# The mapping below was read off the RUNNING containers' mounts, not inferred
# from the compose file.

- name: secrets | Write the Traefik DNS-01 token
  ansible.builtin.copy:
    dest: /mnt/data/secrets/docker/cf_dns_api_token
    content: "{{ cloudflare_dns_api_token }}"
    owner: root
    group: root
    mode: "0444"
  notify: Restart traefik
  no_log: true

# NOT A ROTATION PATH. MYSQL_PASSWORD_FILE is read by the image entrypoint
# during initdb and never again — every later start skips initialisation and
# ignores the file. Writing a new value here and deploying produces a changed
# task, a handler that restarts the container, and the OLD password still in
# force (#159). Rotating for real means an ALTER USER against the running
# database first: knowledge/runbooks/rotate-a-secret.md. The daily posture check
# asserts that the value here still opens the database, which is the acceptance
# test for having followed it.
- name: secrets | Write the Nextcloud database secrets
  ansible.builtin.copy:
    dest: /mnt/data/secrets/docker/{{ item.name }}
    content: "{{ item.value }}"
    owner: root
    group: root
    mode: "0444"
  loop:
    - name: nextcloud_db_password
      value: "{{ nextcloud_db_password }}"
    - name: nextcloud_db_root_password
      value: "{{ nextcloud_db_root_password }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart nextcloud-db
  no_log: true

# --- The Redis password, and it closes a path wider than the container set ----
# `nextcloud-redis` ran `nopass ~* &* +@all`. What it holds is not a cache in the
# harmless sense: PHP's session handler is `redis`, so **217 of its 254 keys were
# live Nextcloud sessions** (~1.9 KB each, 15-minute sliding TTL). Anyone who can
# read them lifts a session and becomes a logged-in user — no password, no second
# factor.
#
# Who could: the 11 other containers on `homelab_internal`, of which only
# Nextcloud, its cron and notify_push have any use for it — and, measured with a
# positive control, ANY LOCAL ACCOUNT on the host. `bash -c 'exec 3<>/dev/tcp/
# <redis>/6379'` answered `+PONG` as an ordinary user, because the host routes to
# the docker bridge. `127.0.0.1:22` stayed silent in the same test, which is what
# proved the instrument rather than the absence.
#
# That second path is why a password was chosen over putting Redis on its own
# network: segmentation closes the container half and leaves the host half open,
# while `requirepass` refuses the command whatever its origin. The `claude`
# account is the concrete case — uid 1001, NOT in the `docker` group, so it can
# reach the port today and cannot read this file.
#
# TWO FILES from one variable, and the second is the reason this task is not a
# one-liner. Redis takes a password from its config file or from `--requirepass`
# on ITS COMMAND LINE; the second would publish the secret in the host's `ps`
# output, handing it to exactly the local accounts this exists to shut out. So
# the conf file carries it and the container reads it as a bind-mounted file.
- name: secrets | Write the Nextcloud Redis password
  ansible.builtin.copy:
    dest: /mnt/data/secrets/docker/nextcloud_redis_password
    content: "{{ nextcloud_redis_password }}"
    owner: root
    group: root
    mode: "0444"
  notify: Restart nextcloud-redis
  no_log: true

# --- The credential the READERS use, and there are two of them ---------------
# Nextcloud's own config is not one file. `config.php` carries a static `redis`
# array written by the installer — host, port, and `password => ''` — while the
# image also ships `redis.config.php`, which rebuilds that array from
# `getenv('REDIS_HOST')` and supports `REDIS_HOST_PASSWORD_FILE` natively.
#
# That second file is enough for the Nextcloud container, and NOT enough for
# notify_push, which is the trap here. Measured: notify_push has no `REDIS_HOST`
# in its environment at all, so `redis.config.php` short-circuits for it and it
# falls back to the static array in `config.php` — with the empty password. It
# nonetheless connects today (its address is on Redis's client list), which is
# exactly how this would have passed review and then broken the push channel the
# moment `requirepass` landed.
#
# So the password is given to both as a LITERAL in a config file rather than
# through the environment: notify_push is a Rust binary parsing PHP, and asking
# it to evaluate `getenv(...) ? trim(file_get_contents(...)) : ...` is a bet on
# someone else's parser. A literal string is not a bet. `zz-` because Nextcloud
# loads `config/*.config.php` in alphabetical order and the last writer wins.
- name: secrets | Give both Redis readers the password
  ansible.builtin.copy:
    dest: "{{ services_data_dir }}/nextcloud/data/config/zz-redis-password.config.php"
    content: |
      <?php
      // Managed by Ansible — do not edit on the host.
      $CONFIG = array(
        'redis' => array(
          'host' => 'nextcloud-redis',
          'port' => 6379,
          'password' => '{{ nextcloud_redis_password }}',
        ),
      );
    owner: "33"
    group: "33"
    mode: "0640"
  notify: Restart nextcloud-redis
  no_log: true

# `save ""` moves here from the compose `command:` so the container has a single
# source of configuration rather than a config file plus overriding arguments.
# It is the same setting it always had: no RDB snapshot, because this store is
# a cache and a session table, and losing it on restart logs everyone out rather
# than losing data.
- name: secrets | Render the Nextcloud Redis configuration
  ansible.builtin.copy:
    dest: /mnt/data/secrets/docker/nextcloud_redis.conf
    content: |
      # Managed by Ansible — do not edit on the host.
      save ""
      requirepass {{ nextcloud_redis_password }}
    owner: root
    group: root
    mode: "0444"
  notify: Restart nextcloud-redis
  no_log: true

# NOT A ROTATION PATH. POSTGRES_PASSWORD_FILE is read by the image entrypoint
# during initdb and never again — every later start skips initialisation and
# ignores the file. Writing a new value here and deploying produces a changed
# task, a handler that restarts the container, and the OLD password still in
# force (#159). Rotating for real means an ALTER USER against the running
# database first: knowledge/runbooks/rotate-a-secret.md. The daily posture check
# asserts that the value here still opens the database, which is the acceptance
# test for having followed it.
- name: secrets | Write the Immich database password
  ansible.builtin.copy:
    dest: /mnt/data/secrets/docker/immich_db_password
    content: "{{ immich_db_password }}"
    owner: root
    group: root
    mode: "0444"
  notify: Restart immich
  no_log: true

- name: secrets | Write the Transmission RPC password
  ansible.builtin.copy:
    dest: /mnt/data/secrets/docker/transmission_password
    content: "{{ transmission_password }}"
    owner: root
    group: root
    mode: "0444"
  notify: Restart transmission
  no_log: true

# Mounted into the pihole container so `pihole setpassword` can read it there
# instead of receiving it on the host's command line (#198). No restart handler
# on purpose: FTL never reads this file — the task in pihole.yml does, and it
# runs on every deploy anyway. A restart here would cost a DNS outage for
# nothing, and would have to drag dnsproxy with it.
- name: secrets | Write the Pi-hole admin password
  ansible.builtin.copy:
    dest: /mnt/data/secrets/docker/pihole_password
    content: "{{ pihole_password }}"
    owner: root
    group: root
    mode: "0444"
  no_log: true

- name: secrets | Write the Vaultwarden admin token hash
  ansible.builtin.copy:
    dest: /mnt/data/secrets/docker/vaultwarden_admin_token_hash
    content: "{{ vaultwarden_admin_token_hash }}"
    owner: root
    group: root
    mode: "0444"
  notify: Restart vaultwarden
  no_log: true

# NOT A ROTATION PATH. POSTGRES_PASSWORD_FILE is read by the image entrypoint
# during initdb and never again — every later start skips initialisation and
# ignores the file. Writing a new value here and deploying produces a changed
# task, a handler that restarts the container, and the OLD password still in
# force (#159). Rotating for real means an ALTER USER against the running
# database first: knowledge/runbooks/rotate-a-secret.md. The daily posture check
# asserts that the value here still opens the database, which is the acceptance
# test for having followed it.
- name: secrets | Write the Miniflux database password
  ansible.builtin.copy:
    dest: /mnt/data/secrets/docker/miniflux_db_password
    content: "{{ miniflux_db_password }}"
    owner: root
    group: root
    mode: "0444"
  notify: Restart miniflux-db
  no_log: true

# Miniflux takes a whole connection string, not a password to slot into one, so
# the DSN is the secret. Composed here rather than in a template because it is a
# single line and every part of it already lives in this role's variables.
# `host=miniflux-db` is the compose service name on the internal network;
# sslmode=disable because that network never leaves the host.
- name: secrets | Write the Miniflux application secrets
  ansible.builtin.copy:
    dest: /mnt/data/secrets/docker/{{ item.name }}
    content: "{{ item.value }}"
    owner: root
    group: root
    mode: "0444"
  loop:
    - name: miniflux_database_url
      value: >-
        user={{ miniflux_db_user | default('miniflux') }}
        password={{ miniflux_db_password }}
        dbname={{ miniflux_db_name | default('miniflux') }}
        host=miniflux-db sslmode=disable
    - name: miniflux_admin_password
      value: "{{ miniflux_admin_password }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart miniflux
  no_log: true

# Read by the RUNNING container on every start, via SECRET_KEY_URI. Forgejo
# normally generates this during web installation; INSTALL_LOCK skips that step,
# so without this the forge runs on the constant compiled into the binary. There
# is no rotation path once data depends on it — which is precisely why the
# 17 h 44 window above mattered.
- name: secrets | Write the Forgejo secret key
  ansible.builtin.copy:
    dest: /mnt/data/secrets/docker/forgejo_secret_key
    content: "{{ forgejo_secret_key }}"
    owner: root
    group: root
    mode: "0444"
  notify: Restart forgejo
  no_log: true

# Deliberately WITHOUT a handler, and this is the one exception in the file.
# Read by the one-shot `forgejo admin user create` on first deploy, never by the
# running container: Forgejo has no CREATE_ADMIN environment variable to make
# the account declaratively the way Miniflux does. Restarting the forge would
# achieve nothing, so no notify — noted here so the omission reads as a decision
# rather than as the oversight this whole change is fixing.
- name: secrets | Write the Forgejo admin password (first-deploy CLI only)
  ansible.builtin.copy:
    dest: /mnt/data/secrets/docker/forgejo_admin_password
    content: "{{ forgejo_admin_password }}"
    owner: root
    group: root
    mode: "0444"
  no_log: true

# Dozzle wants its credentials as a YAML document at a fixed path inside the
# container, not as a bare value under /run/secrets — so it is a template rather
# than an entry in the loop above. Same directory and same 0444 for the same
# reason: the container runs as uid 65534, which no host ownership can match.
- name: secrets | Render the Dozzle simple-auth users file
  ansible.builtin.template:
    src: dozzle-users.yml.j2
    dest: /mnt/data/secrets/docker/dozzle_users.yml
    owner: root
    group: root
    mode: "0444"
  notify: Restart dozzle
  no_log: true
