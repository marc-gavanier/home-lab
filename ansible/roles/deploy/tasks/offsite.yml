---
# Offsite repo weekly check (ADR-010).
# The homelab holds the offsite repo password, so integrity checks of the
# offsite repo run from here, through the WireGuard tunnel. Sunday 06:00:
# well clear of the 03:00 backup+copy window (restic check takes an
# exclusive lock — an overlap would fail one of the two).

# offsite-check.sh is gone (ADR-031): the `offsite` profile is a repository of
# its own with its own credentials, and `check` against it is the whole script.
- name: offsite | Remove the superseded offsite check script
  ansible.builtin.file:
    path: /opt/homelab/scripts/offsite-check.sh
    state: absent

- name: offsite | Create offsite check systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-offsite-check.service
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly offsite restic repo check
      Wants=network-online.target
      Requires=mnt-data.mount
      After=network-online.target mnt-data.mount
      # The script opened with "offsite repo not configured — skipping check"
      # and exited 0. systemd expresses the same thing without the shell: the
      # password file is written only when offsite_restic_password is set, so
      # its absence IS "not configured", and the unit is skipped rather than
      # failing every Sunday on a host that has no offsite repository.
      ConditionPathExists=/mnt/data/secrets/offsite_restic_password

      [Service]
      Type=oneshot
      # --lock-wait for the same reason as the local maintenance, one repository
      # further out: the nightly `copy` writes to this repository and takes
      # restic's own lock on it. An overrunning copy must delay the check, not
      # fail it.
      ExecStart=/usr/local/bin/resticprofile --lock-wait 2h -c /opt/homelab/resticprofile.yaml -n offsite check
      EnvironmentFile=/opt/homelab/backup.env
      Environment=HOME=/root

- name: offsite | Create offsite check systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-offsite-check.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly offsite restic repo check (Sunday 06:00)

      [Timer]
      OnCalendar=Sun *-*-* 06:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: offsite | Enable offsite check timer
  ansible.builtin.systemd:
    name: homelab-offsite-check.timer
    enabled: true
    state: started
    daemon_reload: true
