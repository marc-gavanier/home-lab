---
- name: offsite | Remove the superseded offsite check script
  ansible.builtin.file:
    path: /opt/homelab/scripts/offsite-check.sh
    state: absent

- name: offsite | Create offsite check systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-offsite-check.service
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly offsite restic repo check
      Wants=network-online.target
      Requires=mnt-data.mount
      After=network-online.target mnt-data.mount
      ConditionPathExists=/mnt/data/secrets/offsite_restic_password

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/resticprofile --lock-wait 2h -c /opt/homelab/resticprofile.yaml -n offsite check
      EnvironmentFile=/opt/homelab/backup.env
      Environment=HOME=/root

- name: offsite | Create offsite check systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-offsite-check.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly offsite restic repo check (Tuesday 02:00)

      [Timer]
      OnCalendar=Tue *-*-* 02:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: offsite | Enable offsite check timer
  ansible.builtin.systemd:
    name: homelab-offsite-check.timer
    enabled: true
    state: started
    daemon_reload: true
