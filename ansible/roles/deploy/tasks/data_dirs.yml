---
# Ownership of the data directories that a hardened container must be able to
# WRITE. Runs before `compose up`, so a container recreated by this same play
# finds its directory already usable.
#
# Why this file exists: `cap_drop: ALL` takes CAP_DAC_OVERRIDE away from a
# container running as root, which then falls back under the permission bits it
# used to bypass. A directory owned by the operator's uid stops accepting NEW
# files — while every file already open keeps working. So the container stays
# healthy, the service answers, and nothing fails until something has to be
# created. Two bugs hid there for weeks:
#
#   #138  wg-easy could not write its database, so a VPN peer could not be
#         REVOKED. Not fixed here: see the note at the bottom.
#   #144  Vaultwarden. Its vault is a SQLite database in WAL mode, and it wrote
#         fine only because db.sqlite3-wal and -shm predated the capability
#         drop by six days. SQLite deletes both on a clean shutdown and
#         recreates them on the next open; it could not have. The first
#         `compose down` would have left the vault read-only.
#
# Ownership, not mode: these containers run as uid 0, so root:root is the
# minimum that works and it does not widen access to anything else. Each of the
# three directories has exactly one consumer, verified on the host, and no other
# container or service uid reads them.
#
# `cap_drop: ALL` is correct hardening and stays. The defect was the ownership.

- name: data_dirs | Own the data of root containers that no longer hold DAC_OVERRIDE
  ansible.builtin.file:
    path: "{{ services_data_dir }}/{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: vaultwarden, mode: "0700" }
    # 0755 until 2026-08-24, and nothing had decided that — it was the mode the
    # directory happened to have when this task was written to fix its OWNER.
    # What it holds: the ACME account private key and eighteen certificates with
    # their keys, in acme.json at 0600 under a directory any local account could
    # traverse. Found by the derived assertion (#217) on its first run, not by
    # anyone reading the list. 0700 costs Traefik nothing — it owns the
    # directory and additionally carries CAP_DAC_READ_SEARCH — and the health
    # script that parses acme.json since #157 runs as root.
    - { path: traefik/acme, mode: "0700" }
    - { path: immich/upload, mode: "0755" }
  loop_control:
    label: "{{ item.path }} {{ item.mode }}"

# wg-easy writes its database with umask 022, so it lands 0644 — world-readable,
# holding the interface private key, every client private key and pre-shared key,
# and the admin bcrypt hash (#153). Its siblings in the same directory are 0600
# and 0640; only this one is not, which is why it reads as the application's
# default rather than a decision.
#
# The container runs as root and owns the file, so 0600 costs it nothing. Mode
# only, never ownership: chowning the DIRECTORY is what triggers the #138
# reconciliation write, and this task must stay safe to run from a deploy.
#
# Re-asserted every deploy rather than set once, because the application may
# recreate the file on a restart and take its umask with it.
- name: data_dirs | Look for wg-easy's database
  ansible.builtin.stat:
    path: "{{ services_data_dir }}/wireguard/wg-easy.db"
  register: wg_easy_db

# Skipped rather than ignored: absent means the container has never started here,
# which is a legitimate state on a fresh host. Any OTHER failure still fails.
- name: data_dirs | Keep wg-easy's key material unreadable to other local uids
  ansible.builtin.file:
    path: "{{ services_data_dir }}/wireguard/wg-easy.db"
    state: file
    mode: "0600"
  when: wg_easy_db.stat.exists

# NOT wireguard, deliberately. The same one-line change fixes #138, but it
# cannot be made from here: the first successful write regenerates wg0.conf from
# the database and runs `wg syncconf`, and the live interface is IPv4-only while
# the database holds IPv6 for the interface and for every peer. That interface
# is the only path to this host. #138 is done at the machine.

# --- Credential-bearing service data: gate the DIRECTORY, not each file (#177)
#
# The audit of 2026-08-19 found Vaultwarden's rsa_key.pem — the key that signs
# session JWTs — and its vault database readable by any local unprivileged
# account, along with Kuma's database and its twelve push tokens. Proven by
# reading them as an unrelated uid, with /etc/shadow refused in the same call so
# a refusal elsewhere means something.
#
# The fix mirrors what /mnt/data/secrets already does correctly, and what the
# same audit verified sound: the files there are 0444 and unreachable anyway,
# because the DIRECTORIES are `drwx--x--x` and `drwx--x---`. Two adjacent stores,
# one closed by its directories, one wide open. This closes the second the same
# way.
#
# Why the directory rather than the twenty files: SQLite recreates `-wal` and
# `-shm` on every open, taking the process umask with them, so a mode set on
# those files survives exactly until the next container restart. A directory
# mode does not have that problem, and it covers files nobody has thought of yet.
#
# Safe because each of these directories is bind-mounted by exactly ONE
# container — verified across all 28 — and every one of those containers reaches
# its data as the directory's own owner: root for the first three, uid 1000 for
# calibre-web and transmission's config. None of them depends on DAC_OVERRIDE to
# get in, so this does not repeat #138.
#
# `mode` only, never `owner`: chowning a directory is what triggers the #138
# reconciliation write, and this file must stay safe to run from a deploy.
#
# Pi-hole's store is the sixth, added by #189, and it is the exception to the
# sentence above rather than another instance of it. It runs as root over an
# /etc/pihole owned by uid 1000, so it does NOT reach its data as the owner —
# it gets in because it holds DAC_OVERRIDE (with CHOWN, FOWNER and SETFCAP; the
# reasons are argued at its capability list in compose.yaml). The five others
# are safe because they never needed the capability, this one is safe because
# it has it, and neither can be locked out by the bits. Exactly one container
# mounts the path, as for the rest.
#
# What it closes: pihole.toml carries `webserver.api.pwhash` — populated, with
# TOTP and app-password empty, so that hash is the only factor — and it sat at
# 0644 under two 0755 directories, readable by any local account. The same
# directory holds pihole-FTL.db, which is every DNS query the household has
# made. Not `pihole` itself: its other mount, `pihole/dnsmasq`, is configuration
# and closing it would gate more than the finding.
- name: data_dirs | Gate the service directories that hold credentials
  ansible.builtin.file:
    path: "{{ services_data_dir }}/{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - uptime-kuma
    - navidrome
    - calibre-web
    - transmission/config
    - pihole/etc
    # The eighth store (#217), and the last one that will ever have to be added
    # here by hand: jellyfin.db was 0644 under two 0755 directories, holding six
    # non-expiring device access tokens — bearer credentials with no expiry,
    # full API as that user — and the admin password hash. Proven readable as an
    # unprivileged account with /etc/shadow refused in the same call.
    #
    # Safe for the same reason as the five above: Jellyfin runs as root over a
    # tree the storage role already owns root:root recursively, with
    # `cap_add: []`, so it reaches its data as the owner and cannot be locked
    # out by the bits — this cannot replay #138.
    #
    # It is listed rather than derived because this file ENFORCES; the spec
    # DERIVES and would have failed on it either way. The two now disagree only
    # while a new store is waiting to be closed, which is exactly when they
    # should.
    - jellyfin/config

# Belt as well as braces, on the files an application does NOT recreate: if a
# directory mode ever regresses, these do not hand the contents over with it.
# Deliberately not listing `-wal`/`-shm` — see the umask note above; the
# directory is what protects those.
- name: data_dirs | Look for the credential files that survive a restart
  ansible.builtin.stat:
    path: "{{ services_data_dir }}/{{ item }}"
  register: credential_files
  loop:
    - vaultwarden/rsa_key.pem
    - vaultwarden/config.json
    - vaultwarden/db.sqlite3
    - uptime-kuma/kuma.db
    - uptime-kuma/kuma-pre-2.5.0.db
    - uptime-kuma/kuma-pre-migration-mark.db
    - uptime-kuma/db-config.json
    - navidrome/navidrome.db
    - calibre-web/.key
    - calibre-web/app.db
    - calibre-web/cwa.db
    - calibre-web/gdrive.db
    - calibre-web/client_secrets.json
    - transmission/config/settings.json

# Skipped rather than ignored when absent: a fresh host legitimately has none of
# these yet. Any OTHER failure still fails the play. Two of the Kuma files also
# carry a spurious executable bit, which 0600 removes.
- name: data_dirs | Keep credential files unreadable to other local uids
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: file
    mode: "0600"
  loop: "{{ credential_files.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
