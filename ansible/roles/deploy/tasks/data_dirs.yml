---
- name: data_dirs | Own the data of root containers that no longer hold DAC_OVERRIDE
  ansible.builtin.file:
    path: "{{ services_data_dir }}/{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: vaultwarden, mode: "0700" }
    - { path: traefik/acme, mode: "0700" }
    - { path: immich/upload, mode: "0755" }
    - { path: wireguard, mode: "0700" }
  loop_control:
    label: "{{ item.path }} {{ item.mode }}"

- name: data_dirs | Own the Immich Redis append-only directory (uid 999, queue store)
  ansible.builtin.file:
    path: "{{ services_data_dir }}/immich/redis"
    state: directory
    owner: "999"
    group: "999"
    mode: "0700"

- name: data_dirs | Look for wg-easy's database
  ansible.builtin.stat:
    path: "{{ services_data_dir }}/wireguard/wg-easy.db"
  register: wg_easy_db

- name: data_dirs | Keep wg-easy's key material unreadable to other local uids
  ansible.builtin.file:
    path: "{{ services_data_dir }}/wireguard/wg-easy.db"
    state: file
    mode: "0600"
  when: wg_easy_db.stat.exists

- name: data_dirs | Gate the Pi-hole store at the level the image cannot revert
  ansible.builtin.file:
    path: "{{ services_data_dir }}/pihole"
    state: directory
    mode: "0750"

- name: data_dirs | Gate the service directories that hold credentials
  ansible.builtin.file:
    path: "{{ services_data_dir }}/{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - uptime-kuma
    - navidrome
    - calibre-web
    - transmission/config
    - jellyfin/config
    - immich/upload/backups

    - prowlarr
    - sonarr
    - radarr

- name: data_dirs | Look for the credential files that survive a restart
  ansible.builtin.stat:
    path: "{{ services_data_dir }}/{{ item }}"
  register: credential_files
  loop:
    - vaultwarden/rsa_key.pem
    - vaultwarden/config.json
    - vaultwarden/db.sqlite3
    - uptime-kuma/kuma.db
    - uptime-kuma/kuma-pre-2.5.0.db
    - uptime-kuma/kuma-pre-migration-mark.db
    - uptime-kuma/db-config.json
    - navidrome/navidrome.db
    - calibre-web/.key
    - calibre-web/app.db
    - calibre-web/cwa.db
    - calibre-web/gdrive.db
    - calibre-web/client_secrets.json
    - transmission/config/settings.json
    - prowlarr/config.xml
    - sonarr/config.xml
    - radarr/config.xml

- name: data_dirs | Report how many credential files were found
  ansible.builtin.debug:
    msg: >-
      {{ credential_files.results | selectattr('stat.exists') | list | length }}
      of {{ credential_files.results | length }} credential file(s) present and
      being set to 0600.
      {{ 'NONE were found — on anything but a fresh host that means the data root
      is not where this play is looking.'
         if (credential_files.results | selectattr('stat.exists') | list | length) == 0
         else '' }}

- name: data_dirs | Keep credential files unreadable to other local uids
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: file
    mode: "0600"
  # floor: the assert directly above, which fails when the selectattr returns zero
  loop: "{{ credential_files.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"
