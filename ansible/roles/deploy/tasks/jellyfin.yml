---
- name: jellyfin | Install the Live TV playlist, when one is supplied
  when: (role_path ~ '/files/jellyfin/iptv-fr.m3u') is file
  ansible.builtin.copy:
    src: jellyfin/iptv-fr.m3u
    dest: "{{ services_data_dir }}/jellyfin/config/iptv-fr.m3u"
    owner: root
    group: root
    mode: "0644"
