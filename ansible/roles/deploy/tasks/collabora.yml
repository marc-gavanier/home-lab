---
- name: collabora | List the running containers this wiring needs
  ansible.builtin.command:
    cmd: docker ps --filter status=running --format '{% raw %}{{.Names}}{% endraw %}'
  register: collabora_running
  changed_when: false
  check_mode: false

- name: collabora | Skip the wiring unless both containers are up
  ansible.builtin.set_fact:
    collabora_up: "{{ ['collabora', 'nextcloud'] | difference(collabora_running.stdout_lines) | length == 0 }}"

- name: collabora | Report that the Collabora wiring was NOT applied
  ansible.builtin.debug:
    msg: >-
      Collabora and/or Nextcloud is NOT running, so the whole richdocuments
      wiring was skipped: the connector install, the WOPI URL, the discovery
      cache and — this is the part that matters — the three verifications that
      FAIL the deploy when a document cannot be converted or the browser would
      get an unreachable URL. Those guards did not pass, they did not run. Start
      both containers and re-run this play before believing document editing
      works.
  when: not collabora_up


- name: collabora | Wait for the Collabora document server to answer
  ansible.builtin.command:
    cmd: docker exec nextcloud curl -sf -m 5 http://collabora:9980/hosting/capabilities
  register: collabora_probe
  until: collabora_probe.rc == 0
  retries: 20
  delay: 10
  changed_when: false
  check_mode: false
  failed_when: false
  when: collabora_up

- name: collabora | Get the installed Nextcloud apps
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:list --output=json
  register: collabora_app_list
  changed_when: false
  check_mode: false
  when: collabora_up

- name: collabora | Download the richdocuments connector when absent
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:install richdocuments
  register: collabora_app_install
  changed_when: collabora_app_install.rc == 0
  when:
    - collabora_up
    - "'richdocuments' not in (collabora_app_list.stdout | default('{}') | from_json).enabled"
    - "'richdocuments' not in (collabora_app_list.stdout | default('{}') | from_json).disabled"

- name: collabora | Enable the richdocuments connector when downloaded but off
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:enable richdocuments
  register: collabora_app_enable
  changed_when: "'already enabled' not in collabora_app_enable.stdout"
  when:
    - collabora_up
    - "'richdocuments' in (collabora_app_list.stdout | default('{}') | from_json).disabled"

- name: collabora | Read the current richdocuments configuration
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:list --output=json
  register: collabora_conf
  changed_when: false
  check_mode: false
  when: collabora_up

- name: collabora | Re-assert the WOPI URL (public name, see comment)
  ansible.builtin.command:
    cmd: "docker exec -u www-data nextcloud php occ config:app:set richdocuments wopi_url --value=https://office.{{ domain }}"
  register: collabora_set
  changed_when: true
  when:
    - collabora_up
    - ((collabora_conf.stdout | default('{}') | from_json).apps.richdocuments | default({})).wopi_url | default('') != 'https://office.' ~ domain

- name: collabora | Check whether the cached WOPI discovery is usable
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: >
      out=$(docker exec nextcloud sh -c 'cat /var/www/html/data/appdata_*/richdocuments/remoteData/discovery 2>/dev/null') || exit 1;
      case "$out" in *'urlsrc="https://office.{{ domain }}/'*) ;; *) exit 1 ;; esac;
      live=$(docker exec nextcloud curl -sf -m 20 https://office.{{ domain }}/hosting/discovery) || exit 0;
      [[ "$live" =~ browser/([0-9a-f]+)/ ]] || exit 1;
      live_build="${BASH_REMATCH[1]}";
      [[ "$out" =~ browser/([0-9a-f]+)/ ]] || exit 1;
      [ "${BASH_REMATCH[1]}" = "$live_build" ]
  register: collabora_discovery_cache
  changed_when: false
  check_mode: false
  failed_when: false
  when: collabora_up

- name: collabora | Activate the richdocuments configuration  # noqa: no-handler
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ richdocuments:activate-config
  register: collabora_activate
  changed_when: true
  failed_when: collabora_activate.rc != 0
  when:
    - collabora_up
    - >-
      collabora_app_install is changed or collabora_app_enable is changed
      or collabora_set is changed
      or collabora_discovery_cache.rc | default(1) != 0

- name: collabora | Re-read the configuration activate-config may have rewritten
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:list --output=json
  register: collabora_conf2
  changed_when: false
  check_mode: false
  when: collabora_up

- name: collabora | Re-assert the public WOPI URL the browser is handed
  ansible.builtin.command:
    cmd: "docker exec -u www-data nextcloud php occ config:app:set richdocuments public_wopi_url --value=https://office.{{ domain }}"
  changed_when: true
  when:
    - collabora_up
    - ((collabora_conf2.stdout | default('{}') | from_json).apps.richdocuments | default({})).public_wopi_url | default('') != 'https://office.' ~ domain

- name: collabora | Decide whether the end-to-end conversion probe is worth its cost
  ansible.builtin.set_fact:
    collabora_convert_probe: >-
      {{ deploy_services is not defined
         or 'collabora' in deploy_services.split()
         or 'nextcloud' in deploy_services.split()
         or collabora_activate is changed }}

- name: collabora | Verify a document can actually be converted
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: >
      printf 'homelab deploy probe\n' > /tmp/collabora-probe.txt &&
      docker cp /tmp/collabora-probe.txt nextcloud:/tmp/collabora-probe.txt &&
      docker exec nextcloud curl -sf -m 120 -o /tmp/collabora-probe.pdf
      -F 'data=@/tmp/collabora-probe.txt' http://collabora:9980/cool/convert-to/pdf &&
      magic=$(docker exec nextcloud head -c 5 /tmp/collabora-probe.pdf) &&
      [ "$magic" = '%PDF-' ]
  register: collabora_convert
  until: collabora_convert.rc == 0
  retries: 3
  delay: 60
  changed_when: false
  when:
    - collabora_up
    - collabora_convert_probe

- name: collabora | Verify the URL handed to the browser is publicly reachable
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: >
      out=$(docker exec nextcloud curl -sf -m 20 https://office.{{ domain }}/hosting/discovery) || exit 1;
      case "$out" in *'urlsrc="https://office.{{ domain }}/'*) exit 0 ;; *) exit 1 ;; esac
  register: collabora_urlsrc
  changed_when: false
  check_mode: false
  when: collabora_up

- name: collabora | Verify the cached discovery richdocuments will serve
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: >
      out=$(docker exec nextcloud sh -c 'cat /var/www/html/data/appdata_*/richdocuments/remoteData/discovery 2>/dev/null') || exit 1;
      case "$out" in *'urlsrc="https://office.{{ domain }}/'*) exit 0 ;; *) exit 1 ;; esac
  register: collabora_cache_final
  changed_when: false
  check_mode: false
  when: collabora_up

- name: collabora | Remove the conversion probe artefacts
  ansible.builtin.shell:
    cmd: >
      rm -f /tmp/collabora-probe.txt;
      docker exec nextcloud rm -f /tmp/collabora-probe.txt /tmp/collabora-probe.pdf 2>/dev/null;
      exit 0
  changed_when: false
  when: collabora_up

- name: collabora | Refuse to conclude from the reachability probes if they did not run
  ansible.builtin.assert:
    that:
      - collabora_urlsrc.rc is defined
      - collabora_cache_final.rc is defined
    fail_msg: >-
      Collabora is running but one of the two reachability probes produced no
      result, so the checks below would pass on an absence rather than on an
      answer.
    quiet: true
  when:
    - collabora_up
    - not ansible_check_mode

- name: collabora | Refuse to conclude from a conversion probe that did not run
  ansible.builtin.assert:
    that:
      - collabora_convert.rc is defined
    fail_msg: >-
      The conversion probe was expected to run and produced no result, so the
      check below would pass on an absence rather than on an answer.
    quiet: true
  when:
    - collabora_up
    - collabora_convert_probe
    - not ansible_check_mode

- name: collabora | Fail the deploy when Collabora cannot serve a document
  ansible.builtin.fail:
    msg: >-
      Collabora answers but cannot convert a document. Two causes, and they are
      told apart in `docker logs collabora`. A broken container logs "Waiting for
      a new child" (privilege gain blocked) or exits 70 (missing capability) — the
      kits never start. A saturated disk logs "taking too much time" on the
      link/copy and "taking too long to load … per_document.limit_load_secs" — the
      kits start and lose the race, because without CAP_SYS_ADMIN every document
      copies 759 MB of tree (ADR-021). Check `/proc/pressure/io` before touching
      anything: if `full avg60` is high, Collabora is a victim of the load, not its
      cause, and the probe simply ran in the worst possible window.
  when:
    - collabora_up
    - collabora_convert.rc | default(0) != 0

- name: collabora | Fail the deploy when the browser would get an unreachable URL
  ansible.builtin.fail:
    msg: >-
      Collabora works, but the URL Nextcloud hands the browser is not
      https://office.{{ domain }} — documents will fail to open with a CSP
      form-action violation while every server-side check stays green. Verify
      `wopi_url` is the public name and that the nextcloud container pins
      office.{{ domain }} to the LAN IP (ADR-021).
  when:
    - collabora_up
    - collabora_urlsrc.rc | default(0) != 0

- name: collabora | Fail the deploy when the cached discovery is unusable
  ansible.builtin.fail:
    msg: >-
      Collabora is reachable and serves the right URL, but the discovery cached
      inside richdocuments does not. It never fetches on demand, so an empty or
      stale cache means HTTP 500 on /apps/richdocuments/token and a document
      that loads forever, with every other check green. Repair with
      `docker exec -u www-data nextcloud php occ richdocuments:activate-config`
      and read its output — a failure there is the real cause (ADR-021).
  when:
    - collabora_up
    - collabora_cache_final.rc | default(0) != 0
