---
# Pi-hole password (v6 ignores the env var after first start).

- name: pihole | Inspect the Pi-hole container
  community.docker.docker_container_info:
    name: pihole
  register: pihole_info

- name: pihole | Determine whether Pi-hole is running
  ansible.builtin.set_fact:
    pihole_up: "{{ pihole_info.exists and (pihole_info.container.State.Running | default(false)) }}"

# A skipped block that says nothing is the defect ADR-030 names, and it is the
# same one `observability/tasks/main.yml` guards against with its "no silent
# caps" report: the run is CORRECT — there is genuinely nothing to do against a
# container that is not running — but its silence is not. `ok=0 changed=0` for
# this whole section is what a healthy no-op and a missed configuration pass
# look like from the outside, and `changed=0` is exactly what an idempotence
# check is looking for, so a re-run confirms the wrong thing too.
#
# No count in the message on purpose: a hardcoded number is what went stale in
# boot-and-unlock.md and in ADR-007. The message names the CONSEQUENCES, which
# do not drift when a task is added.

- name: pihole | Report that the admin password was NOT enforced
  ansible.builtin.debug:
    msg: >-
      Pi-hole is NOT running, so its admin password was neither checked against
      the auth API nor set. A rotation recorded in the vault has therefore NOT
      reached the service, and this run reports success either way. Start the
      container and re-run this play.
  when: not pihole_up


# Idempotence: try the v6 auth API with the vault password (JSON-encoded via
# python so special characters survive). 200 = already set, anything else =
# needs (re)setting. The throwaway session expires on its own.
#
# `check_mode: false` even though this POSTs: the request creates a short-lived
# session and nothing else, while skipping it registers stdout as an EMPTY
# STRING — which is not '200', so a dry run would announce that it is about to
# reset the Pi-hole admin password (#169). Of every probe in this role that is
# the worst one to get wrong, because the task it guards is the one that changes
# a credential.
# Read from the FILE, not from `environment:`, since 2026-09-06. The single
# letter `P` was chosen to keep the value out of the program's argv — correct
# for that class, and it missed the channel that mattered: Ansible's become
# wrapper renders `sudo sh -c 'P=<value> python3 ...'`, and sudo journals the
# command line it is asked to run. So the secret left the argv of python3 and
# landed in the argv of sh, in /var/log/auth.log and the systemd journal, both
# readable without sudo by any account in `adm`.
#
# `no_log: true` did not help and was never going to: it suppresses Ansible's
# own output, not the become wrapper. That was already measured and written
# down on an earlier audit run; the note existed and had not been generalised
# from `restic init` to this task.
#
# Measured 2026-09-05: 149 lines across auth.log and its four rotations. The
# reason nine audits missed it is worth keeping: the variable name is chosen by
# the AUTHOR, not by the secret, so no search for *PASSWORD*/*TOKEN*/*SECRET*
# can find a leak called `P`. Only a search for the VALUE finds it.
#
# The file is the one secrets.yml already writes, and it is already mounted
# into the container for `pihole setpassword` (#198) — this only stops the host
# side from taking the long way round.
- name: pihole | Check the admin password against the auth API
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      python3 -c 'import json; print(json.dumps({"password": open("/mnt/data/secrets/docker/pihole_password").read().rstrip("\\n")}))'
      | docker exec -i pihole curl -s -o /dev/null -w '%{http_code}'
      -X POST --data-binary @- http://localhost/api/auth
    executable: /bin/bash
  register: pihole_pw_check
  changed_when: false
  check_mode: false
  failed_when: false
  no_log: true
  when: pihole_up

# The password is read from the mounted secret INSIDE the container. The probe
# above was written with care to keep it off the command line, and this task
# then put it there anyway, six lines below — argv of `docker exec` on the host,
# every deploy, readable by any local account since /proc has no hidepid (#198).
#
# `sh -c` with single quotes is required: without it the `$(cat …)` expands on
# the HOST, where that path does not exist, and `pihole setpassword` — which
# takes no flags and treats whatever it receives as the new password — would
# cheerfully set it to the empty string and answer "New password set".
- name: pihole | Set Pi-hole admin password
  ansible.builtin.command:
    cmd: >-
      docker exec pihole sh -c
      'pihole setpassword "$(cat /run/secrets/pihole_password)"'
  no_log: true
  changed_when: true
  when:
    - pihole_up
    - pihole_pw_check.stdout | default('') != '200'
