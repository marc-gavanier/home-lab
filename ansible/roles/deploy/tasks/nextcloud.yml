---
# Nextcloud post-config (cron mode, system settings, apps, external storage).

- name: nextcloud | Inspect the Nextcloud container
  community.docker.docker_container_info:
    name: nextcloud
  register: nextcloud_info

- name: nextcloud | Determine whether Nextcloud is running
  ansible.builtin.set_fact:
    nextcloud_up: "{{ nextcloud_info.exists and (nextcloud_info.container.State.Running | default(false)) }}"

# A skipped block that says nothing is the defect ADR-030 names, and it is the
# same one `observability/tasks/main.yml` guards against with its "no silent
# caps" report: the run is CORRECT — there is genuinely nothing to do against a
# container that is not running — but its silence is not. `ok=0 changed=0` for
# this whole section is what a healthy no-op and a missed configuration pass
# look like from the outside, and `changed=0` is exactly what an idempotence
# check is looking for, so a re-run confirms the wrong thing too.
#
# No count in the message on purpose: a hardcoded number is what went stale in
# boot-and-unlock.md and in ADR-007. The message names the CONSEQUENCES, which
# do not drift when a task is added.

- name: nextcloud | Report that the Nextcloud configuration was NOT applied
  ansible.builtin.debug:
    msg: >-
      Nextcloud is NOT running, so this deploy configured none of it: cron mode,
      trusted domains, system settings, the files_lock expiry, the productivity
      apps, notify_push and its self-test, and the media external storages
      INCLUDING their read-only flag were all skipped. LibreSign, which gates on
      the same fact, was skipped with them. Nothing failed and nothing changed —
      start the container and re-run this play, or the settings you believe are
      deployed are not.
  when: not nextcloud_up


- name: nextcloud | Wait for Nextcloud to be ready
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ status --output=json
  register: nc_status
  until: nc_status.rc == 0 and (nc_status.stdout | from_json).installed | default(false)
  retries: 30
  delay: 5
  changed_when: false
  check_mode: false
  when: nextcloud_up

- name: nextcloud | Set Nextcloud background jobs to cron mode
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ background:cron
  register: nc_cron
  changed_when: "'set to cron' in nc_cron.stdout"
  when: nextcloud_up

# Idempotence: read the live system config once, then only set what differs.
- name: nextcloud | Read Nextcloud system configuration
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:list system --output=json
  register: nc_sysconf
  changed_when: false
  check_mode: false
  when: nextcloud_up

- name: nextcloud | Configure Nextcloud system settings
  ansible.builtin.command:
    cmd: "docker exec -u www-data nextcloud php occ config:system:set {{ item.key }} --type={{ item.type }} --value={{ item.value }}"
  loop:
    - { key: default_phone_region, type: string, value: FR }
    - { key: maintenance_window_start, type: integer, value: "4" }
  register: nc_sys_set
  changed_when: true
  when:
    - nextcloud_up
    - (nc_sysconf.stdout | from_json).system[item.key] | default('') | string != item.value | string

# files_lock ships a cron job that releases stale locks and a setting that
# disables it. The default `lock_timeout` is -1 — ETA_INFINITE — and
# getDeprecatedLocks() returns an empty list on that value, so Cron\Unlock runs
# every time and finds nothing, forever. A lock therefore outlives whatever made
# it, and the DB stores it as ttl -60 (the -1 default times the 60 in
# ConfigService: the value is MINUTES).
#
# That is not theoretical. The Nextcloud mobile app takes a Text lock when it
# opens a .md note; killed from the app switcher, it never sends the release.
# Six such locks were found on 2026-08-15 and reproduced on demand. One of them
# blocked the rclone mount's write-back for 42 hours: rclone retried every few
# seconds, Nextcloud answered 423 Locked every time, and the log rotated a full
# 100 MB. Nothing went red — the file simply stopped syncing, silently.
#
# 60 minutes rather than something tighter because there is NO refresh: a lock
# ages from its creation whether or not the editor is still open, so the timeout
# has to outlast a real editing session. Losing one mid-edit costs nothing here
# anyway — this is a single-user instance, the lock only ever protects against a
# second person, and Text autosaves continuously.
- name: nextcloud | Read the files_lock timeout
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:app:get files_lock lock_timeout
  register: nc_lock_timeout
  changed_when: false
  check_mode: false
  failed_when: false
  when: nextcloud_up

- name: nextcloud | Let stale file locks expire (files_lock ships the cron, the default disables it)
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:app:set files_lock lock_timeout --value={{ nextcloud_lock_timeout_minutes }}
  changed_when: true
  when:
    - nextcloud_up
    - nc_lock_timeout.stdout | default('') | trim != nextcloud_lock_timeout_minutes | string

# Manage trusted_domains via occ: NEXTCLOUD_TRUSTED_DOMAINS only applies on first
# install, not on an existing instance. localhost = internal healthcheck,
# nextcloud = notify_push reaching http://nextcloud, drive.<domain> = real access.
- name: nextcloud | Ensure Nextcloud trusted domains
  ansible.builtin.command:
    cmd: "docker exec -u www-data nextcloud php occ config:system:set trusted_domains {{ item.idx }} --value={{ item.val }}"
  loop:
    - { idx: 0, val: localhost }
    - { idx: 1, val: "drive.{{ domain }}" }
    - { idx: 2, val: nextcloud }
  loop_control:
    label: "{{ item.val }}"
  register: nc_trusted
  changed_when: true
  when:
    - nextcloud_up
    - ((nc_sysconf.stdout | from_json).system.trusted_domains | default([]))[item.idx] | default('') != item.val

- name: nextcloud | Get installed Nextcloud apps
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:list --output=json
  register: nc_app_list
  changed_when: false
  check_mode: false
  when: nextcloud_up

- name: nextcloud | Install Nextcloud productivity apps
  ansible.builtin.command:
    cmd: "docker exec -u www-data nextcloud php occ app:install {{ item }}"
  loop: [calendar, contacts, tasks, bookmarks, gpxpod, external, notify_push]
  when:
    - nextcloud_up
    - item not in (nc_app_list.stdout | default('{}') | from_json).enabled
    - item not in (nc_app_list.stdout | default('{}') | from_json).disabled
  register: nc_app_install
  changed_when: nc_app_install.rc == 0
  failed_when:
    - nc_app_install.rc is defined
    - nc_app_install.rc != 0
    - "'not compatible' not in nc_app_install.stdout"

# notify_push reads config.php (trusted_proxies, binary path) at startup, so it
# must be restarted after the app is installed and after any Nextcloud config
# change for the self-test to pass. Idempotence: only when something DID change.
# Not a handler on purpose: handlers fire at end of play, but the self-test and
# setup tasks right below need the restarted daemon within this same file.
- name: nextcloud | Restart notify_push to reload Nextcloud config  # noqa: no-handler
  ansible.builtin.command:
    cmd: docker restart nextcloud-notify-push
  changed_when: true
  when:
    - nextcloud_up
    - nc_app_install is changed or nc_sys_set is changed or nc_trusted is changed

# The self-test verifies the whole chain (config, proxy route, binary); a pass
# means there is nothing to set up — that is the idempotence probe.
- name: nextcloud | Probe notify_push with its self-test
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ notify_push:self-test
  register: nc_push_test
  changed_when: false
  check_mode: false
  failed_when: false
  when: nextcloud_up

- name: nextcloud | Set up notify_push (client real-time updates)
  ansible.builtin.command:
    cmd: "docker exec -u www-data nextcloud php occ notify_push:setup https://drive.{{ domain }}/push"
  register: nc_notify_push
  until: nc_notify_push.rc == 0
  retries: 6
  delay: 10
  changed_when: true
  failed_when: false
  when:
    - nextcloud_up
    - nc_push_test.rc | default(0) != 0

# Mount media libraries (photos/music/videos) as read-only External Storage
# so Nextcloud can browse them without duplicating players or syncing files.

- name: nextcloud | Ensure files_external app is enabled
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:enable files_external
  register: nc_files_external
  changed_when: "'already enabled' not in nc_files_external.stdout"
  when: nextcloud_up

- name: nextcloud | List existing Nextcloud external storages
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ files_external:list --output=json
  register: nc_ext_list
  changed_when: false
  check_mode: false
  when: nextcloud_up

- name: nextcloud | Create media external storages
  ansible.builtin.command:
    cmd: >
      docker exec -u www-data nextcloud php occ files_external:create
      "{{ item.name }}" local null::null -c datadir={{ item.path }}
  loop:
    - { name: Photos, path: /external/photos }
    - { name: Music, path: /external/music }
    - { name: Videos, path: /external/videos }
  when:
    - nextcloud_up
    - item.path not in (nc_ext_list.stdout | default('[]') | from_json | map(attribute='configuration.datadir') | list)
  changed_when: true

- name: nextcloud | Re-list external storages after creation
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ files_external:list --output=json
  register: nc_ext_list2
  changed_when: false
  check_mode: false
  when: nextcloud_up

- name: nextcloud | Enforce read-only on media external storages
  ansible.builtin.command:
    cmd: >
      docker exec -u www-data nextcloud php occ files_external:option
      {{ item.mount_id }} readonly true
  loop: "{{ (nc_ext_list2.stdout | from_json) if (nc_ext_list2.stdout | default('')) else [] }}"
  loop_control:
    label: "{{ item.mount_point | default('?') }}"
  when:
    - nextcloud_up
    - item.configuration.datadir is defined
    - item.configuration.datadir.startswith('/external/')
  changed_when: false

# Nextcloud browses its own index, not the disk, so a file that arrives any way
# other than through Nextcloud stays invisible until something rescans. ADR-003
# accepted that as a con and left it "could be automated later if it becomes a
# chore"; ADR-033 made it one, by turning the workstation's ~/Music into the
# library itself. `filesystem_check_changes: 1` is Nextcloud's own answer — it
# revalidates a directory on direct access, so a new album shows up when you
# open the folder. The cost is one stat per directory browsed, not a walk of the
# tree, and the desktop client syncs neither of these mounts.
#
# Verified 2026-08-27 on /Music with /Photos and /Videos left untouched as the
# control: a folder created on the Pi outside Nextcloud appeared on the next
# browse, with no occ files:scan run.
- name: nextcloud | Let media external storages notice out-of-band changes
  ansible.builtin.command:
    cmd: >
      docker exec -u www-data nextcloud php occ files_external:option
      {{ item.mount_id }} filesystem_check_changes 1
  loop: "{{ (nc_ext_list2.stdout | from_json) if (nc_ext_list2.stdout | default('')) else [] }}"
  loop_control:
    label: "{{ item.mount_point | default('?') }}"
  when:
    - nextcloud_up
    - item.configuration.datadir is defined
    - item.configuration.datadir.startswith('/external/')
  changed_when: false
