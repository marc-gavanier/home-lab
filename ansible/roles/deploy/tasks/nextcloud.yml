---
- name: nextcloud | Inspect the Nextcloud container
  community.docker.docker_container_info:
    name: nextcloud
  register: nextcloud_info

- name: nextcloud | Determine whether Nextcloud is running
  ansible.builtin.set_fact:
    nextcloud_up: "{{ nextcloud_info.exists and (nextcloud_info.container.State.Running | default(false)) }}"

- name: nextcloud | Report that the Nextcloud configuration was NOT applied
  ansible.builtin.debug:
    msg: >-
      Nextcloud is NOT running, so this deploy configured none of it: cron mode,
      trusted domains, system settings, the files_lock expiry, the productivity
      apps, notify_push and its self-test, and the media external storages
      INCLUDING their read-only flag were all skipped. LibreSign, which gates on
      the same fact, was skipped with them. Nothing failed and nothing changed —
      start the container and re-run this play, or the settings you believe are
      deployed are not.
  when: not nextcloud_up


- name: nextcloud | Wait for Nextcloud to be ready
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ status --output=json
  register: nc_status
  until: nc_status.rc == 0 and (nc_status.stdout | from_json).installed | default(false)
  retries: 30
  delay: 5
  changed_when: false
  check_mode: false
  when: nextcloud_up

- name: nextcloud | Set Nextcloud background jobs to cron mode
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ background:cron
  register: nc_cron
  changed_when: "'set to cron' in nc_cron.stdout"
  when: nextcloud_up

- name: nextcloud | Read Nextcloud system configuration
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:list system --output=json
  register: nc_sysconf
  changed_when: false
  check_mode: false
  when: nextcloud_up

- name: nextcloud | Configure Nextcloud system settings
  ansible.builtin.command:
    cmd: "docker exec -u www-data nextcloud php occ config:system:set {{ item.key }} --type={{ item.type }} --value={{ item.value }}"
  loop:
    - { key: default_phone_region, type: string, value: FR }
    - { key: maintenance_window_start, type: integer, value: "4" }
    - { key: appstoreenabled, type: boolean, value: "false" }
    - { key: log_rotate_size, type: integer, value: "10485760" }
  register: nc_sys_set
  changed_when: true
  when:
    - nextcloud_up
    - (nc_sysconf.stdout | from_json).system[item.key] | default('') | string | lower != item.value | string | lower

- name: nextcloud | Read the files_lock timeout
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:app:get files_lock lock_timeout
  register: nc_lock_timeout
  changed_when: false
  check_mode: false
  failed_when: false
  when: nextcloud_up

- name: nextcloud | Let stale file locks expire (files_lock ships the cron, the default disables it)
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:app:set files_lock lock_timeout --value={{ nextcloud_lock_timeout_minutes }}
  changed_when: true
  when:
    - nextcloud_up
    - nc_lock_timeout.stdout | default('') | trim != nextcloud_lock_timeout_minutes | string

- name: nextcloud | Ensure Nextcloud trusted domains
  ansible.builtin.command:
    cmd: "docker exec -u www-data nextcloud php occ config:system:set trusted_domains {{ item.idx }} --value={{ item.val }}"
  loop:
    - { idx: 0, val: localhost }
    - { idx: 1, val: "drive.{{ domain }}" }
    - { idx: 2, val: nextcloud }
  loop_control:
    label: "{{ item.val }}"
  register: nc_trusted
  changed_when: true
  when:
    - nextcloud_up
    - ((nc_sysconf.stdout | from_json).system.trusted_domains | default([]))[item.idx] | default('') != item.val

- name: nextcloud | Get installed Nextcloud apps
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:list --output=json
  register: nc_app_list
  changed_when: false
  check_mode: false
  when: nextcloud_up

- name: nextcloud | Install Nextcloud productivity apps
  ansible.builtin.command:
    cmd: "docker exec -u www-data nextcloud php occ app:install {{ item }}"
  loop: [calendar, contacts, tasks, bookmarks, gpxpod, external, notify_push]
  when:
    - nextcloud_up
    - item not in (nc_app_list.stdout | default('{}') | from_json).enabled
    - item not in (nc_app_list.stdout | default('{}') | from_json).disabled
  register: nc_app_install
  changed_when: nc_app_install.rc == 0
  failed_when:
    - nc_app_install.rc is defined
    - nc_app_install.rc != 0
    - "'not compatible' not in nc_app_install.stdout"

- name: nextcloud | Restart notify_push to reload Nextcloud config  # noqa: no-handler
  ansible.builtin.command:
    cmd: docker restart nextcloud-notify-push
  changed_when: true
  when:
    - nextcloud_up
    - nc_app_install is changed or nc_sys_set is changed or nc_trusted is changed

- name: nextcloud | Probe notify_push with its self-test
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ notify_push:self-test
  register: nc_push_test
  changed_when: false
  check_mode: false
  failed_when: false
  when: nextcloud_up

- name: nextcloud | Set up notify_push (client real-time updates)
  ansible.builtin.command:
    cmd: "docker exec -u www-data nextcloud php occ notify_push:setup https://drive.{{ domain }}/push"
  register: nc_notify_push
  until: nc_notify_push.rc == 0
  retries: 6
  delay: 10
  changed_when: true
  failed_when: false
  when:
    - nextcloud_up
    - nc_push_test.rc | default(0) != 0

- name: nextcloud | Ensure files_external app is enabled
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:enable files_external
  register: nc_files_external
  changed_when: "'already enabled' not in nc_files_external.stdout"
  when: nextcloud_up

- name: nextcloud | List existing Nextcloud external storages
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ files_external:list --output=json
  register: nc_ext_list
  changed_when: false
  check_mode: false
  when: nextcloud_up

- name: nextcloud | Create media external storages
  ansible.builtin.command:
    cmd: >
      docker exec -u www-data nextcloud php occ files_external:create
      "{{ item.name }}" local null::null -c datadir={{ item.path }}
  loop:
    - { name: Photos, path: /external/photos }
    - { name: Music, path: /external/music }
    - { name: Videos, path: /external/videos }
  when:
    - nextcloud_up
    - item.path not in (nc_ext_list.stdout | default('[]') | from_json | map(attribute='configuration.datadir') | list)
  changed_when: true

- name: nextcloud | Re-list external storages after creation
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ files_external:list --output=json
  register: nc_ext_list2
  changed_when: false
  check_mode: false
  when: nextcloud_up

- name: nextcloud | Refuse an empty external-storage listing
  ansible.builtin.assert:
    that:
      - (nc_ext_list2.stdout | default('')) | length > 0
      - (nc_ext_list2.stdout | from_json) | length > 0
    fail_msg: >-
      Nextcloud is running but `files_external:list` returned no storage, so the
      read-only enforcement and the filesystem_check_changes option below would
      silently apply to nothing.
    success_msg: >-
      {{ (nc_ext_list2.stdout | from_json) | length }} external storage(s) to
      enforce.
    quiet: true
  when: nextcloud_up

- name: nextcloud | Enforce read-only on media external storages
  ansible.builtin.command:
    cmd: >
      docker exec -u www-data nextcloud php occ files_external:option
      {{ item.mount_id }} readonly true
  loop: "{{ (nc_ext_list2.stdout | from_json) if (nc_ext_list2.stdout | default('')) else [] }}"
  loop_control:
    label: "{{ item.mount_point | default('?') }}"
  when:
    - nextcloud_up
    - item.configuration.datadir is defined
    - item.configuration.datadir.startswith('/external/')
    - ((item.options | default({})).readonly | default('0') | string) not in ['1', 'true', 'True']
  changed_when: true

- name: nextcloud | Let media external storages notice out-of-band changes
  ansible.builtin.command:
    cmd: >
      docker exec -u www-data nextcloud php occ files_external:option
      {{ item.mount_id }} filesystem_check_changes 1
  loop: "{{ (nc_ext_list2.stdout | from_json) if (nc_ext_list2.stdout | default('')) else [] }}"
  loop_control:
    label: "{{ item.mount_point | default('?') }}"
  when:
    - nextcloud_up
    - item.configuration.datadir is defined
    - item.configuration.datadir.startswith('/external/')
    - ((item.options | default({})).filesystem_check_changes | default('0') | string) not in ['1', 'true', 'True']
  changed_when: true
