---
- name: transmission | List the running containers this wiring needs
  ansible.builtin.command:
    cmd: docker ps --filter status=running --format '{% raw %}{{.Names}}{% endraw %}'
  register: transmission_running
  changed_when: false
  check_mode: false

- name: transmission | Skip the wiring unless the container is up
  ansible.builtin.set_fact:
    transmission_up: "{{ 'transmission' in transmission_running.stdout_lines }}"

- name: transmission | Report that the port-forwarding state was NOT asserted
  ansible.builtin.debug:
    msg: >-
      Transmission is NOT running, so NAT-PMP/UPnP was left exactly as the
      container last had it rather than turned off. Start it and re-run this
      play.
  when: not transmission_up


- name: transmission | Read the current port-forwarding state
  ansible.builtin.command:
    cmd: >
      docker exec transmission sh -c
      'TR_AUTH="{{ transmission_user | default("admin") }}:$(cat /run/secrets/transmission_password)"
      transmission-remote 127.0.0.1:9091 -ne -si'
  register: transmission_portmap
  changed_when: false
  check_mode: false
  failed_when: false
  when: transmission_up

- name: transmission | Turn NAT-PMP/UPnP off (it asks the Docker gateway, and UFW drops it)
  ansible.builtin.command:
    cmd: >
      docker exec transmission sh -c
      'TR_AUTH="{{ transmission_user | default("admin") }}:$(cat /run/secrets/transmission_password)"
      transmission-remote 127.0.0.1:9091 -ne --no-portmap'
  changed_when: true
  when:
    - transmission_up
    - "'Port forwarding enabled: Yes' in transmission_portmap.stdout | default('')"

- name: transmission | Check whether settings.json exists yet
  ansible.builtin.stat:
    path: "{{ services_data_dir }}/transmission/config/settings.json"
  register: transmission_settings

- name: transmission | Persist it in settings.json so a hard restart cannot revive it
  ansible.builtin.lineinfile:
    path: "{{ services_data_dir }}/transmission/config/settings.json"
    regexp: '^(\s*)"port-forwarding-enabled":\s*true,'
    line: '\1"port-forwarding-enabled": false,'
    backrefs: true
    state: present
  when: transmission_settings.stat.exists
