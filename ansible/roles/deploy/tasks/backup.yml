---
- name: backup | Install restic and sqlite3
  ansible.builtin.apt:
    name:
      - restic
      - sqlite3
    state: present

- name: backup | Create scripts directory
  ansible.builtin.file:
    path: /opt/homelab/scripts
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: backup | Remove the superseded backup script
  ansible.builtin.file:
    path: /opt/homelab/scripts/backup.sh
    state: absent

- name: backup | Template backup environment file (encrypted volume)
  ansible.builtin.template:
    src: backup.env.j2
    dest: /mnt/data/secrets/backup.env
    owner: root
    group: root
    mode: "0600"

- name: backup | Link /opt/homelab/backup.env to the encrypted volume
  ansible.builtin.file:
    src: /mnt/data/secrets/backup.env
    dest: /opt/homelab/backup.env
    state: link
    force: true

- name: backup | Pin services domain in the cloud-init hosts template (persists across reboots)
  ansible.builtin.lineinfile:
    path: /etc/cloud/templates/hosts.debian.tmpl
    line: "{{ homelab_ip }} services.{{ domain }}"
    state: present

- name: backup | Pin services domain in /etc/hosts now (immediate, until next cloud-init run)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ homelab_ip }} services.{{ domain }}"
    state: present

- name: backup | Initialize restic repository
  ansible.builtin.command:
    cmd: restic init
  environment:
    RESTIC_REPOSITORY: "{{ backup_dir }}/restic-repo"
    RESTIC_PASSWORD_FILE: /mnt/data/secrets/restic_password
  register: restic_init
  failed_when: false
  changed_when: "'created restic repository' in restic_init.stdout"

- name: backup | Assert the deployed password actually opens the repository
  ansible.builtin.command:
    cmd: restic --repo {{ backup_dir }}/restic-repo cat config
  environment:
    RESTIC_PASSWORD_FILE: /mnt/data/secrets/restic_password
  register: restic_open
  changed_when: false
  check_mode: false

- name: backup | Fail the deploy if the repository did not open
  ansible.builtin.assert:
    that:
      - restic_open.rc == 0
    fail_msg: >-
      The password now deployed at /mnt/data/secrets/restic_password does NOT
      open {{ backup_dir }}/restic-repo. The nightly backup would fail at 03:00
      and nothing else would have said so. If you are rotating: run
      `restic key add` against the repository FIRST, confirm `key list` shows
      two keys, and only then change restic_password in the vaulted local.yml.
    quiet: true

- name: backup | Create backup systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-backup.service
    mode: "0644"
    content: |
      [Unit]
      Description=Home Lab Restic Backup
      Requires=mnt-data.mount
      After=mnt-data.mount

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/resticprofile --lock-wait 30m -c /opt/homelab/resticprofile.yaml -n homelab backup
      ExecStart=/usr/local/bin/resticprofile --lock-wait 30m -c /opt/homelab/resticprofile.yaml -n homelab copy
      EnvironmentFile=/opt/homelab/backup.env
      Environment=HOME=/root

- name: backup | Create backup systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-backup.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Daily Home Lab Backup at 3 AM

      [Timer]
      OnCalendar=*-*-* 03:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: backup | Enable backup timer
  ansible.builtin.systemd:
    name: homelab-backup.timer
    enabled: true
    state: started
    daemon_reload: true

- name: backup | Remove the superseded local maintenance script
  ansible.builtin.file:
    path: /opt/homelab/scripts/local-maintenance.sh
    state: absent

- name: backup | Create local maintenance systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-local-maintenance.service
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly local restic repo maintenance (prune + check)
      Requires=mnt-data.mount
      After=mnt-data.mount

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/resticprofile --lock-wait 2h -c /opt/homelab/resticprofile.yaml -n homelab prune
      ExecStart=/usr/local/bin/resticprofile --lock-wait 2h -c /opt/homelab/resticprofile.yaml -n homelab check
      EnvironmentFile=/opt/homelab/backup.env
      Environment=HOME=/root

- name: backup | Create local maintenance systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-local-maintenance.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly local restic repo maintenance (Tuesday 01:00)

      [Timer]
      OnCalendar=Tue *-*-* 01:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: backup | Enable local maintenance timer
  ansible.builtin.systemd:
    name: homelab-local-maintenance.timer
    enabled: true
    state: started
    daemon_reload: true
