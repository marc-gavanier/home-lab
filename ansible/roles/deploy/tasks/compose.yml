---
- name: compose | Copy Docker Compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker/compose.yaml"
    dest: /opt/homelab/compose.yaml
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0640"

- name: compose | Ensure the external Docker network exists
  community.docker.docker_network:
    name: proxy
    state: present

- name: compose | Pull images
  community.docker.docker_compose_v2_pull:
    project_src: /opt/homelab
    services: "{{ deploy_services.split() if deploy_services is defined else omit }}"

- name: compose | Check whether the crash-heal timer is installed
  ansible.builtin.stat:
    path: /etc/systemd/system/homelab-stack-heal.timer
  register: compose_heal_timer

- name: compose | Deploy services, with crash-heal suspended
  block:
    - name: compose | Suspend crash-heal for the recreate
      ansible.builtin.systemd:
        name: homelab-stack-heal.timer
        state: stopped
      changed_when: false
      when: compose_heal_timer.stat.exists

    - name: compose | Deploy services
      community.docker.docker_compose_v2:
        project_src: /opt/homelab
        state: present
        services: "{{ deploy_services.split() if deploy_services is defined else omit }}"
      register: compose_result
  always:
    - name: compose | Resume crash-heal
      ansible.builtin.systemd:
        name: homelab-stack-heal.timer
        state: started
      changed_when: false
      when: compose_heal_timer.stat.exists

- name: compose | Show deployment actions
  ansible.builtin.debug:
    var: compose_result.actions
  when: compose_result.actions | default([]) | length > 0

- name: compose | Re-attach dnsproxy if pihole was recreated under it
  ansible.builtin.shell: |
    {% raw %}
    set -o pipefail
    pp=$(docker inspect -f '{{.State.Pid}}' pihole 2>/dev/null) || exit 0
    [ "$pp" != "0" ] || exit 0
    docker inspect dnsproxy >/dev/null 2>&1 || exit 0

    ns_pihole=$(readlink "/proc/$pp/ns/net")
    [ -n "$ns_pihole" ] || { echo "cannot read pihole netns (needs root)" >&2; exit 1; }

    dp=$(docker inspect -f '{{.State.Pid}}' dnsproxy 2>/dev/null)
    if [ "$dp" != "0" ] && [ "$(readlink "/proc/$dp/ns/net")" = "$ns_pihole" ]; then
        exit 0
    fi

    docker compose --project-directory /opt/homelab up -d --force-recreate dnsproxy \
        >/dev/null 2>&1 || exit 1

    np=$(docker inspect -f '{{.State.Pid}}' dnsproxy 2>/dev/null) || exit 1
    [ "$np" != "0" ] || exit 1
    [ "$(readlink "/proc/$np/ns/net")" = "$ns_pihole" ] || exit 1
    echo reattached
    {% endraw %}
  args:
    executable: /bin/bash
  register: dnsproxy_reattach
  changed_when: "'reattached' in dnsproxy_reattach.stdout"
  check_mode: false
