---
# Docker Compose: file, networks, pull, up — via the native compose module
# (real changed detection per container, no stderr grepping). Optional
# targeting: -e '{"deploy_services": "svc1 svc2"}' limits pull/up to those
# services. Use the JSON form whenever there is more than one:
# `-e deploy_services="a b"` looks right, but the shell strips the quotes and
# Ansible's key=value parser then splits on whitespace, so only `a` survives and
# `b` is dropped in silence. The deploy reports success having skipped the very
# service the run was for — measured 2026-07-28, when the nextcloud half of a
# two-service deploy never happened and `compose | Deploy services` said `ok`.
#
# CAVEAT — adding a BRAND-NEW service: targeting may not pull/create a service
# that doesn't exist yet (the image isn't fetched, so `up` skips it silently).
# The first time a new service is introduced, run a FULL deploy (no
# deploy_services) or `docker compose up -d <svc>` on the host once; afterwards
# targeted deploys keep it in sync. (Learned adding cloudflared, ADR-015.)

- name: compose | Copy Docker Compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker/compose.yaml"
    dest: /opt/homelab/compose.yaml
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0640"

# Between the file copy and `up` on purpose: the compose file on the Pi now
# pins wg-easy 15, and starting it on a v14 data directory would bring up no
# tunnel at all. See wg_easy_migrate.yml — self-guarding, so this is a no-op
# once the migration has happened.
- name: "compose | Migrate wg-easy to 15 before anything is started (issue #48)"
  ansible.builtin.import_tasks: wg_easy_migrate.yml

- name: compose | Ensure Docker networks exist
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop:
    - proxy
    - internal

- name: compose | Pull images
  community.docker.docker_compose_v2_pull:
    project_src: /opt/homelab
    services: "{{ deploy_services.split() if deploy_services is defined else omit }}"

- name: compose | Deploy services
  community.docker.docker_compose_v2:
    project_src: /opt/homelab
    state: present
    services: "{{ deploy_services.split() if deploy_services is defined else omit }}"
  register: compose_result

- name: compose | Show deployment actions
  ansible.builtin.debug:
    var: compose_result.actions
  when: compose_result.actions | default([]) | length > 0
