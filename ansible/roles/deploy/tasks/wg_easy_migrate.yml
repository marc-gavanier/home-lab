---
# wg-easy 14 -> 15 migration (issue #48, ADR-020).
#
# Placement matters: this runs AFTER compose.yaml has been copied (so the file
# on the Pi already pins 15.3.0 and the script's `compose up` gets the new
# image) but BEFORE `compose up` runs — otherwise the deploy would start v15 on
# a v14 data directory, where it finds no database, reopens its setup wizard and
# brings up no tunnel at all, with the container still green.
#
# The script is self-guarding and idempotent: it exits immediately once
# wg-easy.db exists, so it costs one process on every subsequent deploy. It
# stages the whole migration on a COPY and verifies the server key and the peer
# set before stopping anything, then rolls back to 14 unattended if the offsite
# link does not come back.

- name: wg_easy_migrate | Install the 14 to 15 migration script
  ansible.builtin.template:
    src: homelab-wg-easy-migrate.sh.j2
    dest: /usr/local/sbin/homelab-wg-easy-migrate.sh
    owner: root
    group: root
    mode: "0700"

# No failed_when: a failure here must stop the deploy. By the time it fails the
# script has already restored 14 and dropped a marker file, so the VPN is up and
# the next deploy will not silently try again.
- name: wg_easy_migrate | Migrate to 15 when the SQLite database is not there yet
  ansible.builtin.command: /usr/local/sbin/homelab-wg-easy-migrate.sh
  register: wg_easy_migration
  changed_when: "'migration complete' in wg_easy_migration.stdout"

- name: wg_easy_migrate | Show what the migration did
  ansible.builtin.debug:
    var: wg_easy_migration.stdout_lines
  when: wg_easy_migration.stdout_lines | default([]) | length > 1
