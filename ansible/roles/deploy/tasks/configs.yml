---
# Service configurations under /opt/homelab/configs.
# docker/configs/ holds ONLY verbatim files (traefik/dynamic); anything
# needing variables lives in this role's templates/ as .j2. Keep it that way:
# copying unrendered Jinja over rendered files made every deploy report
# changes (and fought the SearXNG settings symlink).

- name: configs | Create service configuration directories
  ansible.builtin.file:
    path: /opt/homelab/configs/{{ item }}
    state: directory
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0750"
  loop:
    - traefik/dynamic
    - pihole

- name: configs | Copy Traefik dynamic configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker/configs/traefik/dynamic/"
    dest: /opt/homelab/configs/traefik/dynamic/
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0640"

- name: configs | Template Traefik static config (resolve variables)
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: /opt/homelab/configs/traefik/traefik.yml
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0640"
  notify: Restart traefik

- name: configs | Template Pi-hole split DNS config (resolve variables)
  ansible.builtin.template:
    src: pihole-05-homelab.conf.j2
    dest: /opt/homelab/configs/pihole/05-homelab.conf
    owner: "{{ ansible_user }}"
    group: docker
    mode: "0640"
  notify: Restart pihole

# settings.yml embeds secret_key, so it stays on the encrypted volume — but as a
# file the container bind-mounts directly, NOT as a symlink from a mounted
# directory. That earlier arrangement could not work: Docker mounted
# /opt/homelab/configs/searxng, and a symlink inside a bind-mounted *directory*
# is resolved in the container's namespace, where /mnt/data/secrets does not
# exist. SearXNG therefore saw no settings, wrote a stub with a random
# secret_key over the symlink, and Ansible restored the link on the next run —
# so the real settings never reached the instance (issue #27).
#
# Mode/owner follow the Docker-secret pattern of ADR-016 for the same reason it
# was chosen there: container UIDs are arbitrary (searxng runs as 977), so the
# file has to be world-readable, and the directory it sits in (0710 root:docker)
# is what restricts access. 0640 <user>:docker was unreadable to that UID —
# which is exactly how this surfaced.
- name: configs | Template SearXNG settings (resolve secret_key + base_url)
  ansible.builtin.template:
    src: searxng-settings.yml.j2
    dest: /mnt/data/secrets/docker/searxng_settings
    owner: root
    group: root
    mode: "0444"

- name: configs | Drop the superseded SearXNG settings path and symlink dir
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /mnt/data/secrets/searxng-settings.yml
    - /opt/homelab/configs/searxng
