---
- name: ddns | Install jq (Cloudflare API JSON parsing)
  ansible.builtin.apt:
    name: jq
    state: present

- name: ddns | Copy DDNS script
  ansible.builtin.copy:
    src: cloudflare-ddns.sh
    dest: /opt/homelab/scripts/cloudflare-ddns.sh
    owner: root
    group: root
    mode: "0750"

- name: ddns | Template DDNS environment file (encrypted volume)
  ansible.builtin.template:
    src: ddns.env.j2
    dest: /mnt/data/secrets/ddns.env
    owner: root
    group: root
    mode: "0600"

- name: ddns | Link /opt/homelab/ddns.env to the encrypted volume
  ansible.builtin.file:
    src: /mnt/data/secrets/ddns.env
    dest: /opt/homelab/ddns.env
    state: link
    force: true

- name: ddns | Create DDNS systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-ddns.service
    mode: "0644"
    content: |
      [Unit]
      Description=Home Lab Cloudflare DDNS (keep vpn A record fresh)
      Wants=network-online.target
      After=network-online.target mnt-data.mount
      ConditionPathExists=/mnt/data/secrets/ddns.env

      [Service]
      Type=oneshot
      SuccessExitStatus=1
      ExecStart=/opt/homelab/scripts/cloudflare-ddns.sh
      EnvironmentFile=/opt/homelab/ddns.env

- name: ddns | Create DDNS systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-ddns.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Cloudflare DDNS every 15 minutes

      [Timer]
      OnCalendar=*:0/15
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: ddns | Enable DDNS timer
  ansible.builtin.systemd:
    name: homelab-ddns.timer
    enabled: true
    state: started
    daemon_reload: true

# [critical]: never set `enabled: false` on these units: it wipes the mnt-data.mount link, their only activation path
- name: ddns | Run the DDNS update whenever the encrypted volume mounts  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl add-wants mnt-data.mount homelab-ddns.service
  args:
    creates: /etc/systemd/system/mnt-data.mount.wants/homelab-ddns.service
