---
# [critical]: the root CA must never be generated twice: a second `configure:openssl` makes a new CA and orphans every issued certificate
- name: libresign | Get the installed Nextcloud apps
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:list --output=json
  register: libresign_app_list
  changed_when: false
  check_mode: false
  when: nextcloud_up | default(false)

- name: libresign | Download the LibreSign app when absent
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:install libresign
  register: libresign_app_install
  changed_when: libresign_app_install.rc == 0
  when:
    - nextcloud_up | default(false)
    - "'libresign' not in (libresign_app_list.stdout | default('{}') | from_json).enabled"
    - "'libresign' not in (libresign_app_list.stdout | default('{}') | from_json).disabled"

- name: libresign | Enable the LibreSign app when downloaded but off
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:enable libresign
  register: libresign_app_enable
  changed_when: "'already enabled' not in libresign_app_enable.stdout"
  when:
    - nextcloud_up | default(false)
    - "'libresign' in (libresign_app_list.stdout | default('{}') | from_json).disabled"

- name: libresign | Read the LibreSign application configuration
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:list --output=json
  register: libresign_conf
  changed_when: false
  check_mode: false
  when: nextcloud_up | default(false)

- name: libresign | Extract the paths LibreSign recorded for its binaries
  ansible.builtin.set_fact:
    libresign_cfg: "{{ (libresign_conf.stdout | default('{}') | from_json).apps.libresign | default({}) }}"
  when: nextcloud_up | default(false)

- name: libresign | Check whether the signing binaries are usable
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: >
      java='{{ libresign_cfg.java_path | default('') }}';
      jar='{{ libresign_cfg.jsignpdf_jar_path | default('') }}';
      pdftk='{{ libresign_cfg.pdftk_path | default('') }}';
      [ -n "$java" ] && [ -n "$jar" ] && [ -n "$pdftk" ] || exit 1;
      docker exec -u www-data nextcloud test -f "$jar" || exit 1;
      docker exec -u www-data nextcloud test -f "$pdftk" || exit 1;
      docker exec -u www-data nextcloud "$java" -version >/dev/null 2>&1
  register: libresign_binaries
  changed_when: false
  check_mode: false
  failed_when: false
  when: nextcloud_up | default(false)

- name: libresign | Download the signing binaries (JRE, JSignPdf, pdftk)
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ libresign:install --java --jsignpdf --pdftk
  register: libresign_install
  changed_when: true
  when:
    - nextcloud_up | default(false)
    - libresign_binaries.rc | default(1) != 0

- name: libresign | Re-read the configuration after the download
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:list --output=json
  register: libresign_conf2
  changed_when: false
  check_mode: false
  when:
    - nextcloud_up | default(false)
    - libresign_install is changed

- name: libresign | Refresh the recorded paths
  ansible.builtin.set_fact:
    libresign_cfg: "{{ (libresign_conf2.stdout | from_json).apps.libresign | default({}) }}"
  when:
    - nextcloud_up | default(false)
    - libresign_install is changed

- name: libresign | Check whether a root certificate already exists
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: >
      path='{{ libresign_cfg.config_path | default('') }}';
      [ -n "$path" ] || exit 1;
      docker exec -u www-data nextcloud test -f "$path/ca.pem" || exit 1;
      docker exec -u www-data nextcloud test -f "$path/ca-key.pem"
  register: libresign_ca
  changed_when: false
  check_mode: false
  failed_when: false
  when: nextcloud_up | default(false)

- name: libresign | Refuse to mint the root certificate from empty values
  ansible.builtin.assert:
    that:
      - libresign_cert_cn | default('') | trim | length > 0
      - libresign_cert_o | default('') | trim | length > 0
      - libresign_cert_c | default('') | trim | length > 0
    fail_msg: >-
      One of libresign_cert_cn / _o / _c is empty. The LibreSign root CA is
      generated once and regenerating it orphans every signature already
      issued (ADR-022), so this run stops rather than mint a certificate with
      blank fields. Set them in the vaulted local.yml, or remove the keys
      entirely to inherit the group_vars defaults.
    success_msg: LibreSign certificate identity is present and non-empty.
    quiet: true
  when:
    - nextcloud_up | default(false)
    - libresign_ca.rc | default(1) != 0

- name: libresign | Generate the root certificate (once — see the header)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - www-data
      - nextcloud
      - php
      - occ
      - libresign:configure:openssl
      - "--cn={{ libresign_cert_cn }}"
      - "--o={{ libresign_cert_o }}"
      - "--c={{ libresign_cert_c }}"
  register: libresign_generate
  changed_when: true
  when:
    - nextcloud_up | default(false)
    - libresign_ca.rc | default(1) != 0

- name: libresign | Re-read the configuration after the generation
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:list --output=json
  register: libresign_conf3
  changed_when: false
  check_mode: false
  when:
    - nextcloud_up | default(false)
    - libresign_generate is changed

- name: libresign | Refresh the recorded paths after the generation
  ansible.builtin.set_fact:
    libresign_cfg: "{{ (libresign_conf3.stdout | from_json).apps.libresign | default({}) }}"
  when:
    - nextcloud_up | default(false)
    - libresign_generate is changed

- name: libresign | Re-assert OpenSSL as the certificate engine
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ config:app:set libresign certificate_engine --value=openssl
  register: libresign_engine
  changed_when: true
  when:
    - nextcloud_up | default(false)
    - libresign_cfg.certificate_engine | default('openssl') != 'openssl'

- name: libresign | Verify the JRE LibreSign recorded actually runs
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: >
      java='{{ libresign_cfg.java_path | default('') }}';
      [ -n "$java" ] || exit 1;
      docker exec -u www-data nextcloud "$java" -version
  register: libresign_java_probe
  changed_when: false
  check_mode: false
  failed_when: false
  when: nextcloud_up | default(false)

- name: libresign | Verify LibreSign reports no setup error
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      out=$(docker exec -u www-data nextcloud php occ libresign:configure:check) || exit 1
      status=0
      while IFS= read -r line; do
        if [[ "$line" =~ ^[[:space:]]{1,6}error[[:space:]]{2,} ]]; then
          status=1
        fi
      done <<< "$out"
      exit $status
  register: libresign_check
  changed_when: false
  check_mode: false
  failed_when: false
  when: nextcloud_up | default(false)

- name: libresign | Fail the deploy when the JRE cannot start
  ansible.builtin.fail:
    msg: >-
      LibreSign recorded a java_path but the JVM does not start from it —
      signing would fail with an empty error in the web UI. Check that
      /mnt/data is not mounted noexec, then re-run the download with
      `docker exec -u www-data nextcloud php occ libresign:install --java`
      (ADR-022).
  when:
    - nextcloud_up | default(false)
    - libresign_java_probe.rc | default(0) != 0

- name: libresign | Fail the deploy when LibreSign is not ready to sign
  ansible.builtin.fail:
    msg: >-
      LibreSign reports a setup error. Read the full table with
      `docker exec -u www-data nextcloud php occ libresign:configure:check` —
      the Tip column names the missing piece. A missing root certificate is the
      only one this playbook will not repair on its own, on purpose: it can
      only be generated once (ADR-022).
  when:
    - nextcloud_up | default(false)
    - libresign_check.rc | default(0) != 0
