---
# Host facts + password hashes consumed by the env template.

- name: hashes | Lookup UID/GID of ansible_user
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

# No WireGuard bcrypt block any more: wg-easy 15 takes a plaintext password
# (through the setup API, or INIT_PASSWORD) and hashes it itself with argon2.
# `wg_password` is still the vault variable — it now reaches the Pi through
# /mnt/data/secrets/wg-easy-setup.env instead of a hash in .env (ADR-020).

# --- Vaultwarden admin token (Argon2id, deterministic via fixed salt) ---

- name: hashes | Install python3-argon2 on Pi
  ansible.builtin.apt:
    name: python3-argon2
    state: present

# The token arrives on STDIN, not through `environment:`, since 2026-09-06 —
# same defect and same reasoning as the Pi-hole task in pihole.yml, and it was
# found the same way: by searching the logs for the VALUE rather than for a
# variable name. `T` is not greppable as a secret, which is precisely why it
# survived nine audits.
#
# `stdin:` is a module PARAMETER: it travels in the AnsiballZ payload that
# Ansible writes to a temp file, never on the command line sudo journals. The
# salt stays in `environment:` on purpose — a salt is not a secret, and the
# gate in ops/check-secret-in-environment.py derives its secret set from the
# variables this role asserts, so it does not flag it.
#
# This task runs BEFORE secrets.yml, so unlike Pi-hole it cannot read the value
# from a file: none exists yet at this point in the play.
- name: hashes | Generate Vaultwarden Argon2 hash (deterministic)
  ansible.builtin.command:
    cmd: >-
      python3 -c "import os,sys; from argon2.low_level import hash_secret, Type;
      print(hash_secret(sys.stdin.buffer.read(), bytes.fromhex(os.environ['S']),
      time_cost=3, memory_cost=65540, parallelism=4, hash_len=32, type=Type.ID).decode())"
    stdin: "{{ vaultwarden_admin_token }}"
    stdin_add_newline: false
  environment:
    S: "{{ vaultwarden_admin_salt }}"
  register: vw_hash
  no_log: true
  changed_when: false
  check_mode: false

- name: hashes | Set Vaultwarden Argon2 hash fact
  ansible.builtin.set_fact:
    vaultwarden_admin_token_hash: "{{ vw_hash.stdout }}"
  no_log: true
