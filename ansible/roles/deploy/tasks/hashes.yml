---
- name: hashes | Lookup UID/GID of ansible_user
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: hashes | Install python3-argon2 on Pi
  ansible.builtin.apt:
    name: python3-argon2
    state: present

- name: hashes | Generate Vaultwarden Argon2 hash (deterministic)
  ansible.builtin.command:
    cmd: >-
      python3 -c "import os,sys; from argon2.low_level import hash_secret, Type;
      print(hash_secret(sys.stdin.buffer.read(), bytes.fromhex(os.environ['S']),
      time_cost=3, memory_cost=65540, parallelism=4, hash_len=32, type=Type.ID).decode())"
    stdin: "{{ vaultwarden_admin_token }}"
    stdin_add_newline: false
  environment:
    S: "{{ vaultwarden_admin_salt }}"
  register: vw_hash
  no_log: true
  changed_when: false
  check_mode: false

- name: hashes | Set Vaultwarden Argon2 hash fact
  ansible.builtin.set_fact:
    vaultwarden_admin_token_hash: "{{ vw_hash.stdout }}"
  no_log: true
