---
# Host facts + password hashes consumed by the env template.

- name: hashes | Lookup UID/GID of ansible_user
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

# --- WireGuard password (wg-easy needs bcrypt) ---
# bcrypt salts are random: rehashing every run would rewrite .env every run.
# Keep the deployed hash when it still matches the vault password.

- name: hashes | Install python3-bcrypt on Pi
  ansible.builtin.apt:
    name: python3-bcrypt
    state: present

- name: hashes | Read deployed WireGuard password hash (idempotence)
  ansible.builtin.shell: >-
    grep -oP '(?<=^WG_PASSWORD_HASH=).*' /mnt/data/secrets/homelab.env
    2>/dev/null | sed 's/\$\$/$/g' || true
  register: wg_hash_current
  changed_when: false
  no_log: true

- name: hashes | Generate WireGuard bcrypt hash (stable while the password is unchanged)
  ansible.builtin.command:
    cmd: >-
      python3 -c "import os, bcrypt;
      pwd = os.environ['P'].encode(); cur = os.environ['C'].encode();
      ok = cur.startswith(b'$2') and len(cur) == 60 and bcrypt.checkpw(pwd, cur);
      print(cur.decode() if ok else bcrypt.hashpw(pwd, bcrypt.gensalt()).decode())"
  environment:
    P: "{{ wg_password }}"
    C: "{{ wg_hash_current.stdout | default('') }}"
  register: wg_hash_result
  changed_when: false
  no_log: true

- name: hashes | Set WireGuard password hash fact
  ansible.builtin.set_fact:
    wg_password_hash: "{{ wg_hash_result.stdout }}"

# --- Vaultwarden admin token (Argon2id, deterministic via fixed salt) ---

- name: hashes | Install python3-argon2 on Pi
  ansible.builtin.apt:
    name: python3-argon2
    state: present

- name: hashes | Generate Vaultwarden Argon2 hash (deterministic)
  ansible.builtin.command:
    cmd: python3 -c "import os,sys; from argon2.low_level import hash_secret, Type; print(hash_secret(os.environ['T'].encode(), bytes.fromhex(os.environ['S']), time_cost=3, memory_cost=65540, parallelism=4, hash_len=32, type=Type.ID).decode())"
  environment:
    T: "{{ vaultwarden_admin_token }}"
    S: "{{ vaultwarden_admin_salt }}"
  register: vw_hash
  no_log: true
  changed_when: false

- name: hashes | Set Vaultwarden Argon2 hash fact
  ansible.builtin.set_fact:
    vaultwarden_admin_token_hash: "{{ vw_hash.stdout }}"
  no_log: true
