---
- name: digest | Create the digest working directory
  ansible.builtin.file:
    path: /home/claude/.local/share/feed-digest
    state: directory
    owner: claude
    group: claude
    mode: "0750"

- name: digest | Render the digest prompt
  ansible.builtin.template:
    src: feed-digest-prompt.md.j2
    dest: /home/claude/.local/share/feed-digest/prompt.md
    owner: claude
    group: claude
    mode: "0640"

- name: digest | Render the digest script
  ansible.builtin.template:
    src: feed-digest.sh.j2
    dest: /home/claude/.local/share/feed-digest/digest.sh
    owner: claude
    group: claude
    mode: "0750"

- name: digest | Write the Miniflux API key
  ansible.builtin.copy:
    dest: /mnt/data/secrets/claude/miniflux_api_key
    content: "{{ miniflux_api_key }}"
    owner: claude
    group: claude
    mode: "0400"
  no_log: true
  when: miniflux_api_key | default('') | length > 0

- name: digest | Remove the Miniflux API key when it is not configured
  ansible.builtin.file:
    path: /mnt/data/secrets/claude/miniflux_api_key
    state: absent
  when: miniflux_api_key | default('') | length == 0

- name: digest | Create the digest systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-feed-digest.service
    mode: "0644"
    content: |
      [Unit]
      Description=Daily feed digest (Miniflux -> Claude -> vault)
      After=network-online.target vault-mount.service
      Wants=network-online.target vault-mount.service
      RequiresMountsFor=/mnt/data

      [Service]
      Type=oneshot
      User=claude
      Group=claude
      WorkingDirectory=/home/claude
      Environment=HOME=/home/claude
      SuccessExitStatus=1
      ExecStart=/home/claude/.local/share/feed-digest/digest.sh
      TimeoutStartSec=900

      [Install]
      WantedBy=multi-user.target

- name: digest | Create the digest systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-feed-digest.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Daily feed digest at {{ feed_digest_hour | default('06:30') }}

      [Timer]
      OnCalendar=*-*-* {{ feed_digest_hour | default('06:30') }}:00
      Persistent=true
      RandomizedDelaySec=300

      [Install]
      WantedBy=timers.target
  notify: Restart feed digest timer

- name: digest | Enable the digest timer
  ansible.builtin.systemd_service:
    name: homelab-feed-digest.timer
    enabled: true
    state: started
    daemon_reload: true
