---
- name: Refuse to deploy while the encrypted volume is unmounted
  ansible.builtin.assert:
    that:
      - ansible_mounts is defined
      - ansible_mounts | selectattr('mount', 'equalto', '/mnt/data') | list | length == 1
    fail_msg: >-
      /mnt/data is not mounted — run homelab-unlock on the host first. Deploying
      now would write credentials in clear onto the SD card, under the mount
      point, report ok/changed, and the next unlock would hide them there.
    quiet: true
  tags: always

- name: Install the claude user, sandbox deps and Claude Code
  ansible.builtin.import_tasks: install.yml

- name: Set up the notes vault (rclone on LUKS, mount unit, sandbox)
  ansible.builtin.import_tasks: vault.yml

- name: Mirror custom slash commands and subagents
  ansible.builtin.import_tasks: commands.yml

- name: Install the Remote Control service
  ansible.builtin.import_tasks: remote-control.yml

- name: Install the daily feed digest
  ansible.builtin.import_tasks: digest.yml
