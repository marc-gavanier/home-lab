---
- name: Read whether the encrypted volume is mounted now
  ansible.builtin.command:
    cmd: mountpoint -q /mnt/data
  register: mnt_data_mountpoint
  changed_when: false
  failed_when: false
  check_mode: false
  tags: always

- name: Refuse to deploy while the encrypted volume is unmounted
  ansible.builtin.assert:
    that:
      - mnt_data_mountpoint.rc == 0
    fail_msg: >-
      /mnt/data is not mounted — run homelab-unlock on the host first (on a
      first install, where homelab-unlock does not exist yet, this is expected
      until the storage role has run). Deploying now would write credentials in
      clear onto the SD card, under the mount point, report ok/changed, and the
      next unlock would hide them there.
    quiet: true
  tags: always

- name: Install the claude user, sandbox deps and Claude Code
  ansible.builtin.import_tasks: install.yml

- name: Set up the notes vault (rclone on LUKS, mount unit, sandbox)
  ansible.builtin.import_tasks: vault.yml

- name: Mirror custom slash commands and subagents
  ansible.builtin.import_tasks: commands.yml

- name: Install the Remote Control service
  ansible.builtin.import_tasks: remote-control.yml

- name: Install the daily feed digest
  ansible.builtin.import_tasks: digest.yml
