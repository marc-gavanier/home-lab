---
- name: install | Create the dedicated unprivileged 'claude' user
  ansible.builtin.user:
    name: claude
    shell: /bin/bash
    create_home: true

- name: install | Install sandbox deps (bubblewrap + socat) and rclone
  ansible.builtin.apt:
    name:
      - bubblewrap
      - socat
      - rclone
    state: present

- name: install | Allow bubblewrap user namespaces (AppArmor profile)
  ansible.builtin.copy:
    dest: /etc/apparmor.d/bwrap
    mode: "0644"
    content: |
      abi <abi/4.0>,
      include <tunables/global>

      profile bwrap /usr/bin/bwrap flags=(unconfined) {
        userns,
        include if exists <local/bwrap>
      }
  notify: Reload bwrap AppArmor profile

- name: install | Install Claude Code for the claude user  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: set -o pipefail; curl -fsSL https://claude.ai/install.sh | bash
    executable: /bin/bash
  args:
    creates: /home/claude/.local/bin/claude
  become: true
  become_user: claude
