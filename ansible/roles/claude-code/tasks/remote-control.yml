---
# Claude Code Remote Control (always-on, sandboxed, dedicated user).
# Requires the one-time `claude auth login` as the claude user (see main.yml).
# Pairing: the environment is registered once and persists across restarts, so
# it is listed at claude.ai/code and in the mobile app. The URL is NOT in the
# journal any more — stdout is discarded (see StandardOutput below). To print it
# again: stop the unit, then run the ExecStart command by hand as the claude
# user.

- name: remote-control | Create the Claude Code Remote Control systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/claude-remote-control.service
    mode: "0644"
    content: |
      [Unit]
      Description=Claude Code Remote Control (sandboxed, dedicated user)
      After=network-online.target vault-mount.service
      Wants=network-online.target vault-mount.service
      # Deliberately NOT Requires=vault-mount.service: at boot the rclone mount
      # depends on Traefik/Nextcloud, which take a while to come up. A hard
      # Requires= makes this unit fail with 'dependency' the instant the mount
      # isn't ready yet — and a dependency-job failure stays dead forever (it is
      # NOT covered by Restart=). Instead we soft-want the mount, gate startup on
      # it being present (ExecStartPre), and let Restart=on-failure retry until
      # the mount appears — self-healing across a slow boot.
      StartLimitIntervalSec=0

      [Service]
      Type=simple
      User=claude
      Group=claude
      WorkingDirectory=/home/claude/vault
      Environment=HOME=/home/claude
      # Two distinct ways the vault can be unusable, and they need two gates:
      #
      #  - NOT MOUNTED YET (slow boot): the mount point exists as an empty local
      #    directory, so the WorkingDirectory chdir SUCCEEDS. Without the
      #    /proc/mounts check Claude would happily work in it and write notes to
      #    the SD card instead of Nextcloud. That is what this gate is for.
      #  - STALE ENDPOINT (a stop that could not unmount): the entry IS still in
      #    /proc/mounts, so this gate cannot see it. systemd catches that one
      #    first — the chdir fails with 200/CHDIR (ENOTCONN) before ExecStartPre
      #    ever runs, which is why it looped 8 854 times over 54h on 2026-07-31.
      #    Fixed at the source, in vault-mount.service, which now clears a dead
      #    endpoint before mounting. The readability probe below is belt and
      #    braces for a mount that is listed and connected but unusable.
      ExecStartPre=/bin/sh -c 'grep -q " /home/claude/vault " /proc/mounts && ls -1 /home/claude/vault >/dev/null'
      ExecStart=/home/claude/.local/bin/claude remote-control --name Homelab
      Restart=on-failure
      # 15s meant ~240 journal writes an hour on the SD card while the vault was
      # broken. The retry only has to outlast a slow boot, not be prompt.
      RestartSec=30
      # The CLI repaints its banner on stdout once per second — 300 journal
      # lines a minute, forever, on an SD card. Discard stdout; stderr still
      # reaches the journal, so real failures remain visible.
      StandardOutput=null
      StandardError=journal

      [Install]
      WantedBy=multi-user.target
  notify: Restart Claude Remote Control

- name: remote-control | Check whether the claude user is authenticated
  ansible.builtin.stat:
    path: /home/claude/.claude/.credentials.json
  register: claude_creds

- name: remote-control | Enable Remote Control (started only once claude.ai login is done)
  ansible.builtin.systemd:
    name: claude-remote-control.service
    enabled: true
    state: "{{ 'started' if claude_creds.stat.exists else 'stopped' }}"
    daemon_reload: true
