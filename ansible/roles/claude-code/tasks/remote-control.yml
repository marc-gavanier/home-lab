---
- name: remote-control | Create the Claude Code Remote Control systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/claude-remote-control.service
    mode: "0644"
    content: |
      [Unit]
      Description=Claude Code Remote Control (sandboxed, dedicated user)
      After=network-online.target vault-mount.service
      Wants=network-online.target vault-mount.service
      PartOf=vault-mount.service
      StartLimitIntervalSec=0

      [Service]
      Type=simple
      User=claude
      Group=claude
      WorkingDirectory=/home/claude/vault
      Environment=HOME=/home/claude
      ExecStartPre=/bin/sh -c 'grep -q " /home/claude/vault " /proc/mounts && ls -1 /home/claude/vault >/dev/null'
      ExecStart=/home/claude/.local/bin/claude remote-control --name Homelab
      Restart=on-failure
      RestartSec=30
      StandardOutput=null
      StandardError=journal

      [Install]
      WantedBy=multi-user.target
  notify: Restart Claude Remote Control

- name: remote-control | Check whether the claude user is authenticated
  ansible.builtin.stat:
    path: /home/claude/.claude/.credentials.json
  register: claude_creds

- name: remote-control | Create the vault-mount drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/vault-mount.service.d
    state: directory
    mode: "0755"

- name: remote-control | Pull Remote Control up with the vault mount
  ansible.builtin.copy:
    dest: /etc/systemd/system/vault-mount.service.d/10-remote-control.conf
    mode: "0644"
    content: |
      [Unit]
      Wants=claude-remote-control.service
  when: claude_creds.stat.exists

- name: remote-control | Drop the pull-in while the claude.ai login is not done
  ansible.builtin.file:
    path: /etc/systemd/system/vault-mount.service.d/10-remote-control.conf
    state: absent
  when: not claude_creds.stat.exists

- name: remote-control | Enable Remote Control (started only once claude.ai login is done)
  ansible.builtin.systemd:
    name: claude-remote-control.service
    enabled: true
    state: "{{ 'started' if claude_creds.stat.exists else 'stopped' }}"
    daemon_reload: true
