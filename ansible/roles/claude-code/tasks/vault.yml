---
- name: vault | Pin drive domain in the cloud-init hosts template (persists across reboots)
  ansible.builtin.lineinfile:
    path: /etc/cloud/templates/hosts.debian.tmpl
    regexp: ' drive\.{{ domain | regex_escape }}$'
    line: "{{ homelab_ip }} drive.{{ domain }}"
    state: present

- name: vault | Pin drive domain in /etc/hosts now (immediate, until next cloud-init run)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: ' drive\.{{ domain | regex_escape }}$'
    line: "{{ homelab_ip }} drive.{{ domain }}"
    state: present

- name: vault | Create claude secrets directory on the encrypted volume
  ansible.builtin.file:
    path: /mnt/data/secrets/claude
    state: directory
    owner: claude
    group: claude
    mode: "0700"

- name: vault | Check the deployed rclone remote against the vault
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      IFS= read -r P || true;
      [ -n "$P" ] || { echo REMOTE_DIFF; exit 0; };
      cur=$(rclone config dump 2>/dev/null | python3 -c
      'import json,sys; r=json.load(sys.stdin).get("nextcloud",{});
      print(r.get("url","")); print(r.get("pass",""))');
      url=$(echo "$cur" | sed -n 1p); obscured=$(echo "$cur" | sed -n 2p);
      [ "$url" = "$U" ] || { echo REMOTE_DIFF; exit 0; };
      [ -n "$obscured" ] && [ "$(rclone reveal "$obscured" 2>/dev/null)" = "$P" ]
      && echo REMOTE_MATCH || echo REMOTE_DIFF
    executable: /bin/bash
    stdin: "{{ rclone_webdav_pass }}"
  become: true
  become_user: claude
  environment:
    RCLONE_CONFIG: /mnt/data/secrets/claude/rclone.conf
    U: "https://drive.{{ domain }}/remote.php/dav/files/admin/"
  register: rclone_remote_check
  changed_when: false
  check_mode: false
  failed_when: false
  no_log: true

- name: vault | Obscure the WebDAV password without it reaching a command line
  ansible.builtin.command:
    cmd: rclone obscure -
    stdin: "{{ rclone_webdav_pass }}"
    stdin_add_newline: false
  become: true
  become_user: claude
  register: rclone_obscured_pass
  changed_when: false
  check_mode: false
  failed_when: rclone_obscured_pass.rc != 0 or rclone_obscured_pass.stdout | length == 0
  no_log: true
  when: "'REMOTE_MATCH' not in rclone_remote_check.stdout | default('')"

- name: vault | Configure rclone WebDAV remote for the claude user
  ansible.builtin.copy:
    dest: /mnt/data/secrets/claude/rclone.conf
    owner: claude
    group: claude
    mode: "0600"
    content: |
      [nextcloud]
      type = webdav
      url = https://drive.{{ domain }}/remote.php/dav/files/admin/
      vendor = nextcloud
      user = admin
      pass = {{ rclone_obscured_pass.stdout }}
  no_log: true
  when: "'REMOTE_MATCH' not in rclone_remote_check.stdout | default('')"
  notify:
    - Restart vault mount

- name: vault | Remove legacy rclone config from the SD card
  ansible.builtin.file:
    path: /home/claude/.config/rclone/rclone.conf
    state: absent

- name: vault | Check if the vault is already mounted
  ansible.builtin.command: grep -q ' /home/claude/vault ' /proc/mounts
  register: vault_mounted
  failed_when: false
  changed_when: false
  check_mode: false

- name: vault | Create the vault mount point (claude-only)
  ansible.builtin.file:
    path: /home/claude/vault
    state: directory
    owner: claude
    group: claude
    mode: "0700"
  when: vault_mounted.rc != 0

- name: vault | Create the claude state directories on the encrypted volume
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: claude
    group: claude
    mode: "0700"
  loop:
    - /mnt/data/claude
    - /mnt/data/claude/dot-claude
    - /mnt/data/claude/rclone-cache

- name: vault | Refuse to hide Claude state left on the SD card under the mount
  ansible.builtin.shell:
    cmd: >-
      mountpoint -q /home/claude/.claude
      || [ ! -d /home/claude/.claude ]
      || [ -z "$(ls -A /home/claude/.claude)" ]
    executable: /bin/bash
  register: claude_state_on_sd
  changed_when: false
  failed_when: false
  check_mode: false

- name: vault | Stop when /home/claude/.claude still holds data on the SD card
  ansible.builtin.assert:
    that:
      - claude_state_on_sd.rc == 0
    fail_msg: >-
      /home/claude/.claude holds files on the SD card. Mounting the encrypted store
      over it would hide the claude.ai login and every session. Stop
      claude-remote-control, copy the directory into /mnt/data/claude/dot-claude
      with cp -a, empty it, then deploy again.
    quiet: true

- name: vault | Claude state store on the encrypted volume (mount unit)
  ansible.builtin.copy:
    dest: /etc/systemd/system/home-claude-.claude.mount
    mode: "0644"
    content: |
      [Unit]
      Description=Claude Code state on the encrypted volume
      Requires=mnt-data.mount
      After=mnt-data.mount

      [Mount]
      What=/mnt/data/claude/dot-claude
      Where=/home/claude/.claude
      Type=none
      Options=bind

- name: vault | Mount the claude state store whenever the encrypted volume mounts  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl add-wants mnt-data.mount home-claude-.claude.mount
  args:
    creates: /etc/systemd/system/mnt-data.mount.wants/home-claude-.claude.mount

- name: vault | Mount the claude state store now
  ansible.builtin.systemd:
    name: home-claude-.claude.mount
    state: started
    daemon_reload: true

- name: vault | Remove the legacy rclone write cache from the SD card
  ansible.builtin.file:
    path: /home/claude/.cache/rclone
    state: absent

- name: vault | Deploy Claude Code sandbox settings
  ansible.builtin.copy:
    dest: /home/claude/.claude/settings.json
    owner: claude
    group: claude
    mode: "0644"
    content: |
      {
        "sandbox": {
          "enabled": true,
          "failIfUnavailable": true,
          "filesystem": {
            "allowWrite": ["/home/claude/vault"],
            "denyRead": [
              "/home/claude/.claude/.credentials.json",
              "/mnt/data/secrets"
            ]
          },
          "network": {
            "allowedDomains": ["api.anthropic.com"]
          }
        }
      }

- name: vault | Create the rclone vault mount systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/vault-mount.service
    mode: "0644"
    content: |
      [Unit]
      Description=rclone mount of the Nextcloud Notes vault
      After=network-online.target mnt-data.mount homelab-stack-startup.service
      Wants=network-online.target
      RequiresMountsFor=/mnt/data /home/claude/.claude
      StartLimitIntervalSec=600
      StartLimitBurst=5

      [Service]
      Type=notify
      User=claude
      Group=claude
      Environment=RCLONE_CONFIG=/mnt/data/secrets/claude/rclone.conf
      ExecStartPre=-/bin/fusermount -uz /home/claude/vault
      ExecStart=/usr/bin/rclone mount nextcloud:Notes /home/claude/vault \
        --vfs-cache-mode writes --vfs-write-back 2s --dir-cache-time 30s \
        --cache-dir /mnt/data/claude/rclone-cache
      ExecStop=/bin/sh -c '/bin/fusermount -u /home/claude/vault || /bin/fusermount -uz /home/claude/vault'
      Restart=on-failure
      RestartSec=10
  notify:
    - Restart vault mount
    - Restart Claude Remote Control

- name: vault | Start the vault mount whenever the encrypted volume mounts  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl add-wants mnt-data.mount vault-mount.service
  args:
    creates: /etc/systemd/system/mnt-data.mount.wants/vault-mount.service

- name: vault | Start the vault mount (boot-time start comes from mnt-data.mount)
  ansible.builtin.systemd:
    name: vault-mount.service
    state: started
    daemon_reload: true
