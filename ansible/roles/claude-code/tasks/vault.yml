---
- name: vault | Drop the drive pin from the cloud-init hosts template
  ansible.builtin.lineinfile:
    path: /etc/cloud/templates/hosts.debian.tmpl
    regexp: ' drive\.{{ domain | regex_escape }}$'
    state: absent

- name: vault | Drop the drive pin from /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: ' drive\.{{ domain | regex_escape }}$'
    state: absent

- name: vault | Create claude secrets directory on the encrypted volume
  ansible.builtin.file:
    path: /mnt/data/secrets/claude
    state: directory
    owner: claude
    group: claude
    mode: "0700"

- name: vault | Install the ACL tools
  ansible.builtin.apt:
    name: acl
    state: present

- name: vault | Let claude and Nextcloud both write the notes directory
  ansible.posix.acl:
    path: "{{ notes_dir }}"
    entity: "{{ item.entity }}"
    etype: "{{ item.etype }}"
    permissions: "{{ item.perms }}"
    default: "{{ item.default }}"
    state: present
  loop:
    - { etype: user, entity: claude, perms: rwx, default: false }
    - { etype: user, entity: claude, perms: rwx, default: true }
    - { etype: user, entity: "33", perms: rwx, default: true }
    - { etype: other, entity: "", perms: "---", default: true }
  loop_control:
    label: "{{ 'default ' if item.default else '' }}{{ item.etype }}:{{ item.entity }}"

- name: vault | Look for the rclone vault mount unit
  ansible.builtin.stat:
    path: /etc/systemd/system/vault-mount.service
  register: vault_mount_unit

- name: vault | Stop the rclone vault mount
  ansible.builtin.systemd:
    name: vault-mount.service
    state: stopped
    enabled: false
  when: vault_mount_unit.stat.exists

- name: vault | Remove the rclone vault mount units and state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/mnt-data.mount.wants/vault-mount.service
    - /etc/systemd/system/vault-mount.service.d
    - /etc/systemd/system/vault-mount.service
    - /mnt/data/secrets/claude/rclone.conf
    - /mnt/data/claude/rclone-cache
    - /home/claude/.config/rclone/rclone.conf
    - /home/claude/.cache/rclone

- name: vault | Check if the vault is already mounted
  ansible.builtin.command: grep -q ' /home/claude/vault ' /proc/mounts
  register: vault_mounted
  failed_when: false
  changed_when: false
  check_mode: false

- name: vault | Create the vault mount point (claude-only)
  ansible.builtin.file:
    path: /home/claude/vault
    state: directory
    owner: claude
    group: claude
    mode: "0700"
  when: vault_mounted.rc != 0

- name: vault | Create the claude state directories on the encrypted volume
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: claude
    group: claude
    mode: "0700"
  loop:
    - /mnt/data/claude
    - /mnt/data/claude/dot-claude

- name: vault | Refuse to hide Claude state left on the SD card under the mount
  ansible.builtin.shell:
    cmd: >-
      mountpoint -q /home/claude/.claude
      || [ ! -d /home/claude/.claude ]
      || [ -z "$(ls -A /home/claude/.claude)" ]
    executable: /bin/bash
  register: claude_state_on_sd
  changed_when: false
  failed_when: false
  check_mode: false

- name: vault | Stop when /home/claude/.claude still holds data on the SD card
  ansible.builtin.assert:
    that:
      - claude_state_on_sd.rc == 0
    fail_msg: >-
      /home/claude/.claude holds files on the SD card. Mounting the encrypted store
      over it would hide the claude.ai login and every session. Stop
      claude-remote-control, copy the directory into /mnt/data/claude/dot-claude
      with cp -a, empty it, then deploy again.
    quiet: true

- name: vault | Claude state store on the encrypted volume (mount unit)
  ansible.builtin.copy:
    dest: /etc/systemd/system/home-claude-.claude.mount
    mode: "0644"
    content: |
      [Unit]
      Description=Claude Code state on the encrypted volume
      Requires=mnt-data.mount
      After=mnt-data.mount

      [Mount]
      What=/mnt/data/claude/dot-claude
      Where=/home/claude/.claude
      Type=none
      Options=bind

- name: vault | Mount the claude state store whenever the encrypted volume mounts  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl add-wants mnt-data.mount home-claude-.claude.mount
  args:
    creates: /etc/systemd/system/mnt-data.mount.wants/home-claude-.claude.mount

- name: vault | Mount the claude state store now
  ansible.builtin.systemd:
    name: home-claude-.claude.mount
    state: started
    daemon_reload: true

- name: vault | Deploy Claude Code sandbox settings
  ansible.builtin.copy:
    dest: /home/claude/.claude/settings.json
    owner: claude
    group: claude
    mode: "0644"
    content: |
      {
        "env": {
          "DISABLE_ERROR_REPORTING": "1"
        },
        "sandbox": {
          "enabled": true,
          "failIfUnavailable": true,
          "filesystem": {
            "allowWrite": ["/home/claude/vault"],
            "denyRead": [
              "/home/claude/.claude/.credentials.json",
              "/mnt/data/secrets"
            ]
          },
          "network": {
            "allowedDomains": ["api.anthropic.com"]
          }
        }
      }

- name: vault | Bind the notes directory onto the vault (mount unit)
  ansible.builtin.copy:
    dest: /etc/systemd/system/home-claude-vault.mount
    mode: "0644"
    content: |
      [Unit]
      Description=Notes vault (Nextcloud Notes external storage) for Claude Code
      Requires=mnt-data.mount
      After=mnt-data.mount

      [Mount]
      What={{ notes_dir }}
      Where=/home/claude/vault
      Type=none
      Options=bind

- name: vault | Mount the vault whenever the encrypted volume mounts  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl add-wants mnt-data.mount home-claude-vault.mount
  args:
    creates: /etc/systemd/system/mnt-data.mount.wants/home-claude-vault.mount

- name: vault | Mount the vault now
  ansible.builtin.systemd:
    name: home-claude-vault.mount
    state: started
    daemon_reload: true
