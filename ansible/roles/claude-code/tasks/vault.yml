---
# Notes vault: rclone WebDAV remote (secrets on LUKS), FUSE mount unit,
# sandbox settings confining Claude to the vault.

# rclone runs on the HOST as `claude`; it must resolve drive.<domain> to the Pi's
# LAN IP, NOT the public IP. Resolving to the public IP hairpins through NAT and
# arrives at Traefik with an EXTERNAL source IP, which the global `vpn-only`
# ipAllowList rejects with 403 — breaking the mount and thus Remote Control.
#
# This host is cloud-init managed (manage_etc_hosts: True), so cloud-init
# REGENERATES /etc/hosts from a template on every boot, wiping a plain lineinfile
# pin. We therefore pin in TWO places:
#   1. the cloud-init template  -> survives reboots (cloud-init rewrites from it)
#   2. /etc/hosts directly       -> takes effect immediately, without a reboot
- name: vault | Pin drive domain in the cloud-init hosts template (persists across reboots)
  ansible.builtin.lineinfile:
    path: /etc/cloud/templates/hosts.debian.tmpl
    line: "{{ homelab_ip }} drive.{{ domain }}"
    state: present

- name: vault | Pin drive domain in /etc/hosts now (immediate, until next cloud-init run)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ homelab_ip }} drive.{{ domain }}"
    state: present

# The rclone config holds the (reversibly obscured) WebDAV app-password —
# it lives on the encrypted volume, never on the SD card.
- name: vault | Create claude secrets directory on the encrypted volume
  ansible.builtin.file:
    path: /mnt/data/secrets/claude
    state: directory
    owner: claude
    group: claude
    mode: "0700"

# Idempotence: `rclone config create` re-obscures the password with a fresh
# nonce on every run (file changes even when nothing did). Reveal the deployed
# password and compare before recreating.
- name: vault | Check the deployed rclone remote against the vault
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      cur=$(rclone config dump 2>/dev/null | python3 -c
      'import json,sys; r=json.load(sys.stdin).get("nextcloud",{});
      print(r.get("url","")); print(r.get("pass",""))');
      url=$(echo "$cur" | sed -n 1p); obscured=$(echo "$cur" | sed -n 2p);
      [ "$url" = "$U" ] || { echo REMOTE_DIFF; exit 0; };
      [ -n "$obscured" ] && [ "$(rclone reveal "$obscured" 2>/dev/null)" = "$P" ]
      && echo REMOTE_MATCH || echo REMOTE_DIFF
    executable: /bin/bash
  become: true
  become_user: claude
  environment:
    RCLONE_CONFIG: /mnt/data/secrets/claude/rclone.conf
    U: "https://drive.{{ domain }}/remote.php/dav/files/admin/"
    P: "{{ rclone_webdav_pass }}"
  register: rclone_remote_check
  changed_when: false
  check_mode: false
  failed_when: false
  no_log: true

# `rclone config create` put the cleartext app-password in the argv of a process
# on a /proc with no hidepid — while the probe ELEVEN LINES ABOVE passes the same
# value through `environment:`, which is the form the rest of this repository
# settled on in #177 and #188. `no_log: true` hides it from Ansible's output and
# not from /proc, which is exactly what made this read as safe.
#
# The guard made it worse rather than narrower: the probe carries
# `failed_when: false`, so a probe that fails registers rc != 0 with an empty
# stdout, and `'REMOTE_MATCH' not in ''` is TRUE. The guard opens on failure
# instead of closing.
#
# So the password is now obscured through STDIN — verified on the host, `rclone
# obscure -` reads standard input — and the config file, five lines of INI, is
# written by Ansible over the SSH transport, where no command line is involved.
#
# What this does NOT fix, stated rather than left to be rediscovered: the probe
# above still passes the OBSCURED value on a command line. rclone's own help
# calls obscuring "not a secure way of encrypting", so that string is equivalent
# to the password. It is the same string this task writes into the 0600 file on
# the encrypted volume, and taking it out of argv needs a `reveal` that reads
# stdin — measured on this host, `rclone reveal` has no such form.
- name: vault | Obscure the WebDAV password without it reaching a command line
  ansible.builtin.command:
    cmd: rclone obscure -
    stdin: "{{ rclone_webdav_pass }}"
    stdin_add_newline: false
  become: true
  become_user: claude
  register: rclone_obscured_pass
  changed_when: false
  check_mode: false
  no_log: true
  when: "'REMOTE_MATCH' not in rclone_remote_check.stdout | default('')"

- name: vault | Configure rclone WebDAV remote for the claude user
  ansible.builtin.copy:
    dest: /mnt/data/secrets/claude/rclone.conf
    owner: claude
    group: claude
    mode: "0600"
    content: |
      # Managed by Ansible — do not edit on the host.
      [nextcloud]
      type = webdav
      url = https://drive.{{ domain }}/remote.php/dav/files/admin/
      vendor = nextcloud
      user = admin
      pass = {{ rclone_obscured_pass.stdout }}
  no_log: true
  when: "'REMOTE_MATCH' not in rclone_remote_check.stdout | default('')"

- name: vault | Remove legacy rclone config from the SD card
  ansible.builtin.file:
    path: /home/claude/.config/rclone/rclone.conf
    state: absent

# A FUSE rclone mount owned by `claude` (no allow_other) is unreadable by root,
# so `mountpoint`/`stat` fail. Detect it via /proc/mounts instead, and only
# create the directory when it is NOT mounted (the module can't touch a live mount).
- name: vault | Check if the vault is already mounted
  ansible.builtin.command: grep -q ' /home/claude/vault ' /proc/mounts
  register: vault_mounted
  failed_when: false
  changed_when: false
  check_mode: false

- name: vault | Create the vault mount point (claude-only)
  ansible.builtin.file:
    path: /home/claude/vault
    state: directory
    owner: claude
    group: claude
    mode: "0700"
  when: vault_mounted.rc != 0

# denyRead is an enumeration, and ADR-004 described it as a policy — "credential
# reads are denied" — while exactly one path was listed (#203, #219). Two files
# the `claude` account owns sat outside it: its rclone configuration (0600) and
# the Miniflux API key (0400), both under the secrets directory. Owned by that
# account means the sandbox is the only thing that could have stopped a read.
#
# The DIRECTORY is denied rather than the two files, so a third secret added
# there tomorrow is covered without anyone remembering this list — the same
# reasoning as #217, where a hand-maintained enumeration kept producing an nth
# entry.
#
# Nothing outside the sandbox is affected: the vault mount and the feed digest
# both read these files from systemd units running as `claude`, not through
# Claude Code's Bash tool. Verified after deploying.
- name: vault | Deploy Claude Code sandbox settings
  ansible.builtin.copy:
    dest: /home/claude/.claude/settings.json
    owner: claude
    group: claude
    mode: "0644"
    content: |
      {
        "sandbox": {
          "enabled": true,
          "failIfUnavailable": true,
          "filesystem": {
            "allowWrite": ["/home/claude/vault"],
            "denyRead": [
              "/home/claude/.claude/.credentials.json",
              "/mnt/data/secrets"
            ]
          },
          "network": {
            "allowedDomains": ["api.anthropic.com"]
          }
        }
      }

- name: vault | Create the rclone vault mount systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/vault-mount.service
    mode: "0644"
    content: |
      [Unit]
      Description=rclone mount of the Nextcloud Notes vault
      After=network-online.target mnt-data.mount
      Wants=network-online.target
      # Config on /mnt/data (secrets never on the SD card): started by
      # mnt-data.mount (add-wants below), not at boot.
      RequiresMountsFor=/mnt/data

      [Service]
      Type=notify
      User=claude
      Group=claude
      Environment=RCLONE_CONFIG=/mnt/data/secrets/claude/rclone.conf
      # When a stop could not unmount, the dead endpoint stays in /proc/mounts
      # and rclone then refuses to start: "directory already mounted". Nothing
      # ever cleared it, so the restart loop could not converge — Remote Control
      # was down from 2026-07-31 06:39 until it was unmounted by hand. Clear a
      # stale endpoint before every start; '-' so a clean start is not a failure.
      # (--allow-non-empty is NOT the fix: it mounts over the dead endpoint.)
      ExecStartPre=-/bin/fusermount -uz /home/claude/vault
      ExecStart=/usr/bin/rclone mount nextcloud:Notes /home/claude/vault \
        --vfs-cache-mode writes --vfs-write-back 2s --dir-cache-time 30s
      # A plain -u fails with EBUSY whenever a process sits inside the mount, and
      # one always does: claude-remote-control holds its working directory there.
      # An unattended-upgrades systemd restart is enough to hit it. Fall back to a
      # lazy unmount so stopping always leaves a clean mount table.
      ExecStop=/bin/sh -c '/bin/fusermount -u /home/claude/vault || /bin/fusermount -uz /home/claude/vault'
      Restart=on-failure
      RestartSec=10
  notify:
    # Remote Control too: its working directory lives inside this mount, so a
    # replaced mount leaves the running process on a dead one.
    - Restart vault mount
    - Restart Claude Remote Control

# noqa command-instead-of-module: the systemd module cannot manage add-wants links.
- name: vault | Start the vault mount whenever the encrypted volume mounts  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl add-wants mnt-data.mount vault-mount.service
  args:
    creates: /etc/systemd/system/mnt-data.mount.wants/vault-mount.service

- name: vault | Start the vault mount (boot-time start comes from mnt-data.mount)
  ansible.builtin.systemd:
    name: vault-mount.service
    state: started
    daemon_reload: true
