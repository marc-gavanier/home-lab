---
- name: commands | Install custom slash commands for the claude user
  ansible.builtin.copy:
    src: commands/
    dest: /home/claude/.claude/commands/
    owner: claude
    group: claude
    mode: "0644"
    directory_mode: "0755"

- name: commands | Install custom subagents for the claude user
  ansible.builtin.copy:
    src: agents/
    dest: /home/claude/.claude/agents/
    owner: claude
    group: claude
    mode: "0644"
    directory_mode: "0755"

- name: commands | Resolve the repo's command and agent inventories once
  ansible.builtin.set_fact:
    repo_commands: "{{ query('ansible.builtin.fileglob', 'commands/*.md') | map('basename') | list }}"
    repo_agents: "{{ query('ansible.builtin.fileglob', 'agents/*.md') | map('basename') | list }}"

- name: commands | Refuse to purge against an empty inventory
  ansible.builtin.assert:
    that:
      - repo_commands | length > 0
      - repo_agents | length > 0
    fail_msg: >-
      fileglob resolved to an empty list ({{ repo_commands | length }} commands,
      {{ repo_agents | length }} agents). It returns [] rather than failing when
      its search path misses, and the purge tasks below would read that as "the
      repo has nothing" and delete every file on the host. Refusing.

- name: commands | List slash commands currently on the host
  ansible.builtin.find:
    paths: /home/claude/.claude/commands
    patterns: "*.md"
  register: host_commands

- name: commands | Purge slash commands no longer in the repo
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  # floor: none needed — this is a PURGE. An empty find means there is nothing
  loop: "{{ host_commands.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: item.path | basename not in repo_commands

- name: commands | List subagents currently on the host
  ansible.builtin.find:
    paths: /home/claude/.claude/agents
    patterns: "*.md"
  register: host_agents

- name: commands | Purge subagents no longer in the repo
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  # floor: none needed — a PURGE, as above. Nothing found means nothing to remove.
  loop: "{{ host_agents.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: item.path | basename not in repo_agents
