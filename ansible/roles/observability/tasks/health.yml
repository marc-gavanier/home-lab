---
- name: health | Install the Pi host health-report script
  ansible.builtin.template:
    src: homelab-health.sh.j2
    dest: /usr/local/bin/homelab-health.sh
    mode: "0750"

- name: health | Remove the state files the goss migration orphaned
  ansible.builtin.file:
    path: "/var/lib/homelab-health/{{ item }}"
    state: absent
  loop:
    - nrestarts
    - autorestart
    - inactive
    - flapping
    - dns.stamp
    - security-pending.stamp

- name: health | Install the health-report service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - homelab-health.service
    - homelab-health.timer

- name: health | Enable the health-report timer
  ansible.builtin.systemd:
    name: homelab-health.timer
    enabled: true
    state: started
    daemon_reload: true
