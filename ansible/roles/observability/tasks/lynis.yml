---
# Weekly lynis audit -> Uptime Kuma push, reporting the hardening index and the
# warning count (DOWN below the floor, or on any regression from the best index
# ever recorded). Reuses the same Kuma-push idiom as the Pi health monitor.
#
# This file used to claim "nothing scheduled it". The machine said otherwise:
# the DISTRIBUTION ships its own lynis.timer, enabled, OnCalendar=daily, and it
# had been running every day — 14 runs in 14 days, 5 min 45 s of CPU each. Two
# consequences, and the second is the one that mattered:
#   - roughly 40 minutes of CPU a week on a Pi, for a report nobody reads;
#   - it kept /var/log/lynis-report.dat permanently fresh, which is what made
#     the report script's only guard unable to fire. See the freshness check in
#     homelab-lynis-report.sh.j2.
# So the redundant daily run is masked here, at the source. Our weekly run is
# the one with a reporting path attached to it.

- name: lynis | Look for the distribution's own timer
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/lynis.timer
  register: lynis_distro_timer

# Guarded on the unit actually existing rather than swallowed with
# `failed_when: false` — a task that cannot fail is the very defect this change
# is fixing, and it would be absurd to introduce one here.
- name: lynis | Stop and disable the distribution's daily timer
  ansible.builtin.systemd:
    name: lynis.timer
    enabled: false
    state: stopped
  when: lynis_distro_timer.stat.exists

# Masked in a SEPARATE task, after the stop, and the order is the entire point.
# Combining `masked: true` with `state: stopped` in one task produces the
# equivalent of `systemctl mask --now`: the fragment becomes /dev/null, systemd
# can no longer load the unit it is being asked to stop, and it records it as
# FAILED. The timer is correctly dead either way, but `systemctl --failed` stops
# being empty — and that is the first thing a human scans, besides being a
# signal several checks here read.
#
# Both orders measured on the host on 2026-08-16:
#   mask --now      -> ActiveState=failed,   one entry in --failed
#   stop, then mask -> ActiveState=inactive, --failed empty
#
# Masked rather than merely disabled so a package update cannot quietly put the
# daily run back.
- name: lynis | Mask it so a package update cannot re-enable it
  ansible.builtin.systemd:
    name: lynis.timer
    masked: true
  when: lynis_distro_timer.stat.exists

- name: lynis | Install the lynis report script
  ansible.builtin.template:
    src: homelab-lynis-report.sh.j2
    dest: /usr/local/bin/homelab-lynis-report.sh
    mode: "0750"

- name: lynis | Install the lynis audit service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - homelab-lynis.service
    - homelab-lynis.timer

- name: lynis | Enable the weekly lynis timer
  ansible.builtin.systemd:
    name: homelab-lynis.timer
    enabled: true
    state: started
    daemon_reload: true
