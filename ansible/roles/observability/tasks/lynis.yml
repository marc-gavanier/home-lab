---
- name: lynis | Skip the pending-security-update test, which Pi pending action owns with a 48 h grace
  ansible.builtin.copy:
    content: "skip-test=PKGS-7392\n"
    dest: /etc/lynis/custom.prf
    owner: root
    group: root
    mode: "0644"

- name: lynis | Install the lynis report script
  ansible.builtin.template:
    src: homelab-lynis-report.sh.j2
    dest: /usr/local/bin/homelab-lynis-report.sh
    mode: "0750"

- name: lynis | Install the lynis audit service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - homelab-lynis.service
    - homelab-lynis.timer

- name: lynis | Enable the weekly lynis timer
  ansible.builtin.systemd:
    name: homelab-lynis.timer
    enabled: true
    state: started
    daemon_reload: true
