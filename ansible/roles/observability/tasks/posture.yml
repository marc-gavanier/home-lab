---
# Container security posture -> its own Uptime Kuma push monitor.
#
# Separate from the health report on purpose: a drifted capability or a rootfs
# that went back to writable is not an outage, and folding it into the signal
# that carries temperature and disk alerts would bury it. Daily cadence, since
# posture only changes when a container is recreated (issue #33).
#
# The script is generated from docker/compose.yaml, so the expected values
# cannot drift from the file they check.

- name: posture | Install the container posture-check script
  ansible.builtin.template:
    src: homelab-posture.sh.j2
    dest: /usr/local/bin/homelab-posture.sh
    mode: "0750"

- name: posture | Install the posture-check service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - homelab-posture.service
    - homelab-posture.timer

- name: posture | Enable the posture-check timer
  ansible.builtin.systemd:
    name: homelab-posture.timer
    enabled: true
    state: started
    daemon_reload: true
