---
- name: goss-install | Read the installed version, if any
  ansible.builtin.command: goss --version
  register: goss_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: goss-install | Install the pinned release
  when: goss_version not in (goss_installed.stdout | default(''))
  block:
    - name: goss-install | Download the release archive
      ansible.builtin.get_url:
        url: "{{ goss_release_url }}/{{ goss_archive }}"
        dest: /tmp/goss.tar.gz
        checksum: "sha256:{{ goss_sha256 }}"
        mode: "0600"
      vars:
        goss_release_url: >-
          https://github.com/goss-org/goss/releases/download/v{{ goss_version }}
        goss_archive: >-
          goss_{{ goss_version }}_linux_arm64.tar.gz

    - name: goss-install | Unpack the binary
      ansible.builtin.unarchive:
        src: /tmp/goss.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include:
          - goss
        owner: root
        group: root
        mode: "0755"

  always:
    - name: goss-install | Remove the downloaded archive
      ansible.builtin.file:
        path: /tmp/goss.tar.gz
        state: absent

- name: goss-install | Create the spec directory
  ansible.builtin.file:
    path: /etc/goss
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: always
