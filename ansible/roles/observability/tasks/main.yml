---
- name: Install the shared persistence gate
  ansible.builtin.import_tasks: gate.yml

- name: Read whether the encrypted volume is mounted now
  ansible.builtin.command:
    cmd: mountpoint -q /mnt/data
  register: mnt_data_mountpoint
  changed_when: false
  failed_when: false
  check_mode: false

- name: Refuse to write the push tokens while the encrypted volume is unmounted
  ansible.builtin.assert:
    that:
      - mnt_data_mountpoint.rc == 0
    fail_msg: >-
      /mnt/data is not mounted — run homelab-unlock on the host first (on a
      first install, this is expected until the storage role has run). Writing
      now would leave the Kuma push tokens in clear on the SD card, under the
      mount point.
    quiet: true

- name: Keep the Kuma push tokens on the encrypted volume (ADR-011)
  ansible.builtin.template:
    src: kuma-push.env.j2
    dest: /mnt/data/secrets/kuma-push.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Push Pi power/thermal health to Uptime Kuma
  ansible.builtin.import_tasks: health.yml

- name: "Install goss and the declarative posture spec (ADR-032)"
  ansible.builtin.import_tasks: goss.yml

- name: "Assert the container security posture daily (issue #33)"
  ansible.builtin.import_tasks: posture.yml

- name: Run a weekly lynis audit and push the result to Uptime Kuma
  ansible.builtin.import_tasks: lynis.yml

- name: Run the Nextcloud notify_push self-test hourly
  ansible.builtin.import_tasks: notify-push.yml

- name: Watch the data disk (SMART counters, capacity, monthly long self-test)
  ansible.builtin.import_tasks: disk.yml

- name: "Route curated Netdata alarms to a human (ADR-030, phase 1)"
  ansible.builtin.import_tasks: netdata.yml
  when: netdata_alarm_groups | default([]) | selectattr('push_url') | list | length > 0

- name: "Report that curated Netdata alarms are NOT installed"
  ansible.builtin.debug:
    msg: >-
      Curated Netdata alarms are DISABLED: no push URL is set for any group in
      netdata_alarm_groups, so no alarm, adapter or timer was installed.
      Netdata still reaches nobody and homelab-health.sh still carries every
      check. To enable one, create a Push monitor in Kuma and set its URL in the
      vaulted host_vars — see local.example.yml.
  when: netdata_alarm_groups | default([]) | selectattr('push_url') | list | length == 0

- name: "Retract the curated Netdata alarms when no push URL is configured"
  when: netdata_alarm_groups | default([]) | selectattr('push_url') | list | length == 0
  block:
    - name: "Stop and disable the Netdata-to-Kuma adapter timer"
      ansible.builtin.systemd:
        name: homelab-netdata-kuma.timer
        enabled: false
        state: stopped
        daemon_reload: true
      failed_when: false

    - name: "Remove the adapter, its units and every curated alarm file"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ ['/usr/local/bin/homelab-netdata-kuma.sh',
            '/etc/systemd/system/homelab-netdata-kuma.service',
            '/etc/systemd/system/homelab-netdata-kuma.timer']
           + (netdata_curated_alarms | default([])
              | map(attribute='file')
              | map('regex_replace', '^(.*)$',
                    services_data_dir ~ '/netdata/health.d/\\1.conf')
              | list) }}
      notify: Reload netdata health
