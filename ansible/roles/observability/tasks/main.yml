---
# =============================================================================
# Role: observability — host-level health monitoring
# =============================================================================
# Thin orchestrator: one file per concern, task names prefixed with the file.

- name: Push Pi power/thermal health to Uptime Kuma
  ansible.builtin.import_tasks: health.yml

- name: "Assert the container security posture daily (issue #33)"
  ansible.builtin.import_tasks: posture.yml

# ADR-032 step 1: installs goss and the generated spec beside homelab-posture.sh,
# which still runs untouched. Both can then be compared on the same machine
# before either is replaced.
- name: "Install goss and the declarative posture spec (ADR-032)"
  ansible.builtin.import_tasks: goss.yml

- name: Run a weekly lynis audit and push the result to Uptime Kuma
  ansible.builtin.import_tasks: lynis.yml

- name: Run the Nextcloud notify_push self-test hourly
  ansible.builtin.import_tasks: notify-push.yml

- name: Watch the data disk (SMART counters, capacity, monthly long self-test)
  ansible.builtin.import_tasks: disk.yml

# Gated the way the repository gates every other optional path (see
# offsite_restic_password): empty means DISABLED, and it says so out loud in the
# example file. That is a documented opt-out, not the accidental empty value
# catalogued in #220 — which is what the assert inside guards against.
# Either way the 57 stock alarms stay unrouted.
- name: "Route curated Netdata alarms to a human (ADR-030, phase 1)"
  ansible.builtin.import_tasks: netdata.yml
  when: netdata_alarm_groups | default([]) | selectattr('push_url') | list | length > 0

# A skipped feature that says nothing is the defect this whole ADR is about: the
# first deploy of phase 1 reported `changed=2, failed=0` and installed none of
# it, because no push URL was set. The run was correct; its silence was not.
# No silent caps — if coverage is off, the deploy says so.
- name: "Report that curated Netdata alarms are NOT installed"
  ansible.builtin.debug:
    msg: >-
      Curated Netdata alarms are DISABLED: no push URL is set for any group in
      netdata_alarm_groups, so no alarm, adapter or timer was installed.
      Netdata still reaches nobody and homelab-health.sh still carries every
      check. To enable one, create a Push monitor in Kuma and set its URL in the
      vaulted host_vars — see local.example.yml.
  when: netdata_alarm_groups | default([]) | selectattr('push_url') | list | length == 0
