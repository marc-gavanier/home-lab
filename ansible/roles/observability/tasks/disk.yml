---
- name: disk | Install the disk-health report script
  ansible.builtin.template:
    src: homelab-disk.sh.j2
    dest: /usr/local/bin/homelab-disk.sh
    mode: "0750"

- name: disk | Install the disk-health report service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - homelab-disk.service
    - homelab-disk.timer

- name: disk | Install the weekly SMART extended self-test service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - homelab-smart-test.service
    - homelab-smart-test.timer

- name: disk | Enable the disk-health and SMART self-test timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - homelab-disk.timer
    - homelab-smart-test.timer
