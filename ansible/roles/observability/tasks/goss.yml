---
# goss — ADR-032.
#
# Installs the binary and the generated posture spec. homelab-posture.sh runs
# goss first and reports its TAP output as its own findings, so this must land
# before the posture task or the daily check reports the spec missing.

- name: goss | Read the installed version, if any
  ansible.builtin.command: goss --version
  register: goss_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: goss | Install the pinned release
  when: goss_version not in (goss_installed.stdout | default(''))
  block:
    # Checksum from the project's own SHA256SUMS, not computed locally: a
    # self-computed digest pins the artefact you happened to download, which
    # proves nothing about what the publisher released.
    - name: goss | Download the release archive
      ansible.builtin.get_url:
        url: "{{ goss_release_url }}/{{ goss_archive }}"
        dest: /tmp/goss.tar.gz
        checksum: "sha256:{{ goss_sha256 }}"
        mode: "0600"
      vars:
        goss_release_url: >-
          https://github.com/goss-org/goss/releases/download/v{{ goss_version }}
        goss_archive: >-
          goss_{{ goss_version }}_linux_arm64.tar.gz

    - name: goss | Unpack the binary
      ansible.builtin.unarchive:
        src: /tmp/goss.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include:
          - goss
        owner: root
        group: root
        mode: "0755"

  always:
    - name: goss | Remove the downloaded archive
      ansible.builtin.file:
        path: /tmp/goss.tar.gz
        state: absent

# `template` does not create parent directories, and nothing else on this host
# owns /etc/goss. Without this the deploy fails on "Destination directory
# /etc/goss does not exist" — which is how it was found, the earlier spec
# validations having copied the file into /tmp by hand.
- name: goss | Create the spec directory
  ansible.builtin.file:
    path: /etc/goss
    state: directory
    owner: root
    group: root
    mode: "0700"

# 0400 root: the spec names every container's expected capability set and the
# modes of the credential stores. That is a map of where the secrets are and how
# they are protected — not a secret itself, but not something an unprivileged
# account needs either.
- name: goss | Install the generated posture spec
  ansible.builtin.template:
    src: goss-posture.yaml.j2
    dest: /etc/goss/posture.yaml
    owner: root
    group: root
    mode: "0400"
