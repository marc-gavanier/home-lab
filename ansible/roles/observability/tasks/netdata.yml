---
# Netdata curated alarms -> Uptime Kuma — ADR-030, phase 1.
#
# Builds the path and proves it. Deletes nothing, and changes no existing
# behaviour: the 57 stock alarms keep reaching nobody and Netdata's notification
# configuration is not touched at all. The overlap this described is over —
# swap, available memory and CPU temperature have all left homelab-health.sh,
# each after its curated alarm was observed firing (ADR-030's migration rule).
#
# Netdata notifies nobody. A host-side adapter reads its alarm API and pushes
# each curated alarm into its own Kuma monitor, so Kuma stays the one place the
# notification channel is configured — and each monitor becomes a dead-man's
# switch for netdata itself.
#
# This reverses one earlier trade-off deliberately. `health.yml` records why the
# host signals were folded into a single push: "Kuma v2 monitors are created by
# hand, so folding host-level signals into one push keeps the alerting surface
# flat". That flat surface is exactly what latched for a whole day on a pending
# reboot (#216). One monitor per condition costs a manual monitor each; that is
# the price of a signal that cannot be muted by an unrelated one.
#
# Why the alarm directory has to be mounted: only `lib` and `cache` are on the
# volume today, so anything written into /etc/netdata lives in the container's
# writable layer and disappears on the next recreate — the same defect ADR-019
# fixed for the metrics database. Configuration that vanishes on an image bump
# is worse than none, because it looks present.
#
# What is NOT mounted, and why: /etc/netdata itself. It carries the container's
# own bootstrap files (`.environment`, `.install-type`, `edit-config`, and the
# `orig` symlink into the stock tree). Only the empty `health.d/` is mounted.

- name: netdata | Select the groups that have a Kuma monitor
  ansible.builtin.set_fact:
    netdata_active_groups: >-
      {{ netdata_alarm_groups | selectattr('push_url') | list }}

- name: netdata | Select the alarms whose group is configured
  ansible.builtin.set_fact:
    netdata_active_alarms: >-
      {{ netdata_curated_alarms
         | selectattr('group', 'in', netdata_active_groups | map(attribute='name') | list)
         | list }}

- name: netdata | Refuse a push URL that cannot deliver
  # These alarms only reach this task when their push_url is non-empty, so this
  # is a SHAPE check, not a presence check. A value that is set but malformed
  # renders an adapter that runs, reports success and never surfaces anything —
  # the silent-disablement shape catalogued in #220, whose only difference from
  # an empty value is that it looks configured.
  ansible.builtin.assert:
    that:
      - item.push_url is search('^https://')
      - item.push_url is search('/api/push/')
    fail_msg: >-
      The push URL for alarm group '{{ item.name }}' is set but is not an
      Uptime Kuma push URL, so its alarms would evaluate and never surface.
      Create a Push monitor in Kuma, copy its push URL, and set it in the
      vaulted host_vars — see local.example.yml.
    quiet: true
  loop: "{{ netdata_active_groups }}"
  loop_control:
    label: "{{ item.name }}"

- name: netdata | Create the curated alarm directory on the encrypted volume
  ansible.builtin.file:
    path: "{{ services_data_dir }}/netdata/health.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: netdata | Install the curated alarms
  ansible.builtin.template:
    src: "netdata-health-{{ item.file }}.conf.j2"
    dest: "{{ services_data_dir }}/netdata/health.d/{{ item.file }}.conf"
    owner: root
    group: root
    mode: "0444"
  loop: "{{ netdata_active_alarms }}"
  loop_control:
    label: "{{ item.file }} -> {{ item.group }}"
  notify: Restart netdata

# Collectors are installed WITHOUT alarms on them. A deploy therefore only makes
# new charts appear — nothing can turn a monitor red on the strength of a
# collector nobody has seen produce data yet. The alarms follow, once the charts
# are verified.
- name: netdata | Create the collector configuration directory
  ansible.builtin.file:
    path: "{{ services_data_dir }}/netdata/go.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: netdata | Install the go.d collector configurations
  ansible.builtin.template:
    src: "netdata-go.d-{{ item }}.conf.j2"
    dest: "{{ services_data_dir }}/netdata/go.d/{{ item }}.conf"
    owner: root
    group: root
    mode: "0444"
  loop:
    - docker
  notify: Restart netdata

# 0750 root:root and the push URLs inline, which is this host's existing
# convention for a script carrying a Kuma token (offsite-health.sh, backup.sh).
- name: netdata | Install the Netdata-to-Kuma adapter
  ansible.builtin.template:
    src: homelab-netdata-kuma.sh.j2
    dest: /usr/local/bin/homelab-netdata-kuma.sh
    owner: root
    group: root
    mode: "0750"
  no_log: true

- name: netdata | Install the adapter service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - homelab-netdata-kuma.service
    - homelab-netdata-kuma.timer

- name: netdata | Enable the adapter timer
  ansible.builtin.systemd:
    name: homelab-netdata-kuma.timer
    enabled: true
    state: started
    daemon_reload: true
