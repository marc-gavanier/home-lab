---
- name: netdata | Select the groups that have a Kuma monitor
  ansible.builtin.set_fact:
    netdata_active_groups: >-
      {{ netdata_alarm_groups | selectattr('push_url') | list }}

- name: netdata | Select the alarms whose group is configured
  ansible.builtin.set_fact:
    netdata_active_alarms: >-
      {{ netdata_curated_alarms
         | selectattr('group', 'in', netdata_active_groups | map(attribute='name') | list)
         | list }}

- name: netdata | Refuse a derivation that selected no alarm at all
  ansible.builtin.assert:
    that:
      - netdata_active_alarms | length > 0
    fail_msg: >-
      {{ netdata_active_groups | length }} alarm group(s) carry a push URL, but
      NO curated alarm matched them — every alarm's `group` names a group that
      is not in netdata_alarm_groups. Zero alarms would be installed and the
      deploy would otherwise report success. Check that `group:` in
      netdata_curated_alarms matches `name:` in netdata_alarm_groups.
    success_msg: >-
      {{ netdata_active_alarms | length }} curated alarm(s) selected across
      {{ netdata_active_groups | length }} configured group(s).
    quiet: true

- name: netdata | Refuse a push URL that cannot deliver
  ansible.builtin.assert:
    that:
      - item.push_url is search('^https://')
      - item.push_url is search('/api/push/')
    fail_msg: >-
      The push URL for alarm group '{{ item.name }}' is set but is not an
      Uptime Kuma push URL, so its alarms would evaluate and never surface.
      Create a Push monitor in Kuma, copy its push URL, and set it in the
      vaulted host_vars — see local.example.yml.
    quiet: true
  # floor: main.yml, which gates this entire file on at least one group carrying a
  loop: "{{ netdata_active_groups }}"
  loop_control:
    label: "{{ item.name }}"

- name: netdata | Declare the dbengine retention (class C68)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker/configs/netdata/netdata.conf"
    dest: "{{ services_data_dir }}/netdata/netdata.conf"
    owner: root
    group: root
    mode: "0444"
  notify: Restart netdata

- name: netdata | Create the curated alarm directory on the encrypted volume
  ansible.builtin.file:
    path: "{{ services_data_dir }}/netdata/health.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: netdata | Install the curated alarms
  ansible.builtin.template:
    src: "netdata-health-{{ item.file }}.conf.j2"
    dest: "{{ services_data_dir }}/netdata/health.d/{{ item.file }}.conf"
    owner: root
    group: root
    mode: "0444"
  loop: "{{ netdata_active_alarms }}"
  loop_control:
    label: "{{ item.file }} -> {{ item.group }}"
  notify: Reload netdata health

- name: netdata | Create the collector configuration directory
  ansible.builtin.file:
    path: "{{ services_data_dir }}/netdata/go.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: netdata | Install the go.d collector configurations
  ansible.builtin.template:
    src: "netdata-go.d-{{ item }}.conf.j2"
    dest: "{{ services_data_dir }}/netdata/go.d/{{ item }}.conf"
    owner: root
    group: root
    mode: "0444"
  loop:
    - docker
  notify: Restart netdata

- name: netdata | Install the Netdata-to-Kuma adapter
  ansible.builtin.template:
    src: homelab-netdata-kuma.sh.j2
    dest: /usr/local/bin/homelab-netdata-kuma.sh
    owner: root
    group: root
    mode: "0750"
  no_log: true

- name: netdata | Install the adapter service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - homelab-netdata-kuma.service
    - homelab-netdata-kuma.timer

- name: netdata | Enable the adapter timer
  ansible.builtin.systemd:
    name: homelab-netdata-kuma.timer
    enabled: true
    state: started
    daemon_reload: true
