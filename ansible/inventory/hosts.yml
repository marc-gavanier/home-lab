all:
  hosts:
    homelab:
      ansible_host: "{{ homelab_ip }}"
      # First provisioning run on a fresh flash: -e homelab_ssh_port=22
      ansible_port: "{{ homelab_ssh_port | default(ssh_port_hardened) }}"
      # ansible_user set in group_vars/all.yml or group_vars/local.yml
    offsite:
      # Reached over the WireGuard tunnel since the Pi moved offsite
      # (offsite_ip tracks offsite_wg_ip — see host_vars/offsite/main.yml).
      ansible_host: "{{ offsite_ip }}"
      # First provisioning run on a fresh flash: -e offsite_ssh_port=22
      ansible_port: "{{ offsite_ssh_port | default(ssh_port_hardened) }}"
  vars:
    ansible_python_interpreter: /usr/bin/python3
