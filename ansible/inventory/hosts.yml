all:
  hosts:
    homelab:
      ansible_host: "{{ homelab_ip }}"
      ansible_port: "{{ homelab_ssh_port | default(ssh_port_hardened) }}"
    offsite:
      ansible_host: "{{ offsite_ip }}"
      ansible_port: "{{ offsite_ssh_port | default(ssh_port_hardened) }}"
      ansible_ssh_common_args: >-
        -J {{ hostvars['homelab'].ansible_user }}@{{ hostvars['homelab'].homelab_ip }}:{{ hostvars['homelab'].ansible_port }}
  vars:
    ansible_python_interpreter: /usr/bin/python3
