all:
  hosts:
    homelab:
      ansible_host: "{{ homelab_ip }}"
      # First provisioning run on a fresh flash: -e homelab_ssh_port=22
      ansible_port: "{{ homelab_ssh_port | default(ssh_port_hardened) }}"
      # ansible_user set in group_vars/all.yml or group_vars/local.yml
    offsite:
      # Reached over the WireGuard tunnel since the Pi moved offsite
      # (offsite_ip tracks offsite_wg_ip — see host_vars/offsite/main.yml).
      ansible_host: "{{ offsite_ip }}"
      # First provisioning run on a fresh flash: -e offsite_ssh_port=22
      ansible_port: "{{ offsite_ssh_port | default(ssh_port_hardened) }}"
      # Jump through the homelab, because that address is only routable from
      # inside the VPN and the control node is usually NOT in it.
      #
      # Found 2026-08-26 trying to deploy from the living room: the playbook
      # died on "connect to host 10.8.0.4 port …: Connection timed out" while
      # `ssh offsite` worked perfectly — the ssh config carries a ProxyJump on
      # the ALIAS, and ansible connects to the IP, which does not match it. So
      # an offsite deploy only ever worked from OUTSIDE the house, which is the
      # wrong way round: at home is where the administration happens.
      #
      # The jump works from both places rather than trading one for the other.
      # At home it is the only route. On the VPN the homelab's LAN address is
      # reachable through the tunnel anyway, and the extra hop costs a
      # handshake — the offsite is a WireGuard client of that same container in
      # either case, so this adds no dependency that was not already there.
      ansible_ssh_common_args: >-
        -J {{ ansible_user }}@{{ homelab_ip }}:{{ hostvars['homelab'].ansible_port }}
  vars:
    ansible_python_interpreter: /usr/bin/python3
