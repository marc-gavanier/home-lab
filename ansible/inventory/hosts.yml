all:
  hosts:
    homelab:
      ansible_host: "{{ homelab_ip }}"
      ansible_port: "{{ ssh_port | default(22) }}"
      # ansible_user set in group_vars/all.yml or group_vars/local.yml
    offsite:
      # LAN IP while being prepared at home; switch offsite_ip to the
      # WireGuard IP (offsite_wg_ip) once the Pi lives at its offsite location.
      ansible_host: "{{ offsite_ip }}"
      # First provisioning run on a fresh flash: -e offsite_ssh_port=22
      ansible_port: "{{ offsite_ssh_port | default(ssh_port_hardened) }}"
  vars:
    ansible_python_interpreter: /usr/bin/python3
