# =============================================================================
# Offsite backup Pi — host variables (non-secret — secrets live in local.yml)
# =============================================================================
# Raspberry Pi 4 (4GB) + WD Blue 2TB SATA SSD (USB). Lives on the home LAN
# during preparation, then at the offsite location as a WireGuard client.
# Receives nightly `restic copy` from the homelab via rest-server append-only.

# --- System ---
hostname: backup
free_port_53: false # No Pi-hole here — keep stock systemd-resolved
tmp_tmpfs_size: 512M # Smaller /tmp cap on the 4GB node (homelab defaults to 1G)
# zram compressed swap: this node has no HDD swapfile (it doesn't run the
# storage role) and runs memory-spiky restic jobs, so compressed RAM swap is
# real headroom kept off the SSD. The 8GB homelab leaves this off.
zram_enabled: true
# 52Pi ICE Tower NAS case: PWM fan on GPIO 14, thermostat at 60°C (vendor
# wiki ZP-0141). Without this the fan runs full speed permanently.
gpio_fan_pin: 14
gpio_fan_temp: 60

# --- Connection ---
# LAN IP during preparation. After the move, point this at the WireGuard IP
# (offsite_wg_ip) — the tunnel is the permanent management path.
offsite_ip: "192.168.1.138"

# --- WireGuard ---
offsite_wg_ip: "10.8.0.4" # Assigned by wg-easy to the offsite-backup client
# The homelab HOST's own client IP (client "homelab-host") — wg0 lives in the
# wg-easy container, so the host pushes backups through its own peer identity.
homelab_wg_ip: "10.8.0.5"

# --- Backup storage ---
# The 52Pi enclosure's ASMedia ASM1153 bridge is unstable in UAS mode on the
# Pi (async write errors under load — bitten during first mkfs, 2026-07-12).
# Force the plain usb-storage driver instead.
# Consequence: usb-storage (BOT, no UAS) does not pass TRIM/UNMAP, so
# `fstrim /mnt/backup` reports "discard not supported" — accepted. Integrity of
# the backup target outranks TRIM; fstrim.timer skips it quietly
# (--quiet-unsupported) and the SSD's own background GC handles wear.
usb_storage_quirks: "174c:55aa:u"
backup_disk_device: /dev/sda1
backup_mount_point: /mnt/backup
offsite_disk_force_format: false # Set true (once) to format a non-ext4 disk

# --- rest-server ---
rest_server_version: "0.14.0"
rest_server_port: 8000
rest_server_data_dir: "{{ backup_mount_point }}/restic"
rest_server_auth_user: homelab

# --- Firewall ---
# rest-server only accepts the homelab through the tunnel; SSH is handled by
# the security role.
ufw_service_rules:
  - port: "{{ rest_server_port }}"
    from_ip: "{{ homelab_wg_ip }}/32"
    comment: "rest-server (homelab via WireGuard only)"
