ssh_allowed_sources:
  - 192.168.0.0/24
  - 10.8.0.0/24

hostname: backup
free_port_53: false
unattended_automatic_reboot: true
tmp_tmpfs_size: 512M
fail2ban_service_jails: false
zram_enabled: true
gpio_fan_pin: 14
gpio_fan_temp: 60

offsite_ip: "{{ offsite_wg_ip }}"

offsite_wg_ip: "10.8.0.4"

usb_storage_quirks: "174c:55aa:u"
backup_disk_device: /dev/sda1
backup_disk_device_base: /dev/sda

offsite_smart_counters:
  - {id: 5, name: realloc}
  - {id: 170, name: grown-bad-blocks}
  - {id: 171, name: program-fail}
  - {id: 172, name: erase-fail}
  - {id: 184, name: end-to-end}
  - {id: 187, name: uncorrectable}
  - {id: 199, name: crc-err}
backup_mount_point: /mnt/backup

extra_fsck_filesystems:
  - device: "{{ backup_disk_device }}"
    max_mounts: "{{ data_fsck_max_mounts | default(0) }}"
    interval_days: "{{ data_fsck_interval_days | default(30) }}"
offsite_disk_force_format: false

rest_server_version: "0.14.0"
rest_server_sha256: "cef139cbe8b27b16bda731d17f093b0aa466b8c60b136c12d78b6f2bff3daf22"
rest_server_port: 8000
rest_server_data_dir: "{{ backup_mount_point }}/restic"
rest_server_auth_user: homelab

ufw_service_rules:
  - port: "{{ rest_server_port }}"
    from_ip: "{{ homelab_wg_ip }}/32"
    comment: "rest-server (homelab via WireGuard only)"
