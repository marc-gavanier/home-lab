[defaults]
inventory = inventory/hosts.yml
# Static string (no {file}/{host}/date macros): keeps template output identical
# whoever deploys, so convergence runs stay silent.
ansible_managed = Ansible managed — rendered from the home-lab repo, edits on the host will be overwritten
roles_path = roles:~/.ansible/roles
# Run notified handlers even when a later task fails. Without this, a mid-play
# failure silently drops pending handlers (a journald cap wrote its drop-in but
# never restarted, so the host converged changed=0 on stale config). Every
# handler-gated change — journald/resolved/Docker restarts, "Reboot required" —
# is only safe with this on.
force_handlers = True
private_key_file = ~/.ssh/id_ed25519
host_key_checking = False
retry_files_enabled = False
deprecation_warnings = False
stdout_callback = default
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
# ssh_args is deliberately NOT set. The line that used to live here read
# `-o ControlMaster=auto -o ControlPersist=60s`, which is ansible-core 2.21.2's
# own default (connection/ssh.py:96) MINUS the `-C` that default also carries —
# so it restated upstream in order to freeze it, and lost compression on every
# module payload in the process (measured at 33.7 % of payload size on
# 2026-09-12). Leaving it unset applies the default, which is what the line was
# trying to express, and keeps whatever upstream adds to it next.
