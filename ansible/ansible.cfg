[defaults]
inventory = inventory/hosts.yml
# Static string (no {file}/{host}/date macros): keeps template output identical
# whoever deploys, so convergence runs stay silent.
ansible_managed = Ansible managed — rendered from the home-lab repo, edits on the host will be overwritten
roles_path = roles:~/.ansible/roles
# Run notified handlers even when a later task fails. Without this, a mid-play
# failure silently drops pending handlers (a journald cap wrote its drop-in but
# never restarted, so the host converged changed=0 on stale config). Every
# handler-gated change — journald/resolved/Docker restarts, "Reboot required" —
# is only safe with this on.
force_handlers = True
private_key_file = ~/.ssh/id_ed25519
host_key_checking = False
retry_files_enabled = False
deprecation_warnings = False
stdout_callback = default
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
