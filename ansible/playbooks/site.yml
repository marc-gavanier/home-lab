---
- name: Provision Home Lab
  hosts: homelab
  become: true

  pre_tasks:
    - name: Refuse extra-vars words Ansible split off and dropped
      ansible.builtin.assert:
        that: _raw_params is not defined
        fail_msg: >-
          '{{ _raw_params | default('') }}' was split off an -e value at a space and would be
          silently ignored. Quote the whole value: -e '{"deploy_services": "a b c"}'
        quiet: true
      tags: [always]

    - name: Wait for system to be reachable
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Gather facts
      ansible.builtin.setup:

  roles:
    - role: base
      tags: [phase1, base]

    - role: storage
      tags: [phase1, storage]

    - role: security
      tags: [phase1, security]

    - role: docker
      tags: [phase1, docker]

    - role: observability
      tags: [phase1, observability]

    - role: deploy
      tags: [phase2, phase3, phase4, phase5, deploy]

    - role: claude-code
      tags: [phase5, claude-code]

    - role: killswitch
      tags: [phase5, killswitch]

    - role: usb-tamper
      tags: [phase5, usb-tamper]

    - role: stack-startup
      tags: [phase5, stack-startup]

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg: |
          =============================================
          Home Lab provisioning complete!

          Services should be accessible at:
            - https://drive.{{ domain }}
            - https://vault.{{ domain }}
            - https://photos.{{ domain }}

          VPN: connect via WireGuard on port 51820
          Admin panels: accessible via VPN only
          =============================================
