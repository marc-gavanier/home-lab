---
# =============================================================================
# CIS Ubuntu 24.04 audit — READ-ONLY by design: ALWAYS run with --check
# =============================================================================
#   ansible-galaxy install -r requirements.yml        # once (role v1.6.0)
#   ansible-playbook playbooks/cis-audit.yml --check --diff --ask-vault-pass
#
# Purpose: confront the homelab's own hardening (security role, ADRs) with
# the CIS benchmark and read the gap — NOT to enforce it. The lockdown role
# in enforce mode would break this setup (SSH config, mounts, Docker
# forwarding, ...). The assert below refuses to run outside check mode.
# =============================================================================

- name: CIS Ubuntu 24.04 audit (read-only)
  hosts: homelab
  become: true

  pre_tasks:
    - name: Refuse to run outside check mode (audit only — enforce would break the lab)
      ansible.builtin.assert:
        that: ansible_check_mode
        fail_msg: >-
          This playbook is audit-only. Re-run with --check. Enforcing the full
          CIS benchmark would break the homelab (SSH, mounts, IP forwarding).

  vars:
    # Report only — never let the role touch the system even if check mode
    # were bypassed on individual tasks.
    ubtu24cis_section1: true
    ubtu24cis_section2: true
    ubtu24cis_section3: true
    ubtu24cis_section4: true
    ubtu24cis_section5: true
    # Section 6 (logging & auditing) disabled: auditd is not installed, which
    # IS the section-6 finding — and its prelim tasks crash in check mode when
    # /etc/audit/auditd.conf is absent (install is only simulated). The 6.2.4.x
    # rule vars gate a prelim task with `tags: always`, so they must be off too.
    ubtu24cis_section6: false
    ubtu24cis_rule_6_2_4_1: false
    ubtu24cis_rule_6_2_4_2: false
    ubtu24cis_rule_6_2_4_3: false
    ubtu24cis_rule_6_2_4_4: false
    # Deliberate deviation: the 5TB data disk IS usb-storage — disabling the
    # module (CIS 1.1.1.9) is incompatible with this hardware. Physical USB
    # attack surface is covered differently: ADR-008 usb-tamper poweroff.
    ubtu24cis_rule_1_1_1_9: false
    # Check-mode incompatible: 1.1.1.10 deploys its own discovery script then
    # runs it — the copy is only simulated, the run fails. Covered manually:
    # `lsmod` review; unused fs modules are already blacklisted in firmware
    # (base role kills i2c/spi/radios; overlayfs & friends are needed).
    ubtu24cis_rule_1_1_1_10: false
    # No GRUB on a Raspberry Pi (firmware boot + cmdline.txt): the bootloader
    # AppArmor flag check reads /etc/default/grub and crashes. AppArmor being
    # enabled at boot is verified by 1.3.1.1/3/4 (kept) and aa-status.
    ubtu24cis_rule_1_3_1_2: false
    # Check-mode cascade: /etc/motd does not exist on Ubuntu 24.04 (update-motd.d
    # instead) and the rule creating it (1.6.2) is only simulated — the perms
    # rule then dies on the absent file.
    ubtu24cis_rule_1_6_4: false
    # This host uses systemd-timesyncd (Ubuntu default), not chrony — tell the
    # role so it audits the right tool instead of crashing on absent chrony.conf.
    ubtu24cis_time_sync_tool: systemd-timesyncd
    # Check-mode cascade: libpam-pwquality is not installed (its install is
    # only simulated), so every 5.3.3.2.x rule dies editing the absent
    # /etc/security/pwquality.conf. Real finding to arbitrate: password
    # QUALITY rules are moot here (account password locked, SSH key-only,
    # sudo NOPASSWD) — noted as a deliberate deviation.
    ubtu24cis_rule_5_3_3_2_1: false
    ubtu24cis_rule_5_3_3_2_2: false
    ubtu24cis_rule_5_3_3_2_3: false
    ubtu24cis_rule_5_3_3_2_4: false
    ubtu24cis_rule_5_3_3_2_5: false
    ubtu24cis_rule_5_3_3_2_6: false
    ubtu24cis_rule_5_3_3_2_7: false
    ubtu24cis_rule_5_3_3_2_8: false
    # Same cascade and same rationale for password HISTORY (pam_pwhistory
    # profile absent): no active local passwords on this host.
    ubtu24cis_rule_5_3_3_3_1: false
    ubtu24cis_rule_5_3_3_3_2: false
    ubtu24cis_rule_5_3_3_3_3: false
    # The claude vault is a FUSE mount unreadable by root BY DESIGN (sandbox,
    # no allow_other): every root-wide `find` sweep stats it and exits non-zero,
    # which these rules' failed_when reject. Manual equivalent when needed:
    #   find / -xdev ! -path '/home/claude/vault*' -type f -perm -0002
    # NOTE: the 7.1.11 sweep DID surface a real finding before dying — the
    # media tree is world-writable (see audit synthesis).
    ubtu24cis_rule_7_1_11: false
    ubtu24cis_rule_7_1_12: false
    ubtu24cis_rule_7_1_13: false
    # Check-mode cascade: setfacl (acl package) is absent, its install only
    # simulated. Home-dir perms are sane (0750/0700, single operator).
    ubtu24cis_rule_7_2_9: false
    ubtu24cis_section7: true

    # === Silenced: assumed deviations (NEVER actionable — see report §1) ===
    # Our architecture answers these differently on purpose. Keeping them
    # flagged is pure noise: they will never be "fixed". Full rationale per
    # line lives in knowledge/research/cis-audit-2026-07.md §1.
    ubtu24cis_rule_3_3_1: false    # IP forwarding required (Docker + WireGuard routing)
    ubtu24cis_rule_1_1_1_6: false  # overlayfs is Docker's storage driver
    ubtu24cis_rule_5_2_4: false    # sudo NOPASSWD deliberate (account locked, key-only)
    ubtu24cis_rule_5_1_8: false    # SSH forwarding is the only admin path to wg-easy UI
    ubtu24cis_rule_5_4_1_1: false  # password aging moot — no active local passwords
    ubtu24cis_rule_5_4_1_2: false  # (idem)
    ubtu24cis_rule_5_4_1_3: false  # (idem)
    ubtu24cis_rule_2_1_13: false   # rsync KEPT — operator's media-transfer tool (§1)

    # === Silenced: false positives (effective state IS correct — report §4) ===
    # These stay red not because the system is wrong but because the role
    # checks ITS OWN file layout / value lists, not effective state (proven by
    # `sshd -T`, direct sysctl reads, stat). The check is permanently stuck, so
    # it gives no signal; regression detection lives in the changed=0
    # convergence runs + direct reads instead. (goss `run_audit: true` would
    # measure effective state and clear these without silencing — tried
    # 2026-07-18 and reverted: the audit content is a moving branch with no
    # pinnable tag and had drifted ahead of role 1.6.0, missing 28 vars. See
    # report §4.)
    # -- sshd settings: our values are active (verified `sshd -T` on the Pi),
    #    the role reports changed only because it writes via its own drop-in.
    ubtu24cis_rule_5_1_6: false    # Ciphers
    ubtu24cis_rule_5_1_12: false   # KexAlgorithms
    ubtu24cis_rule_5_1_15: false   # MACs
    ubtu24cis_rule_5_1_10: false   # HostbasedAuthentication no (effective)
    ubtu24cis_rule_5_1_14: false   # LogLevel VERBOSE (effective)
    ubtu24cis_rule_5_1_16: false   # MaxAuthTries (effective)
    ubtu24cis_rule_5_1_17: false   # MaxSessions (effective)
    # -- packages verified ABSENT on the Pi (dpkg), role flags in check mode anyway
    ubtu24cis_rule_1_5_5: false    # apport purged (batch 1)
    ubtu24cis_rule_2_2_4: false    # telnet absent
    ubtu24cis_rule_2_2_6: false    # ftp absent
    ubtu24cis_rule_2_1_2: false    # avahi-daemon purged (batch 4)
    # -- system accounts already locked (* / ! in shadow), verified on the Pi
    ubtu24cis_rule_5_4_2_8: false
    # -- shadow perms: we use Ubuntu's root:shadow 0640, role wants root:root
    ubtu24cis_rule_7_1_5: false
    ubtu24cis_rule_7_1_6: false
    ubtu24cis_rule_7_1_7: false
    ubtu24cis_rule_7_1_8: false
    # -- batch 1 network sysctl (base role, effective — verified live)
    ubtu24cis_rule_3_3_2: false
    ubtu24cis_rule_3_3_3: false
    ubtu24cis_rule_3_3_4: false
    ubtu24cis_rule_3_3_5: false
    ubtu24cis_rule_3_3_6: false
    ubtu24cis_rule_3_3_7: false
    ubtu24cis_rule_3_3_8: false
    ubtu24cis_rule_3_3_9: false
    ubtu24cis_rule_3_3_10: false
    ubtu24cis_rule_3_3_11: false
    # -- batch 1 kernel params (ASLR, ptrace, core dumps)
    ubtu24cis_rule_1_5_1: false
    ubtu24cis_rule_1_5_2: false
    ubtu24cis_rule_1_5_3: false
    # -- batch 2 module blacklist (cramfs, freevxfs, hfs, hfsplus, jffs2, udf)
    ubtu24cis_rule_1_1_1_1: false
    ubtu24cis_rule_1_1_1_2: false
    ubtu24cis_rule_1_1_1_3: false
    ubtu24cis_rule_1_1_1_4: false
    ubtu24cis_rule_1_1_1_5: false
    ubtu24cis_rule_1_1_1_8: false
    # -- batch 2 network-protocol blacklist (dccp, tipc, rds, sctp)
    ubtu24cis_rule_3_2_1: false
    ubtu24cis_rule_3_2_2: false
    ubtu24cis_rule_3_2_3: false
    ubtu24cis_rule_3_2_4: false
    # -- effective/already-satisfied, confirmed on the Pi 2026-07-18
    ubtu24cis_rule_1_3_1_1: false  # AppArmor installed 4.0.1 + enabled (aa-status)
    ubtu24cis_rule_5_4_1_4: false  # login.defs ENCRYPT_METHOD already SHA512
    ubtu24cis_rule_5_3_3_4_3: false # pam_unix hashing already SHA512
    ubtu24cis_rule_5_4_2_7: false  # no non-root account has a login shell
    ubtu24cis_rule_5_2_2: false    # sudo use_pty already a Ubuntu default
    ubtu24cis_rule_5_2_3: false    # dedicated sudo logfile deployed (batch 5)
    ubtu24cis_rule_4_2_3: false    # ufw enabled + SSH port allowed (effective)
    ubtu24cis_rule_4_2_7: false    # ufw default deny incoming (effective)
    ubtu24cis_rule_5_1_7: false    # ClientAlive 300/2 — stricter than the role wants

    # === Deviations by design (report §1/§2) or not applicable ===
    ubtu24cis_rule_4_2_5: false    # egress: default allow outgoing is intentional
    ubtu24cis_rule_5_2_6: false    # sudo timeout moot — NOPASSWD, no auth prompt
    ubtu24cis_rule_1_2_1_1: false  # remote journald: no central log server here
    ubtu24cis_rule_1_2_1_2: false  # (idem)
    ubtu24cis_rule_1_2_2_1: false  # updates handled by unattended-upgrades (base)
    ubtu24cis_rule_1_6_1: false    # login banners: compliance theatre, decided against
    ubtu24cis_rule_1_6_2: false
    ubtu24cis_rule_1_6_3: false
    ubtu24cis_rule_5_1_5: false    # sshd Banner (ties to 1.6.x, decided against)
    ubtu24cis_rule_5_2_7: false    # su restricted group: marginal single-operator
    ubtu24cis_rule_5_4_3_2: false  # shell TMOUT: nuisance on a personal box
    ubtu24cis_rule_5_4_3_3: false  # default umask 027: risk to cross-service reads
    ubtu24cis_rule_7_2_10: false   # user dotfile perms: low value, single operator
    # -- PAM lockout/quality: moot with no active local passwords (key-only, locked)
    ubtu24cis_rule_5_3_1_3: false
    ubtu24cis_rule_5_3_2_2: false
    ubtu24cis_rule_5_3_2_3: false
    ubtu24cis_rule_5_3_2_4: false
    ubtu24cis_rule_5_3_3_1_1: false
    ubtu24cis_rule_5_3_3_1_2: false
    ubtu24cis_rule_5_3_3_1_3: false

  roles:
    - role: UBUNTU24-CIS
