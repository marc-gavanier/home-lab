---
# =============================================================================
# CIS Ubuntu 24.04 audit — goss engine, effective-state, READ-ONLY
# =============================================================================
#   ansible-galaxy install -r requirements.yml     # once (role + goss content)
#   ansible-playbook playbooks/cis-audit.yml --ask-vault-pass
#
# This measures EFFECTIVE state with goss (not "would the ansible role rewrite
# its files"), so hardening we apply our own way (sysctl, sshd, packages) is
# scored on reality — the check-mode false positives are gone.
#
# SAFETY MODEL — audit_only, not --check:
#   goss must actually install its binary + content, so --check can't be used.
#   Instead audit_only=true makes the role run the audit during prelim and then
#   `meta: end_host` BEFORE any remediation section runs (verified in the role:
#   prelim.yml imports pre_remediation_audit.yml which end_hosts on audit_only,
#   and sections are imported only after prelim in main.yml). The assert below
#   refuses to run if audit_only is ever overridden to false.
#
# FOOTPRINT (chosen: installed permanently): goss binary (pinned v0.4.8 +
#   sha256 by the role) at /usr/local/bin/goss, audit content cloned to
#   /opt/UBUNTU24-CIS-Audit (version benchmark_<role version>, tracked by
#   Renovate via the role pin). Reports land in /opt as JSON.
# =============================================================================

- name: CIS Ubuntu 24.04 audit (goss, effective state, read-only)
  hosts: homelab
  become: true

  pre_tasks:
    - name: Refuse to run unless audit_only is set (it end_hosts before any remediation)
      ansible.builtin.assert:
        that: audit_only | bool
        fail_msg: >-
          This playbook MUST run with audit_only=true. Without it the lockdown
          role executes its remediation sections and could break the lab
          (SSH, mounts, IP forwarding). Do not override audit_only.

  vars:
    # --- goss audit engine ---
    setup_audit: true    # install goss (pinned+checksummed by the role) + audit content
    run_audit: true      # run the goss scan
    audit_only: true     # SAFETY: end_host after the scan, before any remediation
    audit_format: json

    # Sections goss evaluates. Section 6 off: auditd is an accepted absence
    # (report §1), and its 6.2.4.x prelim tasks read a non-existent
    # /etc/audit/auditd.conf and crash even under audit_only (prelim runs
    # before end_host).
    ubtu24cis_section1: true
    ubtu24cis_section2: true
    ubtu24cis_section3: true
    ubtu24cis_section4: true
    ubtu24cis_section5: true
    ubtu24cis_section6: false
    ubtu24cis_section7: true
    ubtu24cis_rule_6_2_4_1: false
    ubtu24cis_rule_6_2_4_2: false
    ubtu24cis_rule_6_2_4_3: false
    ubtu24cis_rule_6_2_4_4: false

    # This host uses systemd-timesyncd (Ubuntu default), not chrony.
    ubtu24cis_time_sync_tool: systemd-timesyncd

    # === Assumed deviations — goss WOULD fail these on purpose, so skip them ===
    # These are the ONLY skips now: goss measures effective state, so the former
    # "false positive" skips are gone — goss verifies sshd/sysctl/packages/perms
    # for real and they should pass on their own. Per-line rationale: report §1.
    ubtu24cis_rule_3_3_1: false     # IP forwarding required (Docker + WireGuard routing)
    ubtu24cis_rule_1_1_1_6: false   # overlayfs is Docker's storage driver
    ubtu24cis_rule_1_1_1_9: false   # usb-storage: the 5TB data disk is USB (ADR-008)
    ubtu24cis_rule_1_3_1_2: false   # no GRUB on a Raspberry Pi (firmware boot)
    ubtu24cis_rule_5_2_4: false     # sudo NOPASSWD deliberate (account locked, key-only)
    ubtu24cis_rule_5_1_8: false     # SSH forwarding is the only admin path to wg-easy UI
    ubtu24cis_rule_2_1_13: false    # rsync kept — operator's media-transfer tool
    ubtu24cis_rule_5_4_1_1: false   # password aging moot — no active local passwords
    ubtu24cis_rule_5_4_1_2: false   # (idem)
    ubtu24cis_rule_5_4_1_3: false   # (idem)
    ubtu24cis_rule_5_3_3_2_1: false # pwquality moot — no active local passwords
    ubtu24cis_rule_5_3_3_2_2: false
    ubtu24cis_rule_5_3_3_2_3: false
    ubtu24cis_rule_5_3_3_2_4: false
    ubtu24cis_rule_5_3_3_2_5: false
    ubtu24cis_rule_5_3_3_2_6: false
    ubtu24cis_rule_5_3_3_2_7: false
    ubtu24cis_rule_5_3_3_2_8: false
    ubtu24cis_rule_5_3_3_3_1: false # pwhistory moot — no active local passwords
    ubtu24cis_rule_5_3_3_3_2: false
    ubtu24cis_rule_5_3_3_3_3: false

  roles:
    - role: UBUNTU24-CIS
