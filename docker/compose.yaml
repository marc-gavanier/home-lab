# =============================================================================
# Home Lab — Docker Compose
# =============================================================================
# All services for the home lab. Deploy with:
#   docker compose up -d
# =============================================================================

# Applied to every service (aliased in each block): block privilege escalation
# via setuid binaries after container start (no-new-privileges). Does NOT remove
# explicitly-granted capabilities — wg-easy/netdata keep theirs.
# Two services deliberately omit it, netdata and collabora, because each runs a
# binary that must gain privilege at exec (setuid plugins, file capabilities).
# Both failures are silent, so each block says so where the omission lives.
x-security-opt: &no-new-privs
  - no-new-privileges:true

# Dropped from every service (aliased in each block): Docker's default set is 14
# capabilities handed to every container regardless of need — CHOWN, SETUID,
# SETGID, DAC_OVERRIDE, FOWNER, MKNOD, NET_RAW, KILL, AUDIT_WRITE and more. Most
# images here touch none of them. Each block re-adds only what its own image was
# observed to need, with a comment saying which behaviour requires it; anything
# not listed there was verified absent, not assumed (issue #24).
# Read-only root filesystem (per service, issue #32): the container cannot write
# to its own image layer, so a compromised process cannot drop a binary or alter
# the code it will run next. What each service needs was measured with
# `docker diff` on the live containers — the real write set after weeks of
# running — not guessed. Writable paths are declared explicitly: a sized tmpfs
# for state meant to be lost, a bind mount for state that is not. Services
# without `read_only` carry the reason why in their own block.
x-cap-drop: &cap-drop-all
  - ALL

# Secrets injected as files rather than through `environment:` (ADR-016).
# The socket-proxy permits GET /containers/{id}/json, and that response includes
# every container's Env array — so an env-injected password is readable by
# Traefik or Netdata if either is compromised. Mounted at /run/secrets/<name>,
# only the path shows up there. Sources live on the LUKS volume (ADR-011) and
# are rendered by the deploy role, never committed.
secrets:
  cf_dns_api_token:
    file: /mnt/data/secrets/docker/cf_dns_api_token
  nextcloud_db_password:
    file: /mnt/data/secrets/docker/nextcloud_db_password
  nextcloud_db_root_password:
    file: /mnt/data/secrets/docker/nextcloud_db_root_password
  immich_db_password:
    file: /mnt/data/secrets/docker/immich_db_password
  transmission_password:
    file: /mnt/data/secrets/docker/transmission_password
  vaultwarden_admin_token_hash:
    file: /mnt/data/secrets/docker/vaultwarden_admin_token_hash
  miniflux_db_password:
    file: /mnt/data/secrets/docker/miniflux_db_password
  # The whole DSN, not a password inside it: Miniflux takes its connection
  # string as one value, so the string is what has to stay off `environment:`.
  miniflux_database_url:
    file: /mnt/data/secrets/docker/miniflux_database_url
  miniflux_admin_password:
    file: /mnt/data/secrets/docker/miniflux_admin_password
  # Forgejo has no CREATE_ADMIN equivalent — the account is made by a one-shot
  # CLI call on first deploy, which reads the password from this file rather
  # than taking it as an argument on the host.
  forgejo_admin_password:
    file: /mnt/data/secrets/docker/forgejo_admin_password

networks:
  proxy:
    external: true
  internal:
    driver: bridge
  # Traefik <-> docker-socket-proxy only; internal:true = no outside route.
  socketproxy:
    driver: bridge
    internal: true

# =============================================================================
# Phase 2 — Network infrastructure
# =============================================================================

services:

  # --- Docker socket proxy ---
  # Traefik must NOT mount the raw docker.sock: `:ro` only makes the socket file
  # read-only, not the API — a container holding it has full Docker control =
  # host root (a real proxy-RCE -> host-root chain given Traefik's 2025 CVE
  # history). This read-only proxy exposes ONLY the container-list endpoint
  # Traefik needs (CONTAINERS=1; POST stays 0), on an internal-only network.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: socket-proxy
    restart: unless-stopped   # Tier 0: Traefik depends on it at boot
    # NO read_only (#32): the entrypoint generates haproxy.cfg from the template
    # sitting next to it. Measured: exit code 1, "can't create
    # /usr/local/etc/haproxy/haproxy.cfg". Same reason as nextcloud — the write
    # target shares a directory with content the image provides.
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    environment:
      CONTAINERS: 1   # Traefik reads the container list; EVENTS/PING default on
      # Dozzle calls GET /info at startup and treats a 403 as "no engine": it
      # logs "Could not connect to any Docker Engine" and **exits 1**. Measured
      # on a throwaway pair — same image, same flags, INFO=0 exits 1 and INFO=1
      # reaches "Connected to Docker". Worth naming because the failure looks
      # like a broken socket path rather than a missing permission, and because
      # the cost is shared: Traefik and Netdata gain /info too. What that
      # endpoint returns is daemon metadata — kernel, OS, storage driver,
      # container counts, registry config — with no Env array and no secret in
      # it, and Netdata already reports all of it by design.
      INFO: 1         # Dozzle: fatal at startup without it
      POST: 0         # deny all writes (default, made explicit)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socketproxy
    # Without this the container is invisible to the health report, which only
    # looks at `docker ps --filter health=unhealthy` — and this failure is the
    # silent kind: with HAProxy frozen, Traefik kept answering 200 from its
    # in-memory routes (measured), so nothing looks wrong while it has actually
    # gone blind to container changes and would come up with an empty routing
    # table on its next restart. Probes /_ping *through the proxy* rather than
    # the port, since a HAProxy that listens but no longer reaches the socket
    # still passes a `nc -z` (PING is allowed by default).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Traefik (Reverse Proxy) ---
  traefik:
    image: traefik:v3.7.10
    container_name: traefik
    restart: unless-stopped   # Tier 0: auto-start at boot (see stack-startup role)
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    cap_add:
      # Binds :80 and :443 inside the container.
      - NET_BIND_SERVICE
      # Reads traefik.yml and the dynamic dir, which Ansible renders 0640
      # <user>:docker inside 0750 directories, while the process runs as root:
      # without this it dies in a restart loop on "permission denied" (measured).
      # The read-only override is enough — acme.json is root-owned, so the ACME
      # store rewrites it in place with no directory write involved.
      - DAC_READ_SEARCH
    read_only: true
    tmpfs:
      # Nothing was observed being written here, but lego writes temporary files
      # during a challenge — a failure would only surface at the next renewal.
      - /tmp:size=16m
    environment:
      # Scoped Cloudflare token for the ACME DNS-01 challenge (ADR-014), as a
      # file so it stays out of `docker inspect` (ADR-016). lego — which drives
      # the challenge inside Traefik — accepts a _FILE suffix on any of its
      # provider variables.
      CF_DNS_API_TOKEN_FILE: /run/secrets/cf_dns_api_token
    secrets:
      - cf_dns_api_token
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # docker.sock is now reached via socket-proxy (tcp), never mounted here
      - ${SERVICES_DATA_DIR}/traefik/acme:/acme
      - ./configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./configs/traefik/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      - socket-proxy
    networks:
      - proxy
      - socketproxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`proxy.${DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Pi-hole (DNS + Ad blocking) ---
  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    restart: unless-stopped   # Tier 0: auto-start at boot (see stack-startup role)
    # NO read_only (#32), and this is the sharpest case for measuring instead of
    # reasoning: with a read-only rootfs the container still reports **Up**, but
    # `setcap` on /usr/bin/pihole-FTL fails silently, getcap comes back empty,
    # FTL never starts and :53 refuses connections. A read-only rootfs would turn
    # a loud failure into the invisible kind — the opposite of the goal.
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    cap_add:
      # FTL binds :53 (and :80/:443 for the UI), sets its own scheduling
      # priority, chowns its logs/database when started as pihole rather
      # than root, and switches to uid 1000 to run. NET_ADMIN/SYS_TIME are
      # deliberately absent: the docs tie both to DHCP and embedded NTP,
      # and pihole.toml has dhcp.active = false.
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - SYS_NICE
      # The image runs `setcap` on the pihole-FTL binary so FTL can serve :53 as
      # uid 1000 instead of root. Without SETFCAP that step fails hard — "Unable
      # to set capabilities for pihole-FTL. Cannot run as non-root" — and the
      # container exits in 6 s. The documented alternative (DNSMASQ_USER=root)
      # would trade this capability for running the resolver as root; refused.
      - SETFCAP
      # start.sh runs as root over an /etc/pihole owned by uid 1000: it writes
      # `versions` and chmods the tree. Without these two the container still
      # resolves, but starts degraded with a run of "Permission denied" and
      # "Operation not permitted" — a half-configured state, not a clean one.
      # This one cannot be retired the way the databases were (#28): the root
      # phase is not an accident of ownership, it is where `setcap` happens, and
      # FTL must then run as uid 1000. Two identities share one tree, so no
      # ownership settles it and `user:` would break the setcap step.
      - DAC_OVERRIDE
      - FOWNER
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      TZ: ${TZ}
      FTLCONF_dns_listeningMode: all
      FTLCONF_misc_etc_dnsmasq_d: "true"
      # Upstream = the cloudflared sidecar (DoH to Quad9), reached at 127.0.0.1
      # because cloudflared shares this container's netns (network_mode below).
      # Codified here (was manual pihole.toml drift); FTLCONF locks it (ADR-015).
      FTLCONF_dns_upstreams: 127.0.0.1#5053
    volumes:
      - ${SERVICES_DATA_DIR}/pihole/etc:/etc/pihole
      - ${SERVICES_DATA_DIR}/pihole/dnsmasq:/etc/dnsmasq.d
      - ./configs/pihole/05-homelab.conf:/etc/dnsmasq.d/05-homelab.conf:ro
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`dns.${DOMAIN}`)"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls.certresolver=letsencrypt"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "dig", "+norecurse", "+retry=0", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 5s
      retries: 3
      # FTL reloads gravity at a cold start and can miss checks for a while
      # under boot load; don't flag unhealthy (Traefik drops unhealthy
      # containers from routing) while it warms up.
      start_period: 120s

  # --- cloudflared (encrypted DNS-over-HTTPS upstream for Pi-hole) ---
  # Pi-hole forwards to 127.0.0.1#5053; this container shares Pi-hole's network
  # namespace (network_mode below), so 127.0.0.1 IS Pi-hole. cloudflared then
  # proxies over DoH (HTTP/2, RFC 8484) to Quad9 — no cleartext DNS to the ISP,
  # upstream choice under version control (ADR-015). No bootstrap loop: the host
  # resolves via 1.1.1.1/8.8.8.8 (Docker's embedded DNS), never Pi-hole.
  # Pi-hole's ONLY upstream: every name the LAN and the VPN resolve leaves
  # through here, encrypted. Replaced cloudflared on 2026-07-27 (ADR-015, issue
  # #50) — Cloudflare removed the `proxy-dns` feature in 2026.2.0, and the new
  # image exits at once with "dns-proxy feature is no longer supported", so the
  # container this stack depended on stopped existing rather than breaking.
  dnsproxy:
    image: adguard/dnsproxy:v0.83.2
    container_name: dnsproxy
    restart: unless-stopped   # Tier 0: Pi-hole's only upstream — must stay up
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    cap_add:
      # Not for the port — :5053 is unprivileged. The binary carries
      # cap_net_bind_service as a FILE capability, and a file-capability binary
      # cannot even be exec'd when that capability is outside the bounding set:
      # `exec /opt/dnsproxy/dnsproxy: operation not permitted` (measured). Same
      # mechanism as ping in uptime-kuma and pihole-FTL (ADR-017).
      - NET_BIND_SERVICE
    read_only: true          # measured: writes nothing, configured by flags alone
    # Sharing Pi-hole's netns has a consequence worth stating where it is
    # created: **restarting Pi-hole silently kills this container's networking**.
    # Docker tears the namespace down and builds a new one; dnsproxy stays up,
    # stays healthy, and is attached to the dead one. Pi-hole then has no
    # upstream and the whole LAN loses DNS while both containers read green.
    # Always restart the pair, in this order (the deploy handler does):
    #   docker restart pihole && docker restart dnsproxy
    network_mode: "service:pihole"   # share Pi-hole's netns → reachable at 127.0.0.1#5053
    command:
      - "-l"
      - "127.0.0.1"
      - "-p"
      - "5053"
      # Upstreams addressed by IP on purpose. A service that *is* the DNS path
      # must not need DNS to start: the hostname form works today (measured
      # inside Pi-hole's namespace), but it would depend on Docker's embedded
      # resolver and on the host's own DNS being up at boot. Quad9's certificate
      # carries IP SANs, so TLS validation is unchanged — this is not a
      # downgrade to an unverified connection.
      - "-u"
      - "https://9.9.9.9/dns-query"
      - "-u"
      - "https://149.112.112.112/dns-query"
    depends_on:
      - pihole

  # --- WireGuard VPN ---
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.3.0
    container_name: wg-easy
    restart: unless-stopped   # Tier 0: auto-start at boot (see stack-startup role)
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    cap_add:
      - NET_ADMIN
      # wg-quick shells out to iptables for the NAT/forward rules, and iptables
      # opens a raw socket to talk to netfilter. Without NET_RAW it fails with
      # "can't initialize iptables table `nat': Permission denied", wg-quick
      # exits 3 and the container crash-loops — the VPN and the offsite link
      # with it. Verified in a sandbox: with NET_RAW, wg0 comes up in 5 s and
      # the MASQUERADE rule is installed.
      #
      # v14 also needed SYS_MODULE; v15 does not. Measured in the #48 sandbox:
      # the interface comes up with all peers on NET_ADMIN + NET_RAW alone.
      #
      # No DAC_OVERRIDE on purpose, with a caveat: /mnt/data/services/wireguard
      # is owned by the host user while the files inside it are root's, so the
      # in-place rewrites wg-easy performs when clients change do work
      # (measured), but creating a *new* file there would be denied. Chowning
      # that directory to root would remove the caveat without a capability.
      - NET_RAW
    read_only: true
    tmpfs:
      - /run:size=8m           # xtables.lock; the SQLite DB is on the bind mount
      - /tmp:size=8m           # node scratch; both were mounted when measured
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821"  # Web UI, localhost only (access via SSH tunnel)
    # v15 keeps its configuration in SQLite, not in the environment: WG_HOST,
    # PASSWORD_HASH, WG_DEFAULT_DNS and WG_ALLOWED_IPS no longer exist. Ansible
    # keeps ownership by re-asserting them through the admin API on every deploy
    # (roles/deploy/tasks/wg_easy_config.yml) — see ADR-020.
    environment:
      # Traefik terminates TLS; without this v15 refuses to serve over HTTP.
      INSECURE: "true"
      # This host has no global IPv6 (no address, no default route). Left on,
      # v15 emits ip6tables rules through its bundled LEGACY iptables binaries,
      # the ip6_tables module is absent from a host running the nf_tables
      # backend, wg-quick exits 3 and NO tunnel comes up — while the container
      # stays green. Measured in the #48 sandbox. See ADR-020.
      DISABLE_IPV6: "true"
    volumes:
      - ${SERVICES_DATA_DIR}/wireguard:/etc/wireguard
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wireguard.rule=Host(`vpn.${DOMAIN}`)"
      - "traefik.http.routers.wireguard.entrypoints=websecure"
      - "traefik.http.routers.wireguard.tls.certresolver=letsencrypt"
      - "traefik.http.services.wireguard.loadbalancer.server.port=51821"

  # =============================================================================
  # Phase 3 — Essential services
  # =============================================================================

  # --- Nextcloud ---
  nextcloud:
    image: nextcloud:34.0.2-apache
    container_name: nextcloud
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    # NO read_only (#32): the entrypoint writes redis-session.ini into
    # /usr/local/etc/php/conf.d, which also holds the 21 .ini files the image
    # ships. Measured: exit code 2, "cannot create .../redis-session.ini". A
    # tmpfs there would hide every PHP extension config, and pre-rendering the
    # directory on the host would silently swallow whatever the next image
    # version adds to it.
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    cap_add:
      # Apache binds :80 then drops to www-data (uid 33), and the entrypoint
      # fixes ownership of config/ and data/ on every start.
      # Kept deliberately (#28): running the container as uid 33, as the
      # databases now do, would take the port away rather than the capability —
      # a non-root process has an empty permitted set, so NET_BIND_SERVICE
      # becomes inert and apache can no longer bind :80.
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    environment:
      # No MYSQL_*/NEXTCLOUD_ADMIN_* here on purpose. The entrypoint reads them
      # only inside `if [ "$installed_version" = "0.0.0.0" ]` — i.e. on a first
      # install. This instance is installed, and its DB credentials live in
      # config.php, so those variables were dead weight leaking the DB password
      # into `docker inspect`. Consequence, accepted: a from-scratch deployment
      # now goes through the Nextcloud web installer instead of self-installing.
      # That is not the recovery path anyway — the runbook restores config.php
      # and the data volume (knowledge/runbooks/restore-from-backup.md).
      # "nextcloud" is needed so the notify_push service can reach NEXTCLOUD_URL=http://nextcloud
      NEXTCLOUD_TRUSTED_DOMAINS: drive.${DOMAIN} nextcloud
      OVERWRITEPROTOCOL: https
      # /12 covers all Docker subnets (Traefik on proxy + notify_push on internal)
      TRUSTED_PROXIES: 172.16.0.0/12
      OVERWRITECLIURL: https://drive.${DOMAIN}
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_MAINTENANCE_WINDOW_START: "4"
      # For the JVM LibreSign spawns to sign PDFs, not for PHP (ADR-022).
      # The image sets no locale, so Java 21 derives its *native* encoding from
      # the environment and lands on ANSI_X3.4-1968 — plain ASCII. Measured in
      # the running container:
      #   native.encoding = ANSI_X3.4-1968   sun.jnu.encoding = ANSI_X3.4-1968
      # file.encoding is UTF-8 regardless since JEP 400, which is why this is
      # easy to miss: strings inside the JVM are fine, while the *boundary* is
      # not — sun.jnu.encoding is what decodes the arguments and file paths
      # handed to JSignPdf. Every accented character in a document name or a
      # signature reason crosses that boundary. With these two set, the same
      # command reports UTF-8 for all four encodings.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - ${SERVICES_DATA_DIR}/nextcloud/data:/var/www/html
      # Media libraries mounted read-only for browsing via External Storage
      # (no copy, no sync — Immich/Jellyfin/Navidrome stay the players)
      - ${MEDIA_DIR}/photos:/external/photos:ro
      - ${MEDIA_DIR}/music:/external/music:ro
      - ${MEDIA_DIR}/videos:/external/videos:ro
    # Pin drive.<domain> to the Pi's LAN IP so internal requests (notify_push
    # self-test) reach Traefik over TCP/443 instead of hairpinning to the public
    # IP. (A dns: Pi-hole entry doesn't work here — UDP/53 hairpin to the host
    # fails from this container, while TCP/443 to the LAN IP works.)
    extra_hosts:
      - "drive.${DOMAIN}:${PI_LAN_IP}"
      # richdocuments fetches the WOPI discovery from `wopi_url` and hands the
      # browser the `urlsrc` it finds there *verbatim* — Collabora builds that
      # value from the Host header, so wopi_url must be the public name, and
      # this container must therefore be able to reach it. Split DNS only, so
      # the pin is what makes it resolvable at all (ADR-021).
      - "office.${DOMAIN}:${PI_LAN_IP}"
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`drive.${DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-headers@file"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  nextcloud-db:
    image: mariadb:12.3.2
    container_name: nextcloud-db
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      # The leaf, not /run: a tmpfs on /run would erase the image's own
      # /run/mysqld and mariadbd does not recreate it ("Bind on unix socket: No
      # such file or directory", measured).
      - /run/mysqld
      # InnoDB creates temporary files at startup and aborts without them.
      - /tmp:size=256m
    # No capability at all: running as mysql from PID 1 removes the root phase
    # the entrypoint would otherwise go through (chown the datadir, then exec as
    # uid 999), and with it CHOWN/SETUID/SETGID/DAC_OVERRIDE/FOWNER — five
    # capabilities that existed only to serve a hand-off we can skip (#28). The
    # datadir is owned by 999 by the storage role, which is what makes this safe
    # on a fresh provision too. The image supports it: it declares no USER and
    # its entrypoint skips the gosu hand-off when already non-root.
    user: "999:999"
    environment:
      # Without this the entrypoint logs "MariaDB upgrade required, but skipped"
      # and starts anyway on system tables from the previous major — measured on
      # the 11.8 → 12.3 bump. The upgrade it runs is one-way, so an image
      # rollback past a major needs a datadir restore, not just a tag change.
      MARIADB_AUTO_UPGRADE: "1"
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/nextcloud_db_root_password
      MYSQL_DATABASE: ${NEXTCLOUD_DB_NAME}
      MYSQL_USER: ${NEXTCLOUD_DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/nextcloud_db_password
    secrets:
      - nextcloud_db_root_password
      - nextcloud_db_password
    volumes:
      - ${SERVICES_DATA_DIR}/nextcloud/db:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 3

  nextcloud-redis:
    image: redis:8.10.0-alpine
    container_name: nextcloud-redis
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true          # measured: no volume and no write outside its socket
    # redis 8 no longer declares VOLUME /data, so on a read-only rootfs the RDB
    # snapshot fails and redis then DISABLES ALL WRITES (stop-writes-on-bgsave-
    # error). Measured the hard way: both caches accepted reads and writes for
    # minutes, then the first background save failed and took the Nextcloud
    # upgrade down with it. These caches hold nothing worth keeping across a
    # restart — they never had a volume — so the honest fix is to stop saving
    # rather than hand a cache a disk.
    command: ["redis-server", "--save", ""]
    # Same treatment as the databases, and even simpler here: no volume at all,
    # so there is nothing for the entrypoint's root phase to chown (#28).
    user: "999:999"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Companion container running Nextcloud background jobs every 5 min
  # (system cron, more reliable than AJAX). Shares the data volume.
  nextcloud-cron:
    image: nextcloud:34.0.2-apache
    container_name: nextcloud-cron
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    cap_add:
      # busybox crond runs the cron job as www-data. Tried and reverted under
      # #28: starting the container as uid 33 leaves crond unable to
      # setgroups() before the job, so it logs "can't set groups: Operation not
      # permitted" and **silently never runs cron.php** — the container stays
      # Up, and only `occ config:app:get core lastcron` shows it. The drop is
      # unconditional in busybox, so the capability is the price of using it.
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /run:size=8m           # crond.pid, crond.reboot
      - /tmp:size=32m          # PHP temporary files during the cron run
    entrypoint: /cron.sh
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    volumes:
      - ${SERVICES_DATA_DIR}/nextcloud/data:/var/www/html
    networks:
      - internal

  # Real-time update push to sync clients (websocket). Runs the notify_push
  # binary shipped by the app; the until-loop waits for it to be installed.
  nextcloud-notify-push:
    image: nextcloud:34.0.2-apache
    container_name: nextcloud-notify-push
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true          # measured: runs a single binary out of the mounted app directory
    cap_add:
      # Only *reads* Nextcloud's config.php, owned by www-data — the narrower
      # read/traverse override is enough, no write bypass needed.
      - DAC_READ_SEARCH
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    environment:
      PORT: "7867"
      NEXTCLOUD_URL: http://nextcloud
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until [ -x /var/www/html/custom_apps/notify_push/bin/aarch64/notify_push ];
        do echo 'waiting for notify_push binary'; sleep 5; done;
        exec /var/www/html/custom_apps/notify_push/bin/aarch64/notify_push
        /var/www/html/config/config.php
    volumes:
      - ${SERVICES_DATA_DIR}/nextcloud/data:/var/www/html
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notify-push.rule=Host(`drive.${DOMAIN}`) && PathPrefix(`/push`)"
      - "traefik.http.routers.notify-push.priority=100"
      - "traefik.http.routers.notify-push.entrypoints=websecure"
      - "traefik.http.routers.notify-push.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.notify-push-strip.stripprefix.prefixes=/push"
      - "traefik.http.routers.notify-push.middlewares=notify-push-strip"
      - "traefik.http.services.notify-push.loadbalancer.server.port=7867"

  # --- Collabora Online (collaborative editing inside Nextcloud) ---
  collabora:
    image: collabora/code:26.04.3.1.1
    container_name: collabora
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    # NO no-new-privileges here (the second exception after netdata, and for the
    # same underlying reason: a binary that must gain privilege after exec).
    # coolwsd spawns documents through `coolforkit-caps`, which carries file
    # capabilities; no-new-privileges blocks that gain and the failure is silent
    # — the container stays `running` and loops on "Waiting for a new child"
    # forever, serving /hosting/discovery the whole time. Measured in the #16
    # sandbox. The image's own healthcheck does catch it (unhealthy after ~3
    # checks), which is why it is left enabled below.
    cap_drop: *cap-drop-all
    cap_add:
      # Exactly the three the sandbox proved necessary: removing any one of them
      # leaves coolwsd unable to spawn its forkit and it exits 70 at startup.
      # MKNOD is NOT among them, despite Collabora's own documentation.
      - SYS_CHROOT             # each document runs in its own chroot jail
      - CHOWN                  # jail contents are re-owned as they are built
      - FOWNER                 # …and their modes adjusted, across uids
    # No read_only. It *works* (leaf tmpfs on child-roots/cache/.cache), but
    # without CAP_SYS_ADMIN coolmount cannot create its mount namespace, so
    # Collabora falls back from bind-mounting each jail to copying it: 759 MB of
    # jail tree. On the writable layer that lands on /mnt/data (3.7 TB free); in
    # tmpfs it is RAM, and the container measured 1.257 GiB instead of 573 MiB.
    # Granting SYS_ADMIN to avoid the copy is not a trade worth making on a stack
    # where 12 of 21 containers hold no capability at all. See ADR-021.
    environment:
      # WOPI hosts allowed to embed this server. Without an entry here Collabora
      # refuses the Nextcloud origin outright.
      aliasgroup1: https://drive.${DOMAIN}:443
      # TLS is terminated by Traefik; coolwsd itself speaks plain HTTP and must
      # be told so, or it answers TLS on the plain port and every request fails.
      extra_params: --o:ssl.enable=false --o:ssl.termination=true
    # Collabora calls Nextcloud back over the public hostname (the WOPI callback
    # is autodetected from the browsing URL). From a container that name does not
    # resolve *at all* — the host is not a Pi-hole client, and the name exists
    # only in split DNS — so without this pin every document fails to open while
    # the container stays green. Measured, not assumed (issue #16).
    extra_hosts:
      - "drive.${DOMAIN}:${PI_LAN_IP}"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.collabora.rule=Host(`office.${DOMAIN}`)"
      - "traefik.http.routers.collabora.entrypoints=websecure"
      - "traefik.http.routers.collabora.tls.certresolver=letsencrypt"
      - "traefik.http.services.collabora.loadbalancer.server.port=9980"

  # --- Vaultwarden ---
  vaultwarden:
    image: vaultwarden/server:1.37.1
    container_name: vaultwarden
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true          # measured: its only image-layer entries are the secret mount points
    cap_add:
      # Binds :80 inside the container (Traefik terminates TLS).
      - NET_BIND_SERVICE
    environment:
      DOMAIN: https://vault.${DOMAIN}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      # Admin panel kept token-protected (argon2 hash, behind vpn-only, on a
      # patched version >=1.33.0). "Disable by default" was dropped: never use
      # DISABLE_ADMIN_TOKEN (it BYPASSES the token = opens /admin), and an empty
      # ADMIN_TOKEN did not cleanly disable the panel with a vault-rendered token.
      # Vaultwarden reads any setting from <VAR>_FILE (verified: DOMAIN_FILE
      # produces the same validation error as DOMAIN).
      ADMIN_TOKEN_FILE: /run/secrets/vaultwarden_admin_token_hash
      PASSWORD_HINTS_ALLOWED: "false"   # never store/serve master-password hints
      SHOW_PASSWORD_HINT: "false"       # no hint on failed login (also aids user-enum)
      DISABLE_ICON_DOWNLOAD: "true"     # no server-side favicon fetches (SSRF/egress)
      SENDS_ALLOWED: "false"            # Send file/text sharing unused — drop the surface
      # A log FILE, because fail2ban cannot read a container's stdout (#35).
      # It lands inside the existing /data bind mount, so the read-only rootfs
      # is untouched; the host rotates it (copytruncate — vaultwarden holds the
      # descriptor open).
      LOG_FILE: /data/logs/vaultwarden.log
      LOG_LEVEL: warn                   # failed logins are logged at ERROR
    secrets:
      - vaultwarden_admin_token_hash
    volumes:
      - ${SERVICES_DATA_DIR}/vaultwarden:/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/alive"]
      interval: 30s
      timeout: 5s
      retries: 3

  # =============================================================================
  # Phase 4 — Secondary services
  # =============================================================================

  # --- Jellyfin (Video) ---
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      # Leaf mounts, never the parent: /jellyfin holds the application itself.
      - /tmp:size=64m                    # .NET debug pipes and diagnostic sockets
      - /root/.aspnet:size=8m            # DataProtection keys — regenerated at each
                                         # start today too, nothing is lost
      - /var/cache/fontconfig:size=16m   # rebuilt on demand
      - /jellyfin/Dictionaries:size=8m
    environment:
      JELLYFIN_PublishedServerUrl: https://videos.${DOMAIN}
    volumes:
      - ${SERVICES_DATA_DIR}/jellyfin/config:/config
      - ${SERVICES_DATA_DIR}/jellyfin/cache:/cache
      - ${MEDIA_DIR}/videos:/media/videos:ro
      - ${MEDIA_DIR}/music:/media/music:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`videos.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=letsencrypt"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Navidrome (Music) ---
  navidrome:
    image: deluan/navidrome:0.63.2
    container_name: navidrome
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true          # measured: writes only into the mounted /data and /music
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_BASEURL: ""
    volumes:
      - ${SERVICES_DATA_DIR}/navidrome:/data
      - ${MEDIA_DIR}/music:/music:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.navidrome.rule=Host(`music.${DOMAIN}`)"
      - "traefik.http.routers.navidrome.entrypoints=websecure"
      - "traefik.http.routers.navidrome.tls.certresolver=letsencrypt"
      - "traefik.http.services.navidrome.loadbalancer.server.port=4533"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Immich (Photos) ---
  immich-server:
    # Pinned version (floating 'release' once turned a restore into a surprise
    # v3 upgrade); bump deliberately, server and ML together.
    image: ghcr.io/immich-app/immich-server:v3.0.1
    container_name: immich-server
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /data:size=8m          # created empty by the entrypoint; the real upload
                               # path is the bind mount below
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_started
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: ${IMMICH_DB_USER}
      # start.sh exports DB_PASSWORD from this file, then unsets DB_PASSWORD_FILE
      DB_PASSWORD_FILE: /run/secrets/immich_db_password
      DB_DATABASE_NAME: ${IMMICH_DB_NAME}
      REDIS_HOSTNAME: immich-redis
    secrets:
      - immich_db_password
    volumes:
      - ${SERVICES_DATA_DIR}/immich/upload:/usr/src/app/upload
      - ${MEDIA_DIR}/photos:/usr/src/app/external:ro
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`photos.${DOMAIN}`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.tls.certresolver=letsencrypt"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"

  immich-machine-learning:
    # Pinned: must match immich-server (see above)
    image: ghcr.io/immich-app/immich-machine-learning:v3.0.1
    container_name: immich-ml
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      # matplotlib insists on a writable home; the model cache is a bind mount.
      - /root/.cache:size=32m
      - /root/.config:size=8m
      - /tmp:size=64m
    volumes:
      - ${SERVICES_DATA_DIR}/immich/ml-cache:/cache
    networks:
      - internal

  immich-redis:
    image: redis:8.10.0-alpine
    container_name: immich-redis
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true          # measured: no volume and no write outside its socket
    # redis 8 no longer declares VOLUME /data, so on a read-only rootfs the RDB
    # snapshot fails and redis then DISABLES ALL WRITES (stop-writes-on-bgsave-
    # error). Measured the hard way: both caches accepted reads and writes for
    # minutes, then the first background save failed and took the Nextcloud
    # upgrade down with it. These caches hold nothing worth keeping across a
    # restart — they never had a volume — so the honest fix is to stop saving
    # rather than hand a cache a disk.
    command: ["redis-server", "--save", ""]
    # Same treatment as the databases, and even simpler here: no volume at all,
    # so there is nothing for the entrypoint's root phase to chown (#28).
    user: "999:999"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  immich-db:
    # Official Immich postgres (VectorChord + legacy pgvecto.rs): required by
    # Immich v3, which dropped pgvecto.rs. Same PG major (16) as the previous
    # tensorchord/pgvecto-rs image, so the data files load as-is; the extension
    # migration itself is run by immich-server on startup (one-way — do not
    # downgrade the DB image afterwards).
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-db
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      - /run/postgresql        # same leaf rule as nextcloud-db
      - /tmp:size=128m
      - /etc/postgresql        # the entrypoint writes postgresql.conf here, and
                               # the directory holds nothing else
    # Same reasoning as nextcloud-db: no root phase, therefore no capability.
    # Postgres additionally *requires* the datadir to belong to the uid it runs
    # as, so this is the direction the image was pushing us in anyway.
    user: "999:999"
    environment:
      POSTGRES_USER: ${IMMICH_DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/immich_db_password
      POSTGRES_DB: ${IMMICH_DB_NAME}
      DB_STORAGE_TYPE: "HDD"   # tunes VectorChord for spinning disks
    secrets:
      - immich_db_password
    volumes:
      - ${SERVICES_DATA_DIR}/immich/db:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${IMMICH_DB_NAME} -U ${IMMICH_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Transmission (BitTorrent) ---
  transmission:
    image: linuxserver/transmission:4.1.3-r0-ls354
    container_name: transmission
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    # NO read_only (#32) — and here the image says so itself. Under a read-only
    # rootfs the linuxserver init prints "UMASK, custom services & docker mod
    # functionality will be disabled and the PUID/PGID environment variables will
    # have no effect". Both matter: PUID/PGID own the downloads, and UMASK 022 is
    # there because downloads were landing world-writable (CIS 7.1.11). The
    # container does start read-only — it just quietly stops honouring two
    # settings we rely on, which is a worse trade than the writable layer.
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    cap_add:
      # linuxserver s6 init chowns the config tree and drops to abc
      # (uid 1000) — PUID/PGID is exactly this mechanism. Kept (#28): the s6
      # init model *is* the root phase, so setting `user:` here would not
      # simplify it but disable it — the images document PUID/PGID as the
      # supported way, and it needs these capabilities to work.
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # Downloads were landing world-writable (CIS 7.1.11 finding, 2026-07)
      UMASK: "022"
      USER: ${TRANSMISSION_USER}
      # linuxserver convention: FILE__<VAR> is read into <VAR> at init. It does
      # NOT strip a trailing newline (init-envfile only warns), which is why the
      # deploy role writes the secret files without one.
      FILE__PASS: /run/secrets/transmission_password
      PEERPORT: 51413
      HOST_WHITELIST: "127.0.0.1,*.lan,*.local,*.localhost,share.${DOMAIN}"
      WHITELIST: "127.0.0.1,172.*.*.*"
    secrets:
      - transmission_password
    volumes:
      - ${SERVICES_DATA_DIR}/transmission/config:/config
      - ${SERVICES_DATA_DIR}/transmission/downloads:/downloads
      - ${SERVICES_DATA_DIR}/transmission/watch:/watch
    ports:
      - "51413:51413/tcp"
      - "51413:51413/udp"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host(`share.${DOMAIN}`)"
      - "traefik.http.routers.transmission.entrypoints=websecure"
      - "traefik.http.routers.transmission.tls.certresolver=letsencrypt"
      - "traefik.http.services.transmission.loadbalancer.server.port=9091"
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "--max-time", "5", "http://localhost:9091/transmission/web/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # =============================================================================
  # Phase 5 — Observability
  # =============================================================================

  # --- Uptime Kuma ---
  # Upgrades are NOT routine here: Kuma runs knex migrations at start and exits 1
  # before listening if one fails, and since this container is the monitoring,
  # that failure raises no alarm. 2.5.0 needed a manual intervention to start at
  # all (fix-stat-daily-overflow aborts the SQLite table rebuild). Renovate holds
  # it off the weekly batch; back the DB up and read the runbook first:
  # knowledge/runbooks/uptime-kuma-migration-failure.md
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.0
    container_name: uptime-kuma
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true          # measured: everything it keeps is in the mounted /app/data
    cap_add:
      # Kuma spawns /usr/bin/ping, which carries cap_net_raw=ep as a file
      # capability. Under cap_drop ALL that capability is outside the bounding
      # set, so the exec itself fails and every ping-type monitor reports
      # "spawn EPERM" — while the container stays healthy and the web UI keeps
      # answering. Found by the monitoring, not by an HTTP probe.
      - NET_RAW
    dns:
      - ${PI_LAN_IP}
    volumes:
      - ${SERVICES_DATA_DIR}/uptime-kuma:/app/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`services.${DOMAIN}`)"
      - "traefik.http.routers.uptime.entrypoints=websecure"
      - "traefik.http.routers.uptime.tls.certresolver=letsencrypt"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"

  # --- SearXNG (private metasearch) ---
  searxng:
    image: searxng/searxng:2026.7.13-9e25585ae
    container_name: searxng
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      # Engine and data caches (sqlite). update-ca-certificates also fails
      # read-only, which is harmless: no extra CA is injected, so the image's
      # own bundle is what is used either way (verified).
      - /tmp:size=64m
    volumes:
      # The settings file itself, not the directory around it: a symlink inside a
      # bind-mounted directory is resolved in the container's namespace, so the
      # previous ./configs/searxng mount left SearXNG with a dangling link, a
      # stub config and a secret_key regenerated at every start (issue #27).
      # Read-only, 0444 root, from the LUKS secrets dir — same reasoning as the
      # Docker secrets in ADR-016, since this file embeds secret_key.
      # The image declares VOLUME /etc/searxng, so the directory itself is an
      # anonymous volume and this file is mounted on top of it. Consequence when
      # changing this line: Compose carries the previous mount over on recreate,
      # so the container must be *removed*, not recreated — see
      # knowledge/runbooks/container-config-changes.md.
      - /mnt/data/secrets/docker/searxng_settings:/etc/searxng/settings.yml:ro
      # Gerbier branding: recoloured stylesheet (+ optional logo) overlaid on the
      # stock theme, built by the deploy role (docker/branding/searxng). Read-only.
      - ./branding/searxng/out/sxng-ltr.min.css:/usr/local/searxng/searx/static/themes/simple/sxng-ltr.min.css:ro
      - ./branding/searxng/out/sxng-ltr.min.css.br:/usr/local/searxng/searx/static/themes/simple/sxng-ltr.min.css.br:ro
      - ./branding/searxng/out/sxng-ltr.min.css.gz:/usr/local/searxng/searx/static/themes/simple/sxng-ltr.min.css.gz:ro
    environment:
      SEARXNG_BASE_URL: https://search.${DOMAIN}/
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`search.${DOMAIN}`)"
      - "traefik.http.routers.searxng.entrypoints=websecure"
      - "traefik.http.routers.searxng.tls.certresolver=letsencrypt"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"

  # --- Netdata ---
  netdata:
    image: netdata/netdata:v2.10.4
    container_name: netdata
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    # Netdata's plugins are **setuid root** (4755: apps.plugin, cgroup-network,
    # go.d.plugin, network-viewer…), which is why no-new-privileges is absent
    # below. A setuid binary still only gets the container's bounding set, so
    # cap_drop decides what those plugins can do — and dropping too much backfires
    # in a way no status check shows: without CHOWN the agent cannot prepare its
    # own directories, never drops to uid 201, and runs entirely as root
    # (measured). Every cap here was established by running a throwaway agent and
    # diffing its plugin processes and chart contexts against this one (#24).
    cap_drop: *cap-drop-all
    cap_add:
      - SYS_PTRACE             # apps.plugin: read /host/proc for per-process charts
      - DAC_OVERRIDE           # the setuid-root plugins write into /run/netdata,
                               # owned by uid 201. Without it network-viewer's
                               # spawn server fails to bind and go.d service
                               # discovery (local-listeners) dies — while all 279
                               # chart contexts stay present, so charts alone
                               # would have called this a success.
                               # Out of reach of #28's fix: that directory lives
                               # inside the container, so no host ownership
                               # changes it, and the agent already runs as 201
      - CHOWN                  # prepares /run, /var/cache, /var/lib as 201:201
      - SETUID                 # …then drops from root to netdata (uid 201)
      - SETGID
      # SYS_ADMIN stays removed — it only powered ebpf.plugin (advanced eBPF
      # charts); core/system/apps/container charts are unaffected, and
      # SYS_ADMIN ~= host root. Consequence already visible before this change:
      # cgroup-network cannot enter other containers' namespaces ("Cannot switch
      # to network namespace"), so SYS_CHROOT is left out too — granting it alone
      # would only move that log line, not restore the path.
      # NET_RAW is absent as well: only /usr/bin/fping needs it (it carries
      # cap_net_raw) and no ping collector is configured. Add it back the day one
      # is, or the collector will fail at exec with nothing else looking wrong.
    security_opt:
      # NO no-new-privileges here (one of two exceptions, with collabora — whose
      # coolforkit-caps needs the same gain via file capabilities): the plugins are setuid
      # root (4755, verified — not file capabilities as this comment previously
      # claimed) and need that elevation to read other processes' /proc for
      # per-app charts. no-new-privileges blocks the setuid gain outright and
      # floods the log with EPERM. The big wins (SYS_ADMIN + raw
      # docker.sock) are already removed, so this residual is acceptable.
      # Scoped profile instead of the `unconfined` this carried until #30:
      # docker-default plus a ptrace **read** grant, which is all apps.plugin
      # ever needed from unconfined (it reads /host/proc/<pid>/* for processes
      # confined by other profiles). Attaching to a process — ptrace trace —
      # stays denied. The profile is installed and loaded by the deploy role;
      # if it is missing the container does not start at all, which is the
      # failure mode we want rather than a silent fall back to unconfined.
      - apparmor=homelab-netdata
    read_only: true
    tmpfs:
      # Leaf mounts only. /run ships adduser/lock/log and /var/log/netdata is a
      # set of symlinks to /dev/stdout — a tmpfs on either parent would destroy
      # them and turn the agent's logs into files growing in RAM.
      - /run/netdata:size=8m          # spawn-server sockets and the plugin pipe
      - /tmp:size=32m                 # /tmp/netdata
      - /var/log/netdata/otel:size=16m
      # The otel signal viewer creates these two *inside* the container (the host
      # journal is not mounted, and deliberately so). They were empty before this
      # change too — the tmpfs keeps the behaviour identical instead of adding two
      # ERROR lines to every start.
      - /host/var/log:size=1m
      - /host/run/log:size=1m
    environment:
      # Container-name resolution via the read-only socket-proxy (CONTAINERS=1,
      # same as Traefik), never the raw docker.sock (full Docker API = host root
      # even mounted :ro). Container CPU/mem/net charts come from /proc + /sys.
      DOCKER_HOST: tcp://socket-proxy:2375
    depends_on:
      - socket-proxy
    volumes:
      # State on disk rather than in the image layer. This is what makes
      # read_only possible without paying for it in RAM, and it fixes something
      # that was quietly true before: the metrics database lived in the
      # container's writable layer, so **every recreate started the history from
      # zero**. The image ships only empty cloud.d/ and registry/ directories
      # plus netdata.tarball.checksum (for the auto-updater we do not use) at
      # /var/lib/netdata, so mounting over it masks nothing that matters.
      - ${SERVICES_DATA_DIR}/netdata/lib:/var/lib/netdata
      - ${SERVICES_DATA_DIR}/netdata/cache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    networks:
      - proxy
      - socketproxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netdata.rule=Host(`system.${DOMAIN}`)"
      - "traefik.http.routers.netdata.entrypoints=websecure"
      - "traefik.http.routers.netdata.tls.certresolver=letsencrypt"
      - "traefik.http.services.netdata.loadbalancer.server.port=19999"

  # --- Dozzle (container logs in the browser) ---
  # Fills the gap Netdata and Kuma leave: metrics and uptime were reachable
  # without SSH, logs were not. Reads the daemon through the same read-only
  # socket-proxy as Traefik and Netdata — never the raw docker.sock.
  dozzle:
    image: amir20/dozzle:v10.7.1
    container_name: dozzle
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    # No tmpfs. `docker diff` on a live probe showed an empty write set — the
    # only entries were /data and the users file, both artefacts of the bind
    # mount below. Dozzle is a single Go binary serving from its own image and
    # keeping no state on disk; the auth session is a cookie, not a file.
    user: "65534:65534"        # nobody — it speaks TCP to the proxy, so no docker group
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      # Logs are the point, and they are also the most quietly sensitive surface
      # in the stack: every other container's stdout in one page — session ids,
      # e-mail addresses, tokens an app decided to log. `vpn-only` already gates
      # it like everything else, so this is the second lock, for the case where
      # the perimeter itself is what failed (a stolen WireGuard key, a
      # compromised LAN device). Credentials come from the file below.
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_NO_ANALYTICS: "true"
      # The default polls GitHub for newer Dozzle releases on a schedule. Version
      # bumps arrive through Renovate on the pin above, so the call buys nothing
      # and is one more outbound connection from a container that needs none.
      DOZZLE_RELEASE_CHECK_MODE: manual
      # DOZZLE_ENABLE_ACTIONS / DOZZLE_ENABLE_SHELL stay at their default false.
      # Both need POST on the socket-proxy, which is 0 — so enabling either here
      # would put start/stop/restart buttons and an in-browser shell in the UI
      # that fail against the proxy rather than work. The proxy is the boundary;
      # this is a log viewer, not a control panel.
    volumes:
      # The FILE, not the directory around it: a directory bind mount here would
      # be resolved in the container's namespace and is exactly how #27 left
      # SearXNG with a dangling link for weeks. 0444 from the LUKS secrets dir,
      # rendered by the deploy role — it carries the bcrypt hash of the admin
      # password, so it is a secret by ADR-011's definition even though Dozzle
      # wants it at a fixed path rather than under /run/secrets.
      - /mnt/data/secrets/docker/dozzle_users.yml:/data/users.yml:ro
    # The binary's own subcommand rather than a port probe: it performs a real
    # HTTP request to /healthcheck on the listener, so a Dozzle that is up but
    # no longer serving fails it. Nothing else in the image can run it — there is
    # no shell, no wget, no curl.
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - socket-proxy
    networks:
      - proxy
      - socketproxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`logs.${DOMAIN}`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.tls.certresolver=letsencrypt"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"

  # --- IT-Tools (offline dev toolbox) ---
  it-tools:
    # Pinned to a DIGEST on a moving tag, which is unusual here and deliberate.
    # Upstream stopped cutting releases: the newest is 2024.10.22, and its image
    # ships Alpine 3.20 (past end of support) with nginx 1.26.2. The repository
    # itself is alive, so `nightly` — a build of main, not an unstable channel in
    # this project — is where the maintenance went: Alpine 3.23, nginx 1.28.2.
    # Serving a 21-month-old base to replace third-party web tools would defeat
    # the point of self-hosting this. The digest restores what the tag gives up:
    # the deployed artefact cannot change underneath us, and Renovate raises a PR
    # when the digest moves. Re-read the release situation at the next bump — if
    # nightly goes stale too (it was last built 2026-02-13), that is the signal to
    # drop this service rather than pin it deeper (ADR-024).
    image: corentinth/it-tools:nightly@sha256:f07d246567e1ceb65e29b0a2ea155a70d7b05e9a35cfc534a2eee7b1f53df64b
    container_name: it-tools
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    # Zero capabilities, including NET_BIND_SERVICE, even though nginx listens on
    # :80 as uid 101. Docker sets net.ipv4.ip_unprivileged_port_start=0 inside the
    # container, so the bind needs no capability at all — measured, not assumed:
    # the container serves 200 with `--cap-drop ALL` and nothing added.
    cap_drop: *cap-drop-all
    read_only: true            # measured: `docker diff` write set is empty
    user: "101:101"            # nginx user in the image
    tmpfs:
      # These need uid/gid, unlike every other tmpfs in this file. A tmpfs is
      # mounted root-owned 0755 by default, so uid 101 cannot create
      # /var/cache/nginx/client_temp and nginx exits 1 at startup with
      # "mkdir() ... failed (13: Permission denied)" — a failure that reads like
      # a read-only filesystem problem and is not one.
      - /var/cache/nginx:size=16m,uid=101,gid=101
      - /var/run:size=4m,uid=101,gid=101
      - /tmp:size=8m,uid=101,gid=101
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxy
    # No second lock, unlike Dozzle. Every tool here runs in the browser: the
    # server parses nothing, stores nothing and never sees what is pasted into a
    # JWT decoder. `vpn-only` on the entrypoint is the whole perimeter, and there
    # is no server-side secret behind it to defend.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.it-tools.rule=Host(`tools.${DOMAIN}`)"
      - "traefik.http.routers.it-tools.entrypoints=websecure"
      - "traefik.http.routers.it-tools.tls.certresolver=letsencrypt"
      - "traefik.http.services.it-tools.loadbalancer.server.port=80"

  # --- Calibre-Web-Automated (ebook library + OPDS) ---
  calibre-web:
    image: crocodilestick/calibre-web-automated:v4.0.6
    container_name: calibre-web
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    # NO read_only, and not for lack of trying: `docker diff` on a running
    # container shows **1797** entries, because the image patches its own source
    # tree and writes Python bytecode caches under /app at every start. Unlike
    # transmission below, there is no polite degradation to weigh — it simply
    # cannot start.
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    cap_add:
      # The same five as transmission, for the same reason, and measured the
      # same way. This is a linuxserver-style s6 image: the init runs as root,
      # chowns /config, /calibre-library and /cwa-book-ingest, then drops to
      # PUID/PGID. Six variants were tried before settling here (ADR-025):
      #   - zero caps                     → /config/client_secrets.json denied, never serves
      #   - CHOWN+SETUID+SETGID           → reports **healthy** while /app cache is missing
      #   - the above + DAC_OVERRIDE      → reports **healthy** while `install` fails on
      #                                     /config/processed_books/* (needs FOWNER)
      #   - user: "1000:1000", zero caps  → s6 preinit: "/run belongs to uid 0 … we're
      #                                     lacking the privileges to fix it", exit 100
      #   - the above + owned /run tmpfs  → exit 126, tmpfs is noexec by default
      #   - the above + exec on the tmpfs → s6 starts, then /app is root-owned in the
      #                                     image and the app never serves
      # So `user:` cannot remove the root phase here — the image would have to
      # ship /app owned by the app uid, and it does not. Two of those variants
      # sat at `healthy` while broken, which is why the Kuma monitor does not
      # trust this container's own healthcheck (see docs/05-services/calibre-web.md).
      #
      # And root is NOT confined to init, unlike transmission below: cps.py does
      # run as uid 1000, but cwa-ingest-service, metadata-change-detector,
      # cwa-auto-zipper and svc-cron stay root for the container's whole life.
      # The first of those parses whatever lands in the ingest folder, so treat
      # that folder as a trusted path (ADR-025).
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      # The Calibre library itself, alongside music/photos/videos and inside the
      # restic set for free. CWA is the OWNER of this tree, not a reader of it:
      # it rewrites metadata.db on first run (measured — the md5 changes), so
      # editing the same library from desktop Calibre would silently fork the
      # two. The desktop copy is a cold archive now (ADR-025).
      - /mnt/data/media/books:/calibre-library
      - ${SERVICES_DATA_DIR}/calibre-web:/config
      # Drop an .epub here and CWA imports it into the library. Transient by
      # design: files are moved out on success, so this is normally empty.
      - /mnt/data/media/books-ingest:/cwa-book-ingest
    networks:
      - proxy
    # Deliberately NOT the image's own healthcheck, which is what `docker ps`
    # reports: two of the capability variants above reached "healthy" with a
    # broken install. This probes the login page, which is served by the same
    # process that serves the library.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8083/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s       # measured: first boot creates app.db and takes ~90 s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.calibre-web.rule=Host(`books.${DOMAIN}`)"
      - "traefik.http.routers.calibre-web.entrypoints=websecure"
      - "traefik.http.routers.calibre-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.calibre-web.loadbalancer.server.port=8083"

  # --- Miniflux (RSS reader) ---
  miniflux:
    image: miniflux/miniflux:2.3.3
    container_name: miniflux
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    # No tmpfs at all, and that is measured rather than hoped for: `docker diff`
    # on a probe that ran the 132 migrations, created the admin account and
    # served /healthcheck came back with an EMPTY write set. Miniflux is one Go
    # binary on a distroless base and keeps everything it owns in Postgres.
    user: "65534:65534"        # nobody — already the image's own default, restated
                               # here so a base-image change cannot move it silently
    depends_on:
      miniflux-db:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/secrets/miniflux_database_url
      RUN_MIGRATIONS: "1"
      # Idempotent by design: Miniflux logs "user already exists" and carries on
      # when the account is there, so this stays on across deploys instead of
      # being a first-boot flag someone has to remember to remove.
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${MINIFLUX_ADMIN_USER}
      ADMIN_PASSWORD_FILE: /run/secrets/miniflux_admin_password
      # Upstream's default is 127.0.0.1:8080, which inside a container means the
      # process answers only itself and Traefik gets connection refused.
      LISTEN_ADDR: 0.0.0.0:8080
      BASE_URL: https://rss.${DOMAIN}
    secrets:
      - miniflux_database_url
      - miniflux_admin_password
    networks:
      - proxy
      - internal
    # The binary's own subcommand, like Dozzle, and here there is no alternative:
    # the image is distroless — no shell, no curl, no wget — so a CMD-SHELL probe
    # cannot run at all. It issues a real HTTP request against the listener, so a
    # Miniflux that is up but no longer serving fails it.
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.miniflux.rule=Host(`rss.${DOMAIN}`)"
      - "traefik.http.routers.miniflux.entrypoints=websecure"
      - "traefik.http.routers.miniflux.tls.certresolver=letsencrypt"
      - "traefik.http.services.miniflux.loadbalancer.server.port=8080"

  miniflux-db:
    # Postgres 18, not the 16 immich-db is pinned to. This database is Miniflux's
    # alone — nothing reads it across services — so there is no schema to match,
    # and 18 is what upstream's own compose ships.
    image: postgres:18-alpine
    container_name: miniflux-db
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    # Same reasoning as immich-db and nextcloud-db: running as the final uid from
    # PID 1 removes the entrypoint's root phase, so there is no chown left to
    # need a capability for.
    user: "999:999"
    tmpfs:
      # Both carry uid/gid, unlike immich-db's Debian-based image, and both
      # failures were observed rather than anticipated. A tmpfs mounts root-owned
      # 0755; the alpine entrypoint chmods its socket directory before dropping
      # privilege, so without the uid the container exits on
      #   chmod: /var/run/postgresql: Operation not permitted
      # and then, once that is fixed, on
      #   mktemp: : Read-only file system
      # because initdb wants a scratch directory the read-only rootfs denies.
      - /run/postgresql:uid=999,gid=999
      - /tmp:size=64m,uid=999,gid=999
    environment:
      POSTGRES_USER: ${MINIFLUX_DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/miniflux_db_password
      POSTGRES_DB: ${MINIFLUX_DB_NAME}
    secrets:
      - miniflux_db_password
    volumes:
      # /var/lib/postgresql, NOT the /var/lib/postgresql/data that immich-db
      # mounts: Postgres 18 moved PGDATA to /var/lib/postgresql/18/docker and
      # declares the PARENT as its volume. Mounting the old path would leave the
      # real datadir inside the container, where every recreate destroys it.
      - ${SERVICES_DATA_DIR}/miniflux/db:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${MINIFLUX_DB_NAME} -U ${MINIFLUX_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Forgejo (private git forge, GitHub pull-mirror) ---
  forgejo:
    # The ROOTLESS variant, not the default image, and the difference is
    # structural rather than cosmetic. The standard image starts as root, chowns
    # its data directory and drops to uid 1000 through su-exec — a sequence that
    # needs SETUID/SETGID back and a writable image layer to do it in. The
    # rootless image is already uid 1000 at PID 1, so it meets this stack's
    # baseline (no-new-privileges + cap_drop ALL) with nothing added back.
    # It pays for that with different paths: data lives in /var/lib/gitea and
    # config in /etc/gitea, NOT the /data that every tutorial mounts (ADR-028).
    image: codeberg.org/forgejo/forgejo:16.0.2-rootless
    container_name: forgejo
    restart: "no"              # started by the stack-startup waves; crashes handled by the heal timer
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    # Measured, not assumed: `docker diff` after a full mirror clone of 425
    # commits — every branch plus the pull/*/head refs — returned the SAME seven
    # entries as an idle boot, five of which are mount points. Git writes nothing
    # to the image layer; it all lands in the bind mount below.
    read_only: true
    user: "1000:1000"          # `git` in the rootless image. USER_UID/USER_GID
                               # are inert here: the uid is fixed at build time,
                               # they only exist for the root-entrypoint variant.
    tmpfs:
      # The single writable path the measurement found: GITEA_TEMP=/tmp/gitea,
      # which Forgejo creates itself at 0700. The uid is not optional — a tmpfs
      # mounts root-owned 0755, and uid 1000 holds no capability to work around
      # that, so without it the container cannot create its own temp directory.
      # Same failure that bit IT-Tools and the Postgres instances.
      # 128m is a ceiling, not an allocation: measured usage after the initial
      # clone was 8 KB, and tmpfs only occupies what it holds.
      - /tmp:size=128m,uid=1000,gid=1000
    environment:
      FORGEJO__server__ROOT_URL: https://git.${DOMAIN}/
      FORGEJO__server__HTTP_PORT: "3000"
      # Git over SSH stays off. The only planned use is a pull-mirror, which
      # Forgejo drives OUTBOUND over HTTPS, and cloning from the LAN works over
      # HTTPS too. Leaving it on would publish port 2222 for a door nothing
      # knocks on. Turn it on the day this stops being a mirror and starts being
      # a remote people push to.
      FORGEJO__server__DISABLE_SSH: "true"
      # The web installer is a single unauthenticated form that creates the first
      # admin account — whoever reaches it first owns the forge. It is locked
      # before the container ever answers a request, and the admin is created by
      # CLI instead (see docs/05-services/forgejo.md). vpn-only would already
      # gate it; this is the second lock, because the first one is a middleware
      # and middlewares can be misconfigured.
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      # SQLite rather than a Postgres sidecar: one user, one mirror job, no
      # concurrency to speak of, and it saves ~70 MB plus a container. The cost
      # is that a live .db cannot be snapshotted safely by restic — backup.sh
      # therefore takes it through SQLite's Online Backup API, exactly as it
      # already does for Vaultwarden (ADR-028).
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /var/lib/gitea/data/forgejo.db
    secrets:
      # Mounted so the first-run admin-create command can read the password from
      # inside the container instead of it being typed on the host, where it
      # would land in shell history.
      - forgejo_admin_password
    volumes:
      - ${SERVICES_DATA_DIR}/forgejo/data:/var/lib/gitea
      - ${SERVICES_DATA_DIR}/forgejo/config:/etc/gitea
    networks:
      # proxy only — SQLite means no database peer to reach on `internal`, and
      # the mirror pulls leave northbound to GitHub like any other egress.
      - proxy
    healthcheck:
      # /api/healthz reports component status rather than just proving the router
      # answers, so a Forgejo whose database has gone away fails it.
      # VERIFY ON FIRST DEPLOY: this assumes busybox `wget` is in the rootless
      # image. If it is not, the container goes permanently unhealthy and the
      # heal timer will fight it every 2 minutes — check before walking away.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s       # first boot runs the schema migrations
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forgejo.rule=Host(`git.${DOMAIN}`)"
      - "traefik.http.routers.forgejo.entrypoints=websecure"
      - "traefik.http.routers.forgejo.tls.certresolver=letsencrypt"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"
