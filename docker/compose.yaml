x-security-opt: &no-new-privs
  - no-new-privileges:true

x-cap-drop: &cap-drop-all
  - ALL

x-nextcloud-hosts: &nextcloud-hosts
  - "drive.${DOMAIN}:${PI_LAN_IP}"
  - "office.${DOMAIN}:${PI_LAN_IP}"

x-kuma-hosts: &kuma-hosts
  - "books.${DOMAIN}:${PI_LAN_IP}"
  - "dns.${DOMAIN}:${PI_LAN_IP}"
  - "drive.${DOMAIN}:${PI_LAN_IP}"
  - "films.${DOMAIN}:${PI_LAN_IP}"
  - "git.${DOMAIN}:${PI_LAN_IP}"
  - "indexers.${DOMAIN}:${PI_LAN_IP}"
  - "logs.${DOMAIN}:${PI_LAN_IP}"
  - "music.${DOMAIN}:${PI_LAN_IP}"
  - "office.${DOMAIN}:${PI_LAN_IP}"
  - "photos.${DOMAIN}:${PI_LAN_IP}"
  - "proxy.${DOMAIN}:${PI_LAN_IP}"
  - "rss.${DOMAIN}:${PI_LAN_IP}"
  - "search.${DOMAIN}:${PI_LAN_IP}"
  - "series.${DOMAIN}:${PI_LAN_IP}"
  - "services.${DOMAIN}:${PI_LAN_IP}"
  - "share.${DOMAIN}:${PI_LAN_IP}"
  - "system.${DOMAIN}:${PI_LAN_IP}"
  - "tools.${DOMAIN}:${PI_LAN_IP}"
  - "vault.${DOMAIN}:${PI_LAN_IP}"
  - "videos.${DOMAIN}:${PI_LAN_IP}"
  - "vpn.${DOMAIN}:${PI_LAN_IP}"

secrets:
  cf_dns_api_token:
    file: /mnt/data/secrets/docker/cf_dns_api_token
  nextcloud_db_password:
    file: /mnt/data/secrets/docker/nextcloud_db_password
  nextcloud_redis_password:
    file: /mnt/data/secrets/docker/nextcloud_redis_password
  nextcloud_db_root_password:
    file: /mnt/data/secrets/docker/nextcloud_db_root_password
  immich_db_password:
    file: /mnt/data/secrets/docker/immich_db_password
  transmission_password:
    file: /mnt/data/secrets/docker/transmission_password
  pihole_password:
    file: /mnt/data/secrets/docker/pihole_password
  vaultwarden_admin_token_hash:
    file: /mnt/data/secrets/docker/vaultwarden_admin_token_hash
  miniflux_db_password:
    file: /mnt/data/secrets/docker/miniflux_db_password
  miniflux_database_url:
    file: /mnt/data/secrets/docker/miniflux_database_url
  miniflux_admin_password:
    file: /mnt/data/secrets/docker/miniflux_admin_password
  forgejo_admin_password:
    file: /mnt/data/secrets/docker/forgejo_admin_password

  forgejo_secret_key:
    file: /mnt/data/secrets/docker/forgejo_secret_key

networks:
  proxy:
    external: true
  internal:
    driver: bridge
  socketproxy:
    driver: bridge
    internal: true

services:

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: socket-proxy
    restart: unless-stopped
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    environment:
      CONTAINERS: 1
      INFO: 1
      IMAGES: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socketproxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  traefik:
    image: traefik:v3.7.13
    container_name: traefik
    restart: unless-stopped
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    cap_add:
      - NET_BIND_SERVICE
      - DAC_READ_SEARCH
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/cf_dns_api_token
    secrets:
      - cf_dns_api_token
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${SERVICES_DATA_DIR}/traefik/acme:/acme
      - ./configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./configs/traefik/dynamic:/etc/traefik/dynamic:ro
      - /run/traefik:/var/log/traefik
    depends_on:
      - socket-proxy
    networks:
      - proxy
      - socketproxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`proxy.${DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 240s

  traefik-log-redactor:
    image: alpine:3.24
    container_name: traefik-log-redactor
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    restart: unless-stopped
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:size=1m
    stop_grace_period: 5s
    command:
      - sh
      - -c
      - exec tail -F /var/log/traefik/access.log 2>/dev/null | awk -f /etc/redact-access-log.awk
    volumes:
      - /run/traefik:/var/log/traefik:ro
      - ./configs/traefik/redact-access-log.awk:/etc/redact-access-log.awk:ro
    depends_on:
      - traefik
    healthcheck:
      test:
        - CMD-SHELL
        - pgrep -f "tail -F /var/log/traefik/access.log" >/dev/null && [ -f /var/log/traefik/access.log ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 180s

  pihole:
    stop_grace_period: 90s
    image: pihole/pihole:2026.07.2
    container_name: pihole
    restart: unless-stopped
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    cap_add:
      # [critical]: never remove these three: the binary carries them as file capabilities and the kernel refuses to exec it without them
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - SYS_NICE
      - SETFCAP
      - DAC_OVERRIDE
      - FOWNER
      - KILL
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      TZ: ${TZ}
      FTLCONF_dns_listeningMode: all
      FTLCONF_misc_etc_dnsmasq_d: "true"
      FTLCONF_dns_upstreams: 127.0.0.1#5053
    secrets:
      - pihole_password
    volumes:
      - ${SERVICES_DATA_DIR}/pihole/etc:/etc/pihole
      - ${SERVICES_DATA_DIR}/pihole/dnsmasq:/etc/dnsmasq.d
      - ./configs/pihole/05-homelab.conf:/etc/dnsmasq.d/05-homelab.conf:ro
      - ./configs/pihole/logrotate:/etc/logrotate.d/pihole:ro
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`dns.${DOMAIN}`)"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls.certresolver=letsencrypt"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "dig", "+norecurse", "+retry=0", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  dnsproxy:
    image: adguard/dnsproxy:v0.84.2
    container_name: dnsproxy
    restart: unless-stopped
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=8m
    network_mode: "service:pihole"
    command:
      - "-l"
      - "127.0.0.1"
      - "-p"
      - "5053"
      - "-u"
      - "https://9.9.9.9/dns-query"
      - "-u"
      - "https://149.112.112.112/dns-query"
    depends_on:
      - pihole

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.4.0
    container_name: wg-easy
    restart: unless-stopped
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    cap_add:
      - NET_ADMIN
      - NET_RAW
    read_only: true
    tmpfs:
      - /run:size=8m
      - /tmp:size=8m
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821"
    environment:
      INSECURE: "true"
      DISABLE_IPV6: "true"
    volumes:
      - ${SERVICES_DATA_DIR}/wireguard:/etc/wireguard
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wireguard.rule=Host(`vpn.${DOMAIN}`)"
      - "traefik.http.routers.wireguard.entrypoints=websecure"
      - "traefik.http.routers.wireguard.tls.certresolver=letsencrypt"
      - "traefik.http.services.wireguard.loadbalancer.server.port=51821"

  nextcloud:
    image: nextcloud:34.0.4-apache
    container_name: nextcloud
    restart: "no"
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    environment:
      NEXTCLOUD_TRUSTED_DOMAINS: drive.${DOMAIN} nextcloud
      OVERWRITEPROTOCOL: https
      TRUSTED_PROXIES: 172.16.0.0/12
      OVERWRITECLIURL: https://drive.${DOMAIN}
      REDIS_HOST: nextcloud-redis
      REDIS_HOST_PASSWORD_FILE: /run/secrets/nextcloud_redis_password
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    secrets:
      - nextcloud_redis_password
    volumes:
      - ${SERVICES_DATA_DIR}/nextcloud/data:/var/www/html
      - ./configs/nextcloud/zz-disable-jit.ini:/usr/local/etc/php/conf.d/zz-disable-jit.ini:ro
      - ${MEDIA_DIR}/photos:/external/photos:ro
      - ${MEDIA_DIR}/music:/external/music:ro
      - ${LIBRARY_DIR}/movies:/external/videos/movies:ro
      - ${LIBRARY_DIR}/shows:/external/videos/shows:ro
      - ${MEDIA_DIR}/videos/home-videos:/external/videos/home-videos:ro
      - ${MEDIA_DIR}/videos/music-videos:/external/videos/music-videos:ro
    extra_hosts: *nextcloud-hosts
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`drive.${DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-headers@file"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  nextcloud-db:
    image: mariadb:12.3.3
    container_name: nextcloud-db
    restart: "no"
    stop_grace_period: 90s
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      - /run/mysqld:size=8m
      - /tmp:size=256m
    user: "999:999"
    environment:
      # [critical]: the MariaDB upgrade is one-way: rolling the image back past a major needs a datadir restore
      MARIADB_AUTO_UPGRADE: "1"
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/nextcloud_db_root_password
      MYSQL_DATABASE: ${NEXTCLOUD_DB_NAME}
      MYSQL_USER: ${NEXTCLOUD_DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/nextcloud_db_password
    secrets:
      - nextcloud_db_root_password
      - nextcloud_db_password
    volumes:
      - ${SERVICES_DATA_DIR}/nextcloud/db:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  nextcloud-redis:
    image: redis:8.10.1-alpine
    container_name: nextcloud-redis
    restart: "no"
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      - /tmp:size=8m
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - /mnt/data/secrets/docker/nextcloud_redis.conf:/usr/local/etc/redis/redis.conf:ro
    user: "999:999"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -q NOAUTH"]
      interval: 10s
      timeout: 5s
      retries: 3

  nextcloud-cron:
    image: nextcloud:34.0.4-apache
    container_name: nextcloud-cron
    restart: "no"
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    cap_add:
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /run:size=8m
      - /tmp:size=32m
    entrypoint: /cron.sh
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    volumes:
      - ${SERVICES_DATA_DIR}/nextcloud/data:/var/www/html
      - ./configs/nextcloud/zz-disable-jit.ini:/usr/local/etc/php/conf.d/zz-disable-jit.ini:ro
    extra_hosts: *nextcloud-hosts
    networks:
      - internal

  nextcloud-notify-push:
    image: nextcloud:34.0.4-apache
    container_name: nextcloud-notify-push
    restart: "no"
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_add:
      - DAC_READ_SEARCH
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    environment:
      PORT: "7867"
      NEXTCLOUD_URL: http://nextcloud
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until [ -x /var/www/html/custom_apps/notify_push/bin/aarch64/notify_push ];
        do echo 'waiting for notify_push binary'; sleep 5; done;
        exec /var/www/html/custom_apps/notify_push/bin/aarch64/notify_push
        /var/www/html/config/config.php
    volumes:
      - ${SERVICES_DATA_DIR}/nextcloud/data:/var/www/html:ro
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notify-push.rule=Host(`drive.${DOMAIN}`) && PathPrefix(`/push`)"
      - "traefik.http.routers.notify-push.priority=100"
      - "traefik.http.routers.notify-push.entrypoints=websecure"
      - "traefik.http.routers.notify-push.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.notify-push-strip.stripprefix.prefixes=/push"
      - "traefik.http.routers.notify-push.middlewares=notify-push-strip"
      - "traefik.http.services.notify-push.loadbalancer.server.port=7867"

  collabora:
    image: collabora/code:26.04.4.1.1
    healthcheck:
      start_period: 1320s
      start_interval: 15s
    container_name: collabora
    restart: "no"
    cap_drop: *cap-drop-all
    cap_add:
      - SYS_CHROOT
      - CHOWN
      - FOWNER
    environment:
      aliasgroup1: https://drive.${DOMAIN}:443
      extra_params: --o:ssl.enable=false --o:ssl.termination=true
    extra_hosts:
      - "drive.${DOMAIN}:${PI_LAN_IP}"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.collabora.rule=Host(`office.${DOMAIN}`)"
      - "traefik.http.routers.collabora.entrypoints=websecure"
      - "traefik.http.routers.collabora.tls.certresolver=letsencrypt"
      - "traefik.http.services.collabora.loadbalancer.server.port=9980"

  vaultwarden:
    image: vaultwarden/server:1.37.3
    container_name: vaultwarden
    restart: "no"
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TZ: ${TZ}
      DOMAIN: https://vault.${DOMAIN}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      ADMIN_TOKEN_FILE: /run/secrets/vaultwarden_admin_token_hash
      PASSWORD_HINTS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      DISABLE_ICON_DOWNLOAD: "true"
      SENDS_ALLOWED: "false"
      TRASH_AUTO_DELETE_DAYS: "90"
      LOG_FILE: /data/logs/vaultwarden.log
      LOG_LEVEL: warn
    secrets:
      - vaultwarden_admin_token_hash
    volumes:
      - ${SERVICES_DATA_DIR}/vaultwarden:/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/alive"]
      interval: 30s
      timeout: 5s
      retries: 3

  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: "no"
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /root/.aspnet:size=8m
      - /var/cache/fontconfig:size=16m
      - /jellyfin/Dictionaries:size=8m
    environment:
      JELLYFIN_PublishedServerUrl: https://videos.${DOMAIN}
    volumes:
      - ${SERVICES_DATA_DIR}/jellyfin/config:/config
      - ${SERVICES_DATA_DIR}/jellyfin/cache:/cache
      - ${LIBRARY_DIR}/movies:/media/videos/movies:ro
      - ${LIBRARY_DIR}/shows:/media/videos/shows:ro
      - ${MEDIA_DIR}/videos/home-videos:/media/videos/home-videos:ro
      - ${MEDIA_DIR}/videos/music-videos:/media/videos/music-videos:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`videos.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=letsencrypt"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 420s
      start_interval: 15s

  navidrome:
    image: deluan/navidrome:0.64.0
    container_name: navidrome
    restart: "no"
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      - /tmp:size=64m
    environment:
      ND_SCANNER_SCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_BASEURL: ""
      ND_SCANNER_PURGEMISSING: full
    volumes:
      - ${SERVICES_DATA_DIR}/navidrome:/data
      - ${MEDIA_DIR}/music:/music:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.navidrome.rule=Host(`music.${DOMAIN}`)"
      - "traefik.http.routers.navidrome.entrypoints=websecure"
      - "traefik.http.routers.navidrome.tls.certresolver=letsencrypt"
      - "traefik.http.services.navidrome.loadbalancer.server.port=4533"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4533/ping | grep -qx '[.]'"]
      interval: 30s
      timeout: 5s
      retries: 3

  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.2.2
    healthcheck:
      start_period: 1020s
      start_interval: 15s
    container_name: immich-server
    restart: "no"
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /data:size=8m
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_started
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: ${IMMICH_DB_USER}
      DB_PASSWORD_FILE: /run/secrets/immich_db_password
      DB_DATABASE_NAME: ${IMMICH_DB_NAME}
      REDIS_HOSTNAME: immich-redis
    secrets:
      - immich_db_password
    volumes:
      - ${SERVICES_DATA_DIR}/immich/upload:/usr/src/app/upload
      - ${MEDIA_DIR}/photos:/usr/src/app/external:ro
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`photos.${DOMAIN}`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.tls.certresolver=letsencrypt"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.2
    healthcheck:
      start_period: 420s
      start_interval: 15s
    container_name: immich-ml
    restart: "no"
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      - /root/.cache:size=32m
      - /root/.config:size=8m
      - /tmp:size=64m
    volumes:
      - ${SERVICES_DATA_DIR}/immich/ml-cache:/cache
    networks:
      - internal

  immich-redis:
    image: redis:8.10.1-alpine
    container_name: immich-redis
    restart: "no"
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      - /tmp:size=8m
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ${SERVICES_DATA_DIR}/immich/redis:/data
    user: "999:999"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3

  immich-db:
    # [warning]: do not size this from a solo `docker stop` on an idle database: the real cost is a checkpoint while every container drains to the same disk
    stop_grace_period: 90s
    # [critical]: the extension migration is one-way: never downgrade this image afterwards
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-db
    restart: "no"
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    read_only: true
    tmpfs:
      - /run/postgresql:size=8m
      - /tmp:size=128m
      - /etc/postgresql:size=8m
    user: "999:999"
    environment:
      POSTGRES_USER: ${IMMICH_DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/immich_db_password
      POSTGRES_DB: ${IMMICH_DB_NAME}
      DB_STORAGE_TYPE: "HDD"
    secrets:
      - immich_db_password
    volumes:
      - ${SERVICES_DATA_DIR}/immich/db:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "exec psql -U ${IMMICH_DB_USER} -d ${IMMICH_DB_NAME} -tAc 'select 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s

  transmission:
    image: linuxserver/transmission:4.1.3-r0-ls354
    container_name: transmission
    restart: "no"
    security_opt: *no-new-privs
    cap_drop: *cap-drop-all
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "022"
      USER: ${TRANSMISSION_USER}
      FILE__PASS: /run/secrets/transmission_password
      PEERPORT: 51413
      HOST_WHITELIST: "127.0.0.1,*.lan,*.local,*.localhost,share.${DOMAIN}"
      WHITELIST: "127.0.0.1,172.*.*.*"
    secrets:
      - transmission_password
    volumes:
      - ${SERVICES_DATA_DIR}/transmission/config:/config
      - ${LIBRARY_DIR}/downloads:/downloads
      - ${SERVICES_DATA_DIR}/transmission/watch:/watch
    ports:
      - "51413:51413/tcp"
      - "51413:51413/udp"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host(`share.${DOMAIN}`)"
      - "traefik.http.routers.transmission.entrypoints=websecure"
      - "traefik.http.routers.transmission.tls.certresolver=letsencrypt"
      - "traefik.http.services.transmission.loadbalancer.server.port=9091"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", 'TR_AUTH="$$USER:$$(cat /run/secrets/transmission_password)" transmission-remote -ne -l >/dev/null 2>&1']
      interval: 30s
      timeout: 5s
      retries: 3

