  netdata:
    image: netdata/netdata:v2.11.1
    container_name: netdata
    restart: "no"
    stop_grace_period: 90s
    cap_drop: *cap-drop-all
    cap_add:
      - SYS_PTRACE
      - DAC_OVERRIDE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - apparmor=homelab-netdata
    read_only: true
    tmpfs:
      - /run/netdata:size=8m
      - /tmp:size=32m
      - /var/log/netdata/otel:size=16m
      - /host/var/log:size=1m
      - /host/run/log:size=1m
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
    depends_on:
      - socket-proxy
    volumes:
      - ${SERVICES_DATA_DIR}/netdata/lib:/var/lib/netdata
      - ${SERVICES_DATA_DIR}/netdata/cache:/var/cache/netdata
      - ${SERVICES_DATA_DIR}/netdata/netdata.conf:/etc/netdata/netdata.conf:ro
      - ${SERVICES_DATA_DIR}/netdata/health.d:/etc/netdata/health.d:ro
      - ${SERVICES_DATA_DIR}/netdata/go.d:/etc/netdata/go.d:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null http://127.0.0.1:19999/api/v1/info || exit 1;
          [ "$$(ps -o etimes= -p 1 | tr -d ' ')" -lt 900 ] && exit 0;
          pidof go.d.plugin >/dev/null || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
      start_interval: 10s
    networks:
      - proxy
      - socketproxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netdata.rule=Host(`system.${DOMAIN}`)"
      - "traefik.http.routers.netdata.entrypoints=websecure"
      - "traefik.http.routers.netdata.tls.certresolver=letsencrypt"
      - "traefik.http.services.netdata.loadbalancer.server.port=19999"

