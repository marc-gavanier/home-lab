# Managed by the home-lab repository — bind-mounted over the image's own
# /etc/netdata/netdata.conf, which ships as a comment stub with no settings.
#
# WHY THIS FILE EXISTS
# --------------------
# Every `db` setting was left commented out, so all three tiers ran on netdata's
# stock defaults — and those defaults declare a period the size cap will not
# deliver. Read from netdata's own API on 2026-08-31, which publishes both
# numbers side by side:
#
#     tier 0:  retention 4d18h   requested_retention 14d
#     tier 1:  retention 28d20h  requested_retention 3mo
#     tier 2:  retention 1mo5d   requested_retention 2y    (expected 10mo5d)
#
# Nine days of tier 0 that the configuration promised and the store never held,
# with nothing anywhere comparing the two. Netdata is not at fault: it is doing
# what a store with a time bound AND a size bound does when the size bound binds
# first. What was wrong is that neither number had been chosen.
#
# THE DECISION, so nobody reopens it: ~5 days of per-second resolution is
# enough, and the caps are NOT raised. Honouring the stock 14d/3mo/2y would cost
# about 7.8 GiB, which the volume has (17 % full, 3.6 TB free) — it is simply
# not worth having. What is fixed here is the DECLARATION, not the capacity.
#
# Read the times below as the intent and the sizes as the governor: the size cap
# still binds a few hours before the time does, so `requested` and actual land
# within hours of each other instead of within days. Exact equality is not
# available from a store with two bounds, and pretending otherwise is what
# produced the original defect.
#
# The store is on the 5 TB HDD, not the SD card
# (`/mnt/data/services/netdata/cache` -> `/var/cache/netdata`), so these caps
# protect nothing and cost nothing; they are a retention choice, not a disk
# guard. Note it is also excluded from the restic backup as of 2026-08-31 — a
# ring buffer that regenerates is not restore material.

[db]
    # Per-second resolution. Measured delivery at this cap: 4 d 18 h.
    dbengine tier 0 retention size = 1024MiB
    dbengine tier 0 retention time = 5d

    # Per-minute. Measured delivery at this cap: 28 d 20 h. This is the tier the
    # `homelab_mem_available` threshold was derived against, and its derivation
    # is recorded as "measured against 19 days of Netdata retention" — so the
    # number stays reproducible here, with a margin of 1.5x.
    dbengine tier 1 retention size = 1024MiB
    dbengine tier 1 retention time = 30d

    # Per-hour. Not size-bound yet — only 100 MiB used, and netdata's own
    # projection at the current rate is 10 mo 5 d, which is what this declares
    # rather than the stock 2 y it will never reach.
    dbengine tier 2 retention size = 1024MiB
    dbengine tier 2 retention time = 10mo
