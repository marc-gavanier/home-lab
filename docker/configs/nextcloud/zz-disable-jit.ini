; Disable PHP's tracing JIT for Nextcloud.
;
; The image ships opcache-recommended.ini with:
;
;     opcache.jit=1255
;     opcache.jit_buffer_size=8M
;
; On this board that segfaults Apache's children. Measured on 2026-08-27:
; nextcloud:34.0.3-apache (PHP 8.5.9) served /status.php with HTTP 200 for
; 2 h 13 after starting, then every PHP request died —
;
;     AH00052: child pid NNNN exit signal Segmentation fault (11)
;
; once a minute, one per healthcheck probe, with no access-log line at all
; because the child dies before logging. Six hours of outage, and it took
; three Kuma monitors plus the rclone vault mount down with it.
;
; A tracing JIT compiles only after a trace goes hot, which is why the
; failure arrives hours after start rather than at boot and why a restart
; "fixes" it until the trace is compiled again. That delay is what made this
; look like an intermittent fault in July rather than a reproducible one.
;
; conf.d is scanned in alphabetical order, so zz- lands after
; opcache-recommended.ini and after redis-session.ini, which the entrypoint
; writes on every start.
;
; opcache itself stays ON — it is what makes Nextcloud usable on a Pi. Only
; the JIT goes. Nextcloud's own documentation does not ask for the JIT, and
; measurement here found no page it made faster.
;
; jit_buffer_size=0 is the operative setting: PHP disables the JIT entirely
; when the buffer is zero, whatever opcache.jit says. Both are set so that
; `php -i` states the intent rather than implying it.

opcache.jit=disable
opcache.jit_buffer_size=0
