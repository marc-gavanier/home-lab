---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yml]

  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint
        entry: env ANSIBLE_CONFIG=ansible/ansible.cfg ansible-lint ansible/
        language: system
        files: ^ansible/
        pass_filenames: false

      - id: ascii-system-files
        name: no non-ASCII bound for an ASCII-strict system file
        entry: ops/check-ascii-system-files.py
        language: system
        files: ^ansible/.*\.ya?ml$
        pass_filenames: false

      - id: jinja-templates-parse
        name: jinja templates parse
        entry: ops/check-jinja-templates.py
        language: system
        files: \.j2$
        pass_filenames: false

      - id: empty-set-floors
        name: no iteration over a derived set without a floor
        entry: ops/check-empty-set-floors.py
        language: system
        files: (goss-.*\.ya?ml\.j2|\.sh(\.j2)?)$
        pass_filenames: false

      - id: goss-specs-render
        name: goss specs render and load the way the host loads them
        entry: ops/check-goss-specs-render.py
        language: system
        files: (goss-.*\.ya?ml\.j2|^docker/compose\.yaml|^ansible/inventory/)
        pass_filenames: false

      - id: empty-set-floors-selftest
        name: the floor gate still fails when it should
        entry: ops/check-empty-set-floors.py --selftest
        language: system
        files: ^ops/check-empty-set-floors\.py$
        pass_filenames: false

      - id: secret-in-environment
        name: no secret in an `environment:`, and no secret file misfiled either way
        entry: ops/check-secret-in-environment.py
        language: system
        files: (^ansible/roles/.*/tasks/.*\.yml|^ansible/playbooks/.*\.yml|^docker/compose\.yaml)$
        pass_filenames: false

      - id: shell-cmds-parse
        name: every embedded shell program parses as shell
        entry: ops/check-shell-cmds-parse.py
        language: system
        files: (^ansible/roles/.*/(tasks|handlers)/.*\.yml|^ansible/playbooks/.*\.yml)$
        pass_filenames: false

      - id: shell-cmds-parse-selftest
        name: the embedded-shell gate still fails when it should
        entry: ops/check-shell-cmds-parse.py --selftest
        language: system
        files: ^ops/check-shell-cmds-parse\.py$
        pass_filenames: false

      - id: secret-in-environment-selftest
        name: the secret-in-environment gate still fails when it should
        entry: ops/check-secret-in-environment.py --selftest
        language: system
        files: ^ops/check-secret-in-environment\.py$
        pass_filenames: false

      - id: no-comments
        name: no comment in code, except tagged ones and tool directives
        entry: ops/check-no-comments.py
        language: system
        pass_filenames: false

      - id: no-comments-selftest
        name: the no-comment gate still fails when it should
        entry: ops/check-no-comments.py --selftest
        language: system
        files: ^ops/check-no-comments\.py$
        pass_filenames: false
